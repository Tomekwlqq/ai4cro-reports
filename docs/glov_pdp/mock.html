&lt;script&gt;
(function(){
  // ── edycja live: packshot / tytuł / cena / akordeony / treść ──
  var mainImg = null;
  function mainProductImg(){
    if(mainImg) return mainImg;
    var sel = [&#x27;.product__media img&#x27;, &#x27;.product__media-wrapper img&#x27;, &#x27;[data-product-media] img&#x27;,
               &#x27;.product__gallery img&#x27;, &#x27;.product__photo img&#x27;, &#x27;.product__images img&#x27;];
    for(var s of sel){ var e = document.querySelector(s); if(e &amp;&amp; e.src){ mainImg = e; return e; } }
    return null;
  }
  function setPackshot(url){
    var img = mainProductImg();
    if(!img || !url) return;
    img.src = url;
    // galeria/thumbnails — podmień wszystkie &lt;img&gt; z tym samym źródłem
    var old = img.getAttribute(&#x27;data-orig&#x27;) || img.src;
    document.querySelectorAll(&#x27;.product__media img, .product__gallery img, .product__thumb img, [data-product-media] img&#x27;).forEach(function(i){
      if(i.src === old || i.getAttribute(&#x27;data-orig&#x27;) === old) i.src = url;
    });
    img.setAttribute(&#x27;data-orig&#x27;, old);
  }
  function setTitle(t){ var h = document.querySelector(&#x27;[data-product-title], h1, .product__title&#x27;); if(h) h.textContent = t; }
  function setPrice(p){
    document.querySelectorAll(&#x27;[data-product-price]&#x27;).forEach(function(e){ e.textContent = p; });
    // rodzice (.price/.product__price) — tylko jeśli NIE zawierają [data-product-price] (nie zabijaj dziecka)
    document.querySelectorAll(&#x27;.product__price, .price&#x27;).forEach(function(e){
      if(!e.querySelector(&#x27;[data-product-price]&#x27;)) e.textContent = p;
    });
  }
  function akordeony(){
    return document.querySelectorAll(&#x27;.product-accordion .accordion-row, .product-accordion .accordion, .accordion-row, .accordion&#x27;);
  }
  function akordeonToggle(el){
    if(el.__hooked) return; el.__hooked = true;
    // content = dziecko .accordion-content (GLOV: row &gt; toggle + content) LUB następny brat
    var content = el.querySelector(&#x27;.accordion-content, .accordion__content&#x27;);
    if(!content){
      content = el.nextElementSibling;
      while(content &amp;&amp; !/accordion-content|accordion__content/.test(content.className)) content = content.nextElementSibling;
    }
    if(!content) return;
    el.addEventListener(&#x27;click&#x27;, function(){
      var vis = content.style.display !== &#x27;none&#x27;;
      content.style.setProperty(&#x27;display&#x27;, vis ? &#x27;none&#x27; : &#x27;block&#x27;, &#x27;important&#x27;);
      el.classList.toggle(&#x27;is-open&#x27;, !vis);
    });
  }
  document.querySelectorAll(&#x27;.accordion-toggle, .accordion__title, .accordion-row, .accordion-row &gt; *&#x27;).forEach(akordeonToggle);
  // THUMBNAILS — klik zmienia główny packshot (secondary images)
  function hookThumbs(){
    document.querySelectorAll(&#x27;.media__thumb&#x27;).forEach(function(th){
      if(th.__th) return; th.__th = true;
      th.addEventListener(&#x27;click&#x27;, function(){
        var img = th.querySelector(&#x27;img&#x27;);
        if(!img) return;
        // Shopify CDN: _200x200_crop_center → pełny rozmiar
        var full = (img.src||&#x27;&#x27;).replace(/_[0-9]+x[0-9]+_crop_center/, &#x27;_360x&#x27;);
        var main = mainProductImg();
        if(main &amp;&amp; full &amp;&amp; full.indexOf(main.src) !== 0 &amp;&amp; main.src.indexOf(full) !== 0){
          main.src = full;
          main.setAttribute(&#x27;data-orig&#x27;, full);
        }
        document.querySelectorAll(&#x27;.media__thumb&#x27;).forEach(function(t){ t.classList.remove(&#x27;is-active&#x27;); });
        th.classList.add(&#x27;is-active&#x27;);
      });
    });
  }
  function init(){
    var img = mainProductImg();
    if(img) img.setAttribute(&#x27;data-orig&#x27;, img.src);
    // slider: BOTH pokazują 1 media (live: slider JS) + thumbnails osobno — ukryj media 2+
    var medias = document.querySelectorAll(&#x27;.product__media&#x27;);
    medias.forEach(function(m, i){ m.style.setProperty(&#x27;display&#x27;, i === 0 ? &#x27;block&#x27; : &#x27;none&#x27;, &#x27;important&#x27;); });
    // akordeony jak live: wszystkie zamknięte, tylko pierwszy .accordion-content otwarty
    var all = document.querySelectorAll(&#x27;.accordion-content, .accordion__content&#x27;);
    all.forEach(function(c){ c.style.display = &#x27;none&#x27;; });
    var first = document.querySelector(&#x27;.accordion-content&#x27;);
    if(first) first.style.display = &#x27;&#x27;;
    hookThumbs();
    // opinie (widget JS-owy — wstrzykujemy rendered HTML z live)
    var jr = document.getElementById(&#x27;judgeme_product_reviews&#x27;);
    if(jr &amp;&amp; window.__REVIEWS){
      // usuń style ukrywające widget (judge.me chowa go do czasu inicjalizacji JS)
      var rv = window.__REVIEWS.replace(/\.jdgm-rev-widg\{ display: none \}/g, &#x27;&#x27;);
      jr.innerHTML = rv;
    }
  }
  if(document.readyState == &#x27;loading&#x27;) document.addEventListener(&#x27;DOMContentLoaded&#x27;, init);
  else init();
  window.__PDP = { setPackshot: setPackshot, setTitle: setTitle, setPrice: setPrice,
                   mainImg: mainProductImg, akordeony: akordeony };
})();
