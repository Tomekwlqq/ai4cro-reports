<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Map Percepcji & Category Standards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafaf9;--surface:#fff;--border:#e7e5e4;
  --text:#1c1917;--text2:#57534e;--text3:#a8a29e;
  --accent:#4338ca;--accent-bg:#eef2ff;
  --beauty:#be185d;--beauty-bg:#fdf2f8;
  --auto:#1d4ed8;--auto-bg:#eff6ff;
  --tech:#0f766e;--tech-bg:#f0fdfa;
  --cross:#7c3aed;--cross-bg:#f5f3ff;
  --green:#16a34a;--yellow:#ca8a04;--red:#dc2626;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

.header{padding:40px 32px 32px;max-width:1200px;margin:0 auto}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--text)}
.header p{font-size:14px;color:var(--text2);margin-top:4px}
.stats-row{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.stat{font-variant-numeric:tabular-nums}
.stat strong{font-size:20px;font-weight:700;color:var(--accent)}
.stat span{font-size:12px;color:var(--text3);display:block;margin-top:1px}

.filters{padding:0 32px 20px;max-width:1200px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.fbtn{font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.section{max-width:1200px;margin:0 auto;padding:0 32px 32px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.section-title{font-size:15px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.section-count{font-size:12px;color:var(--text3);margin-left:auto;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;border-left:3px solid var(--border);transition:border-color .15s,box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card.beauty{border-left-color:var(--beauty)}.card.auto{border-left-color:var(--auto)}.card.tech{border-left-color:var(--tech)}.card.cross{border-left-color:var(--cross)}

.card-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.card-sub{font-size:12px;color:var(--text3);margin-bottom:10px}

.card-links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.link{font-size:12px;font-weight:600;padding:4px 10px;border-radius:5px;text-decoration:none;transition:opacity .15s;display:inline-flex;align-items:center;gap:4px}
.link:hover{opacity:.8}
.link-hub{background:#fef3c7;color:#92400e}
.link-cs{background:#dbeafe;color:#1e40af}
.link-mapa{background:#dcfce7;color:#166534}
.link-baza{background:#f3e8ff;color:#6b21a8}
.link-old{background:#f5f5f4;color:#78716c}

.card-stats{display:flex;gap:12px;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.card-stats .g{color:var(--green)}.card-stats .y{color:var(--yellow)}.card-stats .r{color:var(--red)}

.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}

.footer{text-align:center;padding:32px;font-size:11px;color:var(--text3)}
</style>
</head>
<body>

<div class="header">
  <h1>Katalog Map Percepcji & Category Standards</h1>
  <p>Wszystkie opublikowane mapy, CS-y i huby kategorii GEO w jednym miejscu</p>
  <div class="stats-row">
    <div class="stat"><strong id="s-maps">0</strong><span>map percepcji</span></div>
    <div class="stat"><strong id="s-cs">0</strong><span>category standards</span></div>
    <div class="stat"><strong id="s-hubs">0</strong><span>hubów kategorii</span></div>
    <div class="stat"><strong id="s-q">0</strong><span>pytań zmapowanych</span></div>
  </div>
</div>

<div class="filters">
  <button class="fbtn active" onclick="filter('all',this)">Wszystkie</button>
  <button class="fbtn" onclick="filter('beauty',this)">Beauty & Care</button>
  <button class="fbtn" onclick="filter('auto',this)">Motoryzacja</button>
  <button class="fbtn" onclick="filter('tech',this)">Elektronika & Dom</button>
  <button class="fbtn" onclick="filter('cross',this)">Cross-category</button>
</div>

<div id="content"></div>

<div class="footer">GEO PDP Optimizer · Katalog Map & CS · render_mapa.py + render_cs_mapa.py · 2026-07-28</div>

<script>
const BASE = "https://tomekwlqq.github.io/eel-reports/";

const CATEGORIES = [
  // BEAUTY & CARE
  {
    group: "beauty", name: "Demakijaż", sub: "GLOV · demakijaz_glov",
    hub: "glov/HUB_glov_demakijaz.html",
    cs: "DOBRE_CS_demakijaz.html",
    maps: [{f:"MAPA_PERCEPCJI_demakijaz_glov.html", q:154, p:8, g:87, y:62, r:5, lbl:"v5 angle"}],
  },
  {
    group: "beauty", name: "Lakiery do paznokci", sub: "CoolNails by GLOV",
    hub: "glov/HUB_lakiery.html",
    cs: "DOBRE_CS_lakiery.html",
    maps: [{f:"MAPA_PERCEPCJI_lakier_do_paznokci.html", q:220, p:11, g:145, y:74, r:1, lbl:"v5 angle"}],
  },
  {
    group: "beauty", name: "Maska LED na twarz", sub: "GLOV Luna Eye",
    hub: "HUB_maska_led_na_twarz.html",
    cs: "DOBRE_CS_maska_led.html",
    maps: [
      {f:"MAPA_PERCEPCJI_maska_led_na_twarz.html", q:168, p:10, g:75, y:77, r:16, lbl:"v5 angle"},
      {f:"MAPA_PERCEPCJI_maska_led_na_twarz_v5.5.html", q:168, p:9, lbl:"v5.5"},
    ],
  },
  {
    group: "beauty", name: "Pumeksy do stóp", sub: "GLOV",
    hub: "glov/pumeksy/HUB_pumeksy_do_stop.html",
    cs: "DOBRE_CS_pumeksy.html",
    maps: [
      {f:"MAPA_PERCEPCJI_pumeksy_do_stop_v5.5.html", q:153, p:10, lbl:"v5.5 (do stóp)"},
      {f:"MAPA_PERCEPCJI_pumeksy_v5.5.html", q:230, p:11, lbl:"v5.5"},
    ],
  },
  {
    group: "beauty", name: "Pranie — listki", sub: "Homies",
    hub: "HUB_homies.html",
    maps: [{f:"MAPA_PERCEPCJI_pranie_homies.html", q:190, p:10, g:94, y:85, r:11, lbl:"v5 angle"}],
  },

  // MOTORYZACJA
  {
    group: "auto", name: "Samochody osobowe — prywatny", sub: "Audi Plichta",
    cs: "DOBRE_CS_samochody.html",
    maps: [
      {f:"MAPA_PERCEPCJI_samochody_osobowe_prywatny_v5.7.html", q:152, p:8, lbl:"v5.7"},
      {f:"MAPA_PERCEPCJI_samochody_osobowe_prywatny_v5.5.html", q:152, p:8, lbl:"v5.5"},
    ],
  },
  {
    group: "auto", name: "Samochody osobowe — biznesowy", sub: "Audi Plichta",
    maps: [{f:"MAPA_PERCEPCJI_samochody_osobowe_biznesowy_v5.7.html", q:138, p:8, lbl:"v5.7"}],
  },
  {
    group: "auto", name: "Samochody elektryczne — prywatny", sub: "Audi Plichta",
    cs: "DOBRE_CS_samochody_ev.html",
    maps: [{f:"MAPA_PERCEPCJI_samochody_elektryczne_prywatny_v5.7.html", q:130, p:8, lbl:"v5.7"}],
  },
  {
    group: "auto", name: "SUV premium — prywatny", sub: "Audi Plichta",
    maps: [{f:"MAPA_PERCEPCJI_suv_premium_prywatny_v5.7.html", q:130, p:8, lbl:"v5.7"}],
  },
  {
    group: "auto", name: "Samochody używane & CPO", sub: "Audi Plichta",
    maps: [{f:"MAPA_PERCEPCJI_samochody_uzywane_cpo_v5.7.html", q:135, p:8, lbl:"v5.7"}],
  },
  {
    group: "auto", name: "Leasing prywatny — finansowanie", sub: "Audi Plichta",
    cs: "DOBRE_CS_leasing.html",
    maps: [{f:"MAPA_PERCEPCJI_leasing_prywatny_finansowanie_v5.7.html", q:120, p:7, lbl:"v5.7"}],
  },

  // ELEKTRONIKA & DOM
  {
    group: "tech", name: "Ekspresy do kawy", sub: "kategoria referencja",
    cs: "DOBRE_CS_ekspresy.html",
    maps: [
      {f:"MAPA_PERCEPCJI_ekspresy_do_kawy_v5.5.html", q:264, p:13, lbl:"v5.5 (pełne)"},
      {f:"MAPA_PERCEPCJI_ekspresy_v5.5.html", q:191, p:13, lbl:"v5.5"},
      {f:"MAPA_PERCEPCJI_ekspresy_do_kawy.html", q:null, p:null, lbl:"starsza"},
    ],
  },
  {
    group: "tech", name: "Słuchawki z ANC", sub: "kategoria referencja",
    cs: "DOBRE_CS_sluchawki_anc.html",
    maps: [{f:"MAPA_PERCEPCJI_sluchawki_anc_v5.5.html", q:388, p:15, lbl:"v5.5"}],
  },
  {
    group: "tech", name: "Sejfy domowe", sub: "SejfZone",
    cs: "DOBRE_CS_sejfy.html",
    maps: [{f:"mapa-percepcji-sejfy-domowe.html", q:null, p:null, lbl:"v1 (stara)"}],
    old_maps: ["mapa-percepcji.html"],
  },
  {
    group: "tech", name: "Szafy na broń", sub: "SejfZone",
    cs: "DOBRE_CS_szafy.html",
    maps: [{f:"mapa-percepcji-bron.html", q:null, p:null, lbl:"v1 (stara)"}],
  },

  // CROSS
  {
    group: "cross", name: "DOBRE CS — katalog", sub: "hub wszystkich CS w formacie wzorcowym",
    hub: "DOBRE_CS_HUB.html",
  },
  {
    group: "cross", name: "Baza CS", sub: "pełna baza category standards",
    baza: ["baza_cs.html", "baza_cs_db.html", "baza_cs_sejfy.html"],
  },
];

function render(grp) {
  const cats = grp === 'all' ? CATEGORIES : CATEGORIES.filter(c => c.group === grp);
  const groups = {};
  for (const c of cats) {
    if (!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(c);
  }

  const labels = {beauty:"Beauty & Care", auto:"Motoryzacja", tech:"Elektronika & Dom", cross:"Cross-category"};
  const colors = {beauty:"var(--beauty)", auto:"var(--auto)", tech:"var(--tech)", cross:"var(--cross)"};

  let html = '';
  for (const [g, items] of Object.entries(groups)) {
    html += `<div class="section" data-group="${g}">
      <div class="section-head">
        <div class="section-dot" style="background:${colors[g]}"></div>
        <div class="section-title">${labels[g]}</div>
        <div class="section-count">${items.length} kategorii</div>
      </div>
      <div class="grid">`;

    for (const c of items) {
      let links = '';
      if (c.hub) links += `<a class="link link-hub" href="${BASE}${c.hub}" target="_blank">HUB</a>`;
      if (c.cs) links += `<a class="link link-cs" href="${BASE}${c.cs}" target="_blank">CS</a>`;
      if (c.baza) for (const b of c.baza) links += `<a class="link link-baza" href="${BASE}${b}" target="_blank">${b.replace('.html','')}</a>`;
      if (c.maps) for (const m of c.maps) links += `<a class="link link-mapa" href="${BASE}${m.f}" target="_blank">Mapa ${m.lbl}</a>`;

      let stats = '';
      if (c.maps && c.maps.length) {
        const best = c.maps.find(m => m.q) || c.maps[0];
        if (best.q) {
          stats = `<div class="card-stats">${best.q} pytań · ${best.p} ścieżek`;
          if (best.g !== undefined) stats += ` · <span class="g">${best.g}🟢</span> <span class="y">${best.y}🟡</span> <span class="r">${best.r}🔴</span>`;
          stats += `</div>`;
        }
      }

      html += `<div class="card ${c.group}">
        <div class="card-name">${c.name}</div>
        <div class="card-sub">${c.sub}</div>
        <div class="card-links">${links}</div>
        ${stats}
      </div>`;
    }
    html += `</div></div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function filter(grp, btn) {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(grp);
}

// Stats
let totalQ = 0, totalMaps = 0, totalCS = 0, totalHubs = 0;
for (const c of CATEGORIES) {
  if (c.hub) totalHubs++;
  if (c.cs) totalCS++;
  if (c.maps) { totalMaps += c.maps.length; for (const m of c.maps) if (m.q) totalQ += m.q; }
  if (c.baza) totalCS += c.baza.length;
}
document.getElementById('s-maps').textContent = totalMaps;
document.getElementById('s-cs').textContent = totalCS;
document.getElementById('s-hubs').textContent = totalHubs;
document.getElementById('s-q').textContent = totalQ.toLocaleString('pl');

render('all');
</script>
</body>
</html>
