<!doctype html><html lang="pl"><head>
<style id="sg">
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--sg-vio:#7c5cff;--sg-ink:#1a1f2b;--sg-mut:#667085;--sg-line:#e4e7ec}
body{font-family:'Space Grotesk',-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;color:var(--sg-ink);background:#fff}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.2px}
code,pre,.mono,label,.tab,.badge,.go,.meta,.cnt,th{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
a{color:var(--sg-vio)}
</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dobry Dach — Jeden widok</title>
<style>
:root{--vio:#7c5cff;--ink:#1a1f2b;--mut:#667085;--line:#e4e7ec}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:'Space Grotesk',-apple-system,'Segoe UI',Arial,sans-serif;background:#f4f5f9;color:var(--ink)}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.nav{flex:0 0 auto;z-index:50;background:#fff;border-bottom:2px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(26,31,43,.06)}
.nav .brand{font-weight:800;font-size:15px;letter-spacing:-.2px;margin-right:10px;white-space:nowrap}
.nav .brand span{color:var(--vio)}
.nav a{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;color:#3a4250;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;transition:.15s;white-space:nowrap;background:#fff}
.nav a:hover{border-color:var(--vio);color:var(--vio)}
.nav a.on{background:var(--vio);border-color:var(--vio);color:#fff}
.dd{position:relative;display:inline-block}
.dd-btn{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;color:#3a4250;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;transition:.15s;white-space:nowrap;background:#fff;cursor:pointer}
.dd-btn:hover{border-color:var(--vio);color:var(--vio)}
.dd-btn.on{background:var(--vio);border-color:var(--vio);color:#fff}
.dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(26,31,43,.12);padding:6px;min-width:230px;z-index:100}
.dd.open .dd-menu{display:block}
.dd-menu a{display:block;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;color:#3a4250;text-decoration:none;border:0;border-radius:8px;padding:8px 12px;white-space:nowrap}
.dd-menu a:hover{background:#f3f0ff;color:var(--vio)}
.frame{flex:1 1 auto;min-height:0;width:100%;border:0;background:#fff}
@media(max-width:700px){.nav{padding:8px 10px}.nav .brand{width:100%}}
</style></head><body>
<div class="nav">
  <div class="brand">Dobry Dach <span>· jeden widok</span></div>
  <a href="AUTOMATYZACJE_PROJEKT.html" data-t="Automaty" class="on">⚙️ Automaty</a>
  <div class="dd" id="ddPortfel">
    <a href="PORTFEL_RAPORTOW.html" data-t="Portfel" class="dd-btn">📊 Portfel raportów ▾</a>
    <div class="dd-menu">
      <a href="PORTFEL_RAPORTOW.html#n4" data-t="N4">🧭 N4 — dziennik WZ</a>
      <a href="PORTFEL_RAPORTOW.html#a6" data-t="A6">📈 A6 — stan PH</a>
      <a href="PORTFEL_RAPORTOW.html#struktura" data-t="Struktura">🔗 struktura danych</a>
    </div>
  </div>
  <a href="DOBRY_DACH_KNOWLEDGE_BOARD.html" data-t="Status">🧠 Status projektu</a>
  <a href="zalozenia-projektu.html" data-t="Zalozenia">📋 Założenia projektu</a>
  <a href="proces-roboczy.html" data-t="Proces">⚙️ Proces roboczy</a>
  <a href="odkrycia.html" data-t="Odkrycia">🔎 Odkrycia</a>
  <a href="lista_zadan_i_blokery.html" data-t="Zadania">🗂️ Zadania</a>
  <a href="discovery.html" data-t="Discovery">📝 Discovery <span style="opacity:.55">· archiwum</span></a>
  <a href="analiza.html" data-t="Analiza">📊 Analiza <span style="opacity:.55">· archiwum</span></a>
  <a href="zrodla.html" data-t="Zrodla">📚 Źródła</a>
</div>
<iframe class="frame" id="f" src="AUTOMATYZACJE_PROJEKT.html"></iframe>
<script>
var f = document.getElementById('f');
document.querySelectorAll('.nav a').forEach(function(a){
  a.addEventListener('click', function(e){
    e.preventDefault();
    document.querySelectorAll('.nav a').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.dd-btn').forEach(function(x){x.classList.remove('on')});
    a.classList.add('on');
    f.src = a.getAttribute('href');
    document.querySelectorAll('.dd').forEach(function(d){d.classList.remove('open')});
    window.scrollTo(0,0);
  });
});
document.querySelectorAll('.dd-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.preventDefault();
    var dd = btn.parentElement;
    var wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.dd').forEach(function(d){d.classList.remove('open')});
    if(!wasOpen){ dd.classList.add('open'); }
  });
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.dd')){ document.querySelectorAll('.dd').forEach(function(d){d.classList.remove('open')}); }
});
</script>
</body></html>
