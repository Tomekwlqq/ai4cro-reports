<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakiery do paznokci — CS Gold | GEO</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--sb-bg:#f6f8fa;--sb-border:#d0d7de;
  --accent:#0969da;--accent-bg:#dbeafe;
  --text:#24292f;--text2:#57606a;--text3:#8c959f;
  --bm-bg:#dafbe1;--bm:#1a7f37;
  --ba-bg:#fff3c4;--ba:#7d4e00;
  --sb-w:272px;--hh:48px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#hd{height:var(--hh);background:#fff;border-bottom:1px solid var(--sb-border);
  display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0;
  box-shadow:0 1px 0 rgba(0,0,0,.04);}
.back{font-size:12px;color:var(--accent);text-decoration:none;
  padding:3px 9px;border:1px solid var(--sb-border);border-radius:6px;white-space:nowrap;}
.back:hover{background:var(--sb-bg);}
#hd h1{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbadge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
#lay{display:flex;flex:1;overflow:hidden;}
#sb{width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);
  border-right:1px solid var(--sb-border);overflow-y:auto;}
.sb-hdr{padding:8px 14px;font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;
  border-bottom:1px solid var(--sb-border);
  position:sticky;top:0;background:var(--sb-bg);z-index:2;}
.ci{display:flex;flex-direction:column;gap:4px;padding:9px 14px;
  text-decoration:none;color:inherit;
  border-left:3px solid transparent;border-bottom:1px solid var(--sb-border);}
.ci:hover{background:rgba(9,105,218,.05);}
.ci.active{background:var(--accent-bg);border-left-color:var(--accent);}
.ci-name{font-size:13px;font-weight:500;line-height:1.3;}
.ci.active .ci-name{color:var(--accent);font-weight:600;}
.ci-badges{display:flex;gap:4px;flex-wrap:wrap;}
.badge{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;}
.b-m{background:var(--bm-bg);color:var(--bm);}
.b-a{background:var(--ba-bg);color:var(--ba);}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.frow{display:flex;flex:1;overflow:hidden;}
.fp{flex:1;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--sb-border);}
.fp:last-child{border-right:none;}
.flabel{font-size:10px;font-weight:700;color:var(--text3);
  padding:4px 12px;background:var(--sb-bg);
  border-bottom:1px solid var(--sb-border);
  text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;
  display:flex;align-items:center;gap:6px;}
.tab-btn{font-size:10px;padding:2px 8px;border-radius:10px;
  border:1px solid var(--sb-border);background:#fff;cursor:pointer;
  color:var(--text2);font-weight:500;}
.tab-btn.act{background:var(--accent);color:#fff;border-color:var(--accent);}
.fp iframe{flex:1;border:none;width:100%;height:100%;}
.welcome-wrap{flex:1;overflow-y:auto;background:#f9fafb;}
.welcome-top{text-align:center;padding:28px 20px 16px;color:var(--text2);}
.welcome-top h2{font-size:22px;color:var(--text);margin-bottom:10px;font-weight:700;}
.welcome-top p{font-size:14px;line-height:1.6;max-width:480px;margin:0 auto;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px;padding:16px 20px 24px;}
.ccard{background:#fff;border:1px solid var(--sb-border);border-radius:8px;
  padding:14px;text-decoration:none;color:inherit;
  transition:box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;gap:7px;}
.ccard:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(9,105,218,.15);}
.ccard-name{font-size:14px;font-weight:600;color:var(--text);}
.ccard-badges{display:flex;gap:4px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="hd"><a href="DOBRE_CS_HUB.html" class="back">← Hub</a><h1>Lakiery do paznokci</h1><div style="display:flex;gap:5px;"><span class="hbadge b-m">✅ Mapa percepcji</span></div></div>
<div id="lay">
  <nav id="sb"></nav>
  <div id="main"><div class="frow"><div class="fp"><div class="flabel">CS — Mapa kategorii</div><iframe src="HUB_lakiery.html"></iframe></div><div class="fp"><div class="flabel">Mapa percepcji</div><iframe src="MAPA_PERCEPCJI_lakier_do_paznokci.html"></iframe></div></div></div>
</div>
<script>
const CATS=[
  {slug:'sejfy',name:'Sejfy domowe',file:'DOBRE_CS_sejfy.html',hasMapa:false,hasAnaliza:false},
  {slug:'pumeksy',name:'Pumeksy do stóp',file:'DOBRE_CS_pumeksy.html',hasMapa:true,hasAnaliza:true},
  {slug:'sluchawki_anc',name:'Słuchawki ANC',file:'DOBRE_CS_sluchawki_anc.html',hasMapa:true,hasAnaliza:false},
  {slug:'demakijaz',name:'Demakijaż GLOV',file:'DOBRE_CS_demakijaz.html',hasMapa:true,hasAnaliza:false},
  {slug:'lakiery',name:'Lakiery do paznokci',file:'DOBRE_CS_lakiery.html',hasMapa:true,hasAnaliza:false},
  {slug:'ekspresy',name:'Ekspresy do kawy',file:'DOBRE_CS_ekspresy.html',hasMapa:true,hasAnaliza:true},
  {slug:'samochody',name:'Samochody osobowe',file:'DOBRE_CS_samochody.html',hasMapa:true,hasAnaliza:false},
  {slug:'samochody_ev',name:'Samochody elektryczne',file:'DOBRE_CS_samochody_ev.html',hasMapa:true,hasAnaliza:false},
  {slug:'leasing',name:'Leasing',file:'DOBRE_CS_leasing.html',hasMapa:true,hasAnaliza:false},
  {slug:'maska_led',name:'Maska LED',file:'DOBRE_CS_maska_led.html',hasMapa:true,hasAnaliza:false},
  {slug:'szafy',name:'Szafy na broń',file:'DOBRE_CS_szafy.html',hasMapa:false,hasAnaliza:true},
];
function renderSidebar(a){
  var sb=document.getElementById('sb');
  var h='<div class="sb-hdr">Kategorie CS ('+CATS.length+')</div>';
  CATS.forEach(function(c){
    var act=c.slug===a;
    var bd='';
    if(c.hasMapa)bd+='<span class="badge b-m">✅ Mapa</span>';
    if(c.hasAnaliza)bd+='<span class="badge b-a">🔬 Analiza</span>';
    h+='<a href="'+c.file+'" class="ci'+(act?' active':'')+'"><span class="ci-name">'+c.name+'</span>'+(bd?'<span class="ci-badges">'+bd+'</span>':'')+'</a>';
  });
  sb.innerHTML=h;
}

renderSidebar('lakiery');
</script>
</body>
</html>
