 each step reduces load.", "hyp": "A one-question-at-a-time checkout flow outperforms a single long form.", "ctrl": "Single-page checkout with all fields visible (address, billing, shipping)", "varnt": "Step-by-step: 1 field per screen, progress shown, next unlocked after each answer", "kpi": "Checkout completion rate", "kpi2": ["Drop-off by field", "Time to complete"], "diff": "medium", "time": "4h dev", "uplift": "+5–15%", "tags": ["checkout", "UX", "mobile", "CRO"], "eval_signal": "Czy PDP/listing/checkout dzieli informacje na warstwy wg istotności (obecny), czy wszystko wyrzucone na raz jednym blokiem (brak), czy ukryto coś co powinno być widoczne od razu np. cenę/dostępność (źle użyty).", "lever": "Rozbić długie formularze checkout na kroki 1 pytanie/sekcja na raz; zwinąć specyfikacje techniczne pod \"Pokaż szczegóły\".", "risk": "Ukrywanie kluczowych informacji (cena końcowa, koszt dostawy) pod dodatkowym klikiem to dark pattern — granica: drugorzędne info OK do zwinięcia, decyzyjne info musi być widoczne.", "evidence_class": "literatura", "evidence": []}, {"id": 55, "name": "Cognitive Load", "series": "choice", "def": "Total mental effort in working memory — overload leads to frustration and errors.", "mech": "Working memory holds roughly 7±2 items; exceeding capacity drops performance sharply.", "hyp": "Removing all non-essential links and distractions from checkout increases completion.", "ctrl": "Checkout page with full site header, footer, and promotional banners", "varnt": "Distraction-free checkout: no nav, no ads, no exit points except 'Back to Cart'", "kpi": "Checkout completion rate", "kpi2": ["Time to complete checkout", "Abandonment rate"], "diff": "easy", "time": "2h CSS", "uplift": "+5–15%", "tags": ["checkout", "UX", "CRO", "conversion"], "eval_signal": "ile elementów rozpraszających (linki, oferty, pop-upy) jest obecnych na checkout/kasie; czy formularz płatności ma tylko niezbędne pola; czy nawigacja jest ograniczona/usunięta na etapie finalizacji.", "lever": "okrojenie checkout do minimum (bez menu, stopki, cross-sell), redukcja liczby kroków/pól, progresywne ujawnianie opcji zaawansowanych.", "risk": "nadmierne \"uproszczenie\" może też ukrywać istotne informacje (np. koszty) — cognitive load management nie może być wymówką do zatajania danych.", "evidence_class": "literatura", "evidence": []}, {"id": 56, "name": "Decoy Effect", "series": "value", "def": "A third 'decoy' option changes preference between the original two options.", "mech": "The decoy is 'dominated' by one option but not the other, making that option look best.", "hyp": "3-tier pricing with the middle tier priced near the top tier drives upsell to top tier.", "ctrl": "2-tier pricing: Basic ($29) and Pro ($79)", "varnt": "3-tier: Basic ($29) / Plus ($69) / Pro ($79) — Plus is the decoy making Pro look like a steal", "kpi": "Revenue per visitor", "kpi2": ["Tier distribution (% choosing each)", "Average subscription value"], "diff": "easy", "time": "1h config", "uplift": "+10–30% revenue", "tags": ["pricing", "SaaS", "packaging", "AOV"], "eval_signal": "czy pricing ma ≥3 opcje z celowo zdominowaną? Czy różnica cen kieruje w górę? Czy jest oznaczony „rekomendowany\"?", "lever": "dodaj wariant-wabik obok tego, który chcesz sprzedać; wyróżnij docelowy „best value\".", "risk": "za dużo wariantów → zamiast wabika masz choice overload (patrz #6).", "evidence_class": "literatura", "evidence": []}, {"id": 57, "name": "Nudge", "series": "choice", "def": "Subtle environmental changes guide behavior without removing options.", "mech": "Defaults and social norms guide System 1 (fast/intuitive) decision-making.", "hyp": "'Most people choose [Option]' label next to a shipping choice increases that option's selection.", "ctrl": "Shipping options listed with no labels or guidance", "varnt": "One option labeled 'Most Popular Choice ✓' or 'Most customers choose this'", "kpi": "% selecting nudged option", "kpi2": ["Revenue per order", "Customer satisfaction with delivery"], "diff": "easy", "time": "30min copy", "uplift": "+15–40% to nudged option", "tags": ["UX", "defaults", "nudge", "copy"], "eval_signal": "jakie opcje są domyślnie zaznaczone w checkout/formularzach i czy to zbieżne z interesem usera czy tylko sklepu? Czy jest social-proof label przy opcjach wyboru (dostawa, gwarancja)?", "lever": "ustawić domyślne opcje zgodne z tym co wybiera większość klientów, dodać etykietę \"Najczęściej wybierane\" przy rekomendowanej opcji dostawy/wariantu.", "risk": "default wybrany pod marżę sklepu a nie pod dobro klienta (pre-checked droższa opcja, ukryta subskrypcja) — to już dark pattern, nie nudge.", "evidence_class": "literatura", "evidence": []}, {"id": 58, "name": "Zeigarnik Effect", "series": "memory", "def": "We remember uncompleted tasks better than completed ones.", "mech": "Unfinished tasks create psychic tension — they stay active in working memory.", "hyp": "'You left something unfinished' cart email subject outperforms standard cart recovery.", "ctrl": "Subject line: 'You left items in your cart'", "varnt": "Subject line: 'You left something unfinished...' — tension-inducing, open loop", "kpi": "Cart recovery email open rate", "kpi2": ["Click rate", "Revenue recovered"], "diff": "easy", "time": "30min copy", "uplift": "+5–20% open rate", "tags": ["email", "cart recovery", "copywriting", "urgency"], "eval_signal": "Czy istnieje mechanizm przypominający o niedokończonym procesie (koszyk, profil, checkout) — obecny, czy porzucony koszyk/proces po prostu znika bez żadnego follow-upu (brak).", "lever": "Kampania e-mail/push do porzuconych koszyków z komunikatem \"zostawiłeś coś niedokończonego\", pasek postępu w wieloetapowym checkout/profilu.", "risk": "Nadmierna częstotliwość przypomnień (kilka maili dziennie o tym samym koszyku) zamienia napięcie w irytację i prowadzi do unsubscribe.", "evidence_class": "literatura", "evidence": []}, {"id": 59, "name": "Peak-End Rule", "series": "memory", "def": "We judge experiences by their peak intensity and final moment — not the average.", "mech": "Memory stores 'snapshots' of the most intense and most recent moments only.", "hyp": "A delightful 'Thank You' page with a surprise offer creates a lasting positive memory.", "ctrl": "Standard 'Order Confirmed' page with order summary", "varnt": "Delightful Thank You page: personalized note + surprise 15% code for next order + share invite", "kpi": "Repeat purchase rate", "kpi2": ["NPS", "Post-purchase social sharing"], "diff": "easy", "time": "2h design", "uplift": "+5–15% repeat", "tags": ["post-purchase", "UX", "retention", "LTV"], "eval_signal": "jak wygląda strona potwierdzenia zamówienia — neutralny ekran z numerem zamówienia, czy zaprojektowany moment radości? Czy proces zwrotu/reklamacji (często ostatni kontakt z marką) jest zaprojektowany czy zaniedbany?", "lever": "zainwestować w \"Thank You page\" z niespodzianką i w unboxing experience — to tańszy dźwignia niż poprawianie każdego kroku ścieżki, bo user pamięta głównie szczyt i koniec.", "risk": "zaniedbanie \"końca\" przy problemach (zwrot, reklamacja, opóźniona dostawa) — to też jest \"end\", i jeśli jest zły, kasuje całe pozytywne doświadczenie zakupowe.", "evidence_class": "literatura", "evidence": []}, {"id": 60, "name": "Loss Aversion", "series": "value", "def": "We strongly prefer avoiding losses over acquiring equivalent gains.", "mech": "The pain of loss is neurologically ~2x as powerful as the pleasure of gain.", "hyp": "'Reserve for 10 minutes' creates temporary ownership, increasing purchase via loss aversion.", "ctrl": "Standard 'Add to Cart' button", "varnt": "'Reserve yours for 10 minutes' → countdown timer → 'Don't lose your reserved item'", "kpi": "Conversion Rate", "kpi2": ["Time-to-purchase", "Cart abandonment during reservation"], "diff": "medium", "time": "4h dev", "uplift": "+10–25%", "tags": ["urgency", "FOMO", "CRO", "checkout"], "eval_signal": "czy niedobór jest widoczny i KONKRETNY (liczba, nie „mało\")? Czy prawdziwy (stan magazynu) czy dekoracyjny? Czy deadline realny?", "lever": "pokaż realny stan magazynu / czas promocji przy CTA; framing przez stratę („nie przegap\") nie zysk.", "risk": "wieczne „ostatnie sztuki\" / resetujący się licznik = klasyczny dark pattern, zabija wiarygodność.", "evidence_class": "literatura", "evidence": []}, {"id": 61, "name": "Sunk Cost Fallacy", "series": "value", "def": "We continue endeavors because of past investments, even when stopping is rational.", "mech": "Avoiding 'waste' and the admission of a past mistake — loss framing for past effort.", "hyp": "Showing customization progress ('You've built 8 of 10 parts!') prevents configurator abandonment.", "ctrl": "Product configurator with no progress indicator", "varnt": "Progress bar + 'You've customized 8 parts! Just 2 more to complete your build'", "kpi": "Configurator completion rate", "kpi2": ["Conversion from configurator", "Drop-off point analysis"], "diff": "easy", "time": "2h dev", "uplift": "+10–25%", "tags": ["UX", "configurator", "engagement", "retention"], "eval_signal": "Czy długie formularze/konfiguratory pokazują inwestycję usera (czas/kroki) żeby zniechęcić do porzucenia (obecny), czy user może zniknąć w połowie procesu bez żadnego przypomnienia co już zrobił (brak).", "lever": "Pokazywać licznik wykonanej pracy w konfiguratorze (\"Skonfigurowałeś już 8 elementów!\") tuż przed momentem porzucenia (exit-intent).", "risk": "Wykorzystywanie sunk cost do zatrzymania usera w procesie, który mu nie służy (np. zbyt drogi finalny produkt) to manipulacja — granica gdy user czuje się \"złapany\" zamiast doprowadzony do wartościowego finału.", "evidence_class": "literatura", "evidence": []}, {"id": 62, "name": "IKEA Effect", "series": "belief", "def": "We place disproportionately high value on products we partially created.", "mech": "Labor leads to love — effort invested becomes part of our self-concept.", "hyp": "A product configurator increases perceived value and reduces return rate vs. pre-made.", "ctrl": "Standard 'Buy Now' for pre-configured product", "varnt": "Color/feature/engraving configurator before purchase — user builds their version", "kpi": "Return rate", "kpi2": ["Perceived value (survey)", "Conversion Rate"], "diff": "hard", "time": "3 days dev", "uplift": "-10–20% returns", "tags": ["configurator", "UX", "personalization", "LTV"], "eval_signal": "czy PDP/kategoria oferuje jakikolwiek element współtworzenia (konfigurator, builder, personalizacja) czy tylko gotowy produkt z przyciskiem \"kup\"? Czy user \"inwestuje\" chwilę czasu przed zobaczeniem finalnej oferty?", "lever": "dodać konfigurator/builder zestawu nawet w prostej formie (wybór wariantu, dodatków) zamiast płaskiego \"Buy Now\" — podnosi postrzeganą wartość i willingness to pay.", "risk": "zbyt długi/skomplikowany konfigurator zderza się z Hick's Law i podnosi porzucenia — musi być prosty i szybki.", "evidence_class": "literatura", "evidence": []}, {"id": 63, "name": "Generation Effect", "series": "memory", "def": "Self-generated information is better remembered than passively received information.", "mech": "Active processing creates deeper neural pathways than passive reception.", "hyp": "An interactive sizing calculator reduces returns better than a static size chart.", "ctrl": "Static size chart with measurements for reference", "varnt": "Interactive calculator: enter height/weight/measurements → get personalized recommendation", "kpi": "Return rate", "kpi2": ["Calculator usage rate", "Conversion with vs. without calculator"], "diff": "medium", "time": "4h dev", "uplift": "-5–20% returns", "tags": ["UX", "sizing", "returns", "fashion"], "evidence_class": "literatura", "evidence": []}, {"id": 64, "name": "Zero-Risk Bias", "series": "value", "def": "We prefer complete elimination of risk over larger reductions in total risk.", "mech": "'Zero' is emotionally certain — 'low risk' still feels dangerous.", "hyp": "'100% Money Back' converts better than '99% satisfaction guaranteed' — zero matters.", "ctrl": "'99% Satisfaction Guaranteed — or your money back'", "varnt": "'100% Money Back Guarantee — no questions asked, ever'", "kpi": "Conversion Rate", "kpi2": ["Return rate", "Trust score"], "diff": "easy", "time": "30min copy", "uplift": "+2–8%", "tags": ["trust", "copy", "guarantee", "CRO"], "eval_signal": "Czy przy CTA zakupu/checkout widoczna jest gwarancja sformułowana jako pełna, absolutna (100%, bez pytań) — obecny, czy gwarancja jest warunkowa/niejasna i nie komunikuje zera ryzyka (brak/słabszy efekt).", "lever": "Sformułować politykę zwrotów/gwarancji jako \"100%\" zamiast \"do 99%\" czy \"w większości przypadków\" — nawet gdy warunki są te same, framing zera ma nieproporcjonalną siłę.", "risk": "Obiecanie \"zero ryzyka\" bez realnego pokrycia w polityce firmy (drobny druk z wyjątkami) to zwykłe wprowadzenie w błąd i groźba dla reputacji przy pierwszym sporze.", "evidence_class": "literatura", "evidence": []}, {"id": 65, "name": "Unit Bias", "series": "choice", "def": "We have a drive to complete a 'unit' — whole things feel more satisfying than partial.", "mech": "Completion drive creates discomfort when something is 'almost done'.", "hyp": "A bundle progress bar ('2 of 3 items added to unlock free gift') increases AOV.", "ctrl": "Static 'Bundle & Save' offer without progress indicator", "varnt": "Dynamic: 'Add 1 more item to unlock your free gift' progress bar", "kpi": "AOV", "kpi2": ["Bundle completion rate", "Items per order"], "diff": "easy", "time": "2h dev", "uplift": "+10–25% AOV", "tags": ["bundles", "AOV", "UX", "gamification"], "eval_signal": "Czy oferta/UX prezentuje produkt jako \"całość do skompletowania\" z widocznym postępem (obecny), czy sprzedaje tylko pojedyncze elementy bez żadnej narracji kompletności (brak).", "lever": "Dodać pasek postępu przy budowaniu koszyka/bundla (\"jeszcze 1 produkt do darmowej dostawy/gratisu\"), sprzedawać zestawy jako gotowe \"kity\".", "risk": "Sztuczne dzielenie produktu na \"brakujące części\" żeby wymusić dokupienie niepotrzebnych elementów to manipulacja kosztem realnej wartości zakupu.", "evidence_class": "literatura", "evidence": []}, {"id": 66, "name": "Hyperbolic Discounting", "series": "value", "def": "We strongly prefer smaller immediate rewards over larger delayed ones.", "mech": "Prehistoric brains value certainty — future rewards are discounted steeply.", "hyp": "'Instant $5 credit' for sign-up outperforms '20% off first order' (which requires spending).", "ctrl": "'Sign up and get 20% off your first order'", "varnt": "'Instant $5 credit added to your account the moment you sign up'", "kpi": "Sign-up rate", "kpi2": ["First purchase rate", "CLTV"], "diff": "easy", "time": "1h dev", "uplift": "+15–40% sign-ups", "tags": ["email", "sign-up", "loyalty", "incentives"], "eval_signal": "czy strona oferuje natychmiastową gratyfikację (instant discount, express) obok opcji odroczonej (oszczędność później)? Który wariant jest wizualnie wyeksponowany jako domyślny?", "lever": "eksponować natychmiastowe korzyści (np. \"5 zł kredytu od razu\" zamiast \"20% na pierwsze zamówienie po spełnieniu warunku\") tam gdzie chcemy szybkiej konwersji (zapis, checkout).", "risk": "promowanie natychmiastowej gratyfikacji kosztem realnej wartości dla klienta (droższa dostawa express przy niepilnej potrzebie) — krótkoterminowy zysk konwersyjny, długoterminowa utrata zaufania.", "evidence_class": "literatura", "evidence": []}, {"id": 67, "name": "Peltzman Effect", "series": "value", "def": "Perceived safety increases allow for riskier behavior — risk compensation.", "mech": "We have a 'target level of risk' — reduce it and we compensate by pushing harder.", "hyp": "Prominently displayed 'Free Returns' increases cart size and experimental purchases.", "ctrl": "'Free Returns' mentioned only in footer or FAQ", "varnt": "'Free Returns on Everything ← no questions asked' visible on hero and PDP", "kpi": "Items per cart", "kpi2": ["AOV", "Return rate", "Conversion of high-risk new products"], "diff": "easy", "time": "30min design", "uplift": "+5–15% cart size", "tags": ["returns", "trust", "UX", "AOV"], "eval_signal": "Czy komunikaty 'bezpieczeństwa' (gwarancja zwrotu, darmowa wysyłka zwrotna, ubezpieczenie) są używane jako pretekst do słabszej jakości informacji przedzakupowej — bo 'i tak można zwrócić'? Sprawdź czy jasność opisu produktu spada, gdy gwarancje rosną.", "lever": "Komunikuj gwarancje jako uzupełnienie dobrego opisu, nie zamiennik — jasny opis + gwarancja razem redukują zwroty bardziej niż sama gwarancja.", "risk": "Poleganie na 'łatwym zwrocie' by celowo zaniżyć jakość opisu/zdjęć (bo klient 'i tak sprawdzi w domu') podnosi koszty logistyczne i frustrację.", "evidence_class": "literatura", "evidence": []}, {"id": 68, "name": "Status Quo Bias", "series": "choice", "def": "We prefer the current state of affairs — change requires effort and risks loss.", "mech": "Changing defaults requires activation energy + loss aversion of the new unknown.", "hyp": "Pre-checked newsletter subscription (opt-out) dramatically outperforms opt-in.", "ctrl": "Newsletter checkbox unchecked by default (opt-in required)", "varnt": "Newsletter checkbox pre-checked by default (opt-out if unwanted)", "kpi": "Newsletter subscription rate", "kpi2": ["Email list growth", "Unsubscribe rate after opt-out test"], "diff": "easy", "time": "30min dev", "uplift": "+100–400% sign-ups", "tags": ["email", "defaults", "UX", "list growth"], "eval_signal": "Co jest ustawione jako domyślne (checked/unchecked) w każdym formularzu z opcją opt-in/opt-out — pytanie kontrolne: czy default działa na korzyść usera czy tylko biznesu.", "lever": "Ustawić sensowny default (np. najczęściej wybierany wariant) żeby skrócić ścieżkę decyzyjną, ale przy subskrypcjach/płatnościach dawać jasny, łatwy opt-out.", "risk": "Domyślne opt-in do płatnej subskrypcji lub trudne do wyłączenia auto-odnowienie to klasyczny dark pattern (subscription trap) — realne ryzyko prawne (np. EU Omnibus Directive).", "evidence_class": "literatura", "evidence": []}, {"id": 69, "name": "Ambiguity Bias", "series": "choice", "def": "We avoid options with unknown probabilities — the unknown is scarier than the known bad.", "mech": "Brains can't plan for ambiguity — uncertainty triggers avoidance.", "hyp": "Showing shipping cost and delivery date on the product page reduces cart abandonment.", "ctrl": "Shipping cost revealed only at checkout (after address entered)", "varnt": "Estimated delivery date + shipping cost displayed clearly on product page", "kpi": "Cart abandonment rate", "kpi2": ["Checkout start rate", "Conversion Rate"], "diff": "easy", "time": "2h dev", "uplift": "-10–25% abandonment", "tags": ["checkout", "UX", "transparency", "shipping"], "eval_signal": "czy koszt i czas dostawy są widoczne PRZED checkout (PDP/koszyk) czy dopiero na końcu; czy warunki zwrotu są jawne od razu; czy jest komunikat \"no surprises\" (np. \"darmowy zwrot 30 dni\" blisko CTA).", "lever": "pokazać estymowaną datę dostawy i koszt wysyłki możliwie najwcześniej (PDP, nie checkout); jasna sekcja FAQ/zwroty przy CTA.", "risk": "sztuczne \"odkrywanie\" informacji na końcu ścieżki żeby nie odstraszyć wcześniej — krótkoterminowo podnosi ATC, ale niszczy zaufanie i podbija porzucenia koszyka na kasie.", "evidence_class": "literatura", "evidence": []}, {"id": 70, "name": "Reactance", "series": "choice", "def": "We do the opposite of what's demanded when we feel our freedom is threatened.", "mech": "Threats to autonomy trigger negative emotion — we resist to reclaim control.", "hyp": "Soft suggestions ('You might also like') outperform hard demands ('Add this now!') on pop-ups.", "ctrl": "Aggressive 'Don't leave! Add this item NOW' exit pop-up", "varnt": "Gentle 'Before you go, you might enjoy...' suggestion overlay", "kpi": "Pop-up CTR", "kpi2": ["Bounce rate", "Conversion from pop-up"], "diff": "easy", "time": "1h copy", "uplift": "+5–15% CTR, -10% bounce", "tags": ["UX", "pop-ups", "copy", "CRO"], "eval_signal": "Czy popupy/CTA proponują czy rozkazują (ton komunikatu), czy exit-intent daje łatwe wyjście \"Nie, dzięki\" bez winy, czy presja czasowa jest realna czy sztuczna (fake urgency wywołuje reaktancję gdy user ją rozpozna).", "lever": "Zmiana tonu z nakazującego na sugerujący (\"Może Cię zainteresować\" zamiast \"Dodaj teraz!\"), łatwe zamykanie popupów bez ukrytego X.", "risk": "Agresywne, manipulacyjne CTA i trudne do zamknięcia modale to wprost dark pattern — user zamyka kartę ze złością zamiast konwertować.", "evidence_class": "literatura", "evidence": []}, {"id": 71, "name": "Reverse Psychology", "series": "attention", "def": "Advocating the opposite of the desired behavior to trigger it via reactance.", "mech": "Deliberately triggering reactance to steer someone toward the target behavior.", "hyp": "A 'Top Secret Members-Only' section requiring an extra click drives more engagement.", "ctrl": "Standard sale section clearly labeled 'Sale' in navigation", "varnt": "'Members Only: Secret Deals' section requiring one extra click to access", "kpi": "Section CTR", "kpi2": ["Time on page", "Conversion from hidden section"], "diff": "easy", "time": "2h dev", "uplift": "+20–50% CTR", "tags": ["UX", "engagement", "FOMO", "gamification"], "eval_signal": "Czy strona używa odwróconego framingu żeby wywołać reaktancję (np. 'to nie dla każdego', 'produkt tylko dla wymagających', 'nie klikaj jeśli nie jesteś gotowy') przy CTA lub w copy premium?", "lever": "Framing ekskluzywności/wyzwania ('nie każdy to udźwignie') przy produktach premium/niche — buduje pożądanie przez selektywność.", "risk": "Nadużyte jako fałszywa ekskluzywność ('tylko dla wybranych' gdy dostępne dla wszystkich) = manipulacja tożsamością, granica z fake scarcity.", "evidence_class": "literatura", "evidence": []}, {"id": 72, "name": "Backfire Effect", "series": "belief", "def": "Counter-evidence to deeply held beliefs causes people to believe even more strongly.", "mech": "Contradictory evidence feels like an identity attack — defensive strengthening occurs.", "hyp": "'Yes, and...' framing that acknowledges beliefs before shifting perspective converts skeptics.", "ctrl": "'Brand X is overpriced because...' direct debunking approach", "varnt": "'We know you've loved [Brand X] — here's what our loyal converts told us after switching'", "kpi": "Conversion among 'brand-loyal competitor' segments", "kpi2": ["Brand perception lift", "CTR among skeptics"], "diff": "easy", "time": "1h copy", "uplift": "+5–15% among skeptics", "tags": ["copywriting", "brand", "acquisition", "objections"], "eval_signal": "Czy strona próbuje bezpośrednio kontrować głęboko zakorzenione przekonania klienta (np. 'mit o X obalony') w sposób konfrontacyjny, co może wzmocnić opór zamiast go zmniejszyć? Sprawdź ton FAQ/edukacji przy kontrowersyjnych tematach kategorii.", "lever": "Zamiast bezpośredniej konfrontacji z przekonaniem klienta, użyj pytań/historii trzeciej osoby ('inni też tak myśleli, dopóki...') — mniej defensywna reakcja.", "risk": "Niskie ryzyko manipulacyjne — to głównie ostrzeżenie przed nieskuteczną taktyką contentową, nie dark pattern.", "evidence_class": "literatura", "evidence": []}, {"id": 73, "name": "Social Comparison Bias", "series": "social", "def": "Seeing someone 'better' than us triggers dislike and competitiveness.", "mech": "Self-esteem is relative — 'perfect' others push us down, triggering defensive reactions.", "hyp": "Relatable 'real customer' photos outperform aspirational perfect models for purchase intent.", "ctrl": "Aspirational model photos — perfect, idealized aesthetic", "varnt": "Real customer UGC photos — relatable, imperfect, diverse", "kpi": "Conversion Rate", "kpi2": ["Purchase intent survey", "Return rate"], "diff": "medium", "time": "1 day UGC sourcing", "uplift": "+5–20%", "tags": ["photography", "UGC", "social proof", "conversion"], "eval_signal": "Czy wizerunki na stronie są aspiracyjne-nieosiągalne czy relatable (pytanie kontrolne: czy grupa docelowa może się z tym utożsamić?), czy w galerii/recenzjach są zdjęcia realnych klientów obok profesjonalnych.", "lever": "Dodać realne zdjęcia klientów (UGC) obok profesjonalnych sesji, zróżnicować modele/reprezentację w komunikacji wizualnej.", "risk": "Nadmiernie \"perfekcyjny\" wizerunek alienuje część odbiorców i obniża intencję zakupu — granica to segment premium/luksusowy gdzie aspiracyjność bywa celowa.", "evidence_class": "literatura", "evidence": []}, {"id": 74, "name": "Planning Fallacy", "series": "memory", "def": "We underestimate how long tasks take by focusing on best-case scenarios.", "mech": "We ignore 'Attentional Bias' toward obstacles when planning future tasks.", "hyp": "'Real customer time: most finish in 45 min' sets expectations better than manufacturer specs.", "ctrl": "Manufacturer-provided assembly time estimate", "varnt": "'Real customers say: most finish in 45 minutes — here's a 3-step quickstart'", "kpi": "Customer satisfaction score", "kpi2": ["Return rate", "Support ticket volume"], "diff": "easy", "time": "2h research", "uplift": "+10–20% satisfaction", "tags": ["UX", "copy", "expectations", "returns"], "eval_signal": "Czy strona podaje realistyczny czas dostawy/wdrożenia czy optymistyczny best-case ('dostawa jutro') który regularnie się nie sprawdza? Sprawdź rozbieżność między obiecanym a rzeczywistym czasem dostawy (jeśli dane dostępne z GA4/opinii).", "lever": "Podawaj realistyczne, lekko zabezpieczone estymaty czasu dostawy zamiast best-case — mniej rozczarowań, mniej ticketów supportu.", "risk": "Celowe zaniżanie czasu dostawy żeby podnieść konwersję, wiedząc że to się nie sprawdzi = wprowadzanie w błąd (podobne do Ambiguity Bias #8).", "evidence_class": "literatura", "evidence": []}, {"id": 75, "name": "Restraint Bias", "series": "belief", "def": "We overestimate our ability to resist temptation in future 'hot' states.", "mech": "Cold-state planning can't accurately predict hot-state cravings.", "hyp": "Offering 'Auto-Pause' and 'Emergency Support' reduces churn on habit-change products.", "ctrl": "Standard subscription with no safety net or pause feature", "varnt": "'Auto-Pause' + 'SOS support chat' for subscription — acknowledging user will struggle", "kpi": "Churn rate", "kpi2": ["LTV", "Customer satisfaction", "NPS"], "diff": "medium", "time": "4h dev", "uplift": "-10–30% churn", "tags": ["subscription", "UX", "retention", "habit products"], "evidence_class": "literatura", "evidence": []}, {"id": 76, "name": "Overconfidence Effect", "series": "belief", "def": "Subjective confidence in our judgments reliably exceeds their objective accuracy.", "mech": "We focus on 'known knowns' and ignore what we don't know.", "hyp": "A 'Blind Spot Reveal' quiz makes users more likely to buy a professional solution.", "ctrl": "Standard product page without self-assessment component", "varnt": "Quiz revealing competence blind spots → 'This is why professionals use [Product]'", "kpi": "Quiz-to-purchase conversion", "kpi2": ["Time on quiz", "AOV from quiz segment"], "diff": "medium", "time": "4h dev", "uplift": "+15–30% from quiz", "tags": ["quiz", "B2B", "education", "SaaS"], "eval_signal": "Czy opis produktu/reklama obiecuje efekty z pewnością nieadekwatną do realnej zmienności wyników (np. 'gwarantowany efekt' w kategorii gdzie wynik zależy od użytkownika — suplementy, kosmetyki, fitness)? Sprawdź język pewności w claimach.", "lever": "Kalibruj język pewności do realnej zmienności efektu (np. 'u większości klientów w 4 tyg.' zamiast 'gwarantowany efekt') — buduje trust długoterminowo.", "risk": "Przesadna pewność co do efektu bez podstawy (nadinterpretacja badań, brak zastrzeżeń) to ryzyko prawne (reklama wprowadzająca w błąd) i wysoki zwrot/reklamacje.", "evidence_class": "literatura", "evidence": []}, {"id": 77, "name": "Social Desirability Bias", "series": "social", "def": "Survey respondents answer in ways viewed favorably by others, not truthfully.", "mech": "We filter our true preferences through what seems socially acceptable to say.", "hyp": "Behavioral click data builds a more accurate product roadmap than stated survey preferences.", "ctrl": "Product roadmap driven by user surveys ('What do you want next?')", "varnt": "Product roadmap driven by behavioral analytics (what they actually click and use)", "kpi": "Feature adoption rate of shipped features", "kpi2": ["User retention", "NPS"], "diff": "medium", "time": "2 days analytics", "uplift": "qualitative", "tags": ["research", "analytics", "product", "process"], "evidence_class": "literatura", "evidence": []}, {"id": 78, "name": "Third-Person Effect", "series": "belief", "def": "We believe mass media messages affect others more than ourselves.", "mech": "An ego defense that lets us feel smarter than the 'easily-swayed' masses.", "hyp": "Rational/scientific copy converts 'I'm immune to marketing' analytical user segments.", "ctrl": "Emotional, lifestyle-driven marketing copy for all segments", "varnt": "Logic-first, data-rich copy: 'The science behind [Product]: peer-reviewed results'", "kpi": "Conversion among analytically-inclined segments", "kpi2": ["CTR", "Session length"], "diff": "easy", "time": "1h copy", "uplift": "+5–15% in analytical segment", "tags": ["copywriting", "segmentation", "B2B", "data"], "evidence_class": "literatura", "evidence": []}, {"id": 79, "name": "Chunking", "series": "choice", "def": "Grouping individual pieces of information into larger meaningful wholes.", "mech": "Reduces cognitive load by treating 5 items as 1 chunk — fits more in working memory.", "hyp": "Grouped product descriptions (Material | Fit | Care) increase comprehension vs. paragraphs.", "ctrl": "Single continuous paragraph describing product features", "varnt": "Three distinct labeled sections: Material / Fit & Sizing / Care Instructions", "kpi": "Comprehension quiz score", "kpi2": ["Time on page", "Return rate"], "diff": "easy", "time": "1h copy", "uplift": "+10–20% comprehension", "tags": ["UX", "copy", "PDP", "returns"], "eval_signal": "Czy długie formularze checkout/opisy produktu są podzielone na logiczne grupy (np. dane kontaktowe / adres / płatność jako osobne kroki) czy jedna ściana pól? Sprawdź strukturę specyfikacji produktu — czy pogrupowana (wymiary/materiał/pielęgnacja) czy jedna lista.", "lever": "Grupuj pola formularza i atrybuty produktu w logiczne, nazwane bloki (max ~5-7 elementów na grupę) — redukuje obciążenie poznawcze i porzucenia.", "risk": "Niskie — czysto UX, brak granicy dark pattern.", "evidence_class": "literatura", "evidence": []}, {"id": 80, "name": "Serial Position Effect", "series": "memory", "def": "First and last items in a list are remembered best; middle items are recalled worst.", "mech": "Primacy (long-term rehearsal) + Recency (still in working memory) create U-shaped recall.", "hyp": "Placing the strongest 'reason to buy' first and second-strongest last improves conversion.", "ctrl": "'Reasons to buy' list in random or arbitrary order", "varnt": "Strongest benefit first / weakest in middle / second-strongest benefit last", "kpi": "Conversion Rate", "kpi2": ["Key feature recall (survey)", "Scroll depth"], "diff": "easy", "time": "30min copy", "uplift": "+3–8%", "tags": ["copy", "PDP", "landing page", "CRO"], "eval_signal": "Czy najmocniejszy argument/produkt jest na pierwszym miejscu listy a drugi najmocniejszy na ostatnim (obecny), czy kluczowe punkty giną w środku długiej listy (brak/źle użyty).", "lever": "Przenieść najsilniejszy bullet/USP na górę listy, drugi najsilniejszy na dół; w karuzeli produktów najlepiej sprzedający się produkt na start i koniec.", "risk": "Niskie — głównie ryzyko zaniedbania (środek listy zawsze będzie słabszy, więc nie wrzucać tam kluczowych informacji, np. ceny czy gwarancji).", "evidence_class": "literatura", "evidence": []}, {"id": 81, "name": "Primacy Effect", "series": "memory", "def": "The first items in a sequence anchor our overall perception more strongly.", "mech": "First items get more rehearsal time and transfer to long-term memory.", "hyp": "Testing different first product gallery images reveals which anchors the best perception.", "ctrl": "Random first image in product gallery (often a plain pack shot)", "varnt": "Test: lifestyle first image / technical detail first / color hero first", "kpi": "Conversion Rate per first-image variant", "kpi2": ["Bounce rate", "Image engagement"], "diff": "easy", "time": "2h A/B setup", "uplift": "+5–15%", "tags": ["PDP", "photography", "CRO", "A/B testing"], "eval_signal": "Co jest PIERWSZYM elementem na PDP/listingu (pierwsze zdjęcie, pierwszy bullet, pierwszy wariant)? Czy to najsilniejszy argument sprzedażowy, czy przypadkowa kolejność? Sprawdź kolejność bulletów i wariantów cenowych.", "lever": "Umieść najsilniejszy argument/atut i najkorzystniejszy wariant jako pierwszy widoczny element — kotwiczy całą dalszą percepcję.", "risk": "Niskie — dopóki pierwszy element jest prawdziwy i reprezentatywny, nie fałszywie wyolbrzymiony.", "evidence_class": "literatura", "evidence": []}, {"id": 82, "name": "Recency Effect", "series": "memory", "def": "The most recently presented information is best remembered.", "mech": "Most recent items remain active in the phonological loop or working memory.", "hyp": "A 'Safe & Secure' trust badge immediately adjacent to the final 'Pay' button reduces abandonment.", "ctrl": "Trust badges in the footer of checkout, away from payment button", "varnt": "'256-bit Secure / Verified by Visa' badge directly next to the 'Complete Order' button", "kpi": "Payment step abandonment rate", "kpi2": ["Checkout completion rate", "Trust score"], "diff": "easy", "time": "30min dev", "uplift": "+3–8%", "tags": ["checkout", "trust", "UX", "conversion"], "eval_signal": "Co jest OSTATNIM elementem przed CTA (ostatni argument, ostatnia recenzja, ostatnia sekcja przed 'dodaj do koszyka')? Sprawdź czy to mocne domknięcie (gwarancja, urgency, kluczowa korzyść) czy słaby/przypadkowy element (stopka, niepowiązany link).", "lever": "Zaprojektuj ostatni element przed CTA jako mocne domknięcie decyzji (podsumowanie korzyści + gwarancja) — to zostaje w pamięci tuż przed kliknięciem.", "risk": "Niskie — czysto strukturalna dźwignia UX.", "evidence_class": "literatura", "evidence": []}, {"id": 83, "name": "Spacing Effect", "series": "memory", "def": "Learning is greater when spread over time vs. compressed into one session.", "mech": "Memory consolidation happens during rest — spaced repetition strengthens neural paths.", "hyp": "A 3-email drip over one week outperforms a single product announcement email.", "ctrl": "One large email: all products, all details, all offers at once", "varnt": "Email 1: Problem / Email 2: Solution reveal / Email 3: Offer + deadline", "kpi": "Conversion from email series", "kpi2": ["Open rate per email", "CTR per email", "Unsubscribe rate"], "diff": "easy", "time": "2h email setup", "uplift": "+10–25% conversion", "tags": ["email", "drip", "copy", "retention"], "evidence_class": "literatura", "evidence": []}, {"id": 84, "name": "Misattribution of Memory", "series": "memory", "def": "Remembering information correctly but being wrong about its source.", "mech": "Content memory and source memory are stored separately and can detach.", "hyp": "Consistent brand colors and design across all platforms maximize positive misattribution.", "ctrl": "Inconsistent branding across ads, email, website, and social", "varnt": "Pixel-perfect brand consistency: same palette, font, style across every touchpoint", "kpi": "Brand recall rate (unaided survey)", "kpi2": ["Organic branded search volume", "CTR on retargeting"], "diff": "medium", "time": "2 days brand audit", "uplift": "+10–30% brand recall", "tags": ["brand", "design", "consistency", "awareness"], "evidence_class": "literatura", "evidence": []}, {"id": 85, "name": "False Memory", "series": "memory", "def": "Remembering events that didn't happen or differently than they occurred.", "mech": "Memory is reconstructive — every recall rebuilds the event, often adding new details.", "hyp": "Visual order history with photos and dates reduces 'I never received this' disputes.", "ctrl": "Text-only order history: 'Order #1234 — 3 items — $89.00'", "varnt": "Visual order history: product photos, timeline, tracking history with dates and status", "kpi": "'I never got this' CS inquiry volume", "kpi2": ["Trust score", "Return dispute rate"], "diff": "medium", "time": "4h dev", "uplift": "-20–40% disputes", "tags": ["UX", "account", "CS", "trust"], "evidence_class": "literatura", "evidence": []}, {"id": 86, "name": "Source Confusion", "series": "social", "def": "Correctly remembering information but attributing it to the wrong source.", "mech": "Two competing sources for the same cue — the 'wrong' one can win retrieval.", "hyp": "'Our policy vs. Standard Industry Policy' comparison table reduces confusion-based mistrust.", "ctrl": "Return/refund policy described in isolation", "varnt": "Comparison table: 'Standard industry policy vs. Our policy' side by side", "kpi": "Policy page bounce rate", "kpi2": ["Trust score", "Conversion after policy page visit"], "diff": "easy", "time": "1h copy", "uplift": "+5–10% trust", "tags": ["trust", "UX", "copy", "policy"], "evidence_class": "literatura", "evidence": []}, {"id": 87, "name": "Cryptomnesia", "series": "belief", "def": "A forgotten memory returns unrecognized — the person believes it's their original idea.", "mech": "Source monitoring failure: the 'What' is remembered, the external origin is forgotten.", "hyp": "An 'Inspiration Bank' for design tracking prevents accidental competitor copying.", "ctrl": "No systematic tracking of design inspiration sources", "varnt": "Shared 'Inspiration Bank': every design idea logged with source URL and date", "kpi": "Legal/IP risk incidents", "kpi2": ["Design differentiation score", "Team transparency"], "diff": "easy", "time": "1h setup", "uplift": "risk reduction", "tags": ["process", "team", "design", "IP"], "evidence_class": "literatura", "evidence": []}, {"id": 88, "name": "Suggestibility", "series": "memory", "def": "False information can be incorporated into memory via suggestion.", "mech": "The brain uses gaps in memory to fit in suggested information for coherence.", "hyp": "Positive-leading survey questions improve user's retrospective experience rating.", "ctrl": "Neutral: 'How would you rate your delivery experience? (1-5)'", "varnt": "Positive-leading: 'How much did you enjoy our fast and reliable delivery?'", "kpi": "Average survey score", "kpi2": ["NPS", "Repeat purchase rate"], "diff": "easy", "time": "30min copy", "uplift": "+0.3–0.8 score pts", "tags": ["surveys", "NPS", "UX", "retention"], "evidence_class": "literatura", "evidence": []}, {"id": 89, "name": "Fading Affect Bias", "series": "memory", "def": "Negative emotional memories fade faster than positive ones.", "mech": "The mind's immune system maintains optimism by eroding negative affect over time.", "hyp": "A positive touchpoint after a negative experience accelerates win-back.", "ctrl": "No follow-up after a return or negative review", "varnt": "'We're sorry' + surprise free gift or credit after return/negative review", "kpi": "Win-back rate (2nd purchase after negative experience)", "kpi2": ["NPS after recovery", "LTV of recovered customers"], "diff": "easy", "time": "2h setup", "uplift": "+20–50% win-back", "tags": ["retention", "CS", "email", "recovery"], "evidence_class": "literatura", "evidence": []}, {"id": 90, "name": "List-Length Effect", "series": "memory", "def": "As a list grows longer, the percentage of items remembered decreases.", "mech": "Interference between similar items and limited working memory capacity.", "hyp": "A persistent wishlist icon on long category pages improves return-visit conversion.", "ctrl": "Category page with 100 items, no save or bookmark feature", "varnt": "Heart/save icon always visible in product card corner for quick wishlist adds", "kpi": "Wishlist adds per session", "kpi2": ["Return visit rate", "Conversion from wishlist"], "diff": "easy", "time": "2h dev", "uplift": "+10–25% in return-visit conversion", "tags": ["UX", "wishlist", "navigation", "retention"], "eval_signal": "czy długi listing ma mechanizm \"zapamiętywania\" dla usera (wishlist, porównywarka, ikona serca) czy user musi polegać na własnej pamięci przy przewijaniu dziesiątek produktów?", "lever": "dodać zawsze widoczną ikonę wishlist/compare na kartach produktu w listingu, żeby user nie musiał pamiętać co mu się podobało wśród wielu pozycji.", "risk": "nadmiar mechanizmów \"zapamiętywania\" (zbyt wiele ikon akcji na karcie) zaśmieca listing i sam staje się źródłem przeciążenia — patrz Hick's Law.", "evidence_class": "literatura", "evidence": []}, {"id": 91, "name": "Leveling and Sharpening", "series": "memory", "def": "Memory 'levels' (forgets) details and 'sharpens' (exaggerates) salient points.", "mech": "The brain creates a summary, keeping only the most distinctive elements.", "hyp": "Identifying and amplifying one 'sharp' brand signature element improves aided recall.", "ctrl": "Multiple brand elements competing for attention — no single signature", "varnt": "Identify the 'One Sharp Thing' and feature it prominently in all brand communications", "kpi": "Unaided brand recall rate", "kpi2": ["Brand association accuracy", "Share of voice"], "diff": "hard", "time": "1 week strategy", "uplift": "+10–30% recall", "tags": ["brand", "strategy", "positioning", "awareness"], "evidence_class": "literatura", "evidence": []}, {"id": 92, "name": "Serial Recall Effect", "series": "memory", "def": "We recall items better when they follow a clear sequential order.", "mech": "Temporal coding: information stored as sequences, like a movie reel.", "hyp": "Step-by-step onboarding increases feature adoption vs. a feature-rich dashboard.", "ctrl": "Full feature dashboard visible from Day 1 — everything available immediately", "varnt": "Guided onboarding: 1 feature introduced per day, in logical progression", "kpi": "Feature adoption rate at 30 days", "kpi2": ["Onboarding completion rate", "Churn at Day 30"], "diff": "medium", "time": "4h dev", "uplift": "+15–30% adoption", "tags": ["onboarding", "UX", "SaaS", "retention"], "evidence_class": "literatura", "evidence": []}, {"id": 93, "name": "Google Effect (Digital Amnesia)", "series": "memory", "def": "We forget information we know we can easily find online later.", "mech": "The brain optimizes for 'how to find it' rather than storing the info itself.", "hyp": "Ranking #1 for 'Brand + Generic Category' captures users relying on search for recall.", "ctrl": "Ranked by brand terms only, no generic category presence", "varnt": "SEO/SEM strategy targeting '[Brand] + [Generic Category]' searches explicitly", "kpi": "Organic traffic from generic+brand queries", "kpi2": ["Branded search volume", "Revenue from search capture"], "diff": "hard", "time": "3 months SEO", "uplift": "+20–50% brand+generic traffic", "tags": ["SEO", "SEM", "brand", "awareness"], "evidence_class": "literatura", "evidence": []}, {"id": 94, "name": "Testing Effect", "series": "memory", "def": "Retrieving information strengthens memory more than passively reviewing it.", "mech": "Active retrieval creates stronger neural connections than passive re-exposure.", "hyp": "A quiz after a product video increases feature adoption vs. video-only content.", "ctrl": "Product how-to video with no interaction element", "varnt": "Video + 3-question quiz at the end: 'What's the first step?' etc.", "kpi": "Feature adoption rate", "kpi2": ["Time to first use", "Retention at 14 days"], "diff": "easy", "time": "2h dev", "uplift": "+10–20% adoption", "tags": ["education", "UX", "onboarding", "retention"], "evidence_class": "literatura", "evidence": []}, {"id": 95, "name": "Next-in-Line Effect", "series": "choice", "def": "Anticipatory anxiety about an upcoming task consumes cognitive resources, causing missed details.", "mech": "Internal rehearsal of the upcoming action leaves no capacity for surrounding information.", "hyp": "Moving 'No Returns' policy information one step before — not during — the Buy moment reduces disputes.", "ctrl": "Critical terms ('No returns on sale items') on same screen as 'Buy Now' button", "varnt": "Policy displayed prominently one step before: 'Before you proceed, note: Sale items are final sale'", "kpi": "Dispute rate", "kpi2": ["Return claim rate", "CS ticket volume"], "diff": "easy", "time": "1h UX", "uplift": "-20–40% disputes", "tags": ["UX", "policy", "checkout", "CS"], "evidence_class": "literatura", "evidence": []}, {"id": 96, "name": "Tip of the Tongue Phenomenon", "series": "memory", "def": "Feeling a memory is available but currently inaccessible — blocked by a competing memory.", "mech": "A related-but-wrong memory is 'louder,' blocking the correct retrieval path.", "hyp": "Visual search and 'Did you mean?' suggestions bypass word-blocking and recover lost searches.", "ctrl": "Text-only search with no suggestions or visual results", "varnt": "Visual search (image-based) + 'Did you mean?' suggestions + category auto-complete", "kpi": "Search abandonment rate", "kpi2": ["Search-to-purchase conversion", "Zero-results rate"], "diff": "hard", "time": "1 week dev", "uplift": "-15–30% search abandonment", "tags": ["search", "UX", "navigation", "CRO"], "evidence_class": "literatura", "evidence": []}, {"id": 97, "name": "Absent-Mindedness", "series": "choice", "def": "Memory lapses caused by failure to pay attention at the time of encoding.", "mech": "The attention filter was elsewhere — information never entered long-term memory.", "hyp": "A pattern-interrupting modal for critical choices reduces wrong-selection errors.", "ctrl": "'Shipping method' quietly listed among other checkout fields", "varnt": "Color-change or modal interrupt: 'Heads up: you selected In-Store Pickup. Is that right?'", "kpi": "Wrong-selection error rate", "kpi2": ["CS inquiry volume", "Customer satisfaction"], "diff": "easy", "time": "2h dev", "uplift": "-30–50% wrong selections", "tags": ["UX", "checkout", "error prevention", "CS"], "evidence_class": "literatura", "evidence": []}, {"id": 98, "name": "Blocking", "series": "memory", "def": "One memory interferes with the retrieval of another.", "mech": "Retrieval competition — the 'wrong' path is currently stronger.", "hyp": "Social login options eliminate password blocking and reduce abandoned logins.", "ctrl": "Username/password login only — no social login", "varnt": "Google / Facebook / Apple login as primary options, password as secondary", "kpi": "Login success rate", "kpi2": ["Cart abandonment at login step", "Account creation rate"], "diff": "medium", "time": "4h dev", "uplift": "+10–25% login success", "tags": ["UX", "checkout", "account", "authentication"], "evidence_class": "literatura", "evidence": []}, {"id": 99, "name": "Persistence", "series": "social", "def": "Unwanted recall of disturbing memories — persistent intrusive thoughts.", "mech": "Strong fear-based emotional arousal creates hard-coded, difficult-to-suppress memories.", "hyp": "Hyper-transparency elements (live tracking, physical address, live chat) counter checkout anxiety.", "ctrl": "Standard checkout with minimal trust signals", "varnt": "Full trust overlay: live order tracking preview, physical address, live chat availability, phone number", "kpi": "First-time visitor checkout completion rate", "kpi2": ["Trust score", "Abandonment rate"], "diff": "medium", "time": "2 days", "uplift": "+5–20% for first-time buyers", "tags": ["trust", "checkout", "UX", "acquisition"], "evidence_class": "literatura", "evidence": []}, {"id": 100, "name": "Self-Consistency Bias", "series": "belief", "def": "We rewrite our past self to match our current identity — wanting to feel stable.", "mech": "The brain creates a coherent personal narrative, revising past attitudes to match present.", "hyp": "'Welcome to the world of [Category]' bridging copy converts first-time segment buyers.", "ctrl": "'Welcome back! Here's what's new.' generic returning user message", "varnt": "'Welcome to the world of [Category] — you're now part of a community of [X] people who...'", "kpi": "First purchase rate in new segment", "kpi2": ["LTV of new segment", "Second purchase rate"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["copywriting", "onboarding", "identity", "retention"], "evidence_class": "literatura", "evidence": []}, {"id": 101, "name": "Egocentric Bias", "series": "belief", "def": "Overreliance on our own perspective — seeing ourselves as more central and special.", "mech": "We are the protagonist of our own story — our actions and needs feel uniquely important.", "hyp": "'Exclusive / Only for you' personalized language increases CTR vs. generic 'For our members'.", "ctrl": "'Special offer for our loyal customers'", "varnt": "'This offer is only visible to you, [Name] — we held it back just for you'", "kpi": "Email open rate", "kpi2": ["CTR", "Conversion from email"], "diff": "easy", "time": "30min copy", "uplift": "+5–20% open rate", "tags": ["email", "personalization", "copy", "CRO"], "evidence_class": "literatura", "evidence": []}, {"id": 102, "name": "Hindsight Bias II", "series": "memory", "def": "'I knew it all along' — past events feel more predictable in retrospect.", "mech": "The brain creates a linear narrative of cause-and-effect once the outcome is known.", "hyp": "'The secret is out' headlines make users feel like early adopters or insiders.", "ctrl": "Standard product launch headline: 'Introducing [Product]'", "varnt": "'The secret's finally out — [Product] that insiders have been using for months'", "kpi": "CTR", "kpi2": ["Conversion Rate", "Brand authority perception"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["copywriting", "launch", "brand", "authority"], "evidence_class": "literatura", "evidence": []}, {"id": 103, "name": "Telescoping Effect", "series": "memory", "def": "We displace recent events backward (seem longer ago) and remote events forward (seem recent).", "mech": "Time is judged by memory intensity and density — not by the calendar.", "hyp": "Replenishment reminders based on actual usage math (not user memory) drive repeat purchases.", "ctrl": "Waiting for user to notice they've run out and re-order organically", "varnt": "'Based on your usage, you'll run out in about 5 days — refill now?' at calculated trigger", "kpi": "Repeat purchase rate", "kpi2": ["Revenue from replenishment", "Unsubscribe from reminders"], "diff": "medium", "time": "4h dev", "uplift": "+15–30% repeat", "tags": ["email", "retention", "replenishment", "subscription"], "evidence_class": "literatura", "evidence": []}, {"id": 104, "name": "Rosy Retrospection", "series": "memory", "def": "We rate past events more positively than we rated them in the moment.", "mech": "Small annoyances are leveled off over time — peaks are sharpened, lows are smoothed.", "hyp": "Review requests sent 30 days post-purchase get higher scores than requests sent after delivery.", "ctrl": "Review request email sent 2 days after delivery", "varnt": "Review request email sent 28-30 days after delivery", "kpi": "Average review rating", "kpi2": ["Review volume", "Review sentiment"], "diff": "easy", "time": "1h email setup", "uplift": "+0.2–0.5 stars", "tags": ["reviews", "email", "UX", "NPS"], "evidence_class": "literatura", "evidence": []}, {"id": 105, "name": "Childhood Amnesia", "series": "memory", "def": "Adults can't retrieve early childhood memories — first clear emotional memories are age 6-12.", "mech": "Lack of language encoding + rapid hippocampal development in early childhood.", "hyp": "Nostalgia design elements targeting generational cohort peaks (ages 8-12) increases brand affinity.", "ctrl": "Modern, contemporary aesthetics for all age groups equally", "varnt": "Cohort-specific nostalgia elements: 90s aesthetics for Millennials / 80s for Gen X", "kpi": "Brand affinity score in target age group", "kpi2": ["Conversion Rate", "Social sharing"], "diff": "medium", "time": "2 days design", "uplift": "+5–15% affinity", "tags": ["brand", "design", "nostalgia", "segmentation"], "evidence_class": "literatura", "evidence": []}, {"id": 106, "name": "Bizarreness Effect II", "series": "attention", "def": "Unusual things are more memorable than ordinary ones — closing principle.", "mech": "Distinctiveness leads to higher attention allocation and deeper encoding.", "hyp": "An 'Easter Egg' surprise in checkout makes the transaction memorable and shareable.", "ctrl": "Standard functional checkout with no unexpected elements", "varnt": "Hidden Easter Egg: animated surprise (e.g. confetti at final step) + secret discount unlocked", "kpi": "Social sharing rate", "kpi2": ["Brand recall", "Repeat purchase rate"], "diff": "easy", "time": "2h dev", "uplift": "+5–15% social sharing", "tags": ["UX", "brand", "gamification", "WOM"], "evidence_class": "literatura", "evidence": []}, {"id": 107, "name": "Affect Heuristic", "series": "ai", "def": "Decisions are driven by current emotional state rather than rational analysis.", "mech": "The affective system processes faster than the analytical — we feel before we think.", "hyp": "Aligning product recommendations with user's time-of-day emotional context increases conversion.", "ctrl": "Same product mix and copy shown at all hours equally", "varnt": "Evening: comfort/cozy products / Morning: achievement/productivity products — AI-triggered", "kpi": "Conversion Rate by time segment", "kpi2": ["AOV by time block", "Return rate"], "diff": "medium", "time": "4h dev", "uplift": "+5–15% in aligned segments", "tags": ["personalization", "AI", "timing", "CRO"], "eval_signal": "czy strona w ogóle różnicuje komunikat pod kontekst (pora dnia, sezon, sekcja \"dla Ciebie\") czy jeden statyczny przekaz dla wszystkich; czy hero/CTA komunikuje emocję dopasowaną do intencji wejścia (impuls vs planowany zakup).", "lever": "segmentacja kreacji wg pory dnia/kontekstu (wieczór = produkty komfortowe/nagrody, rano = aspiracyjne/wydajnościowe); dynamiczny hero na landing page.", "risk": "manipulacja nastrojem w chwilach słabości (np. targetowanie smutku/samotności) przechodzi w dark pattern — granica to wykorzystanie kontekstu vs wykorzystanie kryzysu emocjonalnego klienta.", "evidence_class": "literatura", "evidence": []}, {"id": 108, "name": "Automation Complacency", "series": "ai", "def": "Uncritical acceptance of automated system decisions — reduced human oversight.", "mech": "Consistent system reliability reduces monitoring — creating blind spots at critical moments.", "hyp": "Periodic 'Still right for you?' check-ins on auto-reorders improve satisfaction and reduce churn.", "ctrl": "Silent auto-reorder with no user review prompts", "varnt": "Every 6th auto-reorder: 'You've ordered this 6x — still the right choice? See alternatives'", "kpi": "Customer satisfaction score (CSAT)", "kpi2": ["Churn rate", "LTV of auto-order customers"], "diff": "easy", "time": "2h dev", "uplift": "-10–20% churn", "tags": ["subscription", "AI", "retention", "UX"], "eval_signal": "Czy klient bezkrytycznie ufa rekomendacjom algorytmu/chatbota na tyle, że strona przestaje pokazywać alternatywy lub ostrzeżenia (np. 'polecane dla Ciebie' bez opcji łatwego porównania z innymi)? Sprawdź czy AI-rekomendacje mają widoczną możliwość odrzucenia/porównania.", "lever": "Zawsze pokazuj obok rekomendacji AI opcję 'zobacz inne opcje/porównaj' — utrzymuje krytyczne zaangażowanie klienta.", "risk": "Wykorzystanie zaufania do 'automatycznej rekomendacji' żeby przepchnąć droższy/mniej dopasowany produkt bez łatwej ścieżki porównania = manipulacja przez pozorną obiektywność algorytmu.", "evidence_class": "literatura", "evidence": []}, {"id": 109, "name": "Automation Trust Bias", "series": "ai", "def": "Trust and loyalty shifting from human brands to algorithmic systems.", "mech": "Algorithms outperform humans on consistency — they don't have bad days.", "hyp": "'Your assistant recommends' framing outperforms 'Nike recommends' for same product.", "ctrl": "'Nike recommends this for you based on your history'", "varnt": "'Your shopping assistant recommends this based on your profile'", "kpi": "Conversion Rate", "kpi2": ["Perceived trust score", "CTR on recommendation"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["AI", "personalization", "copy", "trust"], "eval_signal": "czy strona ma warstwę \"asystenta\"/rekomendacji AI z własną tożsamością (a nie generyczny \"polecane produkty\"); czy komunikat rekomendacji buduje relację z systemem czy z marką.", "lever": "nazwanie i uczłowieczenie warstwy rekomendacji (np. spersonalizowany asystent zakupowy), konsekwentne trafne rekomendacje budujące długoterminowe zaufanie do systemu.", "risk": "jeśli asystent/algorytm zacznie polecać stronniczo (płatne umieszczenia jako \"rekomendacja AI\") — utrata zaufania jest gwałtowna, bo klient czuł się \"prowadzony\" a nie \"reklamowany\".", "evidence_class": "literatura", "evidence": []}, {"id": 110, "name": "Bandwagon Effect", "series": "social", "def": "We adopt beliefs and behaviors because others are doing it — herding.", "mech": "In uncertainty, others are assumed to have better information — self-reinforcing adoption.", "hyp": "Real-time 'X people bought this today' counter increases conversion vs. static social proof.", "ctrl": "Static '★★★★★ 4.8 (2,341 reviews)' badge", "varnt": "Live counter: '47 people bought this today · 12 viewing now'", "kpi": "Conversion Rate", "kpi2": ["AOV", "Time to purchase"], "diff": "easy", "time": "2h dev", "uplift": "+5–20%", "tags": ["social proof", "FOMO", "live", "CRO"], "eval_signal": "Czy strona pokazuje sygnały masowego przyjęcia (liczba sprzedanych, 'najczęściej wybierany', trendy/bestsellery na listingu) w sposób widoczny przy decyzji, nie schowany w stopce?", "lever": "Eksponuj realne liczby wolumenu/rankingi bestsellerów blisko CTA i na listingu — obniża postrzegane ryzyko przez efekt tłumu.", "risk": "Fałszywe/nadmuchane liczniki 'kupione X razy' lub sztucznie generowane rankingi bestsellerów = fake social proof, wysokie ryzyko wykrycia i utraty zaufania.", "evidence_class": "literatura", "evidence": []}, {"id": 111, "name": "Default Effect", "series": "choice", "def": "People strongly choose the pre-selected default, even when change would be beneficial.", "mech": "Changing defaults requires effort and implies accepting responsibility for the new choice.", "hyp": "Subscribe & Save pre-selected as default dramatically increases subscription adoption.", "ctrl": "One-time purchase pre-selected, Subscribe & Save requires active selection", "varnt": "Subscribe & Save pre-selected at 10% off, one-time purchase requires unchecking", "kpi": "Subscription adoption rate", "kpi2": ["Revenue per customer", "LTV"], "diff": "easy", "time": "1h dev", "uplift": "+30–80% subscription adoption", "tags": ["subscription", "defaults", "UX", "revenue"], "eval_signal": "która opcja jest pre-zaznaczona przy wyborze subskrypcji/wariantu/dostawy; czy zmiana domyślnej opcji jest łatwa i widoczna, czy ukryta.", "lever": "ustawić opcję korzystną biznesowo (i uczciwą dla klienta) jako domyślną — np. subskrypcja z realną korzyścią, popularny wariant produktu.", "risk": "domyślne zaznaczenie droższej opcji/subskrypcji trudnej do anulowania (pre-selected upsell, dark pattern subskrypcyjny) — klasyczny \"sneak into basket\"/\"forced continuity\".", "evidence_class": "literatura", "evidence": []}, {"id": 112, "name": "Endowment Effect", "series": "value", "def": "We value things more highly once we own them — or perceive them as 'ours'.", "mech": "Ownership activates loss aversion — giving it up is a loss, not just a cost.", "hyp": "AR 'see it in your space' / try-on feature increases conversion and reduces returns.", "ctrl": "Standard static product photography only", "varnt": "AR try-on or room visualization: 'See this [product] in your home/on you'", "kpi": "Conversion Rate from AR users", "kpi2": ["Return rate", "Time to purchase"], "diff": "hard", "time": "2 weeks dev", "uplift": "+20–40%", "tags": ["AR", "UX", "mobile", "conversion"], "eval_signal": "czy PDP ma funkcję AR/wizualizacji \"u mnie\" (np. mebel w pokoju, ubranie na sylwetce); czy konfigurator pozwala \"poczuć\" personalizację przed dodaniem do koszyka.", "lever": "dodać funkcję AR/wizualizacji lub personalizacji na PDP przed CTA \"kup\", by aktywować poczucie posiadania wcześniej w ścieżce.", "risk": "aktywowanie poczucia posiadania przy produktach o wysokim ryzyku zwrotu (np. źle dobrany rozmiar) prowadzi do rozczarowania i zwrotu po fakcie — trzeba równoważyć z rzetelną informacją o dopasowaniu.", "evidence_class": "literatura", "evidence": []}, {"id": 113, "name": "Habituation", "series": "attention", "def": "Decreased response to repeated stimuli — the brain 'turns off' repetitive inputs.", "mech": "Repeated stimuli generate progressively smaller neural responses — adaptive mechanism.", "hyp": "Capping ad frequency at 3 exposures/week maintains ROAS vs. uncapped delivery.", "ctrl": "Uncapped retargeting delivery — as many impressions as budget allows", "varnt": "Frequency cap: max 3 ad exposures per person per week for same creative", "kpi": "ROAS", "kpi2": ["CTR decay curve", "Cost per acquisition"], "diff": "easy", "time": "1h ad config", "uplift": "+10–30% ROAS", "tags": ["ads", "retargeting", "frequency", "media buying"], "eval_signal": "czy kreacje/banery/popupy rotują, czy user widzi ten sam element od miesięcy? Czy jest cap na frequency reklam do tego samego usera? Czy kluczowe CTA są \"martwe wizualnie\" bo wtopione w powtarzalny layout?", "lever": "rotacja kreacji, frequency cap (np. max 3 ekspozycje/tydzień), okresowe odświeżanie layoutu sekcji promocyjnych żeby przełamać \"ad blindness\".", "risk": "nadmierna rotacja rozmywa rozpoznawalność marki — trzeba balansować świeżość z konsystencją.", "evidence_class": "literatura", "evidence": []}, {"id": 114, "name": "Hot-Cold Empathy Gap", "series": "value", "def": "Difficulty predicting preferences when in a different emotional state.", "mech": "Hot and cold states are governed by distinct systems — neither accurately predicts the other.", "hyp": "Evening push notifications (hot state) convert more but produce higher return rates than morning.", "ctrl": "Push notifications sent at fixed time (e.g. 10am) for all users", "varnt": "A: Evening push (7pm) / B: Morning push (9am) — measure conversion AND return rate", "kpi": "Conversion Rate AND return rate (measured together)", "kpi2": ["AOV", "LTV per notification timing"], "diff": "easy", "time": "2h setup", "uplift": "varies — quality over quantity", "tags": ["push", "timing", "mobile", "email"], "eval_signal": "o jakiej porze/w jakim kontekście wysyłane są oferty impulsowe (wieczór/late night vs rano); czy po zakupie impulsowym jest okno na spokojne przemyślenie (np. łatwy zwrot) czy presja jest utrzymywana do końca.", "lever": "timing komunikacji promocyjnej pod stan emocjonalny (wieczór dla ofert impulsowych), ale mierzyć nie tylko konwersję, także wskaźnik zwrotów, by ocenić jakość decyzji.", "risk": "świadome celowanie w moment zmęczenia/emocjonalnej słabości klienta żeby \"wycisnąć\" impulsowy zakup, wiedząc że wzrośnie liczba zwrotów/żalu — to eksploatacja stanu, nie marketing.", "evidence_class": "literatura", "evidence": []}, {"id": 115, "name": "Illusion of Serendipity", "series": "attention", "def": "Perceiving engineered algorithmic discovery as a lucky coincidence.", "mech": "Serendipitous discovery feels authentic and creates stronger attachment than directed search.", "hyp": "No label on algorithmically-selected products performs better than 'Recommended for you'.", "ctrl": "'Recommended for you' label on AI-selected products", "varnt": "A: 'You might also like' / B: No label — same algorithmically selected products", "kpi": "Conversion Rate", "kpi2": ["Authenticity perception score", "Engagement rate"], "diff": "easy", "time": "1h A/B setup", "uplift": "+3–10%", "tags": ["AI", "personalization", "UX", "recommendations"], "eval_signal": "Czy sekcja 'polecane/może Ci się spodobać' jest zaprezentowana jako neutralne, przypadkowe odkrycie, podczas gdy w rzeczywistości to płatne/algorytmiczne umieszczenie? Sprawdź czy sponsorowane rekomendacje są oznaczone.", "lever": "Buduj poczucie 'trafnego odkrycia' przez dobre dopasowanie rekomendacji do kontekstu przeglądania (kategoria, ostatnio oglądane) — działa najlepiej gdy autentyczne.", "risk": "Ukrywanie że 'polecane dla Ciebie' to w rzeczywistości płatna promocja/wypychanie zapasów magazynowych = wprowadzanie w błąd co do natury rekomendacji.", "evidence_class": "literatura", "evidence": []}, {"id": 116, "name": "Choice Overload", "series": "choice", "def": "Too many options causes paralysis, dissatisfaction, and decision postponement.", "mech": "Each additional option increases cognitive cost and fear of the 'wrong' choice.", "hyp": "3 AI-curated products with 'why this for you' beats full catalog of 48 for conversion.", "ctrl": "Full category catalog: 48 products displayed in a grid", "varnt": "AI-curated: 3 best-match products with personalized rationale ('Why this for you: ...')", "kpi": "Conversion Rate", "kpi2": ["Time-to-purchase", "Customer satisfaction with chosen product"], "diff": "hard", "time": "1 week AI dev", "uplift": "+15–35%", "tags": ["personalization", "AI", "UX", "navigation"], "eval_signal": "czy jest domyślny/rekomendowany wybór? Czy filtry i sortowanie redukują pole? Czy warianty pogrupowane? Czy jest „pomóż mi wybrać\"/quiz?", "lever": "domyślna rekomendacja, „bestseller\", filtry, kurator/quiz; ogranicz widoczne opcje na raz.", "risk": "nadmierne upraszczanie ukrywa asortyment = utrata long-tail sprzedaży.", "evidence_class": "literatura", "evidence": []}, {"id": 117, "name": "Variable Ratio Reinforcement", "series": "ai", "def": "The strongest behavioral conditioning schedule — unpredictable rewards maximize persistence.", "mech": "Variable rewards produce highest and most persistent response rates. Uncertainty maximizes dopamine.", "hyp": "Surprise variable deals (random time/category) drive higher long-term app engagement than predictable deals.", "ctrl": "Predictable daily deal: same time, same format, same category", "varnt": "Variable 'surprise deal' — random time, random category, random size of discount", "kpi": "Long-term app engagement (Day 30, Day 60)", "kpi2": ["Open rate", "CTR", "Revenue per engagement"], "diff": "medium", "time": "4h dev", "uplift": "+15–30% long-term engagement", "tags": ["gamification", "push", "engagement", "retention"], "eval_signal": "Czy strona ma jakikolwiek element nieprzewidywalnej nagrody (obecny), czy wszystkie promocje są w pełni przewidywalne i skończone (brak), czy mechanika jest transparentna czy ukrywa prawdziwe szanse/reguły (źle użyty — granica z hazardem).", "lever": "Wprowadzić element zmiennej nagrody — losowy rabat przy checkout, \"niespodzianka w paczce\", codzienny feed z nieprzewidywalnym doborem produktów.", "risk": "Mechaniki zbliżone do hazardu (loot box, koło szczęścia z fałszywymi szansami) budzą uzależnienie i realne ryzyko regulacyjne/etyczne — szczególnie wrażliwe przy młodszych użytkownikach.", "evidence_class": "literatura", "evidence": []}, {"id": 118, "name": "Source Credibility Effect", "series": "ai", "def": "Information weight depends on the perceived credibility of its source.", "mech": "Credibility = expertise + trustworthiness. Peer reviews score high on trust, low on expertise.", "hyp": "Verified purchaser badge + real photo outperforms AI-summarized reviews for trust and conversion.", "ctrl": "Standard star rating + review text, no verification indicators", "varnt": "A: Verified purchase badge + real photo / B: AI-generated review summary / C: Control", "kpi": "Conversion Rate per variant", "kpi2": ["Perceived trust score", "Review engagement"], "diff": "easy", "time": "2h dev", "uplift": "+5–15%", "tags": ["reviews", "trust", "AI", "social proof"], "eval_signal": "Czy recenzje mają widoczny dowód wiarygodności — verified purchase, zdjęcie, konkretny detal (obecny), czy recenzje wyglądają na generyczne/kupione bez żadnej weryfikacji (brak/źle użyty — zabija zaufanie do całej sekcji).", "lever": "Dodać badge \"zweryfikowany zakup\" + zdjęcia w recenzjach, jasno oznaczać treści AI-generowane jeśli takie są używane (transparentność podnosi zaufanie do reszty).", "risk": "Fałszywe/kupione recenzje bez oznaczenia to prosta droga do dark pattern i utraty zaufania gdy wyjdzie na jaw — kryzys autentyczności recenzji już się dzieje w 2026.", "evidence_class": "literatura", "evidence": []}, {"id": 119, "name": "Gambler's Fallacy", "series": "belief", "def": "The tendency to think that future probabilities are altered by past independent events, when in reality they are unchanged.", "mech": "Erroneous conceptualization of the law of large numbers — a streak is expected to 'correct itself' even though each event is independent.", "hyp": "Framing a discount as 'due' after several full-price purchase cycles (e.g. loyalty countdown) increases redemption vs a plain percentage-off offer.", "ctrl": "Standard '20% off' promo banner", "varnt": "'You're due — your streak unlocks a reward' loyalty framing after N purchases", "kpi": "Conversion Rate", "kpi2": ["Redemption rate", "Repeat purchase rate"], "diff": "easy", "time": "2h copy", "uplift": "+3-8%", "tags": ["belief", "loyalty", "framing"], "eval_signal": "czy program lojalnościowy/gamifikacja sugeruje że klient 'ma to już zaliczone' albo 'następny zakup musi się opłacić' zamiast jasno komunikować niezależne od historii warunki nagrody.", "lever": "wykorzystać narrację streaku/serii w mechanice lojalnościowej (progress bar, 'jeszcze 1 zakup do nagrody') — ludzie chętniej domykają serię niż reagują na czysty rabat.", "risk": "sugerowanie że przeszłe zakupy 'zwiększają szansę' na coś losowego (np. w konkursach/loteriach) to wprowadzanie w błąd co do mechaniki losowania.", "evidence_class": "literatura", "evidence": []}, {"id": 120, "name": "Hot-Hand Fallacy", "series": "belief", "def": "The belief that a person or process that has experienced recent success has a greater chance of further success in additional attempts.", "mech": "Pattern-seeking mind treats a short winning streak as a stable trend rather than noise.", "hyp": "Displaying a seller/brand 'on a hot streak' badge (e.g. '5-star reviews 10 days running') increases trust-driven conversion vs static aggregate rating.", "ctrl": "Static average rating (4.6/5, 320 reviews)", "varnt": "Recent-streak badge ('Perfect ratings last 30 days')", "kpi": "Conversion Rate", "kpi2": ["Trust score", "Click-through to reviews"], "diff": "medium", "time": "1 day dev", "uplift": "+2-6%", "tags": ["belief", "trust", "reviews"], "eval_signal": "czy sekcja recenzji/sprzedawcy komunikuje tylko statyczną średnią czy też aktualny 'momentum' (świeże, ciągłe pozytywne sygnały) — momentum przekonuje mocniej niż sucha liczba.", "lever": "obok średniej oceny pokazać trend świeżości ('ostatnie 20 recenzji: 4.9/5') żeby zbudować poczucie aktualnej, żywej jakości.", "risk": "wybiórcze pokazywanie tylko 'gorącej passy' i chowanie starszych, gorszych ocen zniekształca realny obraz jakości — granica z manipulacją dowodem społecznym.", "evidence_class": "literatura", "evidence": []}, {"id": 121, "name": "Optimism Bias", "series": "belief", "def": "The tendency to be over-optimistic, underestimating the probability of undesirable outcomes and overestimating favorable ones.", "mech": "People systematically believe negative events (returns, defects, delays) are less likely to happen to them personally than to others.", "hyp": "Surfacing an extended-warranty/protection upsell at the moment of highest optimism (post add-to-cart) converts worse than surfacing it earlier during product comparison, when risk feels more salient.", "ctrl": "Warranty upsell shown at checkout only", "varnt": "Warranty/protection framing introduced on PDP during comparison ('what if it breaks?')", "kpi": "Attach rate (protection plan)", "kpi2": ["Conversion Rate", "Return rate"], "diff": "medium", "time": "1 day", "uplift": "+5-12% attach rate", "tags": ["belief", "risk", "upsell"], "eval_signal": "czy komunikacja ryzyka (zwroty, awarie, uszkodzenia w transporcie) pojawia się w momencie gdy klient racjonalnie waży ryzyko (PDP) czy dopiero gdy jest już zaangażowany emocjonalnie (checkout, gdzie optymizm blokuje refleksję nad ryzykiem).", "lever": "wprowadzić temat ryzyka/ochrony wcześniej w ścieżce, kiedy klient jeszcze porównuje opcje, zamiast czekać na checkout gdzie optymizm ('mnie to nie spotka') obniża percepcję potrzeby.", "risk": "przesadne straszenie ryzykiem żeby wymusić sprzedaż dodatkowej ochrony/gwarancji to nieuczciwa praktyka jeśli realne ryzyko jest znikome.", "evidence_class": "literatura", "evidence": []}, {"id": 122, "name": "Compromise Effect", "series": "choice", "def": "Choices are affected by whether an option is presented as an extreme (edge) or as a compromise (middle) among the available choices.", "mech": "When uncertain about trade-offs, people default to the middle option because it feels like the 'safe, balanced' choice regardless of its actual merit.", "hyp": "Adding a visibly extreme third tier (very basic / very premium) makes the middle tier the de facto choice, increasing average order value vs a two-tier layout.", "ctrl": "Two pricing/bundle tiers (Basic, Premium)", "varnt": "Three tiers with the target as the visual middle (Basic, Standard*, Premium)", "kpi": "Average Order Value", "kpi2": ["Conversion Rate", "Tier distribution"], "diff": "easy", "time": "3h", "uplift": "+8-18% AOV", "tags": ["choice", "pricing", "tiers"], "eval_signal": "czy oferta ma ≥3 warianty gdzie środkowy jest wizualnie i cenowo 'bezpiecznym kompromisem' (nie skrajnie tani, nie skrajnie drogi) — sprawdź czy to ten wariant faktycznie ma być sprzedawany.", "lever": "zaprojektować strukturę wariantów tak, by docelowy produkt/pakiet zajmował środkową pozycję między wyraźnie tańszą i wyraźnie droższą opcją.", "risk": "różni się od Decoy Effect (#30 w hubie) — tu wszystkie 3 opcje są realnie sensowne, nie ma sztucznie zdominowanej. Ryzyko: jeśli skrajne warianty są fasadowe (nikt ich nie kupuje, istnieją tylko jako wabik), granica z Decoy się zaciera i pojawia się dark pattern.", "evidence_class": "literatura", "evidence": []}, {"id": 123, "name": "Curse of Knowledge", "series": "belief", "def": "When better-informed people find it extremely difficult to think about problems from the perspective of lesser-informed people.", "mech": "Once you know something, you cannot easily simulate not knowing it — experts unconsciously assume shared context with the audience.", "hyp": "Rewriting PDP technical specs with a 'why this matters to you' translation layer (vs jargon-only) increases add-to-cart, especially for first-time category buyers.", "ctrl": "Spec sheet with technical jargon only (e.g. '620 TOG', '2.5mm aluminum')", "varnt": "Same specs with plain-language benefit translation inline", "kpi": "Add-to-cart rate", "kpi2": ["Time on page", "Support ticket volume (pre-sale questions)"], "diff": "easy", "time": "1 day copy", "uplift": "+4-10%", "tags": ["belief", "copywriting", "clarity"], "eval_signal": "czy opis produktu zakłada wiedzę branżową klienta (żargon, skróty, jednostki bez kontekstu) bez tłumaczenia 'co to dla mnie oznacza' — szczególnie ważne w kategoriach technicznych/specjalistycznych.", "lever": "dodać warstwę tłumaczenia specyfikacji na język korzyści ('2.5mm aluminium = wytrzyma upadek z 1.5m') zamiast zakładać że klient rozumie parametry tak jak producent.", "risk": "nadmierne uproszczenie może pominąć istotne dla eksperckiego segmentu klientów niuanse — warto zachować pełne specyfikacje jako opcję rozwinięcia, nie usuwać ich całkiem.", "evidence_class": "literatura", "evidence": []}, {"id": 124, "name": "Cheerleader Effect", "series": "social", "def": "The tendency for people to appear more attractive in a group than in isolation.", "mech": "Averaging and pattern-perception mechanisms in the brain smooth out individual flaws when faces/objects are seen as a group.", "hyp": "Product photography showing items in a styled group/set (vs isolated single-product shots) increases perceived appeal and cross-sell rate.", "ctrl": "Single isolated product photo on white background", "varnt": "Product shown styled within a matching set/collection photo", "kpi": "Cross-sell rate (bundle add-to-cart)", "kpi2": ["Conversion Rate", "Average Order Value"], "diff": "medium", "time": "1 day (photo assets)", "uplift": "+5-10% cross-sell", "tags": ["social", "merchandising", "photography"], "eval_signal": "czy zdjęcia produktu na listingu/PDP pokazują go WYŁĄCZNIE w izolacji, czy też w kontekście stylizowanego zestawu/kolekcji, co podnosi atrakcyjność percepcyjną i podpowiada cross-sell.", "lever": "dodać hero-zdjęcie 'w zestawie' obok standardowego zdjęcia produktowego — grupowa prezentacja podnosi atrakcyjność każdego elementu i naturalnie sugeruje dokupienie reszty.", "risk": "niskie — głównie ryzyko że zdjęcie grupowe zaciemni szczegóły pojedynczego produktu; zawsze trzymać osobne zdjęcie 'solo' jako opcję dla klienta który chce ocenić SKU samodzielnie.", "evidence_class": "literatura", "evidence": []}, {"id": 125, "name": "Less-Is-Better Effect", "series": "choice", "def": "The tendency to prefer a smaller set/option to a larger one when options are judged separately, but not when judged jointly.", "mech": "In separate (non-comparative) evaluation, people rely on easily evaluable attributes (e.g. 'is it full/generous-looking') rather than actual quantity math.", "hyp": "A smaller bundle presented alone with generous framing ('perfectly portioned') can outsell a larger bundle when shown in isolation (e.g. in an ad or email), even though joint comparison would favor the larger one.", "ctrl": "Larger bundle shown alone as 'best value' in isolated ad/email creative", "varnt": "Smaller, well-curated bundle shown alone with quality/completeness framing", "kpi": "Conversion Rate (isolated placement, e.g. email/ad)", "kpi2": ["Click-through rate", "Return rate"], "diff": "medium", "time": "1 day", "uplift": "+3-9%", "tags": ["choice", "bundling", "framing"], "eval_signal": "czy w kanałach gdzie klient NIE porównuje wariantów obok siebie (email, ad, social) oferta jest prezentowana z naciskiem na 'kompletność/jakość' zestawu, a nie tylko na ilość — ilość przekonuje dopiero w widoku porównawczym (PDP z wariantami).", "lever": "w placementach bez porównania (reklama, mailing) promować mniejszy, dopracowany zestaw jako 'w sam raz', a większe warianty zostawić na PDP gdzie klient porównuje joint-evaluation.", "risk": "sugerowanie że mniejszy zestaw to 'lepsza wartość' gdy w rzeczywistości większy jest tańszy per sztuka — jeśli klient odkryje to dopiero po zakupie, spada zaufanie.", "evidence_class": "literatura", "evidence": []}, {"id": 126, "name": "Cognitive Dissonance", "series": "belief", "def": "The mental discomfort experienced when holding contradictory beliefs, values, or when behavior conflicts with self-image — motivating people to reduce the inconsistency.", "mech": "Discomfort from holding two conflicting cognitions (e.g. 'I care about value' + 'I just overpaid') drives post-hoc justification or belief change.", "hyp": "Proactively addressing likely dissonance ('yes it costs more, here's exactly why') on the PDP reduces cart abandonment vs leaving the price gap unaddressed.", "ctrl": "Premium price shown with no justification copy", "varnt": "Premium price with adjacent 'why it costs more' comparison module", "kpi": "Cart abandonment rate", "kpi2": ["Conversion Rate", "Return rate"], "diff": "medium", "time": "1 d
