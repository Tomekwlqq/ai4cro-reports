<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEL — Tactics Hub</title>
<script>(function(){var t=localStorage.getItem('eel-tactic-theme');if(t!=='dark')document.documentElement.setAttribute('data-theme','light');})()</script>
<style>
:root{--bg:#0f1117;--surface:#1a1d2e;--surface2:#22263a;--surface3:#2a2f47;--border:#2e3350;--text:#e8eaf6;--muted:#7b82b0;--accent:#5c6ef7;--accent2:#7c8ff8;--gold:#f0a500;--teal:#00c4c4;--green:#22c55e;--red:#ef4444;--purple:#a855f7;--orange:#f97316;--radius:12px;--radius-sm:6px;--font:'Inter',system-ui,-apple-system,sans-serif;}
[data-theme="light"]{--bg:#f0f2fb;--surface:#fff;--surface2:#eef0f9;--surface3:#e4e7f5;--border:#cdd0e8;--text:#1a1d2e;--muted:#5a6080;--accent:#4c5ef7;--accent2:#3d4fe8;--gold:#c07800;--teal:#007a8c;--green:#16a34a;--red:#dc2626;--purple:#9333ea;--orange:#ea5c0a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;}
a{color:inherit;text-decoration:none;}
/* topbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--surface2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);}
.tabs{display:flex;gap:6px;}
.tab{padding:7px 16px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;}
.tab.active{border-color:var(--accent);color:var(--accent2);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.tab .cnt{opacity:.6;font-weight:500;}
.spacer{flex:1;}
.tbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;}
.tbtn.active{border-color:var(--accent);color:var(--accent2);}
/* layout master-detail */
.view{display:none;}
.view.active{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 53px);}
@media(max-width:780px){.view.active{grid-template-columns:1fr;}.detail{display:none;}.view.active.show-detail .list{display:none;}.view.active.show-detail .detail{display:block;}}
.list{border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);}
.list-tools{position:sticky;top:0;background:var(--surface);padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.search{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-weight:600;}
.chip.active{color:var(--text);}
.li{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.li:hover{background:var(--surface2);}
.li.sel{background:color-mix(in srgb,var(--accent) 10%,transparent);border-left:3px solid var(--accent);}
.li-title{font-size:13px;font-weight:600;color:var(--text);}
.li-meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dotbadge{width:8px;height:8px;border-radius:50%;display:inline-block;}
.detail{overflow-y:auto;padding:24px;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}
/* card pieces */
.card{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.back{display:none;margin-bottom:12px;}
@media(max-width:780px){.back{display:inline-flex;}}
.card-header{padding:20px 24px 18px;border-bottom:1px solid var(--border);background:var(--surface2);}
.eid{font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--accent2);text-transform:uppercase;margin-bottom:6px;}
.etitle{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:14px;}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.b-area{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);}
.b-add{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);}
.b-modify{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold);}
.b-remove{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);}
.b-time{background:var(--surface3);color:var(--muted);border:1px solid var(--border);}
.b-client{background:color-mix(in srgb,var(--purple) 12%,transparent);color:var(--purple);border:1px solid color-mix(in srgb,var(--purple) 25%,transparent);}
.b-series{color:#fff;font-weight:700;}
.section{padding:20px 24px;border-bottom:1px solid var(--border);}
.section:last-child{border-bottom:none;}
.slabel{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;gap:6px;align-items:center;}
.s-trigger{background:color-mix(in srgb,var(--accent) 6%,transparent);}
.origin{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.ochip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);}
.ochip .k{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.05em;}
.layer{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);border-color:color-mix(in srgb,var(--teal) 30%,transparent);}
.finding{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.55;}
.steps{list-style:none;display:flex;flex-direction:column;gap:8px;}
.step{display:flex;gap:10px;align-items:flex-start;}
.snum{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.hints-wrap{margin-top:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.hints-label{font-size:11px;font-weight:600;color:var(--gold);margin-bottom:8px;}
.hints{list-style:none;display:flex;flex-direction:column;gap:5px;}
.hint{display:flex;gap:8px;color:var(--muted);font-size:13px;}
.hint::before{content:'✦';color:var(--gold);flex-shrink:0;font-size:10px;margin-top:3px;}
/* clickable link chips (cross-link) */
.linkchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);transition:border-color .15s;}
.linkchip:hover{border-color:var(--accent);color:var(--accent2);}
.linkchip .arr{opacity:.5;font-size:11px;}
.biaslink{border-left:3px solid var(--purple);}
.kpilink{border-left:3px solid var(--teal);}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
.bias-why{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4;}
.kvi{display:flex;flex-direction:column;gap:1px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);}
.kvi .tier{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.kvi.prim{border-color:color-mix(in srgb,var(--teal) 35%,transparent);background:color-mix(in srgb,var(--teal) 10%,transparent);}
.kvi.prim .tier{color:var(--teal);}
.event-flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;margin:10px 0;}
.ev-ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);}
.ev-add{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--orange);border:1px solid color-mix(in srgb,var(--orange) 25%,transparent);}
.msteps{list-style:none;display:flex;flex-direction:column;gap:6px;}
.mstep{display:flex;gap:8px;color:var(--muted);font-size:13px;}
.mstep .idx{color:var(--teal);font-weight:600;min-width:18px;}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:480px){.vgrid{grid-template-columns:1fr;}}
.vitem{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.vlabel{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.vnum{font-size:16px;font-weight:700;}
.vnum.green{color:var(--green);}.vnum.gold{color:var(--gold);}.vnum.teal{color:var(--teal);}.vnum.muted{color:var(--muted);font-size:13px;font-weight:500;}
.vsub{font-size:12px;color:var(--muted);margin-top:2px;}
.seq{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);border-left:3px solid var(--accent);margin-bottom:8px;}
.seq .arr{color:var(--accent);font-weight:700;flex-shrink:0;}
.seqtype{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.seqtype.composite{color:var(--purple);}.seqtype.sequence{color:var(--accent2);}.seqtype.crossview{color:var(--teal);}
.kv{display:flex;flex-direction:column;gap:10px;}
.kvrow{display:flex;gap:10px;font-size:13px;line-height:1.55;}
.kvrow .kk{color:var(--muted);min-width:120px;flex-shrink:0;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.05em;padding-top:2px;}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--surface3);color:var(--muted);border:1px solid var(--border);}
.score-sum{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.ring{font-size:24px;font-weight:800;color:var(--green);}.ring small{font-size:13px;color:var(--muted);}
.verdict{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);}
.rubrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;}
.rubname span{color:var(--muted);font-weight:400;font-size:12px;}
.dots{display:flex;gap:4px;}.dot{width:11px;height:11px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);}
.dot.on{background:var(--green);border-color:var(--green);}.dot.warn{background:var(--gold);border-color:var(--gold);}
.usedby{display:flex;flex-direction:column;gap:6px;}
/* panel 10 KPI z kierunkiem */
.kpistd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
@media(max-width:620px){.kpistd{grid-template-columns:repeat(2,1fr);}}
.kcell{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);padding:8px 9px;display:flex;flex-direction:column;gap:2px;}
.kcell .kn{font-size:12px;font-weight:700;color:var(--text);}
.kcell .kd{font-size:10px;color:var(--muted);line-height:1.3;}
.kcell .kar{font-size:18px;font-weight:800;line-height:1;margin-top:2px;}
.kcell.good{border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent);}
.kcell.good .kar{color:var(--green);}
.kcell.flat .kar{color:var(--muted);}
.kcell.na{opacity:.45;}
.kcell.na .kar{color:var(--muted);font-size:13px;}
/* przykłady zdjęć */
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:660px;}
@media(max-width:620px){.exgrid{grid-template-columns:1fr;}}
.expane{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface2);display:flex;flex-direction:column;}
.expane img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#fff;}
.excap{font-size:11px;line-height:1.35;padding:7px 9px;color:var(--muted);}
.exlabel{font-size:9px;font-weight:700;letter-spacing:.12em;padding:4px 9px 2px;text-transform:uppercase;}
.expane.bad .exlabel{color:var(--red);}
.expane.good .exlabel{color:var(--green);}
.expane.bad{border-color:color-mix(in srgb,var(--red) 45%,transparent);}
.expane.good{border-color:color-mix(in srgb,var(--green) 45%,transparent);}
.expane.bad .excap{color:var(--red);}
.expane.good .excap{color:var(--green);}
/* przykłady zdjęć */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.exgrid{grid-template-columns:1fr;}}
.expane{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface2);}
.expane img{width:100%;display:block;background:#fff;cursor:zoom-in;}
.excap{padding:9px 11px;font-size:12px;line-height:1.45;color:var(--text);}
.exsrc{padding:0 11px 9px;font-size:10px;color:var(--muted);letter-spacing:.02em;}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
/* komentarz = polecenie */
.cmt{width:100%;min-height:64px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;resize:vertical;}
.cmt:focus{outline:none;border-color:var(--accent);}
.cmt.has{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent);}
.ordbtn .badge-n{display:inline-block;background:var(--gold);color:#000;border-radius:99px;padding:0 6px;font-size:11px;font-weight:700;margin-left:5px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:640px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.modal-body{padding:16px 20px;overflow-y:auto;}
.modal-ta{width:100%;min-height:260px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;line-height:1.5;resize:vertical;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
</style></head><body>

<div class="topbar">
  <span class="brand">EEL · Tactics Hub</span>
  <div class="tabs">
    <button class="tab active" data-tab="tactics" onclick="switchTab('tactics')">Taktyki <span class="cnt"></span></button>
    <button class="tab" data-tab="biases" onclick="switchTab('biases')">Efekty / Biasy <span class="cnt"></span></button>
    <button class="tab" data-tab="kpis" onclick="switchTab('kpis')">KPI <span class="cnt"></span></button>
  </div>
  <span class="spacer"></span>
  <button class="tbtn ordbtn" onclick="openOrders()">📋 Polecenia<span class="badge-n" id="ord-n" style="display:none">0</span></button>
  <button class="tbtn" id="theme-btn" onclick="toggleTheme()">☀️</button>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img src="" alt="powiększenie"></div>

<div class="modal-bg" id="modal-orders">
  <div class="modal">
    <div class="modal-head"><span>📋 Polecenia do taktyk</span><button class="btn" onclick="closeOrders()">✕</button></div>
    <div class="modal-body"><div style="color:var(--muted);font-size:12px;margin-bottom:8px;">Skopiuj i wklej Klaudiuszowi w czacie — wykona po kolei. (Komentarze trzymają się sesji; skopiuj zanim zamkniesz kartę.)</div><textarea class="modal-ta" id="orders-ta" readonly></textarea></div>
    <div class="modal-foot"><button class="btn" onclick="closeOrders()">Zamknij</button><button class="btn primary" id="copy-btn" onclick="copyOrders()">📋 Kopiuj do schowka</button></div>
  </div>
</div>

<!-- TACTICS -->
<div class="view active" id="view-tactics">
  <div class="list"><div class="list-tools"><input class="search" id="srch-tactics" placeholder="Szukaj taktyki..." oninput="renderTacticList()"><div class="chips" id="chips-cat"></div></div><div id="list-tactics"></div></div>
  <div class="detail" id="detail-tactics"><div class="empty">Wybierz taktykę z listy</div></div>
</div>
<!-- BIASES -->
<div class="view" id="view-biases">
  <div class="list"><div class="list-tools"><input class="search" id="srch-biases" placeholder="Szukaj biasu..." oninput="renderBiasList()"><div class="chips" id="chips-series"></div></div><div id="list-biases"></div></div>
  <div class="detail" id="detail-biases"><div class="empty">Wybierz bias z listy</div></div>
</div>
<!-- KPIS -->
<div class="view" id="view-kpis">
  <div class="list"><div class="list-tools"><input class="search" id="srch-kpis" placeholder="Szukaj KPI..." oninput="renderKpiList()"></div><div id="list-kpis"></div></div>
  <div class="detail" id="detail-kpis"><div class="empty">Wybierz KPI z listy</div></div>
</div>

<script>
const DB = {"biases": [{"id": 1, "name": "Availability Heuristic", "series": "social", "def": "Overestimating likelihood of events based on how easily they come to mind.", "mech": "Ease of recall is used as a proxy for frequency or importance.", "hyp": "Specific vivid recent-purchase notifications convert better than aggregate stats.", "ctrl": "Static '1,000+ sold' badge", "varnt": "'Recently purchased by [Name] in [City]' live notification", "kpi": "Conversion Rate", "kpi2": ["Add-to-cart rate", "Time to decision"], "diff": "medium", "time": "4h dev", "uplift": "+5–15%", "tags": ["social proof", "recency", "FOMO"], "eval_signal": "czy social proof jest konkretny i żywy (imię/miasto/czas) czy tylko suchą liczbą (\"1000+ sprzedanych\"); czy sekcja recenzji ma wyróżnione, plastyczne historie na górze.", "lever": "dodać dynamiczne, konkretne komunikaty zakupowe (real-time notification) obok/zamiast statycznych liczb zbiorczych.", "risk": "fałszywe lub przesadzone \"ostatnio kupione\" (fake urgency/fake social proof) to prosty dark pattern i w wielu krajach podstawa do sankcji prawnych (UOKiK, FTC).", "evidence_class": "literatura", "evidence": []}, {"id": 2, "name": "Attentional Bias", "series": "attention", "def": "Perception is shaped by our current goals and recurring thoughts.", "mech": "Stimuli aligned with active goals capture more cognitive resources.", "hyp": "Hero images matching user's last 3 search terms increase engagement.", "ctrl": "Generic homepage hero image", "varnt": "Personalized hero based on recent search terms", "kpi": "CTR", "kpi2": ["Session depth", "Bounce rate"], "diff": "hard", "time": "3 days", "uplift": "+8–20%", "tags": ["personalization", "attention", "hero"], "eval_signal": "czy listing/PDP eksponuje atrybut zgodny z intencją wyszukiwania klienta (np. jeśli wszedł z frazy \"organiczny\" — czy ten atrybut jest widoczny na pierwszy rzut oka); czy filtrowanie po tym atrybucie jest łatwe.", "lever": "dynamiczne dopasowanie hero/badge'y na podstawie ostatnich zapytań/kliknięć (np. 3 ostatnie wyszukiwania → priorytetowy atrybut na stronie głównej).", "risk": "nadmierne dopasowanie może ukrywać istotne wady produktu (cena, dostawa) — klient \"nie widzi\" tego, co powinien zobaczyć przed zakupem.", "evidence_class": "literatura", "evidence": []}, {"id": 3, "name": "Illusory Truth Effect", "series": "belief", "def": "Repeated statements feel truer than novel ones, regardless of accuracy.", "mech": "Repetition increases processing fluency, mistaken for truthfulness.", "hyp": "Repeating a key value prop at every funnel stage increases perceived trust.", "ctrl": "Value prop shown once on homepage", "varnt": "Same value prop repeated at every funnel stage", "kpi": "Trust score (survey)", "kpi2": ["Conversion Rate", "Brand recall"], "diff": "easy", "time": "30min copy", "uplift": "+3–10%", "tags": ["copywriting", "trust", "funnel"], "eval_signal": "czy kluczowa propozycja wartości (USP) powtarza się konsekwentnie w całym lejku (reklama → listing → PDP → checkout) czy pojawia się raz i ginie? Czy claim ma pokrycie w realnym dowodzie (dane, cytat, badanie) czy jest gołosłowny?", "lever": "powtórzyć kluczowy USP (np. \"dostawa carbon-neutral\") konsekwentnie na każdym etapie ścieżki zakupowej zamiast pokazać go raz w stopce.", "risk": "powtarzanie nieprawdziwego lub niepopartego dowodami claimu — to już nie perswazja tylko dezinformacja, ryzyko UOKiK/reputacyjne.", "evidence_class": "literatura", "evidence": []}, {"id": 4, "name": "Mere Exposure Effect", "series": "memory", "def": "Familiarity breeds liking — people prefer things they've seen before.", "mech": "Familiarity reduces cognitive effort and perceived threat.", "hyp": "3 pre-launch sneak peeks increase Day-1 sales vs. no preview.", "ctrl": "No pre-launch preview — product revealed on launch day", "varnt": "3x 'Sneak Peek' emails sent before launch", "kpi": "Day-1 sales", "kpi2": ["Email open rate", "Launch day CTR"], "diff": "easy", "time": "2h email", "uplift": "+10–25%", "tags": ["email", "launch", "familiarity"], "eval_signal": "czy istnieje spójna sekwencja retargetingowa budująca powtarzalną ekspozycję na produkt przed konwersją, czy każdy kontakt jest jednorazowy i izolowany? Czy nowe kolekcje mają fazę \"zapowiedzi\" przed launch?", "lever": "wprowadzić \"sneak peek\" nowej kolekcji (teaser 2-3x przed premierą) i konsekwentny retargeting tego samego produktu w wielu kanałach.", "risk": "przesycenie ekspozycją przechodzi w habituation/ad blindness (patrz #26) — potrzebny frequency cap.", "evidence_class": "literatura", "evidence": []}, {"id": 5, "name": "Context Effect", "series": "attention", "def": "Environmental cues shape how we perceive and value what we see.", "mech": "Information is processed relative to its surroundings, not in isolation.", "hyp": "Luxury UI context (dark, minimal, lifestyle photos) increases perceived product value.", "ctrl": "Standard bright white product page", "varnt": "Dark 'Luxury Mode' with lifestyle photography", "kpi": "AOV", "kpi2": ["Perceived value survey", "Bounce rate"], "diff": "easy", "time": "1h CSS", "uplift": "+5–20%", "tags": ["UI", "photography", "premium", "AOV"], "eval_signal": "czy stylistyka wizualna PDP/zdjęć pasuje do pozycjonowania cenowego produktu (premium produkt na \"tandetnym\" tle = rozjazd); czy sekcja \"podobne produkty\" nie zaniża percepcji marki.", "lever": "dopasować styl wizualny (tło, fotografia, layout) do segmentu cenowego — dark/minimalist dla premium, jasne/rabatowe dla value.", "risk": "\"przebranie\" taniego produktu w luksusowy kontekst wizualny żeby uzasadnić wyższą cenę bez pokrycia w jakości — to już mylące oznaczenie.", "evidence_class": "literatura", "evidence": []}, {"id": 6, "name": "Cue-Dependent Forgetting", "series": "memory", "def": "We can't recall information without the cues that were present when we encoded it.", "mech": "Memories are stored with contextual 'hooks' — without them, retrieval fails.", "hyp": "Including the original ad image in cart recovery emails reactivates intent.", "ctrl": "Standard cart email with generic product photo", "varnt": "Cart email with original ad/touchpoint image that first brought user", "kpi": "Cart recovery rate", "kpi2": ["Email CTR", "Revenue recovered"], "diff": "medium", "time": "4h dev", "uplift": "+10–30%", "tags": ["cart recovery", "email", "retargeting"], "evidence_class": "literatura", "evidence": []}, {"id": 7, "name": "Mood-Congruent Memory Bias", "series": "memory", "def": "We recall information more easily when it matches our current emotional state.", "mech": "Current emotions filter retrieval, amplifying mood-matching memories.", "hyp": "Emotional copy timing (upbeat Friday PM vs. problem-solving Monday AM) improves CTR.", "ctrl": "Same email copy sent at fixed time daily", "varnt": "'Celebrate yourself' copy Friday 6PM / 'Solve this' copy Monday 9AM", "kpi": "Email CTR by segment", "kpi2": ["Conversion by time block", "Unsubscribe rate"], "diff": "medium", "time": "1 day setup", "uplift": "+5–15%", "tags": ["email", "timing", "emotional"], "evidence_class": "literatura", "evidence": []}, {"id": 8, "name": "Frequency Illusion (Baader-Meinhof)", "series": "attention", "def": "After noticing something, it seems to appear everywhere — ubiquity illusion.", "mech": "Selective attention + confirmation bias amplify the perception of frequency.", "hyp": "'Trending in your area' badge for viewed-but-not-bought products drives returns.", "ctrl": "No special badge for previously viewed products", "varnt": "'Trending in your area' tag for items viewed 2+ times without purchase", "kpi": "Return visit + purchase rate", "kpi2": ["Badge CTR", "Time-to-purchase"], "diff": "easy", "time": "2h dev", "uplift": "+5–12%", "tags": ["retargeting", "badging", "urgency"], "eval_signal": "czy strona/kampania wzmacnia poczucie \"to jest wszędzie\" dla produktów z historii przeglądania? Czy istnieje mechanizm re-exposure (retargeting, email, badge trending) po pierwszym kontakcie?", "lever": "dodać tag \"Popularne w Twojej okolicy\" / \"Trending\" na produktach z historii przeglądania, spiąć z retargetingiem żeby wzmocnić poczucie powszechności marki.", "risk": "fałszywe sygnały popularności (fake trending) bez realnych danych sprzedażowych — dark pattern social proof.", "evidence_class": "literatura", "evidence": []}, {"id": 9, "name": "Empathy Gap", "series": "value", "def": "We underestimate how our future 'hot' states will differ from our current 'cold' state.", "mech": "Cold-state planning ignores future visceral drives like hunger, fatigue, or urgency.", "hyp": "'Hungry-proof your pantry' future-state framing increases subscription checkout.", "ctrl": "Standard subscription page: list of features and price", "varnt": "'Emergency future-you will thank you' framing + use case scenarios", "kpi": "Subscription conversion rate", "kpi2": ["Time on subscription page", "LTV"], "diff": "easy", "time": "1h copy", "uplift": "+5–15%", "tags": ["copywriting", "subscription", "future-state"], "eval_signal": "Czy PDP/checkout pomaga kupującemu wyobrazić sobie przyszły 'hot state' (np. pilna potrzeba, impuls, sezon) — czy jest komunikat 'kup teraz zanim zapomnisz/zabraknie' vs zimna specyfikacja bez kontekstu użycia? Sprawdź czy produkty pod impuls (jedzenie, prezenty, gadżety) mają CTA odwołujące się do emocji chwili.", "lever": "Dodaj framing 'użyjesz tego gdy...' blisko CTA — most między chłodną decyzją teraz a gorącą potrzebą później (np. przypomnienia, wishlist z powiadomieniem 'wraca sezon').", "risk": "Wymuszanie fałszywej pilności emocjonalnej (np. sztuczne 'kup zanim będzie za późno' bez realnej podstawy) to manipulacja stanem emocjonalnym, nie pomoc decyzyjna.", "evidence_class": "literatura", "evidence": []}, {"id": 10, "name": "Omission Bias", "series": "choice", "def": "We judge harmful inaction as better than harmful action, even with identical outcomes.", "mech": "Active choices feel more morally loaded than defaults or inaction.", "hyp": "'Keep current settings' (omission framing) outperforms 'Update now' for opt-ins.", "ctrl": "'Update to new faster shipping' (active opt-in CTA)", "varnt": "Default stays, offer framed as 'Keep your current settings'", "kpi": "Option adoption rate", "kpi2": ["User complaints", "Drop-off at settings step"], "diff": "easy", "time": "30min copy", "uplift": "variable", "tags": ["UX", "defaults", "copy"], "eval_signal": "Czy checkout/koszyk wykorzystuje domyślne opcje (np. pre-zaznaczona zgoda na newsletter, ubezpieczenie, droższa dostawa) licząc, że klient nie odznaczy aktywnie? Sprawdź pre-checked checkboxy i domyślne warianty.", "lever": "Ustaw domyślne opcje zgodnie z interesem klienta (opt-in świadomy), używaj defaultów do redukcji tarcia, nie do maskowania kosztu.", "risk": "Pre-zaznaczone płatne dodatki/zgody wykorzystujące bierność klienta to klasyczny dark pattern (drip pricing, sneak into basket) — ryzyko prawne Omnibus/UOKiK.", "evidence_class": "literatura", "evidence": []}, {"id": 11, "name": "Base Rate Fallacy", "series": "belief", "def": "We ignore statistical base rates in favor of vivid, specific anecdotal info.", "mech": "Narratives and small samples override probabilities in decision-making.", "hyp": "One vivid customer story ('Perfect fit!') converts better than aggregate '98% satisfied'.", "ctrl": "'98% of customers are satisfied' stat badge", "varnt": "Featured vivid review: 'Ordered Tuesday, wore to my sister's wedding Saturday'", "kpi": "Conversion Rate", "kpi2": ["Review section engagement", "Trust score"], "diff": "easy", "time": "1h copy", "uplift": "+3–8%", "tags": ["reviews", "copywriting", "social proof"], "eval_signal": "Czy strona przeciwstawia twardym statystykom (zwrotom, awariom) pojedynczą żywą recenzję/historię, która zaniża postrzegane ryzyko? Sprawdź czy sekcja recenzji eksponuje jednostkowe anegdoty ponad zbiorcze dane (np. wskaźnik defektów).", "lever": "Jeśli baza danych jest korzystna (niski % zwrotów, wysoka trwałość) — pokaż ją wprost jako liczbę obok anegdot, nie zamiast nich.", "risk": "Celowe eksponowanie jednej wybranej, nietypowej recenzji żeby przykryć złe statystyki zbiorcze (np. wysoki % zwrotów) to wprowadzanie w błąd.", "evidence_class": "literatura", "evidence": []}, {"id": 12, "name": "Bizarreness Effect", "series": "attention", "def": "Unusual information is remembered better than mundane information.", "mech": "Distinctiveness triggers deeper encoding and higher cognitive processing.", "hyp": "Surreal/bizarre product imagery in retargeting ads outperforms standard photos on recall.", "ctrl": "Standard product photography in retargeting ad", "varnt": "Surreal or unexpected creative (product in bizarre context) for same product", "kpi": "Ad recall (survey)", "kpi2": ["CTR", "Retargeting conversion"], "diff": "medium", "time": "1 day creative", "uplift": "+10–40% recall", "tags": ["ads", "creative", "recall", "retargeting"], "evidence_class": "literatura", "evidence": []}, {"id": 13, "name": "Humor Effect", "series": "memory", "def": "Funny information is remembered better than neutral information.", "mech": "Humor reduces stress, increases arousal, and requires cognitive resolution — deeper encoding.", "hyp": "A witty error page reduces bounce vs. standard technical error message.", "ctrl": "Standard 'Error 500 — Something went wrong' page", "varnt": "Witty message: 'Our servers are on a coffee break. Back in 30 seconds.'", "kpi": "Bounce rate on error page", "kpi2": ["Return session rate", "Brand recall survey"], "diff": "easy", "time": "30min copy", "uplift": "-10–25% bounce", "tags": ["UX", "error pages", "brand", "copy"], "evidence_class": "literatura", "evidence": []}, {"id": 14, "name": "Von Restorff Effect", "series": "attention", "def": "The item that differs from similar objects is most likely to be remembered.", "mech": "Pattern breaks are flagged as high-priority — visual salience drives attention.", "hyp": "Making one 'Deal of the Day' item 20% larger in a grid drives disproportionate traffic.", "ctrl": "Uniform product grid, all items same size", "varnt": "One 'Deal of the Day' item 20% larger with color contrast", "kpi": "Traffic to featured item", "kpi2": ["Conversion of featured item", "Revenue from slot"], "diff": "easy", "time": "1h CSS", "uplift": "+20–50% on featured item", "tags": ["product grid", "promotions", "visual"], "eval_signal": "Czy w tabeli cenowej / gridzie produktów jest jeden wizualnie wyróżniony element (obecny), czy wszystkie opcje wyglądają identycznie przez co user nie wie na czym się skupić (brak), czy wyróżnień jest za dużo przez co żaden nie działa (źle użyty).", "lever": "Wyróżnić kolorem/rozmiarem/badge jeden rekomendowany plan lub produkt w gridzie/tabeli cenowej.", "risk": "Fałszywe wyróżnienie (\"Najpopularniejszy\" gdy to nieprawda) albo zbyt wiele wyróżnionych elementów jednocześnie neutralizuje efekt i buduje nieufność.", "evidence_class": "literatura", "evidence": []}, {"id": 15, "name": "Picture Superiority Effect", "series": "attention", "def": "Images are remembered far more easily and accurately than words alone.", "mech": "Dual coding: images activate both visual and verbal channels simultaneously.", "hyp": "Replacing feature bullet points with a labeled product diagram reduces returns.", "ctrl": "Bullet-point list of product features", "varnt": "Annotated diagram showing key features with callouts", "kpi": "Return rate", "kpi2": ["Feature comprehension (quiz)", "Time on PDP"], "diff": "medium", "time": "4h design", "uplift": "-5–15% returns", "tags": ["PDP", "UX", "visual", "design"], "eval_signal": "czy kluczowe informacje (dostawa, zwroty, gwarancja, cechy produktu) są komunikowane ikonami/obrazem czy wyłącznie ścianą tekstu? Czy PDP ma diagram/infografikę cech, czy tylko listę bulletów?", "lever": "zamienić bullet pointy cech produktu na oznaczony diagram/infografikę, użyć ikon przy warunkach dostawy i zwrotu zamiast akapitu tekstu.", "risk": "obraz zastępujący istotne informacje prawne (np. warunki gwarancji tylko jako ikona bez pełnego tekstu) — musi być czytelne uzupełnienie tekstowe dla zgodności prawnej.", "evidence_class": "literatura", "evidence": []}, {"id": 16, "name": "Self-Relevance Effect", "series": "belief", "def": "Information relating to oneself is better remembered and more persuasive.", "mech": "The self is our most robust schema — attaching info to it deepens encoding.", "hyp": "Self-relevant headlines based on user profile data outperform generic ones.", "ctrl": "'Best running shoes for performance'", "varnt": "'The best shoes for your 5K goal, [Name]' (from profile data)", "kpi": "CTR", "kpi2": ["Conversion Rate", "Time on page"], "diff": "medium", "time": "1 day personalization", "uplift": "+5–20%", "tags": ["personalization", "copy", "CRO"], "eval_signal": "Czy listing/PDP używa danych o userze do personalizacji nagłówków/rekomendacji (obecny), czy wszystko jest generycznie takie samo dla każdego (brak), czy personalizacja jest trafna czy losowa/błędna (źle użyty psuje zaufanie).", "lever": "Zamienić generyczne nagłówki (\"Najlepsze buty do biegania\") na spersonalizowane na bazie quizu/historii (\"Najlepsze buty pod Twój cel 5K\").", "risk": "Personalizacja oparta na błędnych/naciąganych danych (np. \"widzieliśmy że lubisz X\" gdy user nigdy tego nie oglądał) budzi wrażenie inwigilacji i nietrafności.", "evidence_class": "literatura", "evidence": []}, {"id": 17, "name": "Negativity Bias", "series": "value", "def": "Negative experiences and framings have greater impact than equivalent positive ones.", "mech": "Loss signals are neurologically weighted ~2x vs. equivalent gains — evolutionary survival.", "hyp": "'Don't lose your 20% discount' outperforms 'Claim your 20% discount'.", "ctrl": "'Claim your 20% discount' (gain framing)", "varnt": "'Don't lose your 20% discount' (loss framing)", "kpi": "CTR", "kpi2": ["Conversion Rate", "Email open rate"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["copywriting", "loss aversion", "email", "urgency"], "eval_signal": "jak sekcja recenzji radzi sobie z negatywnymi opiniami — czy są ukrywane (ryzykowne), czy adresowane odpowiedzią marki? Czy komunikaty urgency w koszyku wykorzystują ramowanie straty?", "lever": "aktywnie odpowiadać na negatywne recenzje publicznie (neutralizuje wagę), używać loss-frame w komunikatach urgency (\"nie trać rabatu\" zamiast \"odbierz rabat\") w koszyku/checkout.", "risk": "nadużywanie loss-frame (permanentny straszak \"zostało 1 szt!\") buduje chroniczny niepokój i wypala zaufanie — patrz habituation gdy fałszywe.", "evidence_class": "literatura", "evidence": []}, {"id": 18, "name": "Anchoring Bias", "series": "value", "def": "The first piece of information encountered acts as a reference point for all subsequent judgments.", "mech": "Adjustments away from the anchor are typically insufficient — first info wins.", "hyp": "Showing the most expensive product first in a category increases average order value.", "ctrl": "Cheapest or best-selling item shown first in category", "varnt": "Most expensive item shown first (high anchor) in category grid", "kpi": "AOV", "kpi2": ["Revenue per session", "Tier distribution"], "diff": "easy", "time": "1h product sort", "uplift": "+5–20% AOV", "tags": ["pricing", "product grid", "AOV", "CRO"], "eval_signal": "czy jest widoczna kotwica przy cenie promocyjnej? Czy najdroższy wariant pokazany pierwszy? Czy oszczędność podana kwotą i %?", "lever": "pokaż punkt odniesienia (RRP / cena zestawu / wariant premium) zanim padnie cena docelowa.", "risk": "fałszywe „było\" (nigdy nie sprzedawane w tej cenie) = dark pattern + ryzyko prawne (UOKiK/Omnibus).", "evidence_class": "literatura", "evidence": []}, {"id": 19, "name": "Conservatism Bias", "series": "belief", "def": "We favor existing beliefs over new evidence — updating requires effort.", "mech": "Cognitive inertia: our current worldview is 'invested' and hard to change.", "hyp": "'Everything you love about [familiar category] but better' converts new-product skeptics.", "ctrl": "'Revolutionary new technology — try something completely different'", "varnt": "'All the [familiar benefit] you love, now with [new advantage]'", "kpi": "CTR on new product pages", "kpi2": ["Conversion Rate for new SKUs", "Bounce rate"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["new products", "copywriting", "adoption"], "eval_signal": "Czy strona wymaga dużego 'skoku dowodowego' żeby zmienić przekonanie klienta o kategorii/marce (np. nieznany brand vs znana marka)? Sprawdź czy nowi/wyzywający gracze mają wzmocnione dowody (porównania, gwarancje) kompensujące inercję przekonań.", "lever": "Dla nowych marek/kategorii dodaj bezpośrednie porównanie z 'starym przekonaniem' (np. 'inaczej niż myślisz o X — oto dlaczego') + gwarancja zwrotu redukująca koszt zmiany zdania.", "risk": "Brak — to bardziej diagnostyka bariery wejścia niż dźwignia manipulacyjna; ryzyko niskie.", "evidence_class": "literatura", "evidence": []}, {"id": 20, "name": "Contrast Effect", "series": "value", "def": "Perception of value is shaped by comparison with an adjacent reference point.", "mech": "We don't perceive absolute value — only relative differences from the last stimulus.", "hyp": "A competitor comparison table (showing their gaps) increases own-brand conversion.", "ctrl": "Standard product page without competitor comparison", "varnt": "'How we compare' table — competitor missing 3 key features you offer", "kpi": "Conversion Rate", "kpi2": ["Time on comparison section", "Bounce"], "diff": "easy", "time": "2h copy + design", "uplift": "+5–15%", "tags": ["competitive", "PDP", "pricing", "CRO"], "eval_signal": "czy obok głównego produktu jest droższa kotwica (żeby \"zwykła\" cena wyglądała przystępnie); czy tabela porównawcza z konkurencją jest rzetelna czy spreparowana.", "lever": "ustawić droższy wariant/kotwicę tuż obok promowanego produktu; tabela porównawcza podkreślająca realną przewagę.", "risk": "tabela porównawcza celowo pomijająca istotne atuty konkurencji (cherry-picking cech) to manipulacja, nie edukacja — granica to rzetelność danych porównawczych.", "evidence_class": "literatura", "evidence": []}, {"id": 21, "name": "Distinction Bias", "series": "choice", "def": "Options appear more different when evaluated simultaneously than separately.", "mech": "Side-by-side comparison highlights small differences that don't matter in real use.", "hyp": "Story-based individual product view reduces choice paralysis vs. side-by-side comparison.", "ctrl": "Side-by-side comparison table for technical products", "varnt": "Story-based view: each product presented individually with use-case scenario", "kpi": "Time-to-add-to-cart", "kpi2": ["Conversion Rate", "Cart abandonment"], "diff": "medium", "time": "4h dev", "uplift": "+5–12%", "tags": ["UX", "product pages", "decision", "tech products"], "eval_signal": "czy strona narzuca tryb porównawczy (tabela specyfikacji) tam, gdzie różnice są marginalne dla realnego użytkowania; czy jest alternatywa w formie narracji korzyści zamiast suchych liczb.", "lever": "dla produktów o marginalnych różnicach technicznych zastąpić/uzupełnić tabelę porównawczą narracją \"co to oznacza w praktyce\" (story-based view), redukując paraliżującą analizę.", "risk": "świadome eksponowanie tabeli porównawczej tylko po to, by uwypuklić przewagę własnego produktu w nieistotnym parametrze (cherry-picking metryk) wprowadza w błąd.", "evidence_class": "literatura", "evidence": []}, {"id": 22, "name": "Focusing Effect", "series": "attention", "def": "Placing too much importance on one aspect while ignoring others.", "mech": "Limited attention anchors on a single salient feature, discounting the rest.", "hyp": "Highlighting one 'Killer Feature' in the headline converts better than a list of five.", "ctrl": "Balanced list: '5 reasons to choose [Product]'", "varnt": "Single 'Killer Feature' headline: 'The only [Product] that does X'", "kpi": "CTR", "kpi2": ["Conversion Rate", "Scroll depth"], "diff": "easy", "time": "1h copy", "uplift": "+5–15%", "tags": ["copywriting", "PDP", "headline", "CRO"], "eval_signal": "czy nagłówek/hero PDP komunikuje jedną wyrazistą korzyść czy rozmywa się w liście 5+ cech; czy ta jedna cecha faktycznie odpowiada na główną potrzebę segmentu docelowego.", "lever": "wybrać jedną najsilniejszą, prawdziwą przewagę produktu i uczynić ją headline'em/hero na PDP zamiast wyliczanki funkcji.", "risk": "eksponowanie jednej mocnej cechy, by odwrócić uwagę od istotnej wady (np. \"designerski wygląd\" przy słabej jakości materiału) jest wprowadzeniem w błąd przez selektywne akcentowanie.", "evidence_class": "literatura", "evidence": []}, {"id": 23, "name": "Framing Effect", "series": "value", "def": "We react differently to identical information depending on how it is presented.", "mech": "Gain vs. loss frames activate different risk-tolerance states in decision-making.", "hyp": "Testing three discount frames reveals which resonates most with your audience.", "ctrl": "'Get $50 discount'", "varnt": "A: 'Save $50' / B: 'Don't pay the full $200' / C: 'Keep $50 in your pocket'", "kpi": "CTR", "kpi2": ["Conversion Rate", "AOV"], "diff": "easy", "time": "30min copy", "uplift": "+5–20%", "tags": ["copywriting", "pricing", "email", "CRO"], "eval_signal": "czy komunikaty cenowe/rabatowe są ramowane pod zysk (save/get) czy pod stratę (nie płać pełnej ceny)? Czy strona testowała warianty ramowania tej samej oferty, czy używa jednego przypadkowego frame'u wszędzie?", "lever": "przeformułować komunikaty rabatowe na \"gain frame\" (oszczędzasz X) w miejscach gdzie chcemy komfortu decyzji, \"loss frame\" (nie trać X) tam gdzie chcemy urgency (koszyk, ostatnia szansa).", "risk": "manipulacyjne ramowanie ceny bazowej (sztucznie zawyżona cena \"przed\") — graniczy z wprowadzeniem w błąd, ryzyko prawne (ustawa o cenach, dyrektywa Omnibus).", "evidence_class": "literatura", "evidence": []}, {"id": 24, "name": "Money Illusion", "series": "value", "def": "We think in nominal (face value) terms rather than real purchasing power.", "mech": "The brain prefers 'simple numbers' — larger nominal values feel more valuable.", "hyp": "'Earn 1,000 points' feels more rewarding than 'Earn $10', despite equal value.", "ctrl": "'Earn $10 cashback on this purchase'", "varnt": "'Earn 1,000 Gold Points on this purchase'", "kpi": "Loyalty program sign-up rate", "kpi2": ["Engagement with points system", "Redemption rate"], "diff": "medium", "time": "1 day loyalty setup", "uplift": "+10–30% sign-ups", "tags": ["loyalty", "gamification", "pricing"], "eval_signal": "czy rabaty/nagrody są komunikowane w formie która maksymalizuje postrzeganą wielkość liczby (kwota nominalna, punkty) czy w formie która realnie odzwierciedla wartość (procent)? Który wariant pasuje do wielkości koszyka?", "lever": "przy dużych koszykach komunikować rabat kwotowo (większa liczba = większe wrażenie), przy programach lojalnościowych używać punktów zamiast złotówek dla większego \"nominalnego\" efektu.", "risk": "manipulacja nominalna która realnie daje userowi gorszą ofertę niż sugeruje liczba — granica z wprowadzeniem w błąd co do faktycznej korzyści.", "evidence_class": "literatura", "evidence": []}, {"id": 25, "name": "Weber-Fechner Law", "series": "value", "def": "Perceived change is proportional to the initial intensity — senses work logarithmically.", "mech": "A $10 saving feels huge on a $20 item but negligible on a $2,000 item.", "hyp": "Matching incentive type (% vs. $) to price tier increases conversion at each level.", "ctrl": "Same '10% Off' incentive used across all price tiers", "varnt": "% discount for high-ticket / $ amount discount for low-ticket items", "kpi": "Conversion per price tier", "kpi2": ["Revenue per visitor", "AOV"], "diff": "easy", "time": "2h config", "uplift": "+5–15% per tier", "tags": ["pricing", "promotions", "CRO", "segmentation"], "eval_signal": "Czy forma rabatu (% vs kwota) dobrana jest do poziomu cenowego produktu (obecny), czy stosowany jest ten sam format rabatu niezależnie od ceny co osłabia percepcję (błąd — np. \"-20 zł\" na produkcie za 3000 zł).", "lever": "Przy produktach wysokocenowych komunikować rabat w %, przy tanich w kwocie — dobrać skalę bodźca do bazy cenowej.", "risk": "Niskie samo w sobie, ale granica z dark pattern gdy % rabatu liczony jest od sztucznie zawyżonej ceny bazowej (\"było 200% drożej\") żeby wizualnie spotęgować efekt.", "evidence_class": "literatura", "evidence": []}, {"id": 26, "name": "Confirmation Bias", "series": "belief", "def": "We seek, interpret, and favor information confirming our existing beliefs.", "mech": "Validating existing beliefs is cognitively easier and emotionally more rewarding.", "hyp": "An identity-reinforcing quiz ('Are you a serious runner?') increases conversion vs. generic quiz.", "ctrl": "Generic 'Find your perfect product' quiz", "varnt": "Identity quiz: 'Are you [identity type]?' → products that confirm that identity", "kpi": "Quiz-to-purchase conversion", "kpi2": ["Quiz completion rate", "Session length"], "diff": "medium", "time": "4h dev", "uplift": "+10–25% from quiz", "tags": ["quiz", "personalization", "identity", "CRO"], "eval_signal": "czy PDP/listing eksponuje etykiety zgodne z prawdopodobnym światopoglądem klienta (np. \"organic\", \"dla profesjonalistów\"); czy quiz rekomendacyjny wzmacnia self-identity przed pokazaniem produktu.", "lever": "quiz/onboarding budujący self-identity klienta, a następnie rekomendacja \"potwierdzająca\" tę tożsamość (np. \"Jesteś biegaczem? Oto but dla biegaczy\").", "risk": "ukrywanie faktów sprzecznych z przekonaniem klienta (np. wyższa cena, krótsza trwałość) żeby nie zaburzyć jego \"potwierdzonego\" wyboru — to już wprowadzanie w błąd.", "evidence_class": "literatura", "evidence": []}, {"id": 27, "name": "Congruence Bias", "series": "belief", "def": "Testing hypotheses only through direct testing, ignoring alternative explanations.", "mech": "We confirm the expected path and forget to test radically different approaches.", "hyp": "Testing a different offer type reveals more revenue potential than button color tests.", "ctrl": "A/B test: button color variation (red vs. green)", "varnt": "A/B test: offer type (Free Gift vs. 10% Off vs. Extended Warranty)", "kpi": "Revenue per visitor", "kpi2": ["Conversion Rate", "AOV"], "diff": "easy", "time": "1h setup", "uplift": "varies significantly", "tags": ["A/B testing", "CRO", "strategy", "experimentation"], "eval_signal": "Czy konfigurator/quiz produktowy na PDP/listingu (np. 'dobierz rozmiar/typ skóry/model') zadaje TYLKO pytania potwierdzające jeden z góry założony atrybut (np. sam rozmiar), czy testuje różne, konkurencyjne kryteria wyboru (rozmiar + użycie + budżet)? Sprawdź listę pytań quizu/filtra krok po kroku.", "lever": "Rozbuduj quiz/doradcę produktowego o pytania sprawdzające alternatywne kryteria wyboru (nie tylko to jedno oczywiste), zanim padnie rekomendacja.", "risk": "Niskie — quiz zawężony do jednego kryterium prowadzi do złego dopasowania i zwrotu, ale to błąd jakości narzędzia, nie manipulacja.", "evidence_class": "literatura", "evidence": []}, {"id": 28, "name": "Post-Purchase Rationalization", "series": "belief", "def": "After buying, we convince ourselves it was a great decision to avoid regret.", "mech": "Cognitive dissonance avoidance — the brain retroactively justifies the decision.", "hyp": "A 'Smart Choice' confirmation email with 3 purchase benefits reduces returns and drives LTV.", "ctrl": "Standard 'Your order is confirmed' email", "varnt": "'Congratulations on a smart choice' + 3 personalized benefits of the product", "kpi": "Return rate", "kpi2": ["Repeat purchase rate", "NPS", "Review score"], "diff": "easy", "time": "1h email copy", "uplift": "-5–15% returns", "tags": ["email", "post-purchase", "LTV", "retention"], "eval_signal": "Czy strona thank-you / e-mail potransakcyjny w ogóle wzmacnia decyzję (obecny), czy kończy się na \"dziękujemy za zamówienie\" bez żadnego wzmocnienia (brak), czy komunikat brzmi jak upselling zamiast potwierdzenia wyboru (źle użyty).", "lever": "Dodać e-mail/ekran post-purchase z 2-3 konkretnymi benefitami produktu + social proof (\"dołączyłeś do X klientów\").", "risk": "Przesadna, nachalna pochwała wyboru brzmi jak reklama i budzi podejrzliwość zamiast ulgi — granica to szczerość vs. sprzedażowy ton.", "evidence_class": "literatura", "evidence": []}, {"id": 29, "name": "Choice-Supportive Bias", "series": "belief", "def": "We remember our past choices as better than they were.", "mech": "Ego protects us from feeling foolish by retrofitting our decision memory.", "hyp": "Review requests reminding users of their original purchase reason get higher scores.", "ctrl": "Generic review request: 'How would you rate your purchase?'", "varnt": "'How are you enjoying [Product]? You chose it for [reason from order data]'", "kpi": "Average review score", "kpi2": ["Review volume", "Repeat purchase rate"], "diff": "easy", "time": "1h email", "uplift": "+0.2–0.5 stars", "tags": ["email", "reviews", "retention", "UX"], "eval_signal": "czy komunikacja post-purchase przypomina klientowi DLACZEGO wybrał ten produkt (konkretna cecha) czy jest generyczna (\"oceń zakup\"); czy program lojalnościowy/cross-sell odwołuje się do wcześniejszej decyzji.", "lever": "e-mail/prośba o recenzję z odwołaniem do konkretnej cechy, która skłoniła do zakupu (\"wybrałeś to za trwałość — jak sprawdza się po miesiącu?\").", "risk": "wykorzystywanie tego biasu do tuszowania realnych wad produktu (żeby klient \"sam się przekonał\" że dobrze wybrał) zamiast rzetelnej obsługi reklamacji.", "evidence_class": "literatura", "evidence": []}, {"id": 30, "name": "Selective Perception", "series": "attention", "def": "We perceive what aligns with our existing desires and expectations.", "mech": "Goals and culture act as filters, shaping what we notice and how we interpret it.", "hyp": "Smart filtering that highlights features matching stated preferences increases conversion.", "ctrl": "Standard product page for all users", "varnt": "Dynamic highlighting of features matching user's expressed preferences", "kpi": "Conversion Rate", "kpi2": ["Feature engagement rate", "Time on page"], "diff": "hard", "time": "3 days dev", "uplift": "+10–25%", "tags": ["personalization", "PDP", "UX", "filtering"], "eval_signal": "Czy personalizacja (hero, rekomendacje) wzmacnia istniejące preferencje klienta tak mocno, że przesłania mu istotne informacje (cena, wady, alternatywy)? Sprawdź czy filtrowanie 'pod klienta' nie tworzy bańki ukrywającej niekorzystne dane.", "lever": "Personalizuj ekspozycję produktów, ale nie personalizuj/ukrywaj kluczowych faktów (cena, dostępność, warunki zwrotu) — te muszą być jednolite dla wszystkich.", "risk": "Selektywne pokazywanie tylko pozytywnych sygnałów zgodnych z oczekiwaniami klienta i chowanie ostrzeżeń = manipulacja percepcją.", "evidence_class": "literatura", "evidence": []}, {"id": 31, "name": "Observer-Expectancy Effect", "series": "belief", "def": "Researcher bias can subtly influence participants, skewing results.", "mech": "Small cues (leading questions, tone) signal the 'desired' answer to test participants.", "hyp": "Unmoderated automated user tests with neutral scripts produce more accurate insights.", "ctrl": "Moderated user interviews with potentially leading questions", "varnt": "Unmoderated automated test scripts with neutral, behavioral prompts", "kpi": "Research insight accuracy (validated by A/B test results)", "kpi2": ["Cost per insight", "Test turnaround time"], "diff": "medium", "time": "2 days", "uplift": "qualitative", "tags": ["research", "UX", "testing", "process"], "evidence_class": "literatura", "evidence": []}, {"id": 32, "name": "Experimenter's Bias", "series": "belief", "def": "Researchers are more likely to certify data that agrees with their expectations.", "mech": "We double-check surprising results but accept confirming results uncritically.", "hyp": "Pre-defined hard stop criteria prevent cherry-picking winning A/B test data.", "ctrl": "A/B tests stopped when results look favorable to the hypothesis", "varnt": "Hard-stop rules set before test: 95% significance + minimum 1,000 sessions per variant", "kpi": "False positive rate in tests", "kpi2": ["Decision quality score", "Revenue from test decisions"], "diff": "easy", "time": "1h process doc", "uplift": "risk reduction", "tags": ["A/B testing", "process", "CRO", "statistics"], "evidence_class": "literatura", "evidence": []}, {"id": 33, "name": "Ostrich Effect", "series": "choice", "def": "We avoid negative information by burying our heads — protecting emotional state.", "mech": "Information that triggers stress or requires hard changes is actively avoided.", "hyp": "'Total Saved' dashboard increases engagement vs. 'Total Spent' dashboard.", "ctrl": "'Total Spent: $847' dashboard visible in account", "varnt": "'Total Saved: $212 through discounts and loyalty' dashboard", "kpi": "Dashboard engagement rate", "kpi2": ["Return visit rate", "Churn rate"], "diff": "easy", "time": "2h dev", "uplift": "+20–40% engagement", "tags": ["UX", "account", "retention", "framing"], "eval_signal": "Czy strona ułatwia unikanie niewygodnych informacji (koszty dodatkowe, czas oczekiwania na zwrot pieniędzy, negatywne recenzje) poprzez ich ukrycie/schowanie w akordeonach domyślnie zwiniętych? Sprawdź czy złe wiadomości (opóźniona dostawa, wyprzedany wariant) są komunikowane wprost czy zamiatane.", "lever": "Komunikuj niewygodne fakty proaktywnie i krótko (np. 'wysyłka wydłużona do X dni' zamiast ciszy) — buduje zaufanie mimo złej wiadomości.", "risk": "Wykorzystywanie tego biasu przez CELOWE ukrywanie negatywnych informacji, licząc że klient 'nie zapyta' = zatajanie, ryzyko reklamacyjne/prawne.", "evidence_class": "literatura", "evidence": []}, {"id": 34, "name": "Subjective Validation", "series": "belief", "def": "We believe information is correct when it feels personally meaningful.", "mech": "A 'feeling of resonance' is mistaken for objective truth.", "hyp": "A personality-match product selector with vague-positive descriptions builds trust and converts.", "ctrl": "Standard product filter with attribute-based options", "varnt": "'Find your personality match' quiz with resonant, slightly vague positive profiles", "kpi": "Quiz-to-purchase rate", "kpi2": ["Session length", "Trust score"], "diff": "medium", "time": "4h dev", "uplift": "+10–20% from quiz", "tags": ["quiz", "personalization", "trust", "CRO"], "evidence_class": "literatura", "evidence": []}, {"id": 35, "name": "Continued Influence Effect", "series": "belief", "def": "We keep believing misinformation even after it's corrected, if no alternative is offered.", "mech": "A retracted belief leaves a mental gap — the brain prefers a complete wrong model.", "hyp": "Correcting a misconception + offering an alternative story closes the belief gap.", "ctrl": "'Our shipping is actually fast' denial statement", "varnt": "'We ship within 2 hours because [specific process] — and here's proof'", "kpi": "Trust perception (survey)", "kpi2": ["Conversion Rate among hesitant segments", "CS inquiry volume"], "diff": "easy", "time": "1h copy", "uplift": "+5–10% trust", "tags": ["trust", "copy", "brand", "objections"], "evidence_class": "literatura", "evidence": []}, {"id": 36, "name": "Semmelweis Reflex", "series": "belief", "def": "Reflexive rejection of new evidence that contradicts established norms.", "mech": "Psychological inertia protects worldview stability by attacking contradicting information.", "hyp": "Framing new features as 'evolution of familiar X' drives higher adoption than 'revolution'.", "ctrl": "'Revolutionary new approach — everything changes now'", "varnt": "'The next evolution of [familiar concept] you already know'", "kpi": "New feature adoption rate", "kpi2": ["CTR", "User sentiment in feedback"], "diff": "easy", "time": "30min copy", "uplift": "+10–30% adoption", "tags": ["copywriting", "new features", "UX", "change management"], "evidence_class": "literatura", "evidence": []}, {"id": 37, "name": "Halo Effect", "series": "social", "def": "A positive impression in one area influences opinions about everything else.", "mech": "Cognitive consistency drive: 'good at one thing → good at everything'.", "hyp": "An 'Award-Winning' badge in the site header increases conversion across all product pages.", "ctrl": "No award badge in header", "varnt": "'Award-Winning [Year]' badge visible in header site-wide", "kpi": "Conversion Rate site-wide", "kpi2": ["Trust score", "Bounce rate"], "diff": "easy", "time": "30min dev", "uplift": "+2–8% site-wide", "tags": ["trust", "badging", "conversion", "brand"], "eval_signal": "czy design strony jest spójny z pozycjonowaniem cenowym produktu (tania strona = spadek zaufania do drogiego produktu)? Czy są widoczne sygnały jakości (nagrody, certyfikaty, media mentions) w miejscu gdzie user buduje pierwsze wrażenie (hero, PDP top)?", "lever": "dodać badge \"Award-winning\" / \"Polecane przez [medium]\" w headerze/PDP żeby aureola z jednego osiągnięcia rozlała się na całą markę.", "risk": "fałszywe lub nieaktualne odznaki/nagrody — gdy user zweryfikuje, aureola odwraca się w nieufność.", "evidence_class": "literatura", "evidence": []}, {"id": 38, "name": "Social Proof", "series": "social", "def": "We assume others' actions reflect correct behavior in ambiguous situations.", "mech": "'The herd' is used as a cognitive shortcut for safety and correctness.", "hyp": "Testing expert vs. customer vs. celebrity proof reveals optimal proof type for your niche.", "ctrl": "Generic '★★★★★ 4.8 rating' badge only", "varnt": "A: Expert verification / B: Volume customer reviews / C: Celebrity/Influencer quote", "kpi": "Conversion Rate per variant", "kpi2": ["Trust score", "AOV"], "diff": "medium", "time": "2h", "uplift": "+5–20%", "tags": ["social proof", "trust", "reviews", "authority"], "eval_signal": "czy recenzje są nad foldem na PDP? Czy jest liczba (nie sam %)? Czy proof jest konkretny (imię/foto) czy generyczny? Czy bestsellery oznaczone na listingu?", "lever": "wynieś liczbę recenzji i UGC wysoko na PDP; pokaż wolumen sprzedaży tam gdzie wiarygodny.", "risk": "fejkowe liczniki „ogląda teraz\" / kupione recenzje = spalają zaufanie gdy wykryte.", "evidence_class": "literatura", "evidence": []}, {"id": 39, "name": "Authority Bias", "series": "social", "def": "We attribute greater accuracy to authority figures and are more influenced by them.", "mech": "Socialization teaches deference to authority — 'expertise' is a truth shortcut.", "hyp": "A 'Verified Expert' quote with credentials outperforms a standard customer review.", "ctrl": "Standard 5-star customer review quote", "varnt": "Quote from named expert (Dr./Professional) with credentials and photo", "kpi": "Conversion Rate", "kpi2": ["Trust score", "Time on review section"], "diff": "easy", "time": "1h", "uplift": "+3–10%", "tags": ["social proof", "authority", "trust", "PDP"], "eval_signal": "czy PDP niesie sygnał autorytetu adekwatny do kategorii (health/beauty/tech)? Czy certyfikaty są widoczne, nie schowane w stopce? Czy konkretne (nazwa instytucji) czy mgliste?", "lever": "wynieś certyfikaty/rekomendacje ekspertów blisko decyzji (przy cenie/CTA), nie w regulaminie.", "risk": "puste odznaki bez pokrycia / „eksperci mówią\" bez nazwiska = szum, czasem wprowadzanie w błąd.", "evidence_class": "literatura", "evidence": []}, {"id": 40, "name": "Liking Bias", "series": "social", "def": "We are more persuaded by people we like, find attractive, or share similarities with.", "mech": "Positive affect toward a person transfers to their message — a social Halo Effect.", "hyp": "Relatable/friendly team photos matching target demographic outperform corporate shots.", "ctrl": "Professional corporate team photos — formal attire, studio setting", "varnt": "Friendly, relatable team photos that visually match the target customer", "kpi": "Brand affinity survey score", "kpi2": ["Conversion Rate", "Return visit rate"], "diff": "medium", "time": "1 day photography", "uplift": "+3–10%", "tags": ["brand", "photography", "trust", "CRO"], "eval_signal": "czy zdjęcia ludzi na stronie (About Us, recenzje wideo, UGC) reprezentują realną grupę docelową sklepu, czy są generyczne stockowe? Czy ton głosu marki buduje bliskość czy dystans korporacyjny?", "lever": "dobrać zdjęcia/twarze w komunikacji (zespół, UGC, model) pod demografię target grupy zamiast neutralnych stockowych zdjęć korporacyjnych.", "risk": "sztuczne lub niereprezentatywne \"udawanie bliskości\" (fake testimonials, stockowe zdjęcia podpisane jako realni klienci) — wykrywalne i niszczące zaufanie.", "evidence_class": "literatura", "evidence": []}, {"id": 41, "name": "Reciprocity", "series": "social", "def": "We feel compelled to return positive actions — giving creates psychological debt.", "mech": "Receiving a gift triggers an obligation to repay, increasing compliance with requests.", "hyp": "Giving a discount code before asking for signup outperforms gating the code behind signup.", "ctrl": "'Enter your email to get 10% off'", "varnt": "'Here's 10% off — and if you want to save it, enter your email'", "kpi": "Email sign-up rate", "kpi2": ["List quality (open rate)", "First purchase rate"], "diff": "easy", "time": "1h dev", "uplift": "+20–50% sign-ups", "tags": ["email", "lead gen", "reciprocity", "discount"], "eval_signal": "Czy strona daje coś wartościowego zanim prosi o dane/zakup (obecny), czy od razu żąda e-maila bez żadnej wartości w zamian (brak), czy \"darmowy\" gift jest realną wartością czy śmieciowym gadżetem (źle użyty osłabia efekt).", "lever": "Odwrócić kolejność w formularzu zapisu — najpierw pokazać kod rabatowy, potem prośba o e-mail do potwierdzenia; dodać próbkę produktu do paczki.", "risk": "Sztuczna \"darmowość\" (np. rabat i tak wliczony w cenę) budzi cynizm gdy user się zorientuje — psuje zaufanie do marki.", "evidence_class": "literatura", "evidence": []}, {"id": 42, "name": "Commitment & Consistency", "series": "choice", "def": "Once we commit, we feel pressure to behave consistently with that commitment.", "mech": "Consistency is a valued trait — it saves us from re-evaluating every decision.", "hyp": "A multi-step form with easy first micro-commitment increases checkout completion.", "ctrl": "Single-page checkout with all fields visible at once", "varnt": "Step 1: 'What are you shopping for today?' (easy) → Step 2: Details → Step 3: Payment", "kpi": "Checkout completion rate", "kpi2": ["Drop-off by step", "Cart abandonment"], "diff": "medium", "time": "4h dev", "uplift": "+5–15%", "tags": ["checkout", "UX", "funnel", "CRO"], "eval_signal": "czy przed właściwą ofertą jest lekki krok zaangażowania (quiz, wybór celu, personalizacja); czy checkout jest podzielony na małe kroki zaczynające się od najłatwiejszego.", "lever": "dodać krótki quiz/personalizację przed rekomendacją produktu; multi-step checkout zaczynający się od banalnego wyboru.", "risk": "wymuszanie deklaracji niezwiązanej z realną potrzebą tylko po to, by \"złapać\" klienta w spójność, jest manipulacją — granica to pomoc w wyborze vs pułapka zaangażowania.", "evidence_class": "literatura", "evidence": []}, {"id": 43, "name": "Scarcity", "series": "value", "def": "We place higher value on objects perceived as rare or difficult to acquire.", "mech": "Scarcity triggers loss aversion (FOMO) and reactance — we want what we might lose.", "hyp": "Testing quantity-based vs. time-based scarcity reveals which drives faster decisions.", "ctrl": "No scarcity signal on product page", "varnt": "A: 'Only 3 left in stock' / B: 'Offer expires in 2h 14m'", "kpi": "Conversion Rate", "kpi2": ["Time to purchase", "Add-to-cart rate"], "diff": "easy", "time": "1h dev", "uplift": "+10–30%", "tags": ["urgency", "FOMO", "scarcity", "CRO"], "eval_signal": "czy niedobór jest widoczny i KONKRETNY (liczba, nie „mało\")? Czy prawdziwy (stan magazynu) czy dekoracyjny? Czy deadline realny?", "lever": "pokaż realny stan magazynu / czas promocji przy CTA; framing przez stratę („nie przegap\") nie zysk.", "risk": "wieczne „ostatnie sztuki\" / resetujący się licznik = klasyczny dark pattern, zabija wiarygodność.", "evidence_class": "literatura", "evidence": []}, {"id": 44, "name": "Unity Bias", "series": "social", "def": "We are more influenced by people we perceive as part of our 'in-group'.", "mech": "Shared identity creates trust and a sense of shared destiny.", "hyp": "In-group jargon copy ('Fellow coffee nerds') outperforms generic 'Customer' language.", "ctrl": "Generic copy: 'For our valued customers'", "varnt": "In-group identity copy: 'For fellow [niche identity] obsessives'", "kpi": "CTR", "kpi2": ["Conversion Rate", "Brand affinity score"], "diff": "easy", "time": "1h copy", "uplift": "+5–15%", "tags": ["copywriting", "identity", "community", "brand"], "eval_signal": "Czy komunikacja buduje poczucie wspólnoty/'swoich' (np. 'dla mam takich jak Ty', ambasadorzy z tej samej grupy co target, lokalna społeczność, 'nasi klienci z [miasto/branża]')? Sprawdź recenzje i UGC pod kątem identyfikacji grupowej.", "lever": "Segmentuj social proof pod grupę odbiorcy (np. 'zobacz co mówią rodzice/sportowcy/freelancerzy') zamiast generycznych opinii.", "risk": "Fałszywe sugerowanie przynależności grupowej (np. fejkowi 'ambasadorzy z Twojego miasta') = manipulacja tożsamością.", "evidence_class": "literatura", "evidence": []}, {"id": 45, "name": "Groupthink", "series": "belief", "def": "Group cohesion suppresses dissent, reducing decision quality.", "mech": "Desire for harmony overrides realistic evaluation of alternatives.", "hyp": "A mandatory 'Devil's Advocate' design review step improves conversion of shipped designs.", "ctrl": "Standard design review — consensus-based approval process", "varnt": "Devil's Advocate step: one person required to argue against the leading design", "kpi": "Post-launch conversion vs. internal confidence score", "kpi2": ["Design iteration cycles", "User testing scores"], "diff": "easy", "time": "30min process", "uplift": "qualitative", "tags": ["process", "team", "UX", "research"], "eval_signal": "Czy sekcja recenzji/komentarzy jest moderowana tak, że wygląda na jednomyślną (same 5 gwiazdek, brak kontrastu), co może sugerować sztuczne tłumienie krytyki? Sprawdź rozkład ocen — czy 100% pozytywnych jest wiarygodne.", "lever": "Pokazuj pełny rozkład ocen (w tym 3-4 gwiazdkowe) — wiarygodność rośnie gdy widać zróżnicowanie, nie fałszywą jednomyślność.", "risk": "Usuwanie/ukrywanie negatywnych recenzji żeby wymusić pozorną jednomyślność = fałszowanie social proof, wysokie ryzyko reputacyjne i prawne.", "evidence_class": "literatura", "evidence": []}, {"id": 46, "name": "False Consensus Effect", "series": "belief", "def": "We overestimate how much others share our preferences and views.", "mech": "Our own opinions are used as the default baseline for 'normal'.", "hyp": "Preference tests with real users invalidate 'obvious' internal design choices.", "ctrl": "Design chosen by internal team vote ('obvious' winner)", "varnt": "Preference test with 50+ actual users from target segment", "kpi": "User satisfaction with chosen design", "kpi2": ["Conversion Rate", "Bounce rate"], "diff": "easy", "time": "2h research", "uplift": "qualitative", "tags": ["research", "UX", "testing", "process"], "eval_signal": "Czy komunikacja zakłada, że 'większość klientów myśli/wybiera jak Ty' bez dowodu (np. 'najczęściej wybierany' bez liczby)? Sprawdź czy claim o popularności ma pokrycie w danych.", "lever": "Podpieraj claimy popularności realną liczbą/rankingiem sprzedaży, nie ogólnikiem.", "risk": "Fałszywe 'najpopularniejszy wybór' bez pokrycia w danych = wprowadzanie w błąd, podobne do fałszywego social proof.", "evidence_class": "literatura", "evidence": []}, {"id": 47, "name": "Dunning-Kruger Effect", "series": "choice", "def": "People with low ability overestimate their competence in that domain.", "mech": "Lacking the metacognitive skills to recognize one's own incompetence.", "hyp": "Offering 'Beginner/Pro' knowledge tiers reduces wrong purchases and returns.", "ctrl": "Single product listing with technical specs for all users", "varnt": "Knowledge tiers: Beginner (with educational content) / Intermediate / Pro paths", "kpi": "Return rate by tier", "kpi2": ["Conversion Rate", "Support ticket volume"], "diff": "medium", "time": "4h", "uplift": "-10–25% returns", "tags": ["UX", "onboarding", "segmentation", "education"], "eval_signal": "Czy tabela specyfikacji/porównanie wariantów na PDP zakłada wiedzę eksperta bez tooltipów/wyjaśnień (np. suche parametry 'IP67', 'moc 1200W', 'SPF 30' bez 'co to dla Ciebie oznacza')? Sprawdź czy przy technicznych atrybutach jest warstwa tłumacząca w prostym języku.", "lever": "Dodaj tooltip/mini-opis przy każdym technicznym parametrze w tabeli specyfikacji ('co to znaczy w praktyce') — redukuje zwroty z złego dopasowania przez przecenioną własną wiedzę.", "risk": "Celowe zostawianie parametrów niewyjaśnionych, żeby klient przepłacił za funkcję której nie potrzebuje/nie rozumie = wykorzystanie luki kompetencyjnej.", "evidence_class": "literatura", "evidence": []}, {"id": 48, "name": "Fundamental Attribution Error", "series": "belief", "def": "Overemphasizing personality-based explanations for behavior, ignoring situational factors.", "mech": "Labeling people ('lazy user') is easier than analyzing complex environments.", "hyp": "Session recording analysis reveals situational triggers for 'angry user' behaviors.", "ctrl": "Labeling churned users as 'low-intent' or 'price-sensitive'", "varnt": "Session recording review to find specific UI/UX triggers causing frustration", "kpi": "Conversion improvements after fixes", "kpi2": ["NPS", "Support ticket reduction"], "diff": "medium", "time": "1 day research", "uplift": "depends on findings", "tags": ["research", "UX", "analytics", "CRO"], "evidence_class": "literatura", "evidence": []}, {"id": 49, "name": "Self-Serving Bias", "series": "belief", "def": "We attribute successes to ourselves and failures to external factors.", "mech": "Self-esteem protection — credit for wins, deflection of blame for losses.", "hyp": "'You've unlocked a great deal' confirmation copy drives more shares and repeats.", "ctrl": "'Your order is confirmed. Order #12345.'", "varnt": "'You've unlocked a great deal — here's why you nailed this choice'", "kpi": "Post-purchase social sharing rate", "kpi2": ["NPS", "Repeat purchase rate"], "diff": "easy", "time": "30min copy", "uplift": "+5–15%", "tags": ["post-purchase", "copy", "email", "LTV"], "evidence_class": "literatura", "evidence": []}, {"id": 50, "name": "Hindsight Bias", "series": "memory", "def": "We overestimate our ability to have predicted an outcome in retrospect.", "mech": "Once we know the result, the brain rewrites the past to make it feel inevitable.", "hyp": "'We saw this coming' brand positioning builds authority by aligning with hindsight.", "ctrl": "Generic brand positioning copy", "varnt": "'The future of [Category] is here — we've been building toward this for 3 years'", "kpi": "Brand authority perception score", "kpi2": ["CTR", "Organic brand search volume"], "diff": "easy", "time": "1h copy", "uplift": "+5–10% authority", "tags": ["brand", "copy", "positioning", "authority"], "eval_signal": "Czy komunikacja post-purchase / recenzje sugerują klientowi, że 'oczywiście to był dobry wybór, wiedziałeś to od początku' — wzmacniając identyfikację z marką? Sprawdź follow-up e-maile i treści 'przypomnienia'.", "lever": "W komunikacji posprzedażowej odwołuj się do decyzji jako 'przewidywalnie dobrej', wzmacniając satysfakcję i redukując bufor's remorse.", "risk": "Niskie ryzyko manipulacyjne — głównie wzmacnianie retencji, dopóki nie tuszuje realnych problemów z produktem.", "evidence_class": "literatura", "evidence": []}, {"id": 51, "name": "Outcome Bias", "series": "belief", "def": "We judge a decision by its outcome rather than the quality of the reasoning at decision time.", "mech": "Results are vivid and certain; the process is abstract and uncertain.", "hyp": "A 'Decision Log' with pre-result rationale improves long-term e-commerce strategy ROI.", "ctrl": "Strategy evaluated only after results are in", "varnt": "Decision Log: record hypothesis, data, and rationale before every major test", "kpi": "Long-term ROI on strategic decisions", "kpi2": ["Decision quality score", "Learning velocity"], "diff": "easy", "time": "1h process", "uplift": "strategic", "tags": ["process", "strategy", "A/B testing", "analytics"], "eval_signal": "Czy recenzje/oceny są prezentowane bez kontekstu procesu (np. jedna zła dostawa kurierska obniża ocenę produktu, mimo że produkt był dobry)? Sprawdź czy system ocen rozdziela jakość produktu od jakości logistyki/obsługi.", "lever": "Rozdziel ocenę produktu od oceny dostawy/obsługi w systemie recenzji — unikniesz niesprawiedliwego zaniżania wyniku produktu przez zewnętrzny incydent.", "risk": "Niskie — to bardziej kwestia rzetelności systemu ocen niż dark pattern.", "evidence_class": "literatura", "evidence": []}, {"id": 52, "name": "Hick's Law", "series": "choice", "def": "Decision time increases with the number and complexity of available choices.", "mech": "Each option requires cognitive cycles to compare and eliminate — causing paralysis.", "hyp": "'Top 3 Recommended' overlay for users stuck on category pages reduces time-to-purchase.", "ctrl": "Full category page with 48+ products, no guidance", "varnt": "'Struggling to choose? Here are your top 3 picks' overlay after 60s on page", "kpi": "Time-to-purchase", "kpi2": ["Conversion Rate", "Overlay CTR"], "diff": "medium", "time": "4h dev", "uplift": "+5–20%", "tags": ["UX", "navigation", "decision", "CRO"], "eval_signal": "ile kliknięć/opcji trzeba przetworzyć zanim user zacznie realnie przeglądać produkty? Czy menu główne ma płaską strukturę z dużą liczbą pozycji, czy jest rozbite na przejrzyste poziomy? Czy filtr listingu przytłacza liczbą checkboxów?", "lever": "ograniczyć widoczne opcje do 5-7 głównych kategorii, dodać \"Top 3 polecane\" overlay przy dłuższym namyśle na stronie kategorii, grupować warianty produktu.", "risk": "nadmierne uproszczenie wyboru może sfrustrować power-userów szukających konkretnej specyfikacji — potrzebna ścieżka \"zaawansowane filtry\" jako opt-in.", "evidence_class": "literatura", "evidence": []}, {"id": 53, "name": "Fitts's Law", "series": "choice", "def": "Time to acquire a target is a function of its distance and size.", "mech": "Motor systems move faster toward larger, closer targets — critical on mobile.", "hyp": "A thumb-friendly mobile layout with all CTAs in bottom 30% improves mobile conversion.", "ctrl": "Standard mobile layout with CTAs placed according to desktop logic", "varnt": "All primary actions (Add to Cart, Checkout) in bottom 30% of screen", "kpi": "Mobile conversion rate", "kpi2": ["Rage click rate", "Error rate on mobile"], "diff": "medium", "time": "4h redesign", "uplift": "+10–25% mobile", "tags": ["mobile", "UX", "conversion", "layout"], "eval_signal": "Czy główne CTA (Dodaj do koszyka, Kup teraz) jest wystarczająco duże i blisko kciuka na mobile? Zmierz rozmiar przycisku i odległość od naturalnego miejsca trzymania telefonu; sprawdź czy drugorzędne linki nie konkurują rozmiarem z głównym CTA.", "lever": "Powiększ i przybliż główny CTA do strefy kciuka (dolna część ekranu na mobile), zmniejsz/oddal drugorzędne akcje.", "risk": "Sztuczne powiększanie/ukrywanie przycisku 'anuluj subskrypcję' względem 'kontynuuj' (confirmshaming przez rozmiar) to dark pattern.", "evidence_class": "literatura", "evidence": []}, {"id": 54, "name": "Progressive Disclosure", "series": "choice", "def": "Revealing information gradually prevents cognitive overload and maintains focus.", "mech": "Working memory is limited — showing only what's needed at
