t_item events) and add_to_cart rate before vs after implementing badge system. Also compare CVR on badged products vs unbadged. Explorations.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and sessions for products with badges vs without. Check if 'New' and 'Low Stock' badges show strongest impact.", "test_period": "4 weeks", "kpi": "Collection page CTR / Add-to-cart rate by badge type", "id": "T191"}, {"num": 192, "name": "Visual Countdown Timer", "category": "Visual & Design", "tags": "Promo, Urgency", "difficulty": "Easy", "time": "2h", "bias": "Scarcity / Urgency", "what": "Replace text-only countdown ('Ends in 2 hours') with a visual DD:HH:MM:SS flip clock countdown element", "how": "1. Install 'Countdown Timer — Urgency' app (free options available). 2. Place on: sale landing pages, flash sale PDPs, email banners (static image version for email). 3. Style to match your brand — don't use default garish red unless it fits. 4. Show only when there's a genuine deadline. 5. When timer expires, automatically update the page (remove offer, not just hide timer).", "ga4": "GA4: Compare add_to_cart rate during flash sales with visual countdown vs text-only countdown (or no countdown). Tag periods in GA4 annotations. Reports > Events during promo periods.", "shopify": "Shopify: Analytics > Sales by hour during countdown timer periods vs equivalent time without. Compare conversion rate spikes as timer approaches zero (this is a reliable pattern for well-executed countdowns).", "test_period": "Per promotion", "kpi": "Add-to-cart rate during countdown periods", "id": "T192"}, {"num": 193, "name": "Low Stock Visual Alert", "category": "Visual & Design", "tags": "PDP, Urgency", "difficulty": "Easy", "time": "1h", "bias": "Scarcity / Urgency", "what": "Add a visual indicator (colored bar, icon, text) for low stock levels that's more prominent than plain text", "how": "1. When stock < 10: show a red/amber indicator bar or icon below variant selector. 2. Text: 'Only 4 left!' with a depleting bar visual (like a battery at 20%). 3. This must be real data. 4. Pair with: no restocking planned notice if true ('Once gone, gone!'). 5. Disappear when stock replenishes above threshold.", "ga4": "GA4: Compare add_to_cart rate on low-stock products before vs after adding visual indicator. Use custom dimension 'low_stock' to segment in Explorations. Compare urgency response by product category.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate on products with low stock visual indicator vs those below threshold without the indicator. Also compare sell-through speed of low-stock products.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on low-stock products", "id": "T193"}, {"num": 194, "name": "Before/After Visual on PDP", "category": "Visual & Design", "tags": "PDP, Content", "difficulty": "Medium", "time": "3h", "bias": "Framing Effect", "what": "Add a side-by-side or slider before/after image showing the product's impact", "how": "1. Create a before/after image using a split image (two photos side by side, labeled). 2. Or use a CSS slider (before-after image slider: Juxtapose.js — free). 3. Best for: cleaning products, beauty/skincare, fitness, home improvement. 4. Label clearly: 'Before' and 'After' with timeframe if applicable ('After 4 weeks'). 5. Use real photos — customer submissions are most convincing.", "ga4": "GA4: Track scroll to before/after section (GTM intersection observer). Compare add_to_cart rate on PDPs with before/after vs control. Also compare return rate — clear outcome expectations reduce 'didn't work' returns.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and return rate on products with before/after imagery vs similar products without. Best category to test first: beauty and home care.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T194"}, {"num": 195, "name": "White Space Around CTA", "category": "Visual & Design", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Add visual breathing room (padding/margin) around the Add-to-Cart button to make it stand out", "how": "1. Inspect current ATC button area: is it crowded with variant selectors, trust badges, and price all competing? 2. Add padding: min 16px above and below the ATC button. 3. Ensure no other element has the same visual weight (color, size) as the ATC button. 4. The ATC button should be the most visually prominent element in the purchase zone. 5. Test on mobile first — crowding is worst there.", "ga4": "GA4: Compare add_to_cart rate before vs after design adjustment. Reports > Events > add_to_cart rate. Also compare heatmap click data (Hotjar) to see if ATC click concentration increases relative to other nearby elements.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate before vs after increasing white space around CTA. Small CSS change — easy to test and revert. Track over 3 weeks.", "test_period": "3 weeks", "kpi": "Add-to-cart rate", "id": "T195"}, {"num": 196, "name": "Card vs List Layout Test on Category", "category": "Visual & Design", "tags": "Category, UX", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Test card grid view vs list view on category pages to find which drives higher add-to-cart rates", "how": "1. Add a view toggle to collection pages: grid icon | list icon. 2. Or: run as timed A/B test — grid for 3 weeks, list for 3 weeks. 3. List view shows: product image (left), name + short description + price + ATC button (right). Grid shows: image, name, price. 4. List view often wins for considered purchases; grid wins for browsing/impulse.", "ga4": "GA4: Compare add_to_cart rate and session duration per layout period. Use date comparison. Reports > Events > add_to_cart by page_path on collection pages. Also compare bounce rate per layout.", "shopify": "Shopify: Analytics > Product performance. Compare collection page add-to-cart rate during grid vs list test periods. Also check if AOV differs — list views with more info may drive higher-consideration, higher-value purchases.", "test_period": "6 weeks (3+3)", "kpi": "Collection page add-to-cart rate / Session duration", "id": "T196"}, {"num": 197, "name": "Consistent Brand Color for Interactions", "category": "Visual & Design", "tags": "Sitewide, UX", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Use one consistent brand color for ALL interactive elements: buttons, links, active states, hover effects", "how": "1. Audit your site: are buttons, links, swatches, and hover states using the same color? 2. Define your primary interactive color (brand color). 3. Apply consistently in CSS: all <a> links, :hover states, active nav items, form focus states, button backgrounds. 4. This trains users to associate the color with 'clickable' — reducing confusion. 5. Exception: error states should be red regardless.", "ga4": "GA4: Compare overall CVR and pages per session before vs after design consistency update. Difficult to isolate — track as part of a broader UX sprint. Reports > Engagement and Monetization.", "shopify": "Shopify: Compare overall online store conversion rate before vs after. A consistent visual system reduces friction subtly. Also compare bounce rate — a more professional-looking site improves first impressions.", "test_period": "4 weeks", "kpi": "Overall CVR / Bounce rate", "id": "T197"}, {"num": 198, "name": "Hero Banner with Clear Visual Hierarchy", "category": "Visual & Design", "tags": "Homepage, Conversion", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Redesign homepage hero to have clear visual hierarchy: headline > subheadline > CTA button, with nothing competing", "how": "1. Audit homepage hero: count the number of competing elements. More than 3 elements = too many. 2. Ideal hero: 1 headline (large), 1 supporting line (small), 1 CTA button, 1 background image. Nothing else. 3. Ensure text is legible on the background image (use overlay if needed). 4. CTA button: high contrast, specific text. 5. Remove any secondary CTAs or promotional messages from the hero — they dilute impact.", "ga4": "GA4: Compare homepage bounce rate and CTR from homepage to first product/category before vs after hero redesign. Reports > Engagement > Pages. Also compare homepage CVR overall.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare homepage CVR (sessions that enter via homepage and purchase) before vs after. Also compare bounce rate. A cleaner hero should reduce bounce and increase CTR to products.", "test_period": "3 weeks", "kpi": "Homepage bounce rate / CTA CTR", "id": "T198"}, {"num": 199, "name": "Video Background on Homepage Hero", "category": "Visual & Design", "tags": "Homepage, Brand", "difficulty": "Medium", "time": "1 day", "bias": "Endowment Effect", "what": "Replace a static hero image with a short looping video (muted, 5-10s) showing product in use", "how": "1. Source or shoot a 5-10 second video showing your product/brand in context. 2. Compress to < 5MB for web (use Handbrake, free). 3. In Shopify theme, enable video background in hero section settings. 4. Set: muted, autoplay, loop. 5. Add a static image fallback for slow connections and mobile (mobile browsers often block autoplay). 6. Ensure headline and CTA remain clearly readable over video.", "ga4": "GA4: Compare homepage bounce rate and time on page before vs after adding video hero. Reports > Engagement > Pages > / page. Also compare homepage CVR — video increases engagement but ensure it doesn't slow the page.", "shopify": "Shopify: Online Store > Speed score — compare before vs after (video can slow pages). Analytics > Sessions by landing page. Compare homepage bounce rate, session duration, and CVR before vs after.", "test_period": "4 weeks", "kpi": "Homepage bounce rate / Session duration / Page speed", "id": "T199"}, {"num": 200, "name": "Mobile-First Image Optimization", "category": "Visual & Design", "tags": "Mobile, Performance", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Serve appropriately sized images per device: small files on mobile, large on desktop, using responsive images", "how": "1. In Shopify, responsive images are partly handled automatically via img_url filter sizes. Verify: are product images served at appropriate sizes on mobile? Use browser DevTools > Network > Img to check. 2. Ensure product images use srcset with multiple sizes: 360, 540, 720, 1080, 1440px. 3. Serve WebP format (Shopify does this automatically on supported browsers). 4. Compress original uploads: max 1MB per image at 2000px width.", "ga4": "GA4: Reports > Tech > Web vitals. Compare LCP (Largest Contentful Paint) on mobile before vs after. Also compare mobile bounce rate. Faster image loading = better engagement = higher CVR.", "shopify": "Shopify: Online Store > Speed score — compare before vs after. Also compare mobile CVR in Analytics > Online store conversion rate by device. Google PageSpeed Insights: compare mobile score before vs after image optimization.", "test_period": "4 weeks", "kpi": "Mobile page speed (LCP) / Mobile CVR", "id": "T200"}], "seriesMeta": {"social": {"label": "Social Proof", "color": "#22c55e"}, "attention": {"label": "Attention", "color": "#5c6ef7"}, "belief": {"label": "Belief", "color": "#a855f7"}, "memory": {"label": "Memory", "color": "#f0a500"}, "value": {"label": "Value", "color": "#00c4c4"}, "choice": {"label": "Choice", "color": "#f97316"}, "ai": {"label": "AI / Trust", "color": "#ef4444"}}, "counts": {"biases": 137, "kpis": 167, "tactics": 203}};

// indices
const biasByName = {}; DB.biases.forEach(b=>biasByName[b.name.toLowerCase()]=b);
const biasById = {}; DB.biases.forEach(b=>biasById[b.id]=b);
const kpiGroupBySlug = {}; DB.kpiGroups.forEach(k=>kpiGroupBySlug[k.slug]=k);
const rawMap = DB.kpiRawMap||{};
// raw string KPI -> {slug,base,variant}; exact → bez-nawiasów → najdłuższy base-prefix
function kpiResolve(raw){
  if(!raw)return null;const l=raw.toLowerCase();
  if(rawMap[l])return rawMap[l];
  const ln=l.replace(/\(.*?\)/g,'').trim();
  if(rawMap[ln])return rawMap[ln];
  let best=null;
  for(const g of DB.kpiGroups){const b=g.base.toLowerCase();if(ln===b||ln.startsWith(b+' ')){if(!best||b.length>best._l)best={slug:g.slug,base:g.base,variant:'',_l:b.length};}}
  return best;
}
// bias name -> rekord bazy 118; exact → części po '/'+','
function biasResolve(name){
  if(!name)return null;const l=name.toLowerCase();
  if(biasByName[l])return biasByName[l];
  for(const p of l.split(/[\/,]/)){const t=p.trim();if(biasByName[t])return biasByName[t];}
  return null;
}
// taktyki używające biasu (po nazwie ref) / KPI (po base-slug grupy)
function tacticsUsingBias(name){return DB.tactics.filter(t=>(t.biases||[]).some(x=>x.ref.toLowerCase()===name.toLowerCase()));}
function tacticsUsingKpi(slug){return DB.tactics.filter(t=>{const all=[t.kpi.primary,...(t.kpi.secondary||[])];return all.some(k=>{const r=kpiResolve(k);return r&&r.slug===slug;});});}
function biasesUsingKpiGroup(g){const seen={},out=[];(g.variants||[]).forEach(v=>v.biases.forEach(b=>{if(!seen[b.id]){seen[b.id]=1;out.push(b);}}));return out;}

          <div><span class="badge ${v.variant==='(bazowy)'?'b-add':'b-modify'}">${v.variant==='(bazowy)'?'bazowy':'wariant: '+E(v.variant)}</span> <span style="color:var(--muted);font-size:12px;">×${v.count}</span></div>
          <div class="chipwrap">${v.biases.map(biasChip).join('')}</div>
        </div>`).join('')}</div></div>
    <div class="section"><div class="slabel">🎯 Taktyki mierzone tym KPI</div>
      ${usedT.length?`<div class="usedby">${usedT.map(t=>`<span class="linkchip kpilink" onclick="gotoTactic('${t.id}')">${t.id} · ${E(t.title)} <span class="arr">→</span></span>`).join('')}</div>`:'<div style="color:var(--muted);font-size:13px;">Brak taktyk z tym KPI (jeszcze).</div>'}</div>
  </div>`;
}

/* ---------- CROSS-LINK nav ---------- */
function gotoBias(id){switchTab('biases');openBias(id);document.getElementById('detail-biases').scrollTop=0;}
function gotoKpi(slug){if(!kpiGroupBySlug[slug])return;switchTab('kpis');openKpi(slug);document.getElementById('detail-kpis').scrollTop=0;}
function gotoTactic(id){switchTab('tactics');openTactic(id);document.getElementById('detail-tactics').scrollTop=0;}

function init(){
  renderCatChips();renderTacticList();renderSeriesChips();renderBiasList();renderKpiList();
  updateOrderCount();
  if(DB.tactics[0])openTactic(DB.tactics[0].id);
  try{ if(document.documentElement.getAttribute('data-theme')==='light')theme_btn.textContent='🌙'; }catch(e){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script></body></html>
