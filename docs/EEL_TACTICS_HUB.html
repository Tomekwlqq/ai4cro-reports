ming Effect", "what": "Show cost-per-unit or cost-per-serving alongside total price to make bulk buys feel better value", "how": "1. On product pages with multiple size/pack options, add per-unit price: '500g — €12.99 (€2.60/100g).' 2. Add to: product title area, variant selector, and cart. 3. Use Shopify metafields to store per-unit data and display via liquid template. 4. Best for: food, supplements, cleaning, beauty, any product sold by quantity or weight.", "ga4": "GA4: Compare which size variant is selected more after showing per-unit price. Track 'variant_selected' event with variant details. Compare AOV before vs after — per-unit pricing typically shifts to larger sizes.", "shopify": "Shopify: Analytics > Sales by product variant. Compare % of units sold in larger vs smaller pack sizes before vs after adding per-unit pricing. Also compare AOV.", "test_period": "4 weeks", "kpi": "AOV / % of orders choosing larger pack", "id": "T123"}, {"num": 124, "name": "Cost-Per-Day Framing", "category": "Pricing & Anchoring", "tags": "PDP, High Ticket", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Reframe product price as daily cost: 'Costs less than your morning coffee — €0.50/day'", "how": "1. Calculate: price ÷ product lifespan in days. 2. Add as a single line below the price on PDP: 'Just €0.82/day for 365 days of use.' 3. Best for: high-ticket items where the daily equivalent sounds trivial. 4. Ensure the daily period is realistic (don't say 365 days if product lasts 6 months). 5. Optionally show comparison: 'Less than a coffee a day.'", "ga4": "GA4: Compare add_to_cart rate on PDPs with cost-per-day framing vs without. Particularly effective on higher-priced products — filter analysis by product price tier. Explorations.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate on products with cost-per-day messaging vs control products of similar price point. Track over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on high-ticket PDPs", "id": "T124"}, {"num": 125, "name": "Free Shipping Framing", "category": "Pricing & Anchoring", "tags": "PDP, Checkout", "difficulty": "Easy", "time": "30 min", "bias": "Framing Effect", "what": "Frame free shipping as a value gain: 'FREE delivery' rather than showing it as a €0 line item", "how": "1. On PDP, replace 'Shipping: Calculated at checkout' with 'FREE delivery on all orders over €50 — you qualify!' 2. In cart: show free shipping as 'Delivery: FREE' in a highlighted color (green). 3. On product cards: add 'Free shipping' badge. 4. The word 'FREE' activates positive emotion disproportionate to €3-5 monetary value. 5. Ensure free shipping threshold is met before showing.", "ga4": "GA4: Compare add_to_cart rate and checkout completion rate before vs after updating shipping display language. Reports > Events > add_to_cart and begin_checkout rates.", "shopify": "Shopify: Analytics > Online store conversion rate. Compare overall CVR and checkout completion rate before vs after updating shipping copy. Also check if AOV increases (customers add more to qualify for free shipping).", "test_period": "3 weeks", "kpi": "Add-to-cart rate / Checkout completion rate", "id": "T125"}, {"num": 126, "name": "Bundle Pricing to Obscure Unit Price", "category": "Pricing & Anchoring", "tags": "AOV, Bundling", "difficulty": "Medium", "time": "3h", "bias": "Anchoring", "what": "Create bundles priced attractively where the bundle value is clear but individual prices are secondary", "how": "1. Create a bundle product in Shopify (using 'Bundle Builder' app). 2. Price the bundle at 15-20% less than items bought separately. 3. On bundle PDP, lead with 'Complete Kit — €89' not 'Item A (€35) + Item B (€30) + Item C (€35) = €89 — save 15%.' 4. Make individual product prices harder to find than the bundle price. 5. Bundles remove price anchoring to individual items — customers evaluate the bundle as a whole.", "ga4": "GA4: Compare AOV before vs after introducing bundles. Also track items_per_purchase. Reports > Monetization > Ecommerce purchases. Compare bundle orders vs individual product orders.", "shopify": "Shopify: Analytics > Sales by product. Compare AOV of bundle orders vs single-product orders. Also check inventory depletion rate for products included in bundles — bundles often move slower-selling items.", "test_period": "4 weeks", "kpi": "Bundle CVR / AOV of bundle orders", "id": "T126"}, {"num": 127, "name": "'Price Match' Badge", "category": "Pricing & Anchoring", "tags": "Trust, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Trust / Safety", "what": "Add a 'Price Match Guarantee' or 'Lowest Price Guaranteed' badge if you can back it up", "how": "1. Only add this if you're genuinely willing to price-match. 2. Write a simple price match policy: 'Found it cheaper? We'll match the price — email us within 7 days of purchase.' 3. Add badge to PDP below price. 4. Create a simple price match request process (email or form). 5. Monitor: how many requests do you actually get? Usually very few — it's mostly a psychological signal.", "ga4": "GA4: Compare add_to_cart rate and cart-to-checkout rate before vs after adding badge. Also monitor price match request volume (track form submissions as events in GA4 if using a form).", "shopify": "Shopify: Analytics > Add-to-cart rate and checkout completion rate before vs after. Also check if customer support queries about price increase (they usually don't — badge reduces the urge to look elsewhere).", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Checkout completion rate", "id": "T127"}, {"num": 128, "name": "BNPL Messaging on PDP", "category": "Pricing & Anchoring", "tags": "High Ticket, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Framing Effect", "what": "Show 'Buy Now Pay Later' installment options directly on the product page, not just at checkout", "how": "1. If using Klarna/Afterpay/Clearpay: these apps offer PDP widgets that show 'Pay in 4 installments of €12.50.' 2. Install the relevant BNPL app for Shopify (Klarna, Afterpay, Laybuy). 3. Enable PDP placement in app settings — it shows below price. 4. Particularly effective for products priced €50+. 5. Shopify's Shop Pay also offers BNPL messaging widget.", "ga4": "GA4: Compare add_to_cart rate on high-ticket PDPs before vs after enabling BNPL messaging. Also compare checkout completion rate and payment method distribution. Reports > Monetization.", "shopify": "Shopify: Analytics > Payment methods. Compare % of orders using BNPL before vs after PDP placement. Also compare AOV for BNPL orders vs full-payment orders (BNPL orders typically have 20-30% higher AOV).", "test_period": "4 weeks", "kpi": "Add-to-cart rate on high-ticket PDPs / BNPL adoption rate", "id": "T128"}, {"num": 129, "name": "Decoy Pricing Option", "category": "Pricing & Anchoring", "tags": "Pricing, Bundles", "difficulty": "Medium", "time": "2h", "bias": "Choice Architecture", "what": "Add a 3rd, less attractive pricing option that makes your preferred option look better by comparison", "how": "1. In any pricing selector, introduce 3 options: Option A (small): clearly under-featured, Option B (medium): your target — best value, Option C (large): premium, significantly more expensive. 2. The presence of Option C makes B look like the obvious sweet spot. 3. Ensure all 3 are genuinely real offerings. 4. Works on: subscription tiers, bundle sizes, service levels, product size options.", "ga4": "GA4: Track tier selection rates before vs after introducing the 3rd option. Custom event 'tier_selected' with tier value. Compare selection rate of middle option — should increase significantly.", "shopify": "Shopify: Analytics > Sales by product variant. Compare % of orders choosing each tier before (2 options) vs after (3 options). Middle option should see increased selection rate.", "test_period": "4 weeks", "kpi": "Middle option selection rate", "id": "T129"}, {"num": 130, "name": "Subscription vs One-Time Savings Display", "category": "Pricing & Anchoring", "tags": "Subscription, Retention", "difficulty": "Medium", "time": "3h", "bias": "Anchoring", "what": "Show the price difference between one-time purchase and subscription side by side to drive subscription uptake", "how": "1. Install a subscription app: Recharge, Bold Subscriptions, or Skio. 2. On PDP, show two options: One-time: €29.99 | Subscribe & Save 15%: €25.49/month. 3. Highlight subscription as default selected option. 4. Show annual savings: 'Subscribe and save €54/year.' 5. Make cancellation easy and say so: 'Cancel anytime — no commitment.' Easy cancellation messaging increases subscription sign-ups.", "ga4": "GA4: Track 'subscription_selected' vs 'one_time_selected' custom events on PDP. Compare subscription add-to-cart rate before vs after pricing display optimization. Also track subscription CVR vs one-time CVR.", "shopify": "Shopify: Analytics > Recurring orders (via subscription app dashboard). Compare subscription vs one-time order ratio before vs after. Also compare customer LTV of subscription vs one-time buyers at 90 days.", "test_period": "6 weeks", "kpi": "Subscription sign-up rate / LTV of subscribers", "id": "T130"}, {"num": 131, "name": "Price History Transparency", "category": "Pricing & Anchoring", "tags": "Trust, Sale", "difficulty": "Easy", "time": "2h", "bias": "Trust / Safety", "what": "Show 'Lowest price in 30 days' or price history to comply with pricing regulations and build trust", "how": "1. Required by EU law (Omnibus Directive) for sales promotions: show reference price from last 30 days. 2. Add to sale items: 'Lowest price in the last 30 days: €X.' 3. In Shopify, use a metafield to store the 30-day lowest price and display on sale PDPs. 4. This is also a trust signal — transparent pricing builds confidence. 5. Audit current sale promotions for compliance.", "ga4": "GA4: Compare add_to_cart rate on compliant sale PDPs vs before. Legal compliance + transparency is a trust signal. Also compare return rate — buyers who understood the price history have fewer 'buyer's remorse' returns.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate on sale products after adding price history display. Also track if 'complaint' related contacts decrease.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on sale PDPs / Trust compliance", "id": "T131"}, {"num": 132, "name": "ROI / Value Framing Copy", "category": "Pricing & Anchoring", "tags": "PDP, High Ticket", "difficulty": "Medium", "time": "2h", "bias": "Framing Effect", "what": "Reframe product price in terms of value delivered or money saved over time", "how": "1. Calculate genuine ROI: e.g. reusable coffee cup saves €1.50/day vs disposable → pays for itself in 20 days → saves €500/year. 2. Add to PDP as 'The smarter investment: pays for itself in 20 days.' 3. Show in a simple infographic or 2-line copy block. 4. Only use if the calculation is real and verifiable. 5. Best for: reusable products, tools, subscriptions, health products.", "ga4": "GA4: Compare add_to_cart rate on PDPs with ROI framing vs without. Also compare time on page — ROI calculation is engaging. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR on products with ROI framing vs control products. Also check if review sentiment changes — customers referencing value received.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Review sentiment", "id": "T132"}, {"num": 133, "name": "Currency Converter for International Visitors", "category": "Pricing & Anchoring", "tags": "International, UX", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Show prices in the visitor's local currency automatically based on their location", "how": "1. In Shopify Markets (built-in on all plans): enable multiple currencies. 2. Install 'Geolocation' app (free) to detect visitor country and suggest currency switch. 3. Show currency selector in header. 4. Auto-round converted prices to local conventions (€29.99 not €29.73). 5. Shopify handles conversion rates automatically if using Shopify Payments.", "ga4": "GA4: Compare CVR by country before vs after enabling local currency. Reports > Demographics > Country. Compare CVR for your top 3 international markets specifically.", "shopify": "Shopify: Analytics > Reports > Sessions by location. Compare conversion rate (orders/sessions) for international markets before vs after enabling multi-currency. Target: top 3 non-primary-market countries.", "test_period": "6 weeks", "kpi": "CVR in international markets", "id": "T133"}, {"num": 134, "name": "Precise vs Round Price Test", "category": "Pricing & Anchoring", "tags": "PDP, Pricing", "difficulty": "Easy", "time": "3h", "bias": "Framing Effect", "what": "Test whether precise pricing (€19.73) or round pricing (€20.00) converts better for your product type", "how": "1. Take 5 products. 2. Period A (3 weeks): price at round number (€20.00). Period B (3 weeks): price at precise odd number (€19.73 or €19.97). 3. Rule: round prices suggest quality/premium; precise prices suggest calculated value/deal. 4. For luxury/gift items: round prices. For value/deal items: precise prices. 5. The €X.99 convention is losing effectiveness — test more unusual precise prices.", "ga4": "GA4: Compare add_to_cart rate per period using date comparison. Reports > Events > add_to_cart by page_path. Control for traffic changes between periods.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR for each pricing period. Also compare AOV — round pricing sometimes increases AOV for premium products.", "test_period": "6 weeks (3+3)", "kpi": "Add-to-cart rate / CVR by price point", "id": "T134"}, {"num": 135, "name": "'You're Saving' Line at Price", "category": "Pricing & Anchoring", "tags": "PDP, Sale", "difficulty": "Easy", "time": "30 min", "bias": "Framing Effect", "what": "Add a prominent 'You save €X' line directly next to the sale price on PDPs", "how": "1. Below sale price on PDP, add: 'You save €12 (25%).' 2. Style in green with a savings icon. 3. Show both the € amount AND the percentage — different shoppers respond to different formats. 4. In Shopify, this can be added to the price section of the product template using liquid: {{ product.compare_at_price | minus: product.price | money }}. 5. Only show when compare_at_price is set.", "ga4": "GA4: Compare add_to_cart rate on sale PDPs before vs after adding 'You save' line. Reports > Events > add_to_cart filtered by page_path on sale products.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate on products with compare-at price (sale products) before vs after adding the explicit savings line.", "test_period": "3 weeks", "kpi": "Add-to-cart rate on sale products", "id": "T135"}, {"num": 136, "name": "Installment Price on PDP", "category": "Pricing & Anchoring", "tags": "High Ticket, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Show a monthly installment price alongside the full price for products over €100", "how": "1. Below the product price, add: 'Or 3 payments of €33.33 with Klarna — no interest.' 2. Source from your active BNPL provider's messaging widget (Klarna, Afterpay have official Shopify widgets). 3. Link to 'Learn more' about the BNPL terms. 4. Only show for products above your BNPL minimum threshold. 5. Ensure compliance with consumer credit regulations in your market.", "ga4": "GA4: Compare add_to_cart rate on high-ticket PDPs (filter by product price > €100) before vs after enabling installment messaging. Reports > Events filtered by page.", "shopify": "Shopify: Analytics > Payment methods. Compare BNPL usage rate before vs after enabling PDP messaging. Also compare AOV of BNPL orders vs standard orders and checkout completion rate.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on products >€100 / BNPL usage", "id": "T136"}, {"num": 137, "name": "'Best Value' Per-Pack Label", "category": "Pricing & Anchoring", "tags": "Multi-pack, Bundles", "difficulty": "Easy", "time": "1h", "bias": "Anchoring", "what": "Label the largest or most cost-effective multi-pack as 'Best Value' with per-unit cost shown", "how": "1. In the variant selector for multi-pack products, add 'Best Value' label to the largest pack. 2. Show per-unit cost for each option: '1 pack — €9.99 (€9.99 each)' vs '3 pack — €24.99 (€8.33 each) — Best Value.' 3. Slightly highlight the best value option visually (border, color). 4. Best for: consumables, supplements, food, any product where buying more makes economic sense.", "ga4": "GA4: Track variant selection events — compare selection rate of largest pack before vs after adding Best Value label. Custom event 'variant_selected' with variant_name. Explorations.", "shopify": "Shopify: Analytics > Sales by product variant. Compare % of orders choosing largest pack before vs after adding Best Value label. Also compare AOV overall.", "test_period": "4 weeks", "kpi": "% of orders choosing largest pack / AOV", "id": "T137"}, {"num": 138, "name": "Value Stack on PDP", "category": "Pricing & Anchoring", "tags": "PDP, Conversion", "difficulty": "Medium", "time": "2h", "bias": "Anchoring", "what": "List everything included in the purchase with perceived values to make the price feel like a deal", "how": "1. Create a 'What you get' or 'Everything included' section on PDPs. 2. List each component with individual value: Product X (€29 value) + Free carrying case (€15 value) + 1-year warranty (€20 value) + Free shipping (€5 value). 3. Show 'Total value: €69 — Your price: €39.' 4. All values must be genuine and verifiable. 5. Best for: bundles, kits, subscriptions, products with accessories.", "ga4": "GA4: Compare add_to_cart rate on PDPs with value stack vs without. Also compare cart abandonment rate — value stack reduces post-click hesitation. Explorations > Funnel: page_view → add_to_cart.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR for products with value stack vs control products at similar price points.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / CVR", "id": "T138"}, {"num": 139, "name": "Shipping Cost in Price Framing", "category": "Pricing & Anchoring", "tags": "Checkout, Pricing", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Test 'free shipping with slightly higher product price' vs 'lower price + shipping fee' to find which converts better", "how": "1. Take one product: currently €25 + €4.95 shipping. Test: €29.95 with free shipping for 3 weeks vs €25 + €4.95 for 3 weeks. 2. Keep total cost exactly the same. 3. 'Free shipping' consistently wins in conversion rate even when total cost is identical — 'FREE' is psychologically powerful. 4. If free shipping always: ensure base prices cover shipping cost.", "ga4": "GA4: Compare add_to_cart rate, checkout completion rate, and purchase rate during each pricing model period. Use date comparison. Reports > Monetization and Events.", "shopify": "Shopify: Analytics > Online store conversion rate. Compare CVR during each 3-week period. Also compare cart abandonment rate at checkout — shipping fee shock at checkout causes more abandonment.", "test_period": "6 weeks (3+3)", "kpi": "Conversion rate / Cart abandonment at checkout", "id": "T139"}, {"num": 140, "name": "Gift Card Value Anchoring", "category": "Pricing & Anchoring", "tags": "Gifting, AOV", "difficulty": "Easy", "time": "2h", "bias": "Anchoring", "what": "Offer gift cards in specific denominations that anchor gift buyers toward higher values", "how": "1. Set gift card denominations: €25, €50, €75, €100, €150. 2. Pre-select €50 as default (anchors in the middle). 3. Add copy: 'Most popular gift: €50 — covers one of our bestsellers with free shipping.' 4. Show what each denomination can buy: '€75 buys the Premium Kit + free delivery.' 5. Promote gift cards in November-December and for Father's/Mother's Day.", "ga4": "GA4: Track gift card add_to_cart and purchase events. Compare average gift card value purchased before vs after adjusting denominations. Explorations > Monetization > gift card purchases.", "shopify": "Shopify: Analytics > Gift cards. Compare average gift card denomination sold before vs after. Also check if gift card revenue increases during gifting seasons after restructuring denomination options.", "test_period": "8 weeks", "kpi": "Average gift card denomination / Gift card revenue", "id": "T140"}, {"num": 141, "name": "Sale in Main Navigation", "category": "Navigation & Discovery", "tags": "Navigation, Promo", "difficulty": "Easy", "time": "30 min", "bias": "Loss Aversion", "what": "Add a 'Sale' or 'Deals' link to the main navigation bar styled in red to draw attention", "how": "1. Shopify Admin > Online Store > Navigation > Main menu. 2. Add 'Sale' link pointing to /collections/sale or a tagged collection. 3. Style in red or accent color in theme CSS: nav a[href*='sale'] { color: #e53e3e; font-weight: bold; }. 4. Only show when you have active sale products. 5. Remove or change to 'Coming Soon' when no active sale — don't leave empty collection.", "ga4": "GA4: Track clicks on 'Sale' nav link (custom event 'nav_click' with link text via GTM). Compare CVR of sessions that clicked Sale nav vs those who didn't. Reports > Events.", "shopify": "Shopify: Analytics > Sessions by landing page. Track traffic to /collections/sale and its CVR before vs after making the link prominent in nav. Also compare overall site CVR when Sale link is active vs inactive.", "test_period": "4 weeks", "kpi": "Navigation CTR to sale / Sale collection CVR", "id": "T141"}, {"num": 142, "name": "New Arrivals Navigation", "category": "Navigation & Discovery", "tags": "Navigation, FOMO", "difficulty": "Easy", "time": "30 min", "bias": "FOMO", "what": "Add 'New In' or 'New Arrivals' link to main navigation to surface new products for returning visitors", "how": "1. Create automated collection: products sorted by date added, last 30-60 days. 2. Add to main nav: 'New In.' 3. On mobile: position near the top of the hamburger menu. 4. Add a small 'NEW' badge/dot to the nav link for the first 2 weeks of new products. 5. Returning customers especially respond to this — they've 'seen it all' and want newness.", "ga4": "GA4: Track clicks on 'New In' nav link. Compare CVR and AOV of sessions entering via New Arrivals vs other collections. Reports > Events + Traffic acquisition by landing page.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR on /collections/new-arrivals vs other collection pages. Also check if returning customer purchase rate increases after adding 'New In' to nav.", "test_period": "4 weeks", "kpi": "Returning visitor CVR / New arrivals collection CVR", "id": "T142"}, {"num": 143, "name": "Visual Mega-Menu", "category": "Navigation & Discovery", "tags": "Navigation, Discovery", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Replace text-only dropdown navigation with a visual mega-menu showing product images and categories", "how": "1. Install 'Buddha Mega Menu' (free) or use a theme that supports mega menus. 2. Structure: top row = main categories, below = featured products with images, bottom = promotional banner or bestseller highlight. 3. Limit to 3-4 main columns. 4. Include: product image, name, price. 5. Mobile: convert to accordion, not mega-menu (too complex for small screens).", "ga4": "GA4: Compare pages per session and category page CVR before vs after. Track nav_click events. Also compare sessions that interact with the mega-menu vs standard nav — do they purchase at higher rates? Explorations.", "shopify": "Shopify: Analytics > Online store sessions. Compare pages per session and CVR before vs after enabling mega-menu. Also check if specific category pages get more traffic (better discoverability).", "test_period": "4 weeks", "kpi": "Pages per session / Category page CVR", "id": "T143"}, {"num": 144, "name": "Curated Gift Guide Collections", "category": "Navigation & Discovery", "tags": "Gifting, Discovery", "difficulty": "Medium", "time": "3h", "bias": "Choice Architecture", "what": "Create curated collection pages like 'Gifts Under €50', 'Gifts for Her', 'Last Minute Gifts'", "how": "1. Create collections in Shopify using manual or tag-based rules. 2. Gift guides to create: Gifts Under €25 / €50 / €100, Gifts for Him / Her / Them, Best Sellers (gifted), Last Minute Gifts (instant download or next-day delivery). 3. Add to navigation under 'Gifts' section. 4. Promote in email and social during peak seasons. 5. SEO-optimize collection page with gift guide copy.", "ga4": "GA4: Compare sessions and CVR on gift guide collection pages vs standard collection pages. Reports > Engagement > Pages. Also compare AOV of orders from gift guide entry sessions.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR and AOV from gift guide collection entries vs other collections. Track gift-related search queries in Site Search Analytics.", "test_period": "Seasonal (run 6 weeks before gifting occasions)", "kpi": "Gift guide CVR / AOV from gift-guided sessions", "id": "T144"}, {"num": 145, "name": "Improved 404 Page", "category": "Navigation & Discovery", "tags": "UX, Recovery", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Replace the default 404 page with a helpful page showing search, bestsellers, and navigation options", "how": "1. Edit 404.liquid in Shopify theme code. 2. Add: friendly headline ('Oops — that page has moved'), search bar, bestsellers product grid (link to /collections/all?sort_by=best-selling), links to top categories, link to contact support. 3. On-brand copy and image. 4. Mobile-optimized layout. 5. Add a humorous or brand-consistent message to make it memorable.", "ga4": "GA4: Reports > Engagement > Pages. Filter by page_path = /404. Compare bounce rate from 404 page before vs after. Also track if sessions that land on 404 go on to purchase at higher rate after the redesign.", "shopify": "Shopify: Analytics > Online store sessions by landing page. Filter to /404 URL. Compare bounce rate and session duration before vs after 404 redesign. Check if add-to-cart events follow from 404 entries.", "test_period": "4 weeks", "kpi": "404 page bounce rate / Recovery rate", "id": "T145"}, {"num": 146, "name": "Guided Selling Quiz", "category": "Navigation & Discovery", "tags": "Discovery, Conversion", "difficulty": "Medium", "time": "1 day", "bias": "Choice Architecture", "what": "Add a 'Find your perfect [product]' quiz that recommends specific products based on answers", "how": "1. Install RevenueHunt or Octane AI. 2. Design 3-5 questions: key decision criteria (e.g. skin type, budget, experience level, use case). 3. Map answers to specific product recommendations. 4. End screen: personalized recommendation with 'Add to cart' CTA. 5. Capture email at end: 'Save your results.' 6. Add quiz entry point to: navigation, homepage, and relevant category pages.", "ga4": "GA4: Track 'quiz_start', 'quiz_complete', 'quiz_add_to_cart' custom events. Compare CVR of quiz completers vs non-quiz visitors. Explorations > Funnel: quiz_start → quiz_complete → purchase.", "shopify": "Shopify: Compare CVR of traffic entering via quiz vs direct product pages. Use UTM tags from quiz recommendation emails. Check if quiz-recommended products show increased sales velocity.", "test_period": "6 weeks", "kpi": "Quiz CVR / Recommendation acceptance rate", "id": "T146"}, {"num": 147, "name": "Site Search Synonym Mapping", "category": "Navigation & Discovery", "tags": "Search, Discovery", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Configure your search engine to recognize synonyms, alternate spellings, and common misspellings", "how": "1. In your search app (SearchPie, Boost Commerce, Searchanise): find 'Synonyms' settings. 2. Add synonym groups: sneakers = trainers = runners; moisturizer = moisturiser = face cream; sofa = couch = settee. 3. Add common misspellings: 'jewlery' → jewelry, 'coffie' → coffee. 4. Pull from your site search no-results report to find what shoppers are typing. 5. Review monthly.", "ga4": "GA4: Online Store > Search Analytics (if using Shopify's built-in). Compare 'no results' rate before vs after synonym mapping. Also compare search-to-purchase CVR. Reports > Events > view_search_results.", "shopify": "Shopify: Online Store > Search Analytics. Compare 'no results' search rate before vs after. Target: reduce no-results rate by 50%. Also compare revenue from search-originated sessions before vs after.", "test_period": "4 weeks", "kpi": "Search 'no results' rate / Search CVR", "id": "T147"}, {"num": 148, "name": "Collection Default Sort Optimization", "category": "Navigation & Discovery", "tags": "Category, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Change the default sort order on collection pages from 'Manual' or 'A-Z' to 'Best Selling'", "how": "1. Shopify Admin > Catalog > Collections. 2. For each key collection, set 'Sort by' default to 'Best Selling.' 3. If you want new products visible: use 'Featured' sort and manually curate top spots. 4. Ensure your bestsellers are genuinely your best conversion products — high traffic + high CVR, not just most units sold. 5. Test: does changing sort default improve CVR?", "ga4": "GA4: Compare add_to_cart rate on collection pages before vs after changing default sort. Also compare which products get more add_to_cart events after the change (bestsellers should dominate top positions). Reports > Events.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate on collection pages. Also check if 'hero' products (now top of collections) see increased CVR. Compare overall collection page CVR before vs after.", "test_period": "3 weeks", "kpi": "Collection page CVR / Top-of-page product CTR", "id": "T148"}, {"num": 149, "name": "'Complete the Look' Cross-Sell", "category": "Navigation & Discovery", "tags": "Discovery, AOV", "difficulty": "Medium", "time": "3h", "bias": "Choice Architecture", "what": "Add editorial cross-sell suggestions on PDPs: 'Often worn/used together' with a curated product set", "how": "1. Manually select 2-3 complementary products for each top PDP. 2. Create a section called 'Complete the look' or 'Perfect together.' 3. Show: product image, name, price, and a brief pairing note. 4. Optionally add 'Add all to cart' button at a bundle price. 5. Don't use algorithmic 'customers also viewed' for this — editorial curation converts better for fashion, home, beauty.", "ga4": "GA4: Track 'cross_sell_click' and 'cross_sell_add_to_cart' custom events. Compare AOV of sessions that interact with cross-sell vs those that don't. Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Average order value. Compare before vs after adding editorial cross-sells. Also check if sales of cross-sell products increase when featured alongside hero products.", "test_period": "4 weeks", "kpi": "AOV / Cross-sell click rate", "id": "T149"}, {"num": 150, "name": "Filter by Occasion/Use Case", "category": "Navigation & Discovery", "tags": "Category, Search", "difficulty": "Medium", "time": "3h", "bias": "Choice Architecture", "what": "Add 'occasion' or 'use case' filters to collection pages: 'Gift ideas', 'For beginners', 'For professionals'", "how": "1. In Shopify, add product tags for occasions: 'gift', 'beginner', 'professional', 'travel-size', 'everyday'. 2. In your filter app (SearchPie, Boost), add these as filter options. 3. On collection pages: show filters as: 'Shop by occasion' group. 4. Make filter tags clear and customer-language (not internal jargon). 5. Ensure enough products per filter (min 4) to be useful.", "ga4": "GA4: Track 'filter_applied' events with filter values. Compare CVR of sessions that use occasion filters vs those that don't. Explorations > Segment Overlap. Check if occasion-filtered sessions have higher AOV.", "shopify": "Shopify: Analytics > Product performance. Compare CVR of products when accessed via occasion filter vs direct navigation. Also check if filter usage rate increases after adding occasion options.", "test_period": "4 weeks", "kpi": "Filter usage rate / CVR of filtered sessions", "id": "T150"}, {"num": 151, "name": "'Recently Viewed' on Homepage", "category": "Navigation & Discovery", "tags": "Retention, Discovery", "difficulty": "Easy", "time": "2h", "bias": "Mere Exposure Effect", "what": "Show a personalized 'Continue shopping' or 'Recently viewed' section on the homepage for returning visitors", "how": "1. Many Shopify themes support this natively — check theme editor > Homepage sections for 'Recently Viewed.' 2. If not: install 'Recently Viewed Products' app. 3. Show only when visitor has browsed before (cookie-based). 4. Hide for new visitors (show different section instead). 5. Label: 'Where you left off' or 'Continue exploring.'", "ga4": "GA4: Compare returning visitor CVR before vs after adding recently viewed section. Filter to returning users in Reports > Retention. Also compare pages per session — returning visitors resuming browse.", "shopify": "Shopify: Analytics > Returning customer rate and CVR. Compare returning visitor purchase rate before vs after. Also check if sessions from returning visitors go to fewer pages (they navigate directly from recently viewed).", "test_period": "4 weeks", "kpi": "Returning visitor CVR / Pages per session for returning visitors", "id": "T151"}, {"num": 152, "name": "Improved Internal Search Results Page", "category": "Navigation & Discovery", "tags": "Search, Conversion", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Redesign the search results page to show product images, prices, ratings, and filters clearly", "how": "1. In your search app, customize search results layout. 2. Each result card: product image (consistent ratio), name, price, star rating, 'Add to Cart' button. 3. Add filters on left (desktop) or top (mobile). 4. Show result count: '23 results for running shoes.' 5. Add 'Sort by' options: relevance, price low-high, best selling, newest.", "ga4": "GA4: Compare sessions that view search results vs those that complete a purchase. Track search-to-purchase CVR before vs after redesign. Reports > Events > view_search_results → purchase funnel.", "shopify": "Shopify: Online Store > Search Analytics. Compare search-to-purchase CVR before vs after. Also check average pages after search (should decrease if results are better) and bounce rate from search results page.", "test_period": "4 weeks", "kpi": "Search-to-purchase CVR", "id": "T152"}, {"num": 153, "name": "Landing Pages for Key Search Terms", "category": "Navigation & Discovery", "tags": "SEO, Conversion", "difficulty": "Medium", "time": "3h per page", "bias": "Cognitive Ease", "what": "Create dedicated landing pages targeting high-volume organic search terms with curated product selection and copy", "how": "1. Use Google Search Console to find high-impression, low-CTR search terms. 2. Create Shopify pages or collections targeting these terms: e.g. 'best running shoes for women UK.' 3. Include: SEO-optimized copy, product grid, reviews, FAQ, internal links. 4. Ensure page URL matches the search intent: /collections/best-running-shoes-women. 5. Build 5-10 of these for your highest-volume searches.", "ga4": "GA4: Reports > Acquisition > Organic search. Compare organic traffic and CVR on new landing pages vs old /collections pages for the same search terms. Track over 8-12 weeks for SEO results.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR on new targeted landing pages vs general collection pages. Also use Google Search Console to monitor ranking improvements for targeted terms.", "test_period": "12 weeks", "kpi": "Organic traffic CVR / Organic ranking improvement", "id": "T153"}, {"num": 154, "name": "Wishlist-to-Cart Shortcut", "category": "Navigation & Discovery", "tags": "Retention, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Commitment & Consistency", "what": "Allow customers to add all wishlist items to cart in one click from their wishlist page", "how": "1. In Wishlist Plus or your wishlist app, enable 'Add all to cart' button on the wishlist page. 2. Also add: 'Move to cart' on individual wishlist items. 3. Send wishlist reminder email after 7 days of inactivity: 'Your saved items are waiting — prices may change.' 4. Add 'View your wishlist' button to account page and post-login homepage.", "ga4": "GA4: Track 'wishlist_add_to_cart' and 'wishlist_add_all' custom events. Compare CVR of wishlist users vs non-wishlist users at 30-day mark. Explorations > Funnel: wishlist_view → add_to_cart → purchase.", "shopify": "Shopify: Compare returning customer CVR before vs after enabling wishlist-to-cart shortcut. Wishlist app dashboard shows wishlist → purchase conversion rate. Analytics > Returning customers.", "test_period": "6 weeks", "kpi": "Wishlist-to-purchase CVR", "id": "T154"}, {"num": 155, "name": "Product Availability Filter", "category": "Navigation & Discovery", "tags": "Category, UX", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Add an 'In Stock Only' filter to collection pages so shoppers can hide out-of-stock products", "how": "1. In your filter app (Boost, SearchPie), add 'Availability' filter: 'In stock' / 'Out of stock.' 2. Default: show all products. Let user filter to in-stock. 3. Consider: automatically deprioritize out-of-stock products in collection sort (not hide — just move to bottom). 4. Add 'Back soon' label to OOS products with 'Notify me' button visible.", "ga4": "GA4: Track 'filter_applied' event with filter value = 'in_stock.' Compare add_to_cart rate of sessions that apply in-stock filter vs those that don't. Also compare bounce rate from collection pages.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate from collection pages before vs after adding availability filter. Check if OOS product page bounce rate increases (a problem to solve separately).", "test_period": "4 weeks", "kpi": "Collection page add-to-cart rate / Filter usage", "id": "T155"}, {"num": 156, "name": "Bestsellers Page in Navigation", "category": "Navigation & Discovery", "tags": "Social Proof, Discovery", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Create a dedicated 'Bestsellers' collection page and add it to main navigation", "how": "1. In Shopify, create automated collection: sort by 'Best Selling.' 2. Add to main navigation: 'Bestsellers' or 'Most Popular.' 3. Add editorial intro: 'Our most loved products — chosen by [X] customers.' 4. Include products from all categories — not just one. 5. Update automatically via Shopify's best-selling sort logic.", "ga4": "GA4: Track sessions entering via Bestsellers collection. Compare CVR and AOV vs other collection pages. Reports > Engagement > Pages. Also check if bestsellers nav link is clicked frequently (GTM nav click event).", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR on /collections/bestsellers vs /collections/all and category-specific collections. Check if bestsellers page drives higher AOV orders.", "test_period": "4 weeks", "kpi": "Bestsellers page CVR / Navigation CTR", "id": "T156"}, {"num": 157, "name": "Smart Back-in-Stock Collection", "category": "Navigation & Discovery", "tags": "FOMO, Inventory", "difficulty": "Easy", "time": "1h", "bias": "FOMO", "what": "Create an automated collection showing products that have recently come back in stock", "how": "1. Tag products 'restocked' when they come back into inventory (manually or via Shopify Flow automation). 2. Create automated collection: products tagged 'restocked' in last 30 days. 3. Add to navigation: 'Back in Stock' or 'Just Restocked.' 4. Promote via email to your list when this collection updates. 5. Remove tag after 30 days via Shopify Flow.", "ga4": "GA4: Track sessions landing on 'back in stock' collection. Compare CVR vs other collection pages. Also track add_to_cart rate — customers viewing restocked items have high purchase intent. Reports > Events.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR on restocked collection vs standard collections. Also compare sell-through rate of restocked products with this promotion vs restocks without it.", "test_period": "Per restock cycle", "kpi": "Restocked items sell-through rate / Collection CVR", "id": "T157"}, {"num": 158, "name": "Footer Links Optimization", "category": "Navigation & Discovery", "tags": "Navigation, SEO", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Ensure footer includes links to key categories, popular products, and important info pages", "how": "1. Audit current footer links. 2. Add/organize into 3-4 columns: Shop (top categories), Help (FAQ, returns, contact), About (brand story, sustainability), Popular (bestsellers, new arrivals, sale). 3. Include links to: top 3 categories, bestsellers, FAQs, returns policy, contact page, social media. 4. Add trust signals: payment logos, certification badges. 5. Keep footer clean — don't list every product.", "ga4": "GA4: Track 'footer_link_click' custom event via GTM. Compare pages per session and bounce rate before vs after footer optimization. Reports > Engagement.", "shopify": "Shopify: Analytics > Online store sessions. Compare pages per session and session duration before vs after footer update. Also check if specific pages (FAQ, returns) see increased traffic from footer clicks.", "test_period": "4 weeks", "kpi": "Pages per session / Bounce rate", "id": "T158"}, {"num": 159, "name": "In-Store Search Analytics Review", "category": "Navigation & Discovery", "tags": "Analytics, Discovery", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Analyze your site search queries monthly to find products to stock, content to create, and gaps to fix", "how": "1. Shopify Admin > Online Store > Search Analytics. 2. Find: top searches (are these well-represented?), zero-result searches (product gaps or naming issues), high-search/low-purchase terms (listing or pricing problems). 3. Action each category: zero-results → add synonyms or new products. Low-purchase → improve PDP or pricing. 4. Review monthly. 5. Share insights with buying/merchandising team.", "ga4": "GA4: Reports > Events > view_search_results. Export search terms. Filter by sessions that searched but did NOT purchase — this list reveals biggest opportunity gaps. Also compare search CVR month-over-month.", "shopify": "Shopify: Online Store > Search Analytics. Download full search term report. Sort by: most searched with no results, most searched with low add-to-cart rate. These are your highest-priority improvement areas.", "test_period": "Monthly review", "kpi": "Search CVR / Zero-results rate reduction", "id": "T159"}, {"num": 160, "name": "Related Products Algorithm Optimization", "category": "Navigation & Discovery", "tags": "Discovery, AOV", "difficulty": "Medium", "time": "3h", "bias": "Choice Architecture", "what": "Ensure your 'Related Products' or 'You may also like' widget uses smart rules (not just same-collection products)", "how": "1. In Shopify theme or your app, set related products algorithm to: same tags + same collection (not just same collection). 2. Better: install 'Frequently Bought Together' by Code Black Belt — it uses real purchase history. 3. Rules: show products from complementary categories, not identical alternatives. 4. Exclude out-of-stock products from related suggestions. 5. Show max 4 products to avoid overwhelm.", "ga4": "GA4: Track 'related_product_click' custom event (GTM). Compare AOV of sessions that interact with related products vs those that don't. Also compare CVR — clicking related products shows high engagement. Explorations.", "shopify": "Shopify: Analytics > Average order value. Compare before vs after optimizing the related products algorithm. Check if specific product pairs appear frequently in multi-product orders — these should be in each other's related products.", "test_period": "4 weeks", "kpi": "AOV / Related product CTR", "id": "T160"}, {"num": 161, "name": "Full-Width Mobile CTA", "category": "Mobile Experience", "tags": "Mobile, Conversion", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Make the Add-to-Cart button full-width on mobile product pages for easier tapping", "how": "1. In theme CSS, find .product-form__submit or equivalent button class. 2. Add for mobile: @media (max-width: 768px) { .product-form__submit { width: 100%; } }. 3. Ensure button height: min 52px (comfortable tap target). 4. Keep button text concise: 'Add to Cart' (not 'Add this item to my shopping cart'). 5. Test on real iPhone and Android devices.", "ga4": "GA4: Compare add_to_cart event rate on mobile (filter by device category = mobile) before vs after. Reports > Events > add_to_cart, segmented by device. Explorations > Funnel on mobile only.", "shopify": "Shopify: Analytics > Online store conversion rate, filter by device = Mobile. Compare mobile add-to-cart rate before vs after. Also compare mobile CVR vs desktop CVR ratio — gap should narrow.", "test_period": "3 weeks", "kpi": "Mobile add-to-cart rate", "id": "T161"}, {"num": 162, "name": "Mobile Font Size (16px minimum)", "category": "Mobile Experience", "tags": "Mobile, UX", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Ensure all body text on mobile is at least 16px to prevent iOS auto-zoom and improve readability", "how": "1. Open your theme CSS. 2. Set: body { font-size: 16px; } for mobile breakpoints. 3. Product descriptions: min 16px. Review forms, buttons, labels. 4. iOS Safari zooms in when input field font-size < 16px — this causes UX disruption. 5. Use browser DevTools (mobile emulation) to verify.", "ga4": "GA4: Compare mobile bounce rate and time on page before vs after. Reports > Tech > Device category = mobile. Also compare mobile CVR. Better readability = more time on site = more purchases.", "shopify": "Shopify: Analytics > Online store sessions by device. Compare mobile bounce rate before vs after. Also track if mobile conversion rate improves (readability affects conversion especially for text-heavy PDPs).", "test_period": "3 weeks", "kpi": "Mobile bounce rate / Mobile CVR", "id": "T162"}, {"num": 163, "name": "Mobile Image Swipe Gestures", "category": "Mobile Experience", "tags": "Mobile, PDP", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Enable swipe-left/right to browse product image gallery on mobile with dot indicators", "how": "1. Test current gallery on mobile — swipe to navigate images. 2. If not working, check theme settings for 'Mobile gallery swipe.' 3. Add dot indicators below gallery to show position. 4. Ensure swipe doesn't conflict with page scroll. 5. Add pinch-to-zoom on product images.", "ga4": "GA4: Track 'image_swipe' custom event on mobile via GTM (touchstart/touchend events on gallery). Compare add_to_cart rate on mobile PDPs before vs after enabling swipe. Filter device = mobile.", "shopify": "Shopify: Analytics > Online store conversion rate by device. Compare mobile add-to-cart rate before vs after. Mobile gallery is critical for purchase decision — image browsing precedes ATC.", "test_period": "3 weeks", "kpi": "Mobile add-to-cart rate", "id": "T163"}, {"num": 164, "name": "Mobile Checkout Field Reduction", "category": "Mobile Experience", "tags": "Mobile, Checkout", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Remove or auto-fill unnecessary form fields on mobile checkout to reduce friction", "how": "1. Audit checkout fields: which are truly necessary? Company name, address line 2, phone number (if not needed for delivery) can be optional or hidden. 2. In Shopify, Settings > Checkout > set 'Phone number' to 'Optional.' 3. Remove or collapse 'Company name' field for B2C. 4. Ensure autofill works (see Tactic #24). 5. Test entire mobile checkout flow on real device — time yourself.", "ga4": "GA4: Funnel on mobile: begin_checkout → add_shipping_info → purchase. Compare drop-off at shipping step before vs after reducing fields. Filter by device = mobile. Explorations > Funnel.", "shopify": "Shopify: Analytics > Checkout abandonment on mobile. Compare step completion rate for 'Customer information' step on mobile before vs after reducing fields. Settings > Checkout analytics.", "test_period": "4 weeks", "kpi": "Mobile checkout completion rate", "id": "T164"}, {"num": 165, "name": "Apple Pay / Google Pay Prominence", "category": "Mobile Experience", "tags": "Mobile, Payment", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Make Apple Pay and Google Pay buttons the primary (most prominent) checkout option on mobile", "how": "1. In theme settings, enable 'Dynamic checkout buttons' on product page — this shows Apple Pay / Google Pay / Shop Pay above the standard ATC button on compatible devices. 2. In cart, ensure these express checkout options are prominently displayed. 3. These bypass cart and checkout form entirely — 1 tap from PDP to purchased. 4. Test on iOS (Apple Pay) and Android (Google Pay) devices.", "ga4": "GA4: Compare mobile CVR before vs after enabling express checkout prominence on PDP. Also compare checkout completion rate on mobile. Reports > Monetization > Purchase by device.", "shopify": "Shopify: Analytics > Payment methods report. Compare % of mobile orders using Apple Pay / Google Pay before vs after. Also compare mobile conversion rate overall — express checkout typically lifts mobile CVR 10-20%.", "test_period": "3 weeks", "kpi": "Mobile CVR / Express checkout usage rate", "id": "T165"}, {"num": 166, "name": "Sticky Mobile CTA", "category": "Mobile Experience", "tags": "Mobile, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Keep the Add-to-Cart button visible as a sticky bar at the bottom of the screen when scrolling on mobile PDP", "how": "1. Enable in theme settings if available (many modern themes have sticky ATC). 2. If not: add a position: fixed bottom bar that appears after user scrolls past native ATC button. Show: product name (truncated), price, and ATC button. 3. Ensure it doesn't overlap other content. 4. Hide on desktop. 5. Test with real product on real device.", "ga4": "GA4: Compare mobile add_to_cart rate before vs after. Filter device = mobile. Reports > Events. Also compare mobile PDP bounce rate — sticky ATC reduces the 'I'll come back later' exit.", "shopify": "Shopify: Analytics > Online store conversion rate by device = Mobile. Compare mobile add-to-cart rate before vs after. Compare mobile vs desktop CVR gap — gap should decrease with sticky ATC.", "test_period": "3 weeks", "kpi": "Mobile add-to-cart rate", "id": "T166"}, {"num": 167, "name": "Mobile Filter as Bottom Sheet", "category": "Mobile Experience", "tags": "Mobile, Navigation", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Replace the desktop-style filter sidebar with a slide-up bottom sheet on mobile category pages", "how": "1. On mobile, filters should NOT appear as a side column (too small). 2. Implement as a bottom sheet: tap 'Filter & Sort' button → bottom drawer slides up showing filter options. 3. In your filter app (Boost, SearchPie), enable mobile-specific 'Bottom Sheet' layout. 4. Show applied filters as pill badges on the page. 5. 'Apply' button at bottom of sheet.", "ga4": "GA4: Compare filter usage rate on mobile before vs after (track 'filter_applied' events on mobile). Also compare collection page CVR on mobile. Explorations filtered by device = mobile.", "shopify": "Shopify: Analytics > Online store conversion rate by device = Mobile, on collection pages. Compare mobile collection CVR before vs after. Filter app dashboards show filter usage rates by device.", "test_period": "4 weeks", "kpi": "Mobile collection page CVR / Filter usage on mobile", "id": "T167"}, {"num": 168, "name": "Mobile Homepage Weight Reduction", "category": "Mobile Experience", "tags": "Mobile, Performance", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Remove or lazy-load heavy content sections on mobile homepage to improve load speed and scroll engagement", "how": "1. In theme editor, identify homepage sections: hero banner, featured collections, testimonials, Instagram feed, video. 2. On mobile, hide non-essential sections using CSS: @media (max-width: 768px) { .heavy-section { display: none; } }. 3. Alternatively: lazy-load sections below the fold. 4. Target: mobile homepage load time < 3s. 5. Use Google PageSpeed Insights to identify heaviest elements.", "ga4": "GA4: Compare mobile homepage bounce rate and time to first interaction before vs after. Reports > Tech > device = mobile. Also check Core Web Vitals: LCP and FID on mobile. Reports > Tech > Web vitals.", "shopify": "Shopify: Online Store > Themes > Speed score. Compare before vs after. Also check Analytics > Online store sessions by device — mobile bounce rate and pages per session on homepage entries.", "test_period": "3 weeks", "kpi": "Mobile homepage bounce rate / Mobile load speed", "id": "T168"}, {"num": 169, "name": "Mobile Search Bar Placement", "category": "Mobile Experience", "tags": "Mobile, Search", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Ensure the search bar is immediately accessible on mobile — one tap from anywhere on the site", "how": "1. On mobile, the search icon should be in the main header (not hidden in a hamburger menu). 2. Minimum: a clearly visible search icon (magnifying glass) in the top right of header. 3. Better: an expanded search bar always visible in header on mobile. 4. On tap: full-screen search overlay with keyboard auto-popup and recent searches. 5. Test with one hand on phone — is search reachable with thumb?", "ga4": "GA4: Compare search usage rate on mobile (view_search_results events on mobile) before vs after. Reports > Events filtered by device = mobile. Also compare mobile CVR for sessions that search vs those that don't.", "shopify": "Shopify: Online Store > Search Analytics. Compare number of searches from mobile sessions before vs after making search more accessible. Also compare search-to-purchase CVR on mobile.", "test_period": "3 weeks", "kpi": "Mobile search usage rate / Mobile search CVR", "id": "T169"}, {"num": 170, "name": "Click-to-Call Customer Service", "category": "Mobile Experience", "tags": "Mobile, Trust", "difficulty": "Easy", "time": "30 min", "bias": "Trust / Safety", "what": "Make your customer service phone number a clickable 'tel:' link on mobile so users can call in one tap", "how": "1. In your theme's contact/footer/header area: wrap phone number in <a href='tel:+48XXXXXXXXX'>. 2. On mobile this auto-prompts a call. 3. Also add to checkout page. 4. Consider adding a 'Call us' button to mobile checkout that appears during business hours. 5. Track how often it's used — high call volume on checkout = friction or trust issue.", "ga4": "GA4: Track 'click_to_call' custom event via GTM (click event on tel: links). Compare checkout completion rate before vs after adding click-to-call at checkout. Also monitor call volume as a signal of checkout friction.", "shopify": "Shopify: Compare checkout abandonment rate before vs after. Also track support ticket/call volume — if high, investigate checkout friction points. Shopify Inbox can complement this with live chat.", "test_period": "4 weeks", "kpi": "Checkout completion rate / Customer contact rate", "id": "T170"}, {"num": 171, "name": "Mobile Share Button on PDP", "category": "Mobile Experience", "tags": "Mobile, Viral", "difficulty": "Easy", "time": "30 min", "bias": "Social Proof", "what": "Add a native mobile share button on product pages so users can share to WhatsApp, Instagram, etc.", "how": "1. Add Web Share API button to PDP: navigator.share({ title: productName, url: window.location.href }). 2. This uses the device's native share sheet (WhatsApp, Messages, Instagram, email, etc.). 3. Only shows on supported mobile browsers (Chrome, Safari on iOS/Android). 4. Style as a simple share icon near product title or below ATC button.", "ga4": "GA4: Track 'product_share' custom event via GTM when share button is tapped. Compare if sessions from shared URLs have higher CVR (they're referred by trusted contacts). Also compare organic referral traffic before vs after.", "shopify": "Shopify: Analytics > Traffic sources. Track sessions coming from mobile referral URLs (shared product links). Compare CVR of referred-via-share sessions vs direct/organic. Measure share event frequency.", "test_period": "4 weeks", "kpi": "Share usage rate / CVR of shared-link sessions", "id": "T171"}, {"num": 172, "name": "Mobile Popup Size Optimization", "category": "Mobile Experience", "tags": "Mobile, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Ensure popups (newsletter, discount, exit intent) take up no more than 70% of screen height on mobile", "how": "1. In your popup tool (OptiMonk, Privy, Klaviyo forms), find mobile-specific style settings. 2. Set popup to max 70% screen height. 3. Ensure close button (X) is large (min 40px) and clearly visible — if users can't close popup, they leave. 4. Trigger delay: min 5 seconds after page load (not immediately). 5. Test on small phones (320px width). Google penalizes intrusive interstitials on mobile.", "ga4": "GA4: Compare mobile bounce rate before vs after fixing popup size. Reports > Tech > device = mobile. Also compare email capture rate — smaller, less intrusive popups can actually convert better than full-screen.", "shopify": "Shopify: Analytics > Online store sessions by device. Compare mobile bounce rate and CVR before vs after. Also compare email sign-up rate in your ESP — intrusive popups often have higher sign-up but worse subsequent engagement.", "test_period": "4 weeks", "kpi": "Mobile bounce rate / Email capture rate on mobile", "id": "T172"}, {"num": 173, "name": "Touch Target Size Audit", "category": "Mobile Experience", "tags": "Mobile, UX", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Ensure all interactive elements on mobile are at least 44x44px (Apple's HIG minimum)", "how": "1. Open site on mobile, inspect with browser DevTools (device emulation). 2. Check all buttons, links, form fields, and icons. 3. Minimum size: 44x44px (Apple) / 48x48dp (Google). 4. Most common issues: nav links too small, size swatches too small, close buttons too small, filter tags too small. 5. Increase size via CSS padding (not just width/height of the element itself).", "ga4": "GA4: Compare mobile bounce rate and add_to_cart rate before vs after fixing touch targets. Reports > Tech > device = mobile. Difficult to isolate single cause — track as part of mobile UX improvement sprint.", "shopify": "Shopify: Analytics > Online store conversion rate by device = Mobile. Compare mobile CVR before vs after mobile UX audit. Also monitor Shopify's theme quality score if available.", "test_period": "3 weeks", "kpi": "Mobile bounce rate / Mobile CVR", "id": "T173"}, {"num": 174, "name": "Mobile Video Autoplay (Muted)", "category": "Mobile Experience", "tags": "Mobile, PDP", "difficulty": "Medium", "time": "2h", "bias": "Endowment Effect", "what": "Add a short muted autoplay video as the first element of the product image gallery on mobile", "how": "1. Record a 10-15 second product video (hands using the product, product in context, 360 view). 2. Upload as MP4 to Shopify product media. 3. Set as first item in gallery. 4. Ensure: muted (required for autoplay), loop, plays inline (not fullscreen). 5. Max file size: 10MB for mobile load performance. 6. Test on both iOS and Android.", "ga4": "GA4: Track 'video_play' custom event on mobile. Compare add_to_cart rate on mobile PDPs with autoplay video vs those without. Filter device = mobile. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare mobile add-to-cart rate on products with video vs similar products without, filtering by device type if your analytics integration supports it.", "test_period": "4 weeks", "kpi": "Mobile add-to-cart rate on video PDPs", "id": "T174"}, {"num": 175, "name": "Mobile Tab Bar Navigation", "category": "Mobile Experience", "tags": "Mobile, Navigation", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Test a bottom navigation tab bar on mobile (like an app) vs the standard hamburger menu", "how": "1. Implement a fixed bottom navigation bar with 4-5 key destinations: Home, Categories, Search, Cart, Account. 2. Use sticky CSS: position: fixed; bottom: 0; width: 100%. 3. Ensure it doesn't overlap the sticky ATC button on PDPs. 4. Test: tabs vs hamburger for 3 weeks each. 5. Check if pages per session and CVR improve — bottom tabs are easier to reach.", "ga4": "GA4: Compare mobile pages per session, bounce rate, and CVR for each navigation style period. Reports > Tech > device = mobile. Use date comparison. Also compare which nav destinations are clicked more.", "shopify": "Shopify: Analytics > Online store sessions by device. Compare mobile metrics (session duration, pages/session, CVR) for each 3-week test period. Control for seasonal differences.", "test_period": "6 weeks (3+3)", "kpi": "Mobile pages per session / Mobile CVR", "id": "T175"}, {"num": 176, "name": "Mobile Product Grid Column Test", "category": "Mobile Experience", "tags": "Mobile, Category", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Test 1-column vs 2-column product grid on mobile category pages", "how": "1. In theme settings, find mobile grid column option. 2. Test 1-column (larger images, less choice at once) vs 2-column (more products visible, smaller images). 3. Rule of thumb: 1-column for high-consideration/fashion items (image quality matters), 2-column for commodity/search items (quantity of choice matters). 4. Run each for 3 weeks.", "ga4": "GA4: Compare add_to_cart rate from collection pages on mobile for each test period. Filter device = mobile. Also compare scroll depth — 1-column may show more scroll, 2-column may show more variety.", "shopify": "Shopify: Analytics > Online store conversion rate, filter device = Mobile. Compare collection page CVR for each 3-week period. Also check if AOV differs between grid configurations.", "test_period": "6 weeks (3+3)", "kpi": "Mobile collection page CVR / Add-to-cart rate", "id": "T176"}, {"num": 177, "name": "Mobile Core Web Vitals Fix", "category": "Mobile Experience", "tags": "Mobile, Performance", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Fix the 3 Core Web Vitals (LCP, CLS, INP) on mobile to improve speed and search ranking", "how": "1. Open Google Search Console > Core Web Vitals report. Identify failing pages. 2. LCP fix: ensure hero image is preloaded (<link rel='preload'>), compressed, and served in WebP format. 3. CLS fix: set explicit width/height on all images and embeds to prevent layout shifts. 4. INP fix: reduce JavaScript execution time on mobile (defer non-critical JS). 5. Recheck in PageSpeed Insights after each fix.", "ga4": "GA4: Reports > Tech > Web vitals. Compare LCP, CLS, and INP scores on mobile before vs after. Also compare mobile bounce rate and session duration — faster pages = more engagement.", "shopify": "Shopify: Online Store > Themes > Speed score. Compare before vs after optimization. Use Google Search Console for ongoing CWV tracking. Monitor if organic mobile traffic increases over 12 weeks (SEO benefit of passing CWV).", "test_period": "8 weeks", "kpi": "Core Web Vitals scores / Mobile bounce rate", "id": "T177"}, {"num": 178, "name": "Mobile Wishlist Quick-Access", "category": "Mobile Experience", "tags": "Mobile, Retention", "difficulty": "Easy", "time": "1h", "bias": "Commitment & Consistency", "what": "Add a visible wishlist icon in the mobile header so users can access saved items easily", "how": "1. In mobile header, add heart icon (wishlist) alongside cart icon. 2. Show item count badge (like cart). 3. Tap → goes to wishlist page. 4. Ensure wishlist is populated from previous sessions (localStorage or account-based for logged-in users). 5. On the wishlist page: show product images, price, 'Move to cart' and 'Remove' buttons.", "ga4": "GA4: Track 'wishlist_icon_click' in header on mobile. Compare returning visitor CVR before vs after making wishlist more accessible. Also track wishlist-to-cart conversion rate. Explorations.", "shopify": "Shopify: Analytics > Returning customer rate. Compare returning visitor purchase frequency before vs after. Wishlist app dashboard shows wishlist → purchase conversions — compare on mobile specifically.", "test_period": "6 weeks", "kpi": "Mobile returning visitor CVR / Wishlist-to-cart rate", "id": "T178"}, {"num": 179, "name": "Mobile Orientation Lock Content", "category": "Mobile Experience", "tags": "Mobile, UX", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Ensure all content displays correctly in both portrait and landscape orientations on mobile", "how": "1. Open site on mobile, rotate to landscape. Check: product images (should resize correctly), navigation (should remain functional), checkout form (should not overflow), popups (should not obscure content). 2. Fix layout issues with CSS media queries targeting orientation: @media (orientation: landscape) {}. 3. Most critical: checkout and cart in landscape mode.", "ga4": "GA4: Reports > Tech > device = mobile. Indirectly: compare mobile checkout completion rate and bounce rate before vs after orientation fixes. Mobile users sometimes rotate to see product images better.", "shopify": "Shopify: Compare mobile checkout completion rate before vs after. Orientation issues are hard to isolate — track as part of mobile UX sprint with other improvements and compare overall mobile CVR.", "test_period": "3 weeks", "kpi": "Mobile checkout completion rate", "id": "T179"}, {"num": 180, "name": "Mobile Tap-to-Zoom on Images", "category": "Mobile Experience", "tags": "Mobile, PDP", "difficulty": "Easy", "time": "30 min", "bias": "Endowment Effect", "what": "Enable double-tap or pinch-to-zoom on product images on mobile", "how": "1. Most modern Shopify themes support pinch-to-zoom on mobile product images. Test this on a real device. 2. If not working: check theme settings or add touch-pinch zoom JS library (Hammer.js). 3. Add double-tap zoom as alternative. 4. Show hint text below images: 'Pinch to zoom.' 5. Ensure zoomed image quality is sufficient (upload min 2000px width images).", "ga4": "GA4: Track 'image_zoom' custom event on mobile (touch event). Compare add_to_cart rate on mobile PDPs before vs after enabling zoom. Filter device = mobile. Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Online store conversion rate by device = Mobile. Compare mobile add-to-cart rate on PDPs before vs after enabling touch zoom. Product performance report filtered by mobile traffic.", "test_period": "3 weeks", "kpi": "Mobile add-to-cart rate", "id": "T180"}, {"num": 181, "name": "Lifestyle Images on PDP", "category": "Visual & Design", "tags": "PDP, Content", "difficulty": "Medium", "time": "3h", "bias": "Endowment Effect", "what": "Add at least one lifestyle/in-context photo to every product page alongside the standard product-only shots", "how": "1. Source or shoot: product in natural use context, with a person, in a real environment. Smartphone photos work if well-lit. 2. Place as 2nd or 3rd image in gallery (product-only shot first). 3. Lifestyle image should show the product in the context your customer aspires to. 4. Match your brand aesthetic — casual lifestyle for casual brand, aspirational for premium. 5. Start with top 10 PDPs.", "ga4": "GA4: Compare add_to_cart rate on PDPs with lifestyle images vs product-only PDPs. Explorations > Segment Overlap. Also compare time on page — lifestyle images increase visual engagement.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate on products with lifestyle images vs control products without. Also compare return rate — realistic lifestyle images reduce 'not as expected' returns.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T181"}, {"num": 182, "name": "Consistent Image Aspect Ratios", "category": "Visual & Design", "tags": "Category, UX", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Set a uniform aspect ratio for all product images across category pages for a clean, professional grid", "how": "1. In theme settings, find 'Image aspect ratio' — set to consistent ratio (e.g. 1:1 square or 4:5 portrait for fashion). 2. All product images should follow this ratio. 3. For non-conforming images: Shopify will crop/letterbox. 4. Gradually update product images to match the chosen ratio. 5. Consistency signals professionalism and builds trust.", "ga4": "GA4: Compare category page time on page and add_to_cart rate before vs after enforcing consistent ratios. A cleaner grid reduces cognitive load. Reports > Engagement > Pages.", "shopify": "Shopify: Analytics > Product performance. Compare collection page add-to-cart rate before vs after. Also check if bounce rate on collection pages decreases — visual consistency signals quality.", "test_period": "3 weeks", "kpi": "Collection page CVR / Bounce rate", "id": "T182"}, {"num": 183, "name": "Color Swatch on Collection Page", "category": "Visual & Design", "tags": "Category, Discovery", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Show available color variants as clickable swatches on collection/category page product cards", "how": "1. Enable in theme settings: 'Show color swatches on collection pages' if available. 2. If not: install 'Variant Swatch King' app. 3. Show max 4 swatches per card — '+3 more' for additional. 4. Clicking a swatch should: change the product card image to that color variant AND update the PDP link to that variant. 5. Ensure swatches are accurate colors.", "ga4": "GA4: Compare add_to_cart rate from collection pages before vs after. Also track 'swatch_click' custom event. Explorations: sessions that interact with swatches vs those that don't — compare CVR.", "shopify": "Shopify: Product performance report. Compare collection page add-to-cart rate before vs after enabling swatches. Also check if PDPs have more variant-specific traffic (users arriving at already-chosen color = higher intent).", "test_period": "4 weeks", "kpi": "Collection page add-to-cart rate / PDP variant landing rate", "id": "T183"}, {"num": 184, "name": "Product in Scale Photo", "category": "Visual & Design", "tags": "PDP, Trust", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Add at least one photo showing the product next to a recognizable object or person to communicate scale", "how": "1. Photograph the product next to common objects (hand, coin, A4 paper) or on a person. 2. Caption the image: 'Model is 175cm wearing size M.' 3. For home goods: show in a real room setting with furniture for scale. 4. This reduces returns from 'it was bigger/smaller than expected.' 5. Start with products where size confusion drives returns.", "ga4": "GA4: Compare return rate on products with scale photos vs without. Also compare add_to_cart rate — accurate expectations drive more confident purchase decisions. Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Returns by product. Compare return rate for products with scale photos vs those without. Also compare add-to-cart rate in Product performance report. Size-related returns should decrease.", "test_period": "6 weeks", "kpi": "Return rate / Add-to-cart rate", "id": "T184"}, {"num": 185, "name": "CTA Button Color Test", "category": "Visual & Design", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Test a high-contrast CTA button color against your current button to find the highest-converting option", "how": "1. Identify your current ATC button color. 2. Test alternatives: if current is white/light → test dark navy or deep green. If current is green → test deep orange or high-contrast black. 3. Key rule: CTA must contrast strongly with its background (WCAG AA: 4.5:1 ratio minimum). 4. Run each color for 2 weeks. 5. Never test orange vs orange — make it meaningfully different.", "ga4": "GA4: Compare add_to_cart event rate for each color period. Use date comparison in Reports > Events > add_to_cart rate. Tag color periods in GA4 annotations (Admin > Annotations).", "shopify": "Shopify: Product performance report. Compare add-to-cart rate during each 2-week test period. Control for traffic volume differences. Also compare checkout initiation rate — button click to checkout.", "test_period": "4 weeks (2+2)", "kpi": "Add-to-cart rate", "id": "T185"}, {"num": 186, "name": "Animated ATC Confirmation", "category": "Visual & Design", "tags": "Cart, UX", "difficulty": "Easy", "time": "2h", "bias": "Commitment & Consistency", "what": "Show a brief animation when item is added to cart: product flies to cart icon, cart shakes, or a green check appears", "how": "1. In theme settings, check for 'Cart notification animation' — enable if available. 2. If not: add a CSS animation that triggers on ATC click: cart icon bounces, or a 'Added to cart ✓' toast appears for 2 seconds. 3. Cart icon badge count should update immediately. 4. The animation closes a micro-uncertainty loop: 'Did that work?' 5. Keep animation under 500ms — longer = annoying.", "ga4": "GA4: Compare cart-to-checkout rate (begin_checkout / view_cart) before vs after adding confirmation animation. The animation reduces 'did it work' repeat clicks and anxiety. Reports > Events ratio.", "shopify": "Shopify: Analytics > Abandoned checkouts. Compare cart abandonment rate before vs after. Also check if 'view cart' events increase or decrease — a clear confirmation may mean fewer users clicking to verify cart contents.", "test_period": "3 weeks", "kpi": "Cart-to-checkout rate", "id": "T186"}, {"num": 187, "name": "Directional Cues Toward CTA", "category": "Visual & Design", "tags": "PDP, Conversion", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Add subtle visual elements (arrows, eye direction in photos, line flow) that guide attention toward the ATC button", "how": "1. In hero banners and PDP hero images: choose images where person's gaze or body points toward CTA. 2. Add a subtle arrow or visual indicator above/pointing to ATC button. 3. Use white space strategically: ensure there's clear space surrounding the CTA button. 4. Check that no competing visual elements appear at the same visual weight as the CTA. 5. This is subtle — avoid obvious corny arrows.", "ga4": "GA4: Compare add_to_cart rate before vs after visual redesign. Also compare heatmap data (Hotjar free tier) — does the click concentration shift toward ATC? Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate on redesigned PDPs vs control PDPs. Also check if checkout initiation rate improves — higher add_to_cart should flow through to more purchases.", "test_period": "4 weeks", "kpi": "Add-to-cart rate", "id": "T187"}, {"num": 188, "name": "Skeleton Loading Screens", "category": "Visual & Design", "tags": "Performance, UX", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Replace blank white loading states with skeleton placeholder animations to improve perceived load speed", "how": "1. Identify pages where content takes > 500ms to load: search results, collection pages, cart. 2. Add CSS skeleton loaders: gray placeholder blocks in the shape of the content (product card outline, image box, text lines). 3. These animate with a shimmer effect. 4. Skeleton screens feel faster than spinners even when actual load time is identical. 5. Most Shopify themes handle this — check if enabled.", "ga4": "GA4: Compare bounce rate on high-load pages (search results, collection) before vs after. Reports > Tech > device = mobile (biggest impact). Also compare session duration — perceived speed improvement keeps users on site.", "shopify": "Shopify: Analytics > Online store sessions. Compare bounce rate on collection pages and search results before vs after. Also check Shopify speed score and Google PageSpeed Insights perceived performance score.", "test_period": "3 weeks", "kpi": "Bounce rate on collection/search pages", "id": "T188"}, {"num": 189, "name": "Seasonal Design Elements", "category": "Visual & Design", "tags": "Conversion, Branding", "difficulty": "Easy", "time": "3h", "bias": "Framing Effect", "what": "Add subtle seasonal or campaign-specific design touches (colors, imagery, icons) to reinforce promotional context", "how": "1. For peak seasons (Christmas, Summer, Valentine's): update homepage hero, email headers, and product badges. 2. Keep brand identity — seasonal = accent, not rebrand. 3. Subtle works: a snowflake icon on a winter sale badge, warm tones in a summer campaign banner. 4. Update across touchpoints consistently: site, email, social. 5. Prepare 2 weeks in advance.", "ga4": "GA4: Compare CVR during seasonally-designed campaign periods vs equivalent periods without. Reports > Monetization. Compare email CVR from campaigns with seasonal design vs standard template emails.", "shopify": "Shopify: Analytics > Sales during campaign periods with seasonal design vs comparable periods without. Also compare email campaign click rates (with vs without seasonal design) in your ESP.", "test_period": "Per campaign", "kpi": "Campaign CVR / Email CTR with seasonal design", "id": "T189"}, {"num": 190, "name": "Homepage Hero Benefit Headline", "category": "Visual & Design", "tags": "Homepage, Conversion", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Replace the homepage hero image headline from brand name or product category to a customer benefit statement", "how": "1. Current hero often says: 'Summer Collection 2025' or just the brand logo. 2. Rewrite as a customer benefit: 'Gear That Goes Everywhere — Equipment for the Modern Explorer.' 3. Keep to 5-8 words maximum on mobile. 4. Sub-headline: 1 sentence expanding the benefit. 5. CTA button: specific ('Shop Running Gear') not generic ('Shop Now').", "ga4": "GA4: Compare homepage CVR (sessions → add_to_cart or begin_checkout events from homepage entry sessions) before vs after. Reports > Engagement > Pages > / homepage. Also compare bounce rate.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare CVR for homepage-entry sessions before vs after updating hero. New visitor CVR should be most affected (existing customers know the brand).", "test_period": "3 weeks", "kpi": "Homepage CVR / Bounce rate", "id": "T190"}, {"num": 191, "name": "Product Badge System", "category": "Visual & Design", "tags": "Category, PDP", "difficulty": "Easy", "time": "3h", "bias": "Visual Salience", "what": "Create a consistent badge system (New, Bestseller, Sale, Low Stock, Staff Pick) applied uniformly across cards", "how": "1. Design 4-6 badge variants in consistent style: same font, shape, positioned identically (top-left of card). 2. Priority order (if multiple apply): Sale > Low Stock > New > Bestseller > Staff Pick. 3. Implement via product tags in Shopify liquid. 4. Ensure badges are legible on both light and dark product images. 5. Use sparingly — if 80% of products have badges, they lose meaning.", "ga4": "GA4: Compare collection page CTR (selec
