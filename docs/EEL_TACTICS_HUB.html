. Use checkmarks and X — your product should win on value criteria. 3. Be honest — if competitor wins on something, omit that row rather than lie. 4. Place mid-page on high-consideration PDPs. 5. Avoid naming specific competitors — compare to 'standard market option' instead.", "ga4": "GA4: Track scroll to comparison table. Compare add_to_cart rate for sessions that reached comparison table vs those that bounced before. Explorations > Funnel: page_view → scroll_50% → add_to_cart.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR on PDPs with comparison table vs similar products without, over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on high-consideration PDPs", "id": "T052"}, {"num": 53, "name": "Delivery Reassurance Copy", "category": "Content + Copy", "tags": "PDP, Trust", "difficulty": "Easy", "time": "30 min", "bias": "Trust / Safety", "what": "Add clear delivery and returns information directly on the PDP, near the ATC button", "how": "1. Add a small info strip below the ATC button with icons: Truck icon: 'Free delivery over €50 | Estimated 2-3 days.' Return icon: '30-day free returns — no questions asked.' Lock icon: 'Secure checkout.' 2. Keep each point to one line. 3. This info should be specific — 'Free delivery over €50' beats 'Free delivery available'. 4. Update if delivery times or policies change.", "ga4": "GA4: Compare add_to_cart rate on PDPs with delivery info strip vs without. Also compare cart abandonment — knowing returns policy reduces anxiety. Explorations > Funnel: add_to_cart → begin_checkout.", "shopify": "Shopify: Compare add-to-cart rate and cart abandonment rate before vs after. Analytics > Reports > Abandoned checkouts. Also check if 'what is your return policy' support tickets decrease.", "test_period": "3 weeks", "kpi": "Add-to-cart rate / Cart abandonment rate", "id": "T053"}, {"num": 54, "name": "Occasion-Based Copy", "category": "Content + Copy", "tags": "PDP, Gifting", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Add 'Perfect for' occasion tags to PDPs to help gift buyers and occasion-driven shoppers", "how": "1. Add a small tag/badge section on PDP: 'Perfect for: Birthdays / Housewarming / Self-treat / New parent.' 2. Make tags clickable — link to a curated gift guide or collection for that occasion. 3. Best for products that are commonly gifted. 4. Update for seasonal occasions: 'Perfect for: Valentine's Day / Mother's Day.' 5. Include in email campaigns and paid ads.", "ga4": "GA4: Track clicks on occasion tags (custom event 'occasion_tag_click' via GTM). Compare AOV for sessions that interact with occasion tags vs those that don't. Also check if multi-item orders increase.", "shopify": "Shopify: Compare AOV before vs after adding occasion tags, specifically during gifting seasons. Analytics > Reports > Average order value. Also track if gift wrapping option uptake increases (if available).", "test_period": "4 weeks", "kpi": "AOV / Gift-related purchases", "id": "T054"}, {"num": 55, "name": "Use Case Copy Block", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Add a 'When to use / Ideal for' section showing specific scenarios where the product shines", "how": "1. Write 3-5 specific use case scenarios as a short bulleted list. Make them vivid: 'After a 10k run when your muscles are burning', not 'For athletic recovery'. 2. Use real customer scenarios pulled from reviews. 3. Place below main description or in first accordion section. 4. Best for: versatile products, products with non-obvious use cases, seasonal products.", "ga4": "GA4: Track scroll depth to use case section. Compare add_to_cart rate on PDPs with use case block vs without. Use date comparison or test on a subset of products.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and return rate on products with use case copy vs similar products without. Track over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T055"}, {"num": 56, "name": "% Off vs Fixed Amount Test", "category": "Promo Mechanics", "tags": "Pricing, Framing", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Test whether '20% off' or '€10 off' drives higher conversion for the same discount value", "how": "1. Pick one product or category. 2. Run promotion A: '20% off' for 2 weeks. 3. Run promotion B: '€10 off' (same value) for next 2 weeks. 4. Keep all else equal (same placement, same channels). 5. Rule of thumb: % feels bigger on high-price items; fixed feels bigger on low-price items (Weber's Law — use % when it's > €10 equivalent).", "ga4": "GA4: Compare add_to_cart and purchase rates for each promotion period. Use date range comparison in Reports > Events. Tag each promo period in GA4 annotations (Admin > Annotations).", "shopify": "Shopify: Analytics > Reports > Sales by discount. Compare units sold and revenue for each promo period. Note: control for day-of-week and traffic differences between periods.", "test_period": "4 weeks (2+2)", "kpi": "Conversion rate / Promo redemption rate", "id": "T056"}, {"num": 57, "name": "Free Shipping Threshold Display", "category": "Promo Mechanics", "tags": "Cart, Motivation", "difficulty": "Easy", "time": "2h", "bias": "Goal Gradient Effect", "what": "Show a dynamic progress bar in the cart indicating how much more to spend for free shipping", "how": "1. Install 'Free Shipping Bar' app (free — by Hextom, 100k+ installs). 2. Set your free shipping threshold (e.g. €50). 3. Show in: mini-cart drawer, cart page, and optionally a site-wide top bar. 4. Copy: 'Add €12 more for free shipping!' 5. When threshold is reached: 'You've unlocked free shipping! 🎉' — celebration moment matters.", "ga4": "GA4: Compare AOV before vs after installing the bar. Reports > Monetization > Purchase revenue, track average_purchase_revenue. Also check if multi-item orders increase.", "shopify": "Shopify: Analytics > Reports > Average order value. Compare AOV in 3 weeks before vs 3 weeks after. Also check if orders above the threshold increase as a % of total orders.", "test_period": "3 weeks", "kpi": "Average Order Value (AOV)", "id": "T057"}, {"num": 58, "name": "Bundle Discount (Buy 2 Save 15%)", "category": "Promo Mechanics", "tags": "AOV, Bundling", "difficulty": "Medium", "time": "3h", "bias": "Anchoring", "what": "Create a tiered bundle offer where buying multiple units or complementary products saves a percentage", "how": "1. In Shopify, install 'Bundle Bear' or 'Frequently Bought Together' (both have free tiers). 2. Set up: Buy 1 = full price, Buy 2 = 10% off, Buy 3 = 15% off. Or: Product A + Product B bundle = 15% off both. 3. Display on PDP with bundle selector showing savings. 4. Ensure savings amount is shown in £/€ not just %. 5. Start with your top 3 bestsellers.", "ga4": "GA4: Compare AOV and items_per_purchase before vs after. Reports > Monetization > Ecommerce purchases. Also track add_to_cart events for bundle items vs individual.", "shopify": "Shopify: Analytics > Reports > Average order value and Sales by product. Check if multi-unit orders increase. Compare orders with 2+ of the same item or bundled SKUs before vs after.", "test_period": "4 weeks", "kpi": "AOV / Items per order", "id": "T058"}, {"num": 59, "name": "BOGO Limited Time", "category": "Promo Mechanics", "tags": "Conversion, Urgency", "difficulty": "Medium", "time": "2h", "bias": "Loss Aversion", "what": "Run a 'Buy One Get One free or 50% off' offer for 48-72 hours with a visible timer", "how": "1. Set up automatic discount in Shopify Admin > Discounts > Create discount > Buy X Get Y. 2. Add countdown timer to homepage banner and PDP using 'Countdown Timer Bar' app. 3. Email and SMS your list 24h before + at launch. 4. Set strict end time — BOGO with no end date trains customers to wait. 5. Run on excess stock or high-margin products.", "ga4": "GA4: Compare conversion rate and AOV during BOGO period vs same days previous week/month. Tag period in GA4 annotations. Track purchase events in Reports > Monetization.", "shopify": "Shopify: Analytics > Reports > Sales by discount code and Sales over time. Compare units sold and revenue during BOGO vs control period. Also check if new customer acquisition increases.", "test_period": "72h promotion", "kpi": "Conversion rate during promo / Units sold", "id": "T059"}, {"num": 60, "name": "Flash Sale with Countdown Timer", "category": "Promo Mechanics", "tags": "Conversion, Urgency", "difficulty": "Easy", "time": "2h", "bias": "Scarcity / Urgency", "what": "Run a short-window (4-8 hour) sale with a prominent countdown timer driving urgency", "how": "1. Install 'Countdown Timer Bar' or 'Sales Countdown Timer' (free). 2. Set timer to expire same day (4-8 hours). 3. Place timer on: homepage hero, product page near ATC, email header, top site bar. 4. Limit to 5-10 SKUs max — specificity beats sitewide. 5. Push via email and SMS at launch and 1h before expiry.", "ga4": "GA4: Compare hourly conversion rate on flash sale days vs normal days. Reports > Monetization, filter by date and hour. Also track add_to_cart velocity in real time via Realtime report.", "shopify": "Shopify: Analytics > Reports > Sales by hour on flash sale day vs previous non-sale same day. Compare conversion rate (sessions to orders) during the flash window.", "test_period": "Per activation", "kpi": "Conversion rate during flash window", "id": "T060"}, {"num": 61, "name": "Spend-and-Get Gift Tiers", "category": "Promo Mechanics", "tags": "AOV, Gifting", "difficulty": "Medium", "time": "3h", "bias": "Goal Gradient Effect", "what": "Offer tiered free gifts based on spend thresholds to increase basket size", "how": "1. Set up: Spend €50 = free product A, spend €100 = free product B (better), spend €150 = free product C (best). 2. Use 'Gift Box' or 'BOGOS' app for automatic gift-with-purchase in Shopify. 3. Show clearly in cart: 'You're €15 away from [Gift B]!' 4. Choose gifts with high perceived value but low cost. 5. Promote gift tiers in email, on homepage, and in cart.", "ga4": "GA4: Compare AOV and purchase rate before vs after implementing tiers. Also compare average items per order. Reports > Monetization > Ecommerce purchases > average_purchase_revenue.", "shopify": "Shopify: Analytics > Average order value. Compare before/during/after the tiered gift promotion. Check which tier (€50/€100/€150) most orders reach — optimize thresholds accordingly.", "test_period": "Campaign period", "kpi": "AOV / Tier achievement rate", "id": "T061"}, {"num": 62, "name": "Mystery Discount Reveal", "category": "Promo Mechanics", "tags": "Email capture, Gamification", "difficulty": "Medium", "time": "3h", "bias": "Curiosity Gap", "what": "Show a 'Scratch to reveal your discount' or 'Spin to win' popup that captures email before revealing the offer", "how": "1. Install 'OptiMonk' or 'WooHoo Spin to Win' (free tier). 2. Set up gamified popup: spin wheel shows possible discounts (5%, 10%, 15%, Free Shipping). 3. Weight probabilities toward smaller rewards. 4. Require email before spin result shown. 5. Deliver winning coupon via on-screen message + email. 6. Set cookie — show max once per visitor.", "ga4": "GA4: Track custom events: 'mystery_popup_shown', 'mystery_email_submitted', 'mystery_discount_used'. Compare email capture rate (popup → email submit) vs standard discount popup. Explorations.", "shopify": "Shopify: Compare email sign-up rate and discount redemption rate vs previous list-building tactics. Marketing > Automations or your ESP. Also check if mystery discount buyers have higher LTV than standard discount buyers.", "test_period": "4 weeks", "kpi": "Email capture rate / Discount redemption rate", "id": "T062"}, {"num": 63, "name": "Early Access for Subscribers", "category": "Promo Mechanics", "tags": "Loyalty, Email", "difficulty": "Medium", "time": "3h", "bias": "Status / Exclusivity", "what": "Give email subscribers 24-48 hour early access to sales, new products, or limited drops", "how": "1. Segment your email list (all subscribers) in Klaviyo/Mailchimp/Shopify Email. 2. Create a discount code or password-protected page for early access. 3. Email subject: 'You're in early. Sale opens for everyone in 48 hours.' 4. Make early access offer identical to public — the exclusivity is the access, not a deeper discount. 5. Promote 'Subscribe for early access' on site year-round.", "ga4": "GA4: Compare conversion rate and AOV from email traffic during early access window vs general traffic. Use UTM parameters on early access emails (utm_campaign=early_access). Reports > Traffic acquisition.", "shopify": "Shopify: Analytics > Reports > Sales by traffic source. Compare email channel CVR during early access vs regular email campaigns. Also track if email subscriber growth increases after promoting the benefit.", "test_period": "Per activation", "kpi": "Email CVR during early access / Subscriber growth rate", "id": "T063"}, {"num": 64, "name": "Refer-a-Friend Double Reward", "category": "Promo Mechanics", "tags": "Acquisition, Loyalty", "difficulty": "Medium", "time": "1 day", "bias": "Reciprocity", "what": "Set up a referral program where both referrer and new customer get a reward", "how": "1. Install 'Referral Candy' or 'Smile.io' (free tiers). 2. Set reward: referrer gets €10 store credit when friend makes first purchase; friend gets 10% off first order. 3. Build a referral landing page and dashboard for customers to track rewards. 4. Promote in post-purchase email: 'Share with a friend and earn €10.' 5. Send reminder 30 days after purchase.", "ga4": "GA4: Track referral traffic source (utm_source=referral in referral links). Compare CVR and AOV for referred customers vs organic. Reports > Traffic acquisition > Source/Medium.", "shopify": "Shopify: Analytics > Reports > First-time customers. Track % of new customers coming from referral program. App dashboard (ReferralCandy/Smile) shows referral count and revenue. Compare CAC vs other channels.", "test_period": "3 months", "kpi": "Referral conversion rate / CAC from referral", "id": "T064"}, {"num": 65, "name": "Birthday Discount", "category": "Promo Mechanics", "tags": "CRM, Retention", "difficulty": "Medium", "time": "3h", "bias": "Reciprocity", "what": "Collect customer birthdays and send a personalized discount 7 days before their birthday", "how": "1. Add birthday field to account registration page or via post-purchase survey (Typeform/Klaviyo form). 2. Set up birthday flow in Klaviyo/Omnisend: trigger 7 days before birthday date. 3. Email: 'Your birthday gift from us 🎁 — here's 15% off this month only.' 4. Set expiry: valid for 30 days around birthday. 5. Personalize with first name.", "ga4": "GA4: Track email clicks from birthday campaign (utm_campaign=birthday). Compare CVR and AOV from birthday emails vs standard promotional emails. Reports > Traffic acquisition > Campaign.", "shopify": "Shopify: Analytics > Reports > Sales by discount code (birthday-specific code). Compare redemption rate and AOV. Also check if birthday buyers have higher LTV — track in customer reports.", "test_period": "3 months (enough birthdays)", "kpi": "Birthday email redemption rate / CVR", "id": "T065"}, {"num": 66, "name": "Back-in-Stock Discount", "category": "Promo Mechanics", "tags": "Retention, Email", "difficulty": "Easy", "time": "2h", "bias": "Reciprocity", "what": "Offer a small discount to customers who waited for a product to come back in stock", "how": "1. Using your Back-in-Stock app (from Tactic #5), enable post-notification discount. 2. When item restocks, email notified customers with: 'It's back — and because you waited, here's 10% off for the next 48 hours.' 3. Make the time limit real — 48h only. 4. Use a unique discount code per customer if possible, or a single-use code batch. 5. Limit to first 50 redeemers if margins require.", "ga4": "GA4: Track email click from back-in-stock campaign (UTM tags). Compare CVR of back-in-stock notified customers vs general restock announcement. Explorations > Funnel: email_click → purchase.", "shopify": "Shopify: Analytics > Sales by discount code. Compare redemption rate of back-in-stock discount vs standard campaigns. Also check how quickly restocked items sell out compared to non-discounted restocks.", "test_period": "Per restock", "kpi": "Back-in-stock email CVR / Time to sell out", "id": "T066"}, {"num": 67, "name": "Last Chance Abandoned Cart + Sweetener", "category": "Promo Mechanics", "tags": "Cart Recovery, Email", "difficulty": "Medium", "time": "3h", "bias": "Loss Aversion", "what": "Add a 3rd abandoned cart email with a one-time discount offer if user hasn't converted after 48 hours", "how": "1. In Klaviyo/Shopify Email, build 3-email abandoned cart flow: Email 1 (1h): gentle reminder, no discount. Email 2 (24h): social proof + FAQ. Email 3 (48h): 'Last chance — here's 10% off, expires in 12h.' 2. Email 3 uses urgency: 'This offer expires [time].' 3. One-time use code. 4. A/B test: Email 3 with discount vs without — measure incremental lift vs training customers to abandon on purpose.", "ga4": "GA4: Track email clicks per abandoned cart email (UTM: utm_campaign=abandoned_cart_1/2/3). Compare CVR per email number. Explorations > Funnel per UTM campaign.", "shopify": "Shopify: Analytics > Reports > Abandoned checkouts. Track recovery rate per email in your ESP dashboard. Compare: recovery rate with 3-email flow vs previous 1-2 email flow.", "test_period": "6 weeks", "kpi": "Abandoned cart recovery rate", "id": "T067"}, {"num": 68, "name": "Loyalty Points on Slow-Moving SKUs", "category": "Promo Mechanics", "tags": "Inventory, Loyalty", "difficulty": "Medium", "time": "2h", "bias": "Goal Gradient Effect", "what": "Run double or triple loyalty points on specific products to stimulate demand without discounting", "how": "1. In Smile.io or LoyaltyLion, set up a 'Point multiplier' promotion. 2. Apply 3x points on selected slow-moving products for 2 weeks. 3. Promote via: homepage banner, on-product badge, email to loyalty members. 4. Frame as an exclusive loyalty perk, not a clearance. 5. Calculate: if 3x points cost you €X in future redemptions, compare to cost of markdown.", "ga4": "GA4: Compare sessions and add_to_cart rate on promoted products before vs during 3x points period. Reports > Ecommerce > Products. Also check if loyalty program engagement increases overall.", "shopify": "Shopify: Analytics > Reports > Sales by product. Compare units sold on featured products during 3x points vs baseline weeks. Track inventory depletion rate.", "test_period": "3 weeks", "kpi": "Units sold on targeted SKUs / Inventory velocity", "id": "T068"}, {"num": 69, "name": "Pre-Order Discount", "category": "Promo Mechanics", "tags": "Launch, Revenue", "difficulty": "Medium", "time": "3h", "bias": "Commitment & Consistency", "what": "Offer a discount for customers who pre-order an upcoming product, securing revenue before launch", "how": "1. Create a product in Shopify with 'Pre-order' tag and inventory = 0 but continue selling = ON. 2. Install 'Pre-order Now' app to manage pre-order states. 3. Offer: 15% off for pre-orders placed before launch date. 4. Set a clear ship date: 'Ships in 3-4 weeks.' 5. Send thank-you email with shipping update. 6. Build anticipation with 'X units pre-ordered' counter.", "ga4": "GA4: Track pre-order add_to_cart and purchase events. Compare pre-order CVR with launch-day full-price CVR. Also track if pre-order customers have higher LTV. Explorations.", "shopify": "Shopify: Analytics > Sales by product. Track pre-order revenue vs launch-day revenue. Compare pre-order buyers' repeat purchase rate vs launch-day buyers at 90-day mark.", "test_period": "Per launch", "kpi": "Pre-order CVR / Revenue secured pre-launch", "id": "T069"}, {"num": 70, "name": "Social Share Unlock", "category": "Promo Mechanics", "tags": "Acquisition, Viral", "difficulty": "Medium", "time": "1 day", "bias": "Reciprocity", "what": "Give a discount or bonus when a customer shares your product or brand on social media", "how": "1. Install 'Social Discount' or 'Shareitt' app. 2. Offer: 'Share this product on Instagram or Facebook → get 10% off your order.' 3. Trigger: after sharing, the discount code appears. 4. Optionally verify share (app-based or honour system — honour system converts better). 5. Frame it as 'Tell your friends' not 'promote us'.", "ga4": "GA4: Track custom event 'social_share_click' (on share button via GTM). Compare CVR of sessions that engage with share prompt vs those that don't. Also track referral traffic increase over time.", "shopify": "Shopify: Analytics > Traffic sources. Track if social referral traffic increases. Also track discount code redemption for social-share codes. Compare AOV of social-share customers vs organic.", "test_period": "4 weeks", "kpi": "Social share CVR / Referral traffic increase", "id": "T070"}, {"num": 71, "name": "Quiz to Personalized Discount", "category": "Promo Mechanics", "tags": "Personalization, Email", "difficulty": "Medium", "time": "1 day", "bias": "Reciprocity", "what": "Run a short product recommendation quiz that ends with a personalized discount based on results", "how": "1. Build quiz in 'RevenueHunt' or 'Octane AI' (both have free tiers). 2. 3-5 questions about needs/preferences. 3. End screen: personalized product recommendation + 'Here's 10% off for your first order — chosen just for you.' 4. Capture email to send discount. 5. The key: the discount feels earned and personalized, not generic.", "ga4": "GA4: Track quiz start, quiz completion, and quiz discount redemption as custom events. Compare CVR of quiz completers vs non-quiz visitors. Explorations > Funnel: quiz_start → quiz_complete → purchase.", "shopify": "Shopify: Track discount code redemption for quiz-specific codes. Compare new customer CVR and AOV for quiz-derived customers vs standard visitors. Analytics > Sales by discount code.", "test_period": "6 weeks", "kpi": "Quiz completion rate / Quiz-to-purchase CVR", "id": "T071"}, {"num": 72, "name": "Exit Intent Discount Popup", "category": "Promo Mechanics", "tags": "Conversion, Retention", "difficulty": "Medium", "time": "2h", "bias": "Loss Aversion", "what": "Show a discount offer when a desktop user's cursor moves toward closing the tab", "how": "1. Use OptiMonk or Privy. Set exit-intent trigger. 2. Message: 'Wait — here's 10% off your first order. Enter your email to claim it.' 3. One-time use code, expires in 24h. 4. Set to show once per session, max once per 30 days per visitor (cookie). 5. Mobile alternative: scroll-up trigger after 60s on page.", "ga4": "GA4: Track 'exit_popup_shown' and 'exit_popup_converted' custom events. Compare bounce rate before vs after (should decrease slightly). Also compare email list growth rate and CVR from exit popup emails.", "shopify": "Shopify: Marketing > Email subscribers. Compare weekly email sign-up rate before vs after. Also track exit popup discount code redemption rate in Analytics > Discounts report.", "test_period": "4 weeks", "kpi": "Email capture rate / Exit popup CVR", "id": "T072"}, {"num": 73, "name": "Wishlist Sale Notification", "category": "Promo Mechanics", "tags": "CRM, Conversion", "difficulty": "Medium", "time": "2h", "bias": "FOMO", "what": "Automatically email customers when a product they wishlisted goes on sale or drops in price", "how": "1. Enable in Wishlist Plus app: 'Price Drop Alert' and 'On Sale Alert' notifications. 2. Email: 'Good news — [Product] is now on sale. You wishlisted it — grab it before it's gone.' 3. Include product image, original price crossed out, sale price, and direct ATC link. 4. Add urgency: 'Sale ends in 48 hours' if applicable. 5. Personalize with customer name.", "ga4": "GA4: Track email clicks from wishlist-sale emails (UTM: utm_campaign=wishlist_sale). Compare CVR of wishlist-sale emails vs standard promotional emails. These should be highest CVR emails.", "shopify": "Shopify: Analytics > Sales by traffic source > Email. Compare CVR of wishlist sale email sessions vs other email campaigns. Wishlist Plus dashboard also shows wishlist-to-purchase conversions.", "test_period": "6 weeks", "kpi": "Wishlist sale email CVR", "id": "T073"}, {"num": 74, "name": "Category Flash Sale", "category": "Promo Mechanics", "tags": "Conversion, Inventory", "difficulty": "Medium", "time": "2h", "bias": "Scarcity / Urgency", "what": "Run a 24h sale on a specific product category rather than sitewide to create targeted urgency", "how": "1. Create a Shopify discount: automatic % off tagged products (e.g. 'shoes' tag). 2. Create a dedicated landing page for the category sale with countdown timer. 3. Promote via: email to category-interested segment, homepage banner, Instagram Stories. 4. Do not apply sitewide — scarcity is diluted when everything is on sale. 5. Rotate category each month.", "ga4": "GA4: Compare conversion rate and revenue from target category on sale day vs same day previous week. Reports > Monetization > Ecommerce purchases, filter by item_category.", "shopify": "Shopify: Analytics > Sales by product and Sales by collection. Compare category CVR and units sold on sale day vs baseline. Track if other categories cannibalise (they shouldn't if sale is truly category-specific).", "test_period": "Per activation", "kpi": "Category CVR on sale day / Units sold", "id": "T074"}, {"num": 75, "name": "Purchase Anniversary Email", "category": "Promo Mechanics", "tags": "CRM, Retention", "difficulty": "Medium", "time": "3h", "bias": "Reciprocity", "what": "Send a 'Happy anniversary' email 1 year after a customer's first purchase with a loyalty reward", "how": "1. In Klaviyo, create a flow: trigger = order placed, delay = 365 days. 2. Email: 'It's been a year since your first order — here's a thank you from us.' 3. Include: €X store credit or % discount, valid for 30 days. 4. Remind them what they ordered originally (order data in Klaviyo). 5. Frame as gratitude, not a sales email.", "ga4": "GA4: Track email clicks from anniversary campaign (UTM: utm_campaign=anniversary). Compare CVR of anniversary emails vs other retention emails. Also track 12-month repeat purchase rate before vs after launching program.", "shopify": "Shopify: Analytics > Reports > Customer cohorts. Compare 12-month repurchase rate for cohorts who received anniversary email vs those who didn't (control = earlier cohorts before flow was live).", "test_period": "3+ months", "kpi": "Anniversary email CVR / 12-month repurchase rate", "id": "T075"}, {"num": 76, "name": "Multi-Buy Discount on Consumables", "category": "Promo Mechanics", "tags": "AOV, Subscription", "difficulty": "Easy", "time": "2h", "bias": "Goal Gradient Effect", "what": "Offer quantity-based discounts on products that get repurchased (supplements, coffee, skincare)", "how": "1. In Shopify, create automatic discount: Buy 2 = 5% off, Buy 3 = 10% off, Buy 6 = 15% off. 2. Display discount tiers directly on PDP with a visual selector. 3. Show savings in both % and € amount: 'Buy 3 and save €8.50.' 4. Add 'Subscribe & Save' option alongside (separate flow if you have subscriptions). 5. Best for: food, supplements, coffee, skincare, cleaning products.", "ga4": "GA4: Compare AOV and items_per_purchase before vs after. Reports > Monetization > Ecommerce purchases. Also track if subscription sign-ups increase alongside multi-buy (complementary).", "shopify": "Shopify: Analytics > Average order value. Compare before/after. Also look at Sales by product — check if units per order increase for targeted consumable products.", "test_period": "4 weeks", "kpi": "AOV / Units per order", "id": "T076"}, {"num": 77, "name": "Free Sample with Qualifying Order", "category": "Promo Mechanics", "tags": "Discovery, Loyalty", "difficulty": "Medium", "time": "2h", "bias": "Reciprocity", "what": "Include a free product sample in qualifying orders to drive trial of a new or slow-moving product", "how": "1. In Shopify, set up automatic 'Buy X Get Y' discount for a sample SKU (create a €0 sample variant). 2. Trigger: orders over €X get a free sample of Product Y automatically added. 3. Choose samples strategically: new launches you want to trial, complementary products, or seasonal items. 4. Include a card in the package: 'We added this for you to try — here's 10% off the full size.'", "ga4": "GA4: Track if products given as samples show increased PDP views and purchases in following 60 days. Explorations: sessions from customers who received Sample X in previous order. Compare CVR on sample product PDP.", "shopify": "Shopify: Analytics > Sales by product. Compare sales velocity of sample product before vs 60 days after running sample campaign. Check if repeat purchases of that product increase.", "test_period": "Per campaign", "kpi": "Trial-to-purchase conversion rate on sampled product", "id": "T077"}, {"num": 78, "name": "Weekend-Only Mechanic", "category": "Promo Mechanics", "tags": "Conversion, Urgency", "difficulty": "Easy", "time": "2h", "bias": "Scarcity / Urgency", "what": "Run a promotion exclusively from Friday 6PM to Sunday midnight to drive weekend traffic and urgency", "how": "1. Schedule automatic discount in Shopify (Discounts > set start/end dates/times). 2. Set up recurring weekend campaign using Shopify Flow or manually. 3. Promote Thursday evening via email + Friday morning push/SMS: 'Weekend deal — starts tonight at 6PM.' 4. Add countdown timer on site that activates at 6PM Friday. 5. Rotate offer: one week = % off, next = free gift, next = free shipping.", "ga4": "GA4: Compare CVR and revenue on weekends with promotion vs weekends without. Reports > Monetization, filter by day of week (use date range for Friday-Sunday comparison).", "shopify": "Shopify: Analytics > Sales by day of week. Compare Friday-Sunday revenue and orders during promoted weekends vs non-promoted weekends. Track if promotion cannibalises Monday sales.", "test_period": "8 weeks", "kpi": "Weekend CVR / Weekend revenue uplift", "id": "T078"}, {"num": 79, "name": "New vs Returning Customer Offer", "category": "Promo Mechanics", "tags": "Acquisition, CRM", "difficulty": "Medium", "time": "3h", "bias": "Framing Effect", "what": "Show different promotional offers to first-time visitors vs returning customers based on session history", "how": "1. Use a popup tool (OptiMonk, Privy) with visitor targeting: 'New visitor' gets: 10% off first order (email capture). 'Returning visitor, no purchase' gets: 'Still thinking? Here's free shipping on your first order.' 'Returning customer' gets: 'Welcome back — earn double points today.' 2. Identify visitor type via browser cookie or Shopify customer tag. 3. Never show new-visitor discount to existing customers.", "ga4": "GA4: Compare CVR by user type (new vs returning): Reports > Retention > User type. Track if new visitor email capture rate improves and if returning visitor CVR improves separately.", "shopify": "Shopify: Analytics > Reports > New vs returning customers. Compare new customer acquisition rate and returning customer CVR before vs after implementing segmented offers.", "test_period": "6 weeks", "kpi": "New customer CVR / Returning customer CVR separately", "id": "T079"}, {"num": 80, "name": "Gift Card as Promotional Tool", "category": "Promo Mechanics", "tags": "CRM, Gifting", "difficulty": "Medium", "time": "2h", "bias": "Reciprocity", "what": "Send surprise gift cards to loyal customers instead of discount codes to drive higher-value returns", "how": "1. In Shopify Admin, issue gift cards (Products > Gift Cards > Issue gift card). 2. Send to: top 10% customers by LTV, customers with 3+ orders, or post-bad-experience recovery. 3. Email: 'We wanted to say thank you — here's €15 to spend however you like.' No strings, no minimum spend. 4. Gift cards feel more generous than equivalent % discounts. Track redemption rate vs discount codes.", "ga4": "GA4: Track sessions from gift card email UTM links. Compare CVR and AOV of gift card email traffic vs discount code email traffic. Explorations > Segment Overlap: gift card users vs discount users.", "shopify": "Shopify: Analytics > Gift cards. Compare redemption rate and AOV of gift card orders vs discount code orders. Check if gift card customers have higher 90-day LTV vs discount code customers.", "test_period": "3 months", "kpi": "Gift card redemption rate / LTV of gift card recipients", "id": "T080"}, {"num": 81, "name": "Trust Badges Near ATC", "category": "Cart & Checkout", "tags": "Trust, PDP", "difficulty": "Easy", "time": "30 min", "bias": "Trust / Safety", "what": "Add small trust icons (secure payment, free returns, money-back guarantee) directly below the ATC button", "how": "1. Design or download trust badge icons (SSL, Visa/MC/PayPal, free returns, guarantee). 2. Place as a horizontal icon strip directly below the Add-to-Cart button on PDP. 3. Keep to 3-4 icons max — more = visual noise. 4. Use gray/muted colors so they don't compete with the ATC button. 5. Ensure icons are mobile-optimized (min 24px height).", "ga4": "GA4: Compare add_to_cart rate on PDPs before vs after adding trust badges. Use date comparison. Reports > Events > add_to_cart by page_path. Also track begin_checkout rate.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and checkout initiation rate before vs after. Focus on new visitor conversion rate — trust badges help most with first-time buyers.", "test_period": "3 weeks", "kpi": "Add-to-cart rate / Checkout initiation rate", "id": "T081"}, {"num": 82, "name": "Single-Page Checkout Test", "category": "Cart & Checkout", "tags": "Checkout, Friction", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Consolidate multi-step checkout into one scrollable page to reduce friction and drop-off", "how": "1. Shopify's native checkout is multi-step. Options: a) Enable Shopify's 1-page checkout (available in newer themes — check Settings > Checkout > Layout). b) Use Shopify Plus with checkout customization. 2. Ensure single page loads fast — lazy load non-critical sections. 3. Test on mobile first (most important device). 4. Monitor if time-to-complete decreases.", "ga4": "GA4: Funnel: begin_checkout → add_shipping_info → add_payment_info → purchase. Compare step drop-off before vs after. Explorations > Funnel Exploration.", "shopify": "Shopify: Analytics > Checkout abandonment. Compare step-by-step drop-off and overall checkout completion rate before vs after. Settings > Checkout analytics if available.", "test_period": "4 weeks", "kpi": "Checkout completion rate", "id": "T082"}, {"num": 83, "name": "Visible Order Summary in Checkout", "category": "Cart & Checkout", "tags": "Checkout, Trust", "difficulty": "Easy", "time": "1h", "bias": "Commitment & Consistency", "what": "Ensure the order summary (items, prices, totals) is always visible on all checkout steps", "how": "1. In Shopify's checkout, the order summary is shown on the right column (desktop) but collapsed on mobile. 2. On mobile: set order summary to be expanded by default or pinned. 3. Shopify Checkout Extensibility allows customizing this. 4. Ensure summary includes: product images, quantities, line prices, discounts applied, shipping cost, total. 5. Test on multiple mobile devices.", "ga4": "GA4: Funnel: add_payment_info → purchase. Compare drop-off at payment step before vs after (anxiety at payment step is reduced when users can see exactly what they're paying for).", "shopify": "Shopify: Analytics > Checkout funnel. Compare abandonment at 'Payment' step specifically. This is where order summary visibility matters most.", "test_period": "3 weeks", "kpi": "Checkout completion at payment step", "id": "T083"}, {"num": 84, "name": "Delivery Date Estimate", "category": "Cart & Checkout", "tags": "Checkout, Trust", "difficulty": "Easy", "time": "2h", "bias": "Trust / Safety", "what": "Show a specific estimated delivery date at checkout rather than a vague '3-5 business days'", "how": "1. Install 'Estimated Delivery Date' app (free options: Omega, Stoq). 2. Show on: PDP near ATC, in cart, and at checkout shipping step. 3. Format: 'Estimated delivery: Wednesday 29 April — Thursday 30 April.' 4. Configure by shipping method and destination country. 5. Be conservative — it's better to under-promise and over-deliver.", "ga4": "GA4: Funnel: begin_checkout → add_shipping_info. Compare drop-off at shipping step before vs after. Also compare overall checkout completion rate. Explorations > Funnel.", "shopify": "Shopify: Analytics > Checkout abandonment. Compare abandonment rate at 'Shipping' step before vs after. Also check if customer support queries about delivery time decrease (use Shopify Inbox data).", "test_period": "3 weeks", "kpi": "Checkout completion at shipping step", "id": "T084"}, {"num": 85, "name": "Multiple Payment Methods", "category": "Cart & Checkout", "tags": "Checkout, Conversion", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Add BNPL (Buy Now Pay Later), digital wallets (Apple Pay, Google Pay), and alternative payment methods", "how": "1. Shopify Admin > Settings > Payments. 2. Enable: Shop Pay, Apple Pay, Google Pay (all in Shopify Payments). 3. Add BNPL: Klarna, Afterpay/Clearpay, or Laybuy via Shopify Payments or as external payment provider. 4. Show payment method logos on PDP and at checkout. 5. BNPL increases AOV by 20-30% on average — prioritize for high-ticket items.", "ga4": "GA4: Track purchase completion rate by payment method (if GA4 is configured to capture this — requires custom implementation). Also compare overall CVR before vs after adding new methods.", "shopify": "Shopify: Analytics > Reports > Payment methods. Compare which payment methods are used and compare CVR before vs after adding new options. Check if AOV increases for BNPL orders vs standard.", "test_period": "4 weeks", "kpi": "Checkout completion rate / AOV for BNPL orders", "id": "T085"}, {"num": 86, "name": "Show Savings at Cart", "category": "Cart & Checkout", "tags": "Cart, Motivation", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Display the total discount amount saved prominently in the cart summary", "how": "1. In cart template, add a line below subtotal: 'You're saving €[X] today 🎉' — shown only when discount applies. 2. Calculate: original price total minus discounted total. 3. Style in green or with a savings icon. 4. Also show item-level savings next to each discounted product. 5. This reinforces the decision to purchase and reduces second-guessing.", "ga4": "GA4: Compare begin_checkout rate (cart to checkout) before vs after adding savings display. Reports > Events: begin_checkout / view_cart ratio. Also compare AOV — shoppers seeing savings may add more.", "shopify": "Shopify: Analytics > Abandoned checkouts. Compare abandonment rate at cart stage before vs after. Also check if checkout initiation rate (reached checkout / sessions) improves.", "test_period": "3 weeks", "kpi": "Cart-to-checkout rate", "id": "T086"}, {"num": 87, "name": "Checkout Upsell Block", "category": "Cart & Checkout", "tags": "AOV, Cart", "difficulty": "Medium", "time": "2h", "bias": "Choice Architecture", "what": "Add a 'You might also like' or 'Frequently bought together' block in the cart page or drawer", "how": "1. Install 'CartHook' or 'ReConvert' (both have free tiers for cart upsell). 2. Show 1-2 low-cost complementary products. 3. Keep price low relative to cart value — upsell should be <20% of cart total. 4. Frame as: 'Customers who bought [X] also added [Y].' 5. One-click add to cart — no page navigation.", "ga4": "GA4: Compare AOV before vs after. Also track items_per_purchase in Reports > Monetization > Ecommerce purchases. Measure uplift specifically when upsell item is added.", "shopify": "Shopify: Analytics > Average order value. Compare before/after. Also check if specific upsell products show sales increase. Reports > Sales by product — track upsell item sales velocity.", "test_period": "4 weeks", "kpi": "AOV / Upsell acceptance rate", "id": "T087"}, {"num": 88, "name": "Remove Navigation from Checkout", "category": "Cart & Checkout", "tags": "Checkout, Friction", "difficulty": "Easy", "time": "30 min", "bias": "Choice Architecture", "what": "Remove or hide the site navigation header and footer from checkout pages to reduce distraction", "how": "1. Shopify's checkout does not show full site nav by default. Verify this is the case on your store. 2. If your theme shows navigation in checkout, remove it via checkout.liquid (legacy) or Checkout Extensibility. 3. Keep only: logo (linking to homepage), progress indicator, and support link. 4. No promotional banners, no social links, no related products in checkout flow.", "ga4": "GA4: Funnel: begin_checkout → purchase. Compare completion rate before vs after. Specific drop at begin_checkout step — distraction causes early exit.", "shopify": "Shopify: Analytics > Checkout funnel. Compare overall checkout completion rate. Also compare bounce rate from checkout pages (should decrease when nav is removed).", "test_period": "3 weeks", "kpi": "Checkout completion rate", "id": "T088"}, {"num": 89, "name": "Coupon Field De-emphasized", "category": "Cart & Checkout", "tags": "Checkout, Friction", "difficulty": "Easy", "time": "30 min", "bias": "Choice Architecture", "what": "Make the coupon/discount code field less visually prominent to stop customers leaving to search for codes", "how": "1. In checkout, reduce the coupon field to a small collapsible link: 'Have a discount code? Click here.' instead of an always-visible prominent input box. 2. Shopify's native checkout has a 'Gift card or discount code' field — it's relatively unobtrusive. 3. If using third-party checkout, collapse the field behind a link. 4. Monitor if checkout completion rate improves (customers were leaving to Google for codes).", "ga4": "GA4: Funnel: begin_checkout → purchase. Compare drop-off at first checkout step (where coupon field is visible) before vs after. Also check time-to-complete checkout decreases.", "shopify": "Shopify: Analytics > Checkout abandonment at 'Customer information' step. Compare before vs after. Also check if discount code usage rate changes (shouldn't decrease significantly if users with codes still find it).", "test_period": "4 weeks", "kpi": "Checkout drop-off at information step", "id": "T089"}, {"num": 90, "name": "Gift Message at Checkout", "category": "Cart & Checkout", "tags": "Gifting, AOV", "difficulty": "Easy", "time": "2h", "bias": "Endowment Effect", "what": "Add a gift message field and optional gift wrapping at checkout to capture gifting occasions", "how": "1. Shopify Admin > Settings > Checkout > enable 'Gift options' (includes gift message). 2. Add gift wrapping as a paid add-on product (create a €3-5 'Gift Wrapping' product, add to cart at checkout). 3. Show a checkbox: 'This is a gift — add message and gift wrap.' 4. Gift orders often have higher AOV — the buyer is less price-sensitive. 5. Promote 'Send as a gift' on PDPs.", "ga4": "GA4: Track 'gift_option_selected' event (Shopify's gift option fires an event in GA4 if enhanced ecommerce is set up). Compare AOV of gift orders vs non-gift orders.", "shopify": "Shopify: Analytics > Orders, filter by 'has gift message'. Compare AOV of gift vs non-gift orders. Also track gift wrap revenue separately as a product in Sales by product report.", "test_period": "6 weeks", "kpi": "Gift order AOV / Gift option selection rate", "id": "T090"}, {"num": 91, "name": "Live Chat on Checkout", "category": "Cart & Checkout", "tags": "Checkout, Trust", "difficulty": "Medium", "time": "2h", "bias": "Trust / Safety", "what": "Add a live chat or chatbot widget specifically on checkout pages to answer last-minute questions", "how": "1. Install Shopify Inbox (free) or Tidio (free tier). 2. Enable chat specifically on /checkout pages (not sitewide — reduces distraction). 3. Set up auto-message triggered on checkout page: 'Any questions before you complete your order? We're here.' 4. Pre-write answers to top questions: shipping time, returns, payment security. 5. Set offline hours clearly.", "ga4": "GA4: Compare checkout completion rate before vs after adding checkout chat. Also track if time-to-complete checkout decreases (quick questions resolved = faster decisions). Explorations > Funnel.", "shopify": "Shopify: Analytics > Checkout abandonment. Compare completion rate at 'Payment' step — this is where doubt peaks. Also track Shopify Inbox conversations that started in checkout and led to purchase.", "test_period": "4 weeks", "kpi": "Checkout completion rate at payment step", "id": "T091"}, {"num": 92, "name": "Show Product Image in Cart", "category": "Cart & Checkout", "tags": "Cart, Trust", "difficulty": "Easy", "time": "30 min", "bias": "Endowment Effect", "what": "Ensure product images are displayed in the cart (not just product name and price)", "how": "1. In your cart template (cart.liquid or cart drawer), verify product images are displayed. 2. If missing: add <img src='{{ item.image | img_url: '120x' }}' > to cart line items. 3. Image size: 80x80px minimum (120x120 recommended). 4. Show variant-specific image if product has color variants. 5. Test on mobile cart and desktop cart.", "ga4": "GA4: Compare cart-to-checkout rate (begin_checkout / view_cart events) before vs after. Seeing products visually in cart reinforces purchase intent. Reports > Events ratio.", "shopify": "Shopify: Analytics > Abandoned checkouts. Compare abandonment rate at cart stage before vs after. Also compare sessions that view cart and then leave vs those that proceed to checkout.", "test_period": "3 weeks", "kpi": "Cart-to-checkout rate", "id": "T092"}, {"num": 93, "name": "Return Policy at Checkout", "category": "Cart & Checkout", "tags": "Checkout, Trust", "difficulty": "Easy", "time": "30 min", "bias": "Trust / Safety", "what": "Display a clear, reassuring return policy summary at the checkout payment step", "how": "1. At the checkout payment step, add a line: '30-day free returns — no questions asked.' with a link to your full returns page (opens in new tab). 2. Place below the order total and above the 'Pay now' button. 3. Keep to one sentence — don't add paragraphs at this stage. 4. In Shopify, add via Checkout Extensibility banner or footer text field.", "ga4": "GA4: Funnel: add_payment_info → purchase. Compare drop-off at payment step before vs after. This is where final hesitation occurs — returns policy reduces it.", "shopify": "Shopify: Analytics > Checkout funnel. Compare abandonment rate at 'Payment information' step specifically. This single metric shows the impact of last-step reassurance.", "test_period": "3 weeks", "kpi": "Checkout completion at payment step", "id": "T093"}, {"num": 94, "name": "Cart Social Proof", "category": "Cart & Checkout", "tags": "Cart, Trust", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Add real-time or recent social proof to the cart page: 'X people purchased this today'", "how": "1. In cart template, add a social proof line: 'Join 847 customers who ordered today' or '[Product] — 23 sold in the last 24 hours.' 2. Use real data if possible: Shopify's sales data can feed this. 3. If using app: 'Sales Popup' or 'Fomo.io' can show recent orders. 4. Keep dynamic — static numbers lose credibility. 5. Don't exaggerate: 5 real orders beats fabricated 500.", "ga4": "GA4: Compare cart-to-checkout rate (begin_checkout / view_cart) before vs after. Also monitor if time spent on cart page decreases (social proof speeds up decision). Reports > Events.", "shopify": "Shopify: Analytics > Abandoned checkouts. Compare abandonment rate at cart step. Also check if conversion rate for new visitors specifically improves (they benefit most from social proof reassurance).", "test_period": "3 weeks", "kpi": "Cart-to-checkout rate / New visitor CVR", "id": "T094"}, {"num": 95, "name": "Quantity Increment Buttons", "category": "Cart & Checkout", "tags": "Cart, UX", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Replace text input quantity field with clear +/- buttons in the cart to make quantity changes easy", "how": "1. In cart template, replace <input type='number'> with two buttons: '-' and '+' with quantity displayed between them. 2. Add JS to update cart total when quantity changes (Shopify's AJAX cart API). 3. Minimum quantity = 1 (can't go below). 4. Style buttons clearly — min 40px tap target on mobile. 5. Show updated price immediately when quantity changes.", "ga4": "GA4: Compare AOV before vs after. Easier quantity adjustment often leads to more items per order. Reports > Monetization > Ecommerce purchases > average_purchase_revenue. Also track items_per_purchase.", "shopify": "Shopify: Analytics > Average order value. Compare before vs after. Also check if cart abandonment decreases (easier to adjust = less frustration = fewer exits).", "test_period": "3 weeks", "kpi": "AOV / Cart abandonment rate", "id": "T095"}, {"num": 96, "name": "Loyalty Points Earned Display", "category": "Cart & Checkout", "tags": "Cart, Loyalty", "difficulty": "Easy", "time": "2h", "bias": "Goal Gradient Effect", "what": "Show how many loyalty points the current order will earn, displayed in the cart and at checkout", "how": "1. Install Smile.io or LoyaltyLion — both have cart widgets showing points to be earned. 2. Cart widget: 'This order earns 450 points (worth €4.50).' 3. For non-members: 'Join our rewards program and earn 450 points on this order — sign up free.' 4. At checkout confirmation: 'You earned 450 points! You now have 1,200 total.' 5. Frame as a reward, not a complex system.", "ga4": "GA4: Compare AOV before vs after — loyalty points visibility often pushes customers over the free shipping or next reward threshold. Also track loyalty program sign-ups. Reports > Monetization.", "shopify": "Shopify: Analytics > Average order value. Compare before/after. Also track loyalty app dashboard: new sign-ups per week and redemption rate. Compare repeat purchase rate at 60-day mark.", "test_period": "4 weeks", "kpi": "AOV / Loyalty sign-up rate from cart", "id": "T096"}, {"num": 97, "name": "Free Shipping Bar in Cart", "category": "Cart & Checkout", "tags": "Cart, AOV", "difficulty": "Easy", "time": "1h", "bias": "Goal Gradient Effect", "what": "Show how much more the customer needs to spend to qualify for free shipping, directly in the cart", "how": "1. Most themes and cart apps have this built-in. Enable in theme settings or cart app (Slide Cart Upsell by AMP has this free). 2. Format: Progress bar + 'Add €8 more for free shipping!' 3. When threshold reached: 'You've unlocked free shipping! 🎉' 4. The bar should update dynamically when items are added or removed. 5. Suggest a specific product to bridge the gap: 'How about adding [product] — €7.50?'", "ga4": "GA4: Compare AOV before vs after enabling the bar. Reports > Monetization > average_purchase_revenue. Also track if 'free shipping unlocked' rate (orders above threshold / total orders) increases.", "shopify": "Shopify: Analytics > Average order value. Compare 3 weeks before vs 3 weeks after. Check if the % of orders above your free shipping threshold increases. Reports > Orders by value.", "test_period": "3 weeks", "kpi": "AOV / % of orders above shipping threshold", "id": "T097"}, {"num": 98, "name": "Apple Pay / Google Pay on PDP", "category": "Cart & Checkout", "tags": "Conversion, Mobile", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Enable express checkout buttons (Apple Pay, Google Pay, Shop Pay) directly on the product page", "how": "1. Shopify Admin > Settings > Payments > enable Shop Pay, Apple Pay, Google Pay (all included in Shopify Payments). 2. In theme editor > Product page, enable 'Dynamic checkout buttons' (shows Apple Pay / Google Pay / Shop Pay buttons below ATC). 3. These bypass the cart entirely — 1 click from PDP to purchased. 4. Monitor AOV — may be slightly lower (impulse, no upsell opportunity) but CVR higher.", "ga4": "GA4: Compare purchase completion rate for dynamic checkout button clicks vs standard ATC → checkout flow. Track 'dynamic_checkout_button_click' event (Shopify fires this). Explorations > Funnel.", "shopify": "Shopify: Analytics > Reports > Payment methods. Compare % of orders via Shop Pay / Apple Pay / Google Pay before vs after enabling on PDP. Also compare CVR on mobile specifically.", "test_period": "3 weeks", "kpi": "Mobile CVR / Dynamic checkout rate", "id": "T098"}, {"num": 99, "name": "Abandoned Cart Timing Test", "category": "Cart & Checkout", "tags": "Email, Recovery", "difficulty": "Medium", "time": "3h", "bias": "Loss Aversion", "what": "Test different send times for abandoned cart email #1 to find the highest recovery rate", "how": "1. Current default: 1 hour after abandonment. Test: 20 minutes vs 1 hour vs 4 hours. 2. In Klaviyo/Omnisend: duplicate your abandoned cart flow and set different delays. Split traffic 33/33/33. 3. Run for 4 weeks. 4. Measure: open rate, click rate, recovery rate (% of abandoned carts that result in purchase). 5. 20 minutes often wins for high-intent, browsed-and-chose carts.", "ga4": "GA4: Track email clicks per abandoned cart timing variant (UTM: utm_campaign=cart_abandon_20min, 1h, 4h). Compare CVR per variant. Explorations > Funnel: email_click → purchase by variant.", "shopify": "Shopify: Analytics > Abandoned checkouts recovered. Filter by the email campaign source (if UTM-tagged). Your ESP dashboard will show recovery rate per flow variant directly.", "test_period": "4 weeks", "kpi": "Abandoned cart recovery rate by timing", "id": "T099"}, {"num": 100, "name": "Post-Purchase Upsell Page", "category": "Cart & Checkout", "tags": "AOV, Retention", "difficulty": "Medium", "time": "3h", "bias": "Commitment & Consistency", "what": "Show a one-time offer on the thank-you/order confirmation page immediately after purchase", "how": "1. Install 'ReConvert' (free tier — post-purchase upsell). 2. On order confirmation page, show: 'Add [complementary product] to your order before it ships — 15% off, one time only.' 3. One-click add — customer doesn't need to re-enter payment info. 4. Choose upsell product carefully: must be complementary, not competitive with what they bought. 5. Offer expires when page is closed.", "ga4": "GA4: Track 'post_purchase_upsell_accepted' custom event. Compare AOV with upsell vs without. Also compare orders that include upsell product — do these customers have higher LTV? Explorations.", "shopify": "Shopify: ReConvert dashboard shows upsell acceptance rate and revenue. Also compare average order value of orders with post-purchase upsell vs standard orders in Analytics > Orders.", "test_period": "4 weeks", "kpi": "Post-purchase upsell acceptance rate / AOV uplift", "id": "T100"}, {"num": 101, "name": "Star Ratings on Collection Pages", "category": "Social Proof & Trust", "tags": "Category, Reviews", "difficulty": "Easy", "time": "2h", "bias": "Social Proof", "what": "Display average star rating and review count on product cards in collection/category pages", "how": "1. Install Judge.me or Loox (both have free tiers with collection star ratings). 2. Enable 'Show ratings on collection pages' in app settings. 3. Display format: ★★★★☆ 4.3 (128 reviews). 4. Only show when 5+ reviews exist — 1 review star rating can backfire. 5. Position below product name, above price.", "ga4": "GA4: Compare add_to_cart rate from collection pages before vs after. Products with visible ratings should see higher CTR. Track 'select_item' event (GA4 ecommerce) — click-through from collection to PDP.", "shopify": "Shopify: Analytics > Reports > Product performance. Compare add-to-cart rate on collection pages before vs after enabling ratings. Also check if products with higher ratings see more relative traffic increase.", "test_period": "4 weeks", "kpi": "Collection page CTR / Add-to-cart rate", "id": "T101"}, {"num": 102, "name": "Photo Reviews on PDP", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Easy", "time": "2h", "bias": "Social Proof", "what": "Display customer photo reviews prominently on the product page, above text-only reviews", "how": "1. Enable photo reviews in Judge.me or Loox (Loox specialises in photo reviews). 2. Show photo reviews above written reviews — create a 'Customer Photos' strip. 3. Send post-purchase email requesting photo reviews with incentive: 'Submit a photo review and get 10% off your next order.' 4. Feature photos in a scrollable gallery. 5. Show on collection page product cards too.", "ga4": "GA4: Compare add_to_cart rate on PDPs with photo reviews vs without. Also compare return rate — photo reviews set accurate expectations. Track time on page (photo review engagement increases it).", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate and return rate for products with photo reviews vs those with text-only reviews. Check if review volume increases when photo incentive is offered.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T102"}, {"num": 103, "name": "Video Testimonials", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Medium", "time": "1 day", "bias": "Social Proof", "what": "Add short customer or influencer video testimonials (30-60s) to your key product pages", "how": "1. Source videos: ask customers via email, record staff reviews, partner with micro-influencers. 2. Upload to Vimeo (for quality) or use Shopify's native video hosting. 3. Place below main product description, above written reviews. 4. Keep to 30-60 seconds — longer is not watched. 5. Add captions — most mobile viewers watch without sound.", "ga4": "GA4: Track 'video_play' events (auto-tracked for YouTube; custom event for Vimeo via GTM). Compare add_to_cart rate on PDPs with video testimonials vs without. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR on PDPs with video testimonials vs similar products without. Start with your top 5 highest-traffic products.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on PDPs with video", "id": "T103"}, {"num": 104, "name": "Bestseller Badge on Collection", "category": "Social Proof & Trust", "tags": "Category, Trust", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Add 'Bestseller' or '#1 Seller' badge to your top products on category pages and homepage", "how": "1. In Shopify, add a product tag 'bestseller' to your top 5-10 products. 2. In theme editor or liquid template, show a badge when product has 'bestseller' tag. 3. Style: bold, contrasting label in top-left corner of product card. 4. Keep to max 10% of products — if everything is a bestseller, nothing is. 5. Update monthly based on actual sales data.", "ga4": "GA4: Track 'select_item' events (clicks from collection to PDP) for bestseller-tagged products vs others. Compare CTR. Also compare add_to_cart rate on bestseller PDPs vs non-bestseller.", "shopify": "Shopify: Analytics > Product performance. Compare sessions and add-to-cart rate for bestseller-tagged products before vs after adding badge. Check if 'rich get richer' effect concentrates sales.", "test_period": "4 weeks", "kpi": "Collection page CTR for tagged products", "id": "T104"}, {"num": 105, "name": "'X People Viewing' Counter", "category": "Social Proof & Trust", "tags": "PDP, Urgency", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Show a real-time or simulated 'X people are viewing this right now' counter on PDPs", "how": "1. Install 'Sales Popup' or 'Nudgify' (free tiers available). 2. Show on PDP: '7 people viewing this right now.' 3. IMPORTANT: use real data if possible. If simulating, set realistic ranges (3-15) and vary by product traffic. 4. Only show when count > 1. 5. Pair with low-stock counter for maximum urgency without fabrication.", "ga4": "GA4: Compare add_to_cart rate on PDPs with counter vs without. Also monitor bounce rate — counter may increase urgency and reduce hesitation. Reports > Events.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate before vs after adding social counter. Also check if high-traffic products (where count is most believable) show stronger uplift.", "test_period": "3 weeks", "kpi": "Add-to-cart rate / Bounce rate on PDPs", "id": "T105"}, {"num": 106, "name": "Recent Purchase Notification", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Show a small toast notification: 'Marta from Warsaw just purchased this 2 hours ago'", "how": "1. Install 'Sales Popup — Social Proof' by Autoketing (free) or Fomo.io. 2. Use real purchase data — most apps pull from actual Shopify orders. 3. Show customer first name and city (anonymized). 4. Frequency: max once every 30 seconds. 5. Position: bottom-left corner. 6. Dismiss on click. 7. Avoid showing fabricated data — real data builds trust, fake data erodes it.", "ga4": "GA4: Compare add_to_cart rate and bounce rate on PDPs with notifications vs without. Run by enabling on 50% of products (A/B). Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate for products with purchase notifications vs without. Monitor if high-social-proof products show faster sell-through.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Bounce rate", "id": "T106"}, {"num": 107, "name": "Google/Trustpilot Rating in Header", "category": "Social Proof & Trust", "tags": "Sitewide, Trust", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Display your aggregate review rating from Google or Trustpilot prominently in the site header", "how": "1. Get your Google Business rating (or Trustpilot rating if applicable). 2. Design a small badge: '★ 4.8 · 1,240 reviews on Google.' 3. Place in header bar (top of page) — links to your Google/Trustpilot reviews page. 4. Update manually each quarter. 5. Minimum: 4.5 stars and 50+ reviews before displaying — below 4.5 may hurt.", "ga4": "GA4: Compare overall site bounce rate and session duration before vs after adding rating to header. Also compare new visitor CVR — header trust signals primarily help first-time visitors. Reports > Acquisition.", "shopify": "Shopify: Analytics > Online store sessions by new vs returning visitors. Compare new visitor conversion rate before vs after adding the header trust badge.", "test_period": "4 weeks", "kpi": "New visitor conversion rate", "id": "T107"}, {"num": 108, "name": "Authenticity via Negative Reviews", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Easy", "time": "30 min", "bias": "Trust / Safety", "what": "Do NOT filter out negative reviews — show them to build credibility and reduce return rate", "how": "1. In your review app (Judge.me/Loox), set moderation to allow all reviews (only remove spam/offensive). 2. Respond professionally to critical reviews: 'Thank you for your feedback — we've reached out to resolve this.' 3. A 4.3 average with negative reviews is more credible than a suspicious 5.0. 4. Track: does showing negatives increase or decrease your conversion rate? (It usually increases it for considered purchases.)", "ga4": "GA4: Compare add_to_cart rate before vs after enabling all reviews (no filtering). Also compare return rate — better-informed buyers make fewer returns. Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Returns. Compare return rate before vs after enabling all reviews. Also check review volume — responding to negatives often prompts more reviews overall.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T108"}, {"num": 109, "name": "UGC / Instagram Feed on PDP", "category": "Social Proof & Trust", "tags": "PDP, Visual", "difficulty": "Medium", "time": "3h", "bias": "Social Proof", "what": "Embed a curated Instagram feed showing real customers using your product on the PDP", "how": "1. Install 'Instafeed' (free tier) or 'SnapWidget'. 2. Curate: use your brand hashtag to pull customer posts. Manually approve what shows. 3. Place on PDP below reviews section. 4. Show 6-8 images in a horizontal scrollable strip. 5. Add a caption: 'Real customers, real results — tag #YourBrand to be featured.'", "ga4": "GA4: Track scroll to UGC section and time on page. Compare add_to_cart rate on PDPs with UGC feed vs without. Also compare return rate — realistic expectations from real photos reduce returns.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate and return rate on products with UGC feed vs control products. Monitor hashtag usage as a secondary engagement metric.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T109"}, {"num": 110, "name": "Return Rate Stat as Trust Signal", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Easy", "time": "1h", "bias": "Trust / Safety", "what": "Show your product's low return rate as a trust indicator: '94% of buyers keep this product'", "how": "1. Calculate: (1 - return rate) for your top products. 2. Add to PDP if return rate < 8%: '94% of customers keep this product' or 'Returned by less than 6% of buyers.' 3. Only show if it's genuinely low — honesty is the point. 4. Place near size guide or returns policy link. 5. Update this stat quarterly.", "ga4": "GA4: Compare add_to_cart rate on PDPs with return rate stat vs without. Also compare actual return rate before vs after (may decrease further as buyers feel more confident).", "shopify": "Shopify: Analytics > Returns by product. Calculate return rate per product. Compare add-to-cart rate in Product performance report before vs after adding the stat. Monitor if actual return rate changes.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T110"}, {"num": 111, "name": "Review Q&A Section", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Medium", "time": "2h", "bias": "Social Proof", "what": "Add a Questions & Answers section to PDPs where customers can ask and past buyers/staff can answer", "how": "1. Install 'Product Questions & Answers' (free options: HelpfulCrowd, Hulk). 2. Seed with 3-5 real questions you get in customer support + answers. 3. Allow customers to submit questions via the PDP form. 4. Answer within 24-48 hours. 5. Notify question submitter when answered. 6. Best for: technical products, sizing-sensitive products, products with complex use cases.", "ga4": "GA4: Track 'qa_question_viewed' event (GTM intersection observer on Q&A section). Compare add_to_cart rate and support ticket volume before vs after adding Q&A section.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate. Also check Shopify Inbox or helpdesk — track if same-category questions decrease in customer support after Q&A is live.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Support query volume", "id": "T111"}, {"num": 112, "name": "Orders Today Counter", "category": "Social Proof & Trust", "tags": "PDP, Sitewide", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Show how many orders were placed today or in the last 24 hours, site-wide or on specific PDPs", "how": "1. Create a Shopify script or use an app to pull today's order count from Shopify Admin API. 2. Display as: 'Join 47 customers who've ordered today.' 3. Reset at midnight. 4. Show sitewide in header or on individual PDPs. 5. Only show when count is meaningful (>5). Hide or show 'this week' count on slow days.", "ga4": "GA4: Compare add_to_cart rate and bounce rate sitewide before vs after adding counter. Also check new visitor CVR specifically. Reports > Acquisition > new vs returning users, compare CVR.", "shopify": "Shopify: Analytics > Online store conversion rate. Compare new visitor CVR before vs after. Real-time orders counter pulls from Shopify's admin — verify data accuracy with daily order reports.", "test_period": "3 weeks", "kpi": "New visitor conversion rate / Bounce rate", "id": "T112"}, {"num": 113, "name": "Certification and Award Badges", "category": "Social Proof & Trust", "tags": "PDP, Trust", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Display relevant certifications, awards, or accreditations on PDPs and homepage", "how": "1. Identify any genuine certifications: organic, vegan, B-Corp, ISO, industry awards, press awards. 2. Download official badge/logo from the certification body. 3. Place on relevant PDPs and on homepage (below hero). 4. Link each badge to the certification source. 5. Avoid unofficial or self-created 'award' badges — they signal inauthenticity.", "ga4": "GA4: Compare add_to_cart rate on PDPs with certification badges vs those without (if only some products are certified). Also compare new visitor CVR sitewide. Reports > Events.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate on certified products. Also check if filter usage increases (if you add a 'Certified Organic' filter — customers searching for this).", "test_period": "4 weeks", "kpi": "Add-to-cart rate on certified products", "id": "T113"}, {"num": 114, "name": "Reorder Frequency Stat", "category": "Social Proof & Trust", "tags": "PDP, Retention", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Show how often customers repurchase: 'Reordered by 67% of buyers within 3 months'", "how": "1. Calculate from Shopify: % of customers who bought this product and repurchased within 90 days. Pull from Analytics > Customer reports. 2. Add to PDP as a single line stat with icon: '🔁 67% of buyers reorder within 3 months.' 3. Only show if reorder rate > 40% — lower rates aren't compelling. 4. Best for: consumables, supplements, food, beauty. 5. Update quarterly.", "ga4": "GA4: Compare add_to_cart rate on PDPs with reorder stat vs without. Also compare if subscription sign-up rate increases when reorder frequency is visible. Reports > Events.", "shopify": "Shopify: Analytics > Customer reports > Returning customers. Calculate reorder rate per product. Compare add-to-cart rate in Product performance report before vs after showing reorder stat.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Subscription sign-up rate", "id": "T114"}, {"num": 115, "name": "Expert / Dermatologist / Specialist Quote", "category": "Social Proof & Trust", "tags": "PDP, Authority", "difficulty": "Medium", "time": "3h", "bias": "Authority", "what": "Add a quote from a recognized expert, professional, or specialist endorsing the product or category", "how": "1. Source genuine expert endorsements: partners, doctors, nutritionists, stylists, athletes. 2. Write a 1-2 sentence quote addressing a specific benefit or concern. 3. Include: name, credentials, photo. 4. Place on relevant PDPs near the main description. 5. For regulated industries (health, beauty, food) ensure claims are compliant with local regulations.", "ga4": "GA4: Compare add_to_cart rate on PDPs with expert quote vs without. Also compare time on page — credibility signals increase engagement. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and return rate on products with expert endorsement vs control products. Higher authority = better-informed purchase = fewer returns.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T115"}, {"num": 116, "name": "'Staff Favourite' Section on Homepage", "category": "Social Proof & Trust", "tags": "Homepage, Discovery", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Add a curated 'Staff Favourites' section to the homepage with real team member names and notes", "how": "1. Select 3-6 products genuinely recommended by team members. 2. Each card: product photo, product name, and 1-sentence note: 'My go-to for weekend hikes. — Tom, Operations.' 3. Real first names and real photos of staff if possible. 4. Rotate monthly. 5. Subtle CTA: 'Shop the team's picks.'", "ga4": "GA4: Track 'staff_pick_click' custom event (GTM click trigger on staff picks section). Compare CVR for sessions that interact with staff picks vs those that don't. Explorations > Funnel.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate and sessions for staff-featured products during the month they're featured vs the month before/after.", "test_period": "4 weeks", "kpi": "CTR from homepage / CVR of featured products", "id": "T116"}, {"num": 117, "name": "'Most Loved' Category Page", "category": "Social Proof & Trust", "tags": "Navigation, Discovery", "difficulty": "Easy", "time": "2h", "bias": "Social Proof", "what": "Create a dedicated 'Most Loved' or 'Customer Favourites' collection page pulled from highest-rated/bestselling products", "how": "1. Create a new collection in Shopify: 'Most Loved.' 2. Use automated collection rules: products with rating > 4.5 AND total reviews > 20. 3. Sort by: units sold or review score. 4. Add to main navigation. 5. Add editorial intro: 'These are the products our customers come back for, again and again.' 6. Include only genuinely top performers.", "ga4": "GA4: Track sessions entering from the 'Most Loved' collection page. Compare add_to_cart rate vs other collection pages. Reports > Engagement > Pages — compare CVR by page.", "shopify": "Shopify: Analytics > Reports > Sessions by landing page. Compare CVR of /collections/most-loved vs other collection pages. Also track if this page drives a higher AOV than standard collections.", "test_period": "4 weeks", "kpi": "Collection page CVR / AOV from most-loved traffic", "id": "T117"}, {"num": 118, "name": "Review Count in Title Tag", "category": "Social Proof & Trust", "tags": "SEO, Trust", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Include review count or rating in product page title tags to improve organic click-through rates", "how": "1. In Shopify, edit the meta title field on product pages to include rating info: 'Product Name — ★4.8 (312 Reviews) | BrandName.' 2. Or: 'Product Name | Rated #1 by 312 Customers.' 3. Keep title under 60 characters total. 4. Add review schema markup (JSON-LD) for Google rich snippets (stars in search results). 5. Start with 10 highest-traffic organic PDPs.", "ga4": "GA4: Reports > Acquisition > Organic traffic. Compare CTR from organic search on pages with updated title tags vs before. Note: this is slow to show in GA4 — check Google Search Console for CTR data.", "shopify": "Shopify: Use Google Search Console (linked to Shopify) to compare organic CTR on product pages before vs after title tag update. Filter by product URLs and compare 4-week periods.", "test_period": "8 weeks", "kpi": "Organic CTR from search results", "id": "T118"}, {"num": 119, "name": "Post-Purchase Review Request Timing Test", "category": "Social Proof & Trust", "tags": "Email, Reviews", "difficulty": "Easy", "time": "2h", "bias": "Social Proof", "what": "Test whether asking for a review 7, 14, or 21 days post-purchase yields more reviews", "how": "1. In Judge.me or Loox, set up automated review request email. 2. Currently set to X days — run test periods: 7 days for 4 weeks, then 14 days for 4 weeks, then 21 days for 4 weeks. 3. Track: email open rate, click rate, and review submission rate. 4. Also test subject line: 'How's your [product]?' vs 'Leave a quick review — takes 30 seconds.' 5. Best timing varies by product delivery + usage time.", "ga4": "GA4: This is measured in your review app dashboard and ESP — not directly in GA4. Track review submission rate per timing period. Also monitor if review volume affects add_to_cart rate over time (indirect effect).", "shopify": "Shopify: Track total review count per product over each 4-week test period. Loox/Judge.me dashboards show submission rates per email send. Also check if star rating average changes with different timing.", "test_period": "12 weeks (3x4)", "kpi": "Review submission rate / Review volume", "id": "T119"}, {"num": 120, "name": "'As Seen On' Press Strip", "category": "Social Proof & Trust", "tags": "Homepage, Trust", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Add a press coverage strip on the homepage and optionally on PDPs showing publication logos", "how": "1. Gather any press coverage — blog features, online publications, local press, specialist media. 2. Design a horizontal strip: 'As seen in / Featured in' + publication logos. 3. Place on homepage below hero and above featured products. 4. Link each logo to the original article (opens new tab). 5. If you lack press coverage: create it — submit to relevant blogs or request reviews from publications.", "ga4": "GA4: Compare homepage CVR (add_to_cart or begin_checkout from homepage) before vs after adding press strip. Also compare new visitor session duration — trust signals increase time on site.", "shopify": "Shopify: Analytics > Online store sessions by landing page. Compare homepage CVR before vs after. Focus on new visitor CVR as press logos primarily reassure first-time buyers.", "test_period": "4 weeks", "kpi": "Homepage new visitor CVR", "id": "T120"}, {"num": 121, "name": "Crossed-Out Original Price", "category": "Pricing & Anchoring", "tags": "PDP, Sale", "difficulty": "Easy", "time": "30 min", "bias": "Anchoring", "what": "Show original price visibly crossed out next to the sale price to anchor value perception", "how": "1. In Shopify theme, ensure 'compare at price' field shows as strikethrough when filled. 2. Admin > Products > Compare at price: set to original price when running a promotion. 3. Style: compare-at price in gray strikethrough, sale price in red/bold. 4. Also show % saved: 'Save 25%.' 5. Only use when there's a genuine previous price — manufactured anchors erode trust.", "ga4": "GA4: Compare add_to_cart rate on sale products with compare-at price vs products without. Also compare CVR at checkout — anchored value perception reduces hesitation. Reports > Events.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate and CVR for products with compare-at price set vs those without. Also check if sale products have lower return rate (better value perception = more confident purchase).", "test_period": "Per sale campaign", "kpi": "Add-to-cart rate on sale products", "id": "T121"}, {"num": 122, "name": "'Most Popular' Plan Label", "category": "Pricing & Anchoring", "tags": "Pricing, Bundles", "difficulty": "Easy", "time": "1h", "bias": "Choice Architecture", "what": "Label the middle pricing option as 'Most Popular' or 'Best Value' to guide choice", "how": "1. On any pricing tiers page, bundle selector, or subscription options: highlight the middle option. 2. Style: add a colored banner 'Most Popular' or 'Best Value' to the middle card. 3. Slightly enlarge the middle card visually. 4. Ensure the middle option is genuinely good value — the label should confirm what customers would choose anyway. 5. Apply to: subscription plans, size bundles, service tiers.", "ga4": "GA4: Track selection events for each pricing tier option (custom events via GTM). Compare selection rate of middle tier before vs after adding label. Explorations > Segment by tier selection.", "shopify": "Shopify: Analytics > Sales by product (if tiers are separate variants). Compare % of orders choosing middle tier before vs after adding 'Most Popular' label. Also check if AOV increases.", "test_period": "4 weeks", "kpi": "Middle tier selection rate / AOV", "id": "T122"}, {"num": 123, "name": "Per-Unit Price Display", "category": "Pricing & Anchoring", "tags": "PDP, Multi-pack", "difficulty": "Easy", "time": "1h", "bias": "Fra
