ay", "uplift": "+4-9% reduction in abandonment", "tags": ["belief", "trust", "pricing"], "eval_signal": "czy PDP wyprzedza dysonans klienta przy droższym produkcie (aktywne uzasadnienie ceny/wyboru) czy zostawia go samemu sobie po kliknięciu 'kup' — różni się od Post-Purchase Rationalization (#81 hub, które działa PO zakupie); to jest praca PRZED decyzją, żeby zmniejszyć tarcie.", "lever": "dodać moduł 'dlaczego to kosztuje więcej / dlaczego wybrać ten wariant' bezpośrednio przy cenie, zamiast czekać aż klient sam musi sobie to uzasadnić (i część zrezygnuje w trakcie).", "risk": "nadmierne 'usprawiedliwianie' ceny może brzmieć defensywnie i wzbudzić podejrzenie zamiast je rozwiać — copy musi być rzeczowe (materiały, produkcja), nie przepraszające.", "evidence_class": "literatura", "evidence": []}, {"id": 127, "name": "Projection Bias", "series": "choice", "def": "The tendency to overestimate how much one's future self will share one's current preferences, thoughts, and values, leading to sub-optimal choices.", "mech": "People predict future wants using their present emotional/physiological state as the baseline, ignoring that context and needs will shift.", "hyp": "Framing a durable-goods purchase around future use-cases ('for the trips you'll take next year') vs only current-moment appeal increases conversion for planning-heavy categories (travel gear, fitness, baby products).", "ctrl": "PDP copy focused on current-moment benefit ('feel great today')", "varnt": "PDP copy adding future-self framing ('still perfect in a year, for the next trip')", "kpi": "Conversion Rate", "kpi2": ["Return rate", "Repeat purchase rate"], "diff": "easy", "time": "1 day copy", "uplift": "+3-7%", "tags": ["choice", "copywriting", "planning"], "eval_signal": "czy copy sprzedażowe odwołuje się tylko do obecnego stanu/potrzeby klienta (impuls 'teraz') czy też do przyszłych, zmieniających się kontekstów użycia — istotne w kategoriach gdzie zakup ma służyć długo (sprzęt, ubrania sezonowe, akcesoria dla dziecka które urośnie).", "lever": "dodać framing 'to posłuży ci też gdy...' pokazujący elastyczność produktu wobec przyszłych, innych potrzeb niż te odczuwane w chwili zakupu.", "risk": "obiecywanie przyszłej przydatności której produkt realnie nie ma (np. 'uniwersalny na każdą okazję' dla wąsko wyspecjalizowanego SKU) prowadzi do rozczarowania i zwrotów.", "evidence_class": "literatura", "evidence": []}, {"id": 128, "name": "Neglect of Probability", "series": "choice", "def": "The tendency to completely disregard probability when making a decision under uncertainty, focusing instead on the worst/best-case outcome itself.", "mech": "When outcomes are emotionally vivid (loss, damage, health), the mind reacts to the scenario itself rather than weighing how likely it actually is.", "hyp": "Extended warranty / protection plan upsell copy that names a vivid failure scenario (vs a generic 'protect your purchase') increases attach rate, regardless of actual failure probability.", "ctrl": "Generic warranty upsell: 'Protect your purchase for $9.99'", "varnt": "Vivid-scenario warranty upsell: 'If it cracks after one drop, we replace it free — $9.99'", "kpi": "Protection plan attach rate", "kpi2": ["Conversion Rate", "Refund/claim rate"], "diff": "easy", "time": "2h copy", "uplift": "+10-20% attach rate", "tags": ["choice", "upsell", "risk"], "eval_signal": "czy upsell ochrony/gwarancji rozszerzonej używa konkretnego, żywego scenariusza szkody czy suchego 'zabezpiecz zakup' — konkretny obraz katastrofy sprzedaje ochronę niezależnie od realnego prawdopodobieństwa awarii.", "lever": "zamienić generyczne copy ochrony/gwarancji na konkretny, łatwy do wyobrażenia scenariusz szkody (upadek, zalanie, zarysowanie) obok ceny ochrony.", "risk": "eksploatowanie lęku przez wyolbrzymianie mało prawdopodobnych scenariuszy żeby sprzedać przewartościowaną gwarancję to praktyka na granicy manipulacji — cena ochrony powinna być uczciwie skalibrowana do realnego ryzyka.", "evidence_class": "literatura", "evidence": []}, {"id": 129, "name": "Pseudocertainty Effect", "series": "choice", "def": "The tendency to make risk-averse choices if the expected outcome is framed as good, but risk-seeking choices if it is framed as bad.", "mech": "People treat outcomes described as 'certain' within a sub-frame as truly certain, even when the overall probability structure is identical to a genuinely uncertain alternative.", "hyp": "Framing free returns as 'guaranteed refund, no risk' (certain-outcome frame) increases conversion more than framing the same policy as 'in the unlikely case you're unhappy, we'll refund you' (uncertain frame), even though the policy is identical.", "ctrl": "Returns policy framed around the exception case ('if you're unhappy, contact us')", "varnt": "Returns policy framed as a certain guarantee ('100% money-back guarantee, always')", "kpi": "Conversion Rate", "kpi2": ["Cart abandonment rate"], "diff": "easy", "time": "1h copy", "uplift": "+2-6%", "tags": ["choice", "risk", "framing"], "eval_signal": "czy polityka zwrotów/gwarancji jest sformułowana jako pewny, bezwarunkowy fakt ('zawsze zwrot') czy jako warunkowy wyjątek ('w razie niezadowolenia') — ta sama polityka konwertuje różnie w zależności od framingu pewności.", "lever": "przeformułować komunikat gwarancji/zwrotów z warunkowego na framing absolutnej pewności, bez zmiany realnych warunków polityki.", "risk": "niskie, o ile framing 'gwarancji' faktycznie pokrywa się z rzeczywistą, łatwą do wyegzekwowania polityką — jeśli w praktyce zwrot jest utrudniony, framing pewności staje się wprowadzającym w błąd obietnicą.", "evidence_class": "literatura", "evidence": []}, {"id": 130, "name": "Scope Neglect", "series": "value", "def": "The tendency to be insensitive to the size/scale of a problem or benefit when evaluating it — willingness to pay barely changes even when the scale changes drastically.", "mech": "People evaluate an offer via a holistic emotional impression rather than doing the math on scale, so '50% more product' and '10% more product' can feel similarly appealing if framed the same way.", "hyp": "Quantifying the scale of a bundle's savings/content explicitly (e.g. '3 months of supply' vs just '+extra free') increases perceived value and AOV more than a vague 'bonus included' claim.", "ctrl": "Bundle badge: 'Includes bonus item!'", "varnt": "Bundle badge with quantified scale: 'Includes 3 extra months of supply (value $45)'", "kpi": "Average Order Value", "kpi2": ["Bundle attach rate", "Conversion Rate"], "diff": "easy", "time": "2h copy", "uplift": "+4-10% AOV", "tags": ["value", "bundling", "framing"], "eval_signal": "czy komunikacja korzyści/oszczędności w ofercie/bundlu jest skwantyfikowana (konkretna liczba, jednostka, wartość) czy zostaje na poziomie ogólnika ('więcej', 'bonus') który nie pozwala klientowi ocenić realnej skali zysku.", "lever": "zawsze podawać konkretną, policzalną skalę korzyści (miesiące zapasu, sztuki, wartość w PLN) zamiast jakościowych określeń typu 'dużo więcej'.", "risk": "niskie — ryzyko pojawia się tylko gdy podana skala jest myląca (np. 'wartość $45' liczona po zawyżonej cenie katalogowej nigdy nieistniejącej w sprzedaży).", "evidence_class": "literatura", "evidence": []}, {"id": 131, "name": "Dread Aversion", "series": "value", "def": "Just as losses yield roughly double the emotional impact of equivalent gains, dread (anticipation of a bad outcome) yields roughly double the emotional impact of savouring (anticipation of a good outcome).", "mech": "The anticipatory emotional weight of a looming negative event is disproportionately larger than the anticipatory pleasure of an equivalent positive event, biasing decisions toward dread-avoidance.", "hyp": "Highlighting the elimination of a dreaded pre-purchase friction (e.g. 'no surprise customs fees', 'no waiting on hold') converts better than promoting an equivalent positive perk (e.g. a small discount) of similar monetary value.", "ctrl": "PDP/checkout promotes a small discount perk ('save 5%')", "varnt": "PDP/checkout promotes dread-elimination messaging ('no hidden fees, no surprises at customs')", "kpi": "Checkout completion rate", "kpi2": ["Cart abandonment rate", "Conversion Rate"], "diff": "easy", "time": "2h copy", "uplift": "+3-8%", "tags": ["value", "trust", "checkout"], "eval_signal": "czy komunikacja przy checkout aktywnie neutralizuje znane źródła 'dread' klienta (ukryte opłaty, cło, długi czas oczekiwania na obsługę, trudny zwrot) czy skupia się wyłącznie na promowaniu pozytywnych perków — eliminacja dreadu ma silniejszy wpływ niż dodanie porównywalnej korzyści.", "lever": "zidentyfikować najczęstszy 'dread' klientów w danej kategorii (cło, długość dostawy, trudność zwrotu) i wyeksponować jego jawne wyeliminowanie blisko CTA, priorytetowo względem promowania nowych bonusów.", "risk": "obiecanie eliminacji dreadu (np. 'no hidden fees') które nie jest prawdziwe w 100% przypadków (np. cło poza UE) niszczy zaufanie mocniej niż brak takiej obietnicy w ogóle.", "evidence_class": "literatura", "evidence": []}, {"id": 132, "name": "Ballot Order Effect", "series": "choice", "def": "Options listed first in a sequence receive a small but statistically significant advantage in selection compared to those listed later, independent of merit.", "mech": "Primacy in a list of similar, hard-to-differentiate options gets extra consideration weight simply from position, especially under low involvement or high choice count.", "hyp": "In category/listing pages with many similar SKUs (private label lookalikes, low differentiation), the products placed in the first 1-2 grid positions receive disproportionately more clicks than their conversion-adjusted rank would justify — reordering to put margin-favorable SKUs first increases blended margin without hurting conversion.", "ctrl": "Default sort: relevance/popularity algorithm only", "varnt": "Manually pin 1-2 margin-favorable, quality-equivalent SKUs to top grid positions", "kpi": "Blended margin per session", "kpi2": ["Click-through rate by grid position", "Conversion Rate"], "diff": "medium", "time": "1 day (merchandising rules)", "uplift": "+2-5% blended margin", "tags": ["choice", "merchandising", "listing"], "eval_signal": "w kategoriach z wieloma podobnymi, trudnymi do odróżnienia produktami — czy pierwsze pozycje siatki/listingu są przypadkowe (czysty algorytm) czy świadomie zarządzane; sama POZYCJA na liście przesuwa wybór niezależnie od jakości produktu, więc warto to świadomie wykorzystać zamiast zostawiać przypadkowi.", "lever": "w listingach o niskiej różnicowalności produktów świadomie zarządzać pierwszymi pozycjami siatki (np. produkty własnej marki/wyższej marży) zamiast polegać wyłącznie na sortowaniu 'popularność'.", "risk": "systematyczne wypychanie na start listy produktów gorszych jakościowo tylko dla marży, kosztem realnie lepszych opcji klienta, to erozja zaufania do platformy w dłuższym okresie — różni się od Serial Position/Primacy (#82, #96 hub) tym, że dotyczy KATEGORII produktowej z wieloma podobnymi SKU, nie sekwencji informacji na jednej stronie.", "evidence_class": "literatura", "evidence": []}, {"id": 133, "name": "Zero-Sum Bias", "series": "belief", "def": "A situation is incorrectly perceived to be like a zero-sum game, in which any gain by one party necessarily comes at the expense of another.", "mech": "People instinctively assume limited/fixed resources, so 'someone else getting a deal' feels like it comes at their own expense, even when supply is not actually limited.", "hyp": "Communicating that a promo/discount is available to everyone who qualifies (non-zero-sum: 'unlimited for members') vs implying a limited pool ('first 50 only') changes which framing drives more urgency depending on trust level of the segment — for high-trust repeat customers, non-scarcity framing reduces perceived unfairness and cart abandonment tied to 'will I miss out to someone else' anxiety.", "ctrl": "Promo framed as competitive/limited ('first 50 customers only')", "varnt": "Promo framed as universally available to qualifying segment ('every member gets this, no limit')", "kpi": "Cart abandonment rate", "kpi2": ["Conversion Rate", "Customer satisfaction / NPS"], "diff": "easy", "time": "2h copy", "uplift": "+2-5% (segment-dependent)", "tags": ["belief", "fairness", "promo"], "eval_signal": "czy komunikacja promocji/rabatów sugeruje rywalizację o ograniczoną pulę korzyści (co u części klientów, zwłaszcza lojalnych, budzi poczucie niesprawiedliwości 'inny dostanie kosztem mnie') zamiast jasno komunikować że korzyść jest dostępna dla każdego kto spełnia warunek.", "lever": "dla segmentów lojalnościowych/powracających klientów testować framing 'dostępne dla wszystkich uprawnionych' zamiast czystej rywalizacji o pulę — zmniejsza to lęk przed przegraną z innym klientem.", "risk": "usunięcie elementu rywalizacji/pilności może obniżyć urgency u nowych, jednorazowych klientów — framing warto różnicować per segment, nie stosować uniwersalnie.", "evidence_class": "literatura", "evidence": []}, {"id": 134, "name": "Illusion of Control", "series": "choice", "def": "The tendency to overestimate one's degree of influence over external events or outcomes, even those that are largely random or predetermined.", "mech": "Active participation (choosing, configuring, customizing) creates a felt sense of agency that increases confidence in and attachment to the outcome, regardless of whether the choices actually change the result.", "hyp": "Adding a lightweight product configurator/quiz (color, size, 'style match') before showing a recommendation increases conversion vs showing the same final recommendation with no interactive step, even when the configurator barely changes the outcome.", "ctrl": "Direct product recommendation shown immediately", "varnt": "Same recommendation reached via a 3-step interactive configurator/quiz", "kpi": "Conversion Rate", "kpi2": ["Engagement rate (quiz completion)", "Return rate"], "diff": "medium", "time": "2-3 days dev", "uplift": "+6-15%", "tags": ["choice", "personalization", "engagement"], "eval_signal": "czy ścieżka do rekomendacji produktu daje klientowi poczucie aktywnego wyboru/wpływu (quiz, konfigurator, kreator) czy produkt jest po prostu pokazany — poczucie sprawczości podnosi przywiązanie do wyniku nawet gdy wybory niewiele zmieniają finalną rekomendację.", "lever": "wprowadzić krótki interaktywny krok (quiz doboru, konfigurator wariantu) przed pokazaniem rekomendowanego produktu, budując poczucie że to klient 'wybrał', nie platforma.", "risk": "konfigurator który jest czystą fasadą (każda ścieżka i tak prowadzi do tego samego produktu) jest łatwy do zdemaskowania i wtedy działa odwrotnie — musi realnie różnicować wynik choć w części.", "evidence_class": "literatura", "evidence": []}, {"id": 135, "name": "Survivorship Bias", "series": "belief", "def": "Concentrating on the people or things that 'survived' some process and inadvertently overlooking those that did not, because of their lack of visibility.", "mech": "Visible successes (5-star reviews, before/after photos, testimonials) dominate perception because failures/dissatisfied customers are structurally less likely to leave visible traces (they simply leave without posting).", "hyp": "Actively surfacing a small share of critical/3-star reviews alongside top reviews (vs showing only curated 5-star testimonials) increases trust and net conversion, because it counteracts the implicit 'only happy people write reviews' skepticism.", "ctrl": "Reviews section shows only hand-picked 5-star testimonials", "varnt": "Reviews section shows full distribution including some critical reviews with brand responses", "kpi": "Conversion Rate", "kpi2": ["Trust score", "Review page engagement"], "diff": "easy", "time": "half day", "uplift": "+3-7%", "tags": ["belief", "trust", "reviews"], "eval_signal": "czy sekcja recenzji pokazuje wyłącznie wyselekcjonowane, entuzjastyczne opinie (co doświadczeni kupujący online rozpoznają jako 'przetrwałych zwycięzców' i intuicyjnie nie ufają) czy też pełny, wiarygodny rozkład ocen wraz z odpowiedziami marki na krytykę.", "lever": "pokazać pełny, niewyselekcjonowany rozkład ocen (w tym część krytycznych, z odpowiedzią marki) zamiast tylko najlepszych — paradoksalnie zwiększa to wiarygodność i konwersję.", "risk": "ukrywanie/usuwanie negatywnych recenzji (moderacja wyłącznie kosmetyczna) to praktyka wprost naruszająca zaufanie i w wielu jurysdykcjach niezgodna z prawem konsumenckim dot. autentyczności opinii.", "evidence_class": "literatura", "evidence": []}, {"id": 136, "name": "Barnum Effect", "series": "belief", "def": "The tendency for individuals to give high accuracy ratings to descriptions of their personality or needs that supposedly are tailored specifically for them, but are in fact vague and general enough to apply to almost anyone.", "mech": "Vague, flattering, broadly-applicable statements feel personally accurate because the reader unconsciously fills in specific details from their own life.", "hyp": "A 'personalized recommendation' quiz result that uses vague-but-flattering language ('you value both quality and versatility') feels more accurate and trustworthy to users than a generic 'bestseller' label, driving higher conversion on the recommended product — even when the underlying recommendation logic is simple.", "ctrl": "Product shown with generic 'Bestseller' label", "varnt": "Same product shown as 'Your personalized match' with Barnum-style descriptive copy", "kpi": "Conversion Rate (post-quiz recommendation)", "kpi2": ["Quiz completion rate", "Perceived personalization (survey)"], "diff": "easy", "time": "half day copy", "uplift": "+4-10%", "tags": ["belief", "personalization", "quiz"], "eval_signal": "czy 'spersonalizowana' rekomendacja (po quizie/kreatorze) faktycznie różnicuje się między klientami czy używa uniwersalnego, mgławicowego opisu który pasowałby do każdego — sam ton 'to dopasowane do Ciebie' podnosi zaufanie nawet przy płytkiej personalizacji.", "lever": "sformułować wynik quizu/rekomendacji jako spersonalizowany opis (nawet jeśli logika dopasowania jest prosta), unikając surowego 'oto nasz bestseller'.", "risk": "fałszywe przedstawianie generycznej rekomendacji jako 'głęboko spersonalizowanej AI' gdy w rzeczywistości każdy dostaje to samo, to wprowadzanie w błąd co do rzeczywistej personalizacji usługi.", "evidence_class": "literatura", "evidence": []}, {"id": 137, "name": "Reactive Devaluation", "series": "social", "def": "Devaluing a proposal, product, or claim simply because it is perceived to originate from an adversary or a distrusted source.", "mech": "The same information/offer is judged less favorably when its source is seen as having a conflicting interest, independent of the actual merit of the content.", "hyp": "Product claims backed by independent/third-party sources (lab test, certification body) are trusted and convert better than the identical claim made only in brand-authored copy, because brand-authored claims are reactively devalued as self-interested.", "ctrl": "Product claim stated only in brand copy ('clinically proven to reduce X by 30%')", "varnt": "Same claim with visible third-party source/certification badge linked to the study", "kpi": "Conversion Rate", "kpi2": ["Trust score", "Claim click-through (to source)"], "diff": "medium", "time": "1 day (sourcing + design)", "uplift": "+3-8%", "tags": ["social", "trust", "credibility"], "eval_signal": "czy mocne twierdzenia produktowe (skuteczność, skład, wyniki badań) są poparte wyłącznie własnym copy marki czy widocznym, klikalnym odniesieniem do niezależnego źródła — te same słowa od 'zainteresowanej strony' są automatycznie dyskontowane przez klienta.", "lever": "dla każdego mocnego claimu dodać widoczne odniesienie do niezależnego źródła (badanie, certyfikat, recenzja zewnętrznego eksperta) zamiast polegać na samodeklaracji marki.", "risk": "powoływanie się na fałszywe lub nieistniejące 'niezależne' certyfikaty/badania żeby ominąć naturalną nieufność do claimów marki to bezpośrednie oszustwo konsumenckie.", "evidence_class": "literatura", "evidence": []}], "kpiGroups": [{"base": "Conversion Rate", "slug": "conversion-rate", "total": 70, "variant_count": 22, "variants": [{"variant": "(bazowy)", "example": "Conversion Rate", "count": 48, "biases": [{"id": 1, "name": "Availability Heuristic", "series": "social"}, {"id": 3, "name": "Illusory Truth Effect", "series": "belief"}, {"id": 11, "name": "Base Rate Fallacy", "series": "belief"}, {"id": 16, "name": "Self-Relevance Effect", "series": "belief"}, {"id": 17, "name": "Negativity Bias", "series": "value"}, {"id": 20, "name": "Contrast Effect", "series": "value"}, {"id": 21, "name": "Distinction Bias", "series": "choice"}, {"id": 22, "name": "Focusing Effect", "series": "attention"}, {"id": 23, "name": "Framing Effect", "series": "value"}, {"id": 27, "name": "Congruence Bias", "series": "belief"}, {"id": 30, "name": "Selective Perception", "series": "attention"}, {"id": 39, "name": "Authority Bias", "series": "social"}, {"id": 40, "name": "Liking Bias", "series": "social"}, {"id": 43, "name": "Scarcity", "series": "value"}, {"id": 44, "name": "Unity Bias", "series": "social"}, {"id": 46, "name": "False Consensus Effect", "series": "belief"}, {"id": 47, "name": "Dunning-Kruger Effect", "series": "choice"}, {"id": 52, "name": "Hick's Law", "series": "choice"}, {"id": 60, "name": "Loss Aversion", "series": "value"}, {"id": 62, "name": "IKEA Effect", "series": "belief"}, {"id": 64, "name": "Zero-Risk Bias", "series": "value"}, {"id": 69, "name": "Ambiguity Bias", "series": "choice"}, {"id": 73, "name": "Social Comparison Bias", "series": "social"}, {"id": 80, "name": "Serial Position Effect", "series": "memory"}, {"id": 102, "name": "Hindsight Bias II", "series": "memory"}, {"id": 105, "name": "Childhood Amnesia", "series": "memory"}, {"id": 109, "name": "Automation Trust Bi zby na zdjęciu — więcej nikt nie przeczyta", "Wymiar pokazuj linią odniesienia, nie samą liczbą w powietrzu", "Tekst duży i kontrastowy — miniatura listingu jest mała", "Nie mieszaj: albo warianty, albo wymiary — dwie osobne informacje na dwóch zdjęciach"], "examples": {"before": {"img": "data/img/examples/before_1.jpg", "cap": "Before — zdjęcie nie mówi nic o rozmiarze ani materiale"}, "after": [{"img": "data/img/examples/info_1.jpg", "cap": "Przykład 1 — wymiary + materiał na zdjęciu (10mm, 40cm+5cm, stal)"}, {"img": "data/img/examples/info_2.jpg", "cap": "Przykład 2 — warianty obok siebie + wymiar (co jest do wyboru)"}]}, "biases": [{"ref": "Ambiguity Bias", "why": "Klient unika wyboru, gdy czegoś nie wie — podanie wymiaru i materiału zdejmuje niepewność z decyzji"}, {"ref": "Picture Superiority Effect", "why": "Liczba na zdjęciu zostaje w pamięci; ta sama liczba w opisie zostaje nieprzeczytana"}, {"ref": "Primacy Effect", "why": "Główne zdjęcie jest pierwsze — informacja tam trafia do wszystkich, nie tylko do tych, którzy scrollują"}], "kpi": {"primary": "Conversion Rate", "secondary": ["Return rate", "CTR", "CS inquiry volume"]}, "event": {"status": "ok", "names": "view_item + add_to_cart + purchase (zwroty z systemu zamówień)"}, "measure": {"method": "GA4 Before/After + zwroty z systemu zamówień", "steps": ["Baseline 14–30 dni PRZED: CR i return rate wybranych produktów", "Podmień główne zdjęcie na informacyjne", "Po 30 dniach porównaj CR: różnica >=5% = sygnał, >=10% = wyraźny efekt", "Zwroty licz w oknie 30–60 dni (spływają z opóźnieniem) — spadek zwrotów to główny zysk tej taktyki", "Kontrola: liczba pytań do obsługi o rozmiar/materiał — powinna spaść"]}, "value": {"best": "CR +10–20% · zwroty -10–25%", "typical": "CR +3–10% · zwroty -5–15%", "learn": "Czy brak informacji o rozmiarze/materiale blokował decyzję zakupową", "window": "30 dni (zwroty 30–60 dni)"}, "sequences": [{"text": "Przetestuj co działa mocniej jako główne: wymiary czy warianty", "type": "sequence", "label": "Sekwencja — MODIFY primary_image"}, {"text": "Zrób to samo z ujęciem produktu na człowieku", "type": "composite", "label": "Powiązana — EXP-002"}], "score": {"total": 13, "max": 14, "dims": [["Zaadresowanie", 2, "primary_image (PDP + miniatura listingu)"], ["Konkret wykonania", 2, "5 kroków, dane z pytań klientów"], ["Mechanizm", 2, "Ambiguity / Picture Superiority / Primacy"], ["Mierzalność", 2, "CR + return rate + pytania do CS"], ["Określony efekt", 2, "CR +3–20%, zwroty -5–25%"], ["Wykonalność", 2, "Easy — grafika na zdjęciu, odwracalna"], ["Atomowość", 1, "wymiary i warianty to dwie informacje (można rozbić)"]]}, "kpi_impact": {"visits": "na", "ctr": "flat", "pdp": "flat", "atc": "up", "cr": "up", "aup": "na", "aov": "na", "upt": "na", "revenue": "up", "returns": "down"}}], "rawTactics": [{"num": 1, "name": "Sticky ATC Button (Mobile)", "category": "UX + Functionality", "tags": "Mobile, Conversion", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Make the Add-to-Cart button stick to the bottom of the screen on mobile as user scrolls", "how": "1. Open your theme editor (Online Store > Themes > Customize). 2. Find 'Product page' section. 3. Enable 'Sticky add to cart' if built-in, or install free app 'Sticky Add To Cart' (Pumper). 4. Set button to appear after user scrolls past native ATC. 5. Style to match your brand colors.", "ga4": "GA4: Compare add_to_cart event rate (Events > add_to_cart / Sessions) before vs after. Filter by device category = mobile. Use Explorations > Funnel to see PDP → ATC step on mobile.", "shopify": "Shopify: Analytics > Reports > Online store conversion rate, filter by device = Mobile. Compare Add to cart rate week before vs week after.", "test_period": "3 weeks", "kpi": "Add-to-cart rate (mobile)", "id": "T001"}, {"num": 2, "name": "Checkout Progress Bar", "category": "UX + Functionality", "tags": "Checkout, Trust", "difficulty": "Easy", "time": "1h", "bias": "Progress Effect", "what": "Show a visual step indicator (Step 1 of 3) at the top of every checkout page", "how": "1. In Shopify Admin go to Settings > Checkout > Customize. 2. Add a Banner or use a checkout app like Checkout Blocks (free tier). 3. Add text or icons: 'Cart > Shipping > Payment > Confirmation'. 4. Highlight the active step. 5. Test on mobile and desktop.", "ga4": "GA4: Funnel Exploration: begin_checkout → add_shipping_info → add_payment_info → purchase. Measure drop-off at each step before vs after.", "shopify": "Shopify: Analytics > Reports > Checkout funnel. Compare abandonment rate at each step (Reached checkout vs Completed order).", "test_period": "3 weeks", "kpi": "Checkout completion rate", "id": "T002"}, {"num": 3, "name": "Quick View Modal", "category": "UX + Functionality", "tags": "Navigation, Conversion", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Let shoppers preview product details in a popup without leaving the category page", "how": "1. Install free Shopify app 'Quickview — Instant Preview'. 2. Enable on collection/category pages. 3. Ensure modal shows: main image gallery, price, size/variant selector, ATC button, short description. 4. Do NOT include full page content — keep it scannable. 5. Test on mobile that modal is scrollable.", "ga4": "GA4: Create a custom event 'quickview_open' via GTM when modal triggers. Then track if those sessions have higher add_to_cart rate vs sessions without quickview. Use Explorations > Segment Overlap.", "shopify": "Shopify: Compare Add-to-cart rate on collection pages before vs after. Analytics > Sessions by landing page, filter to /collections/* pages.", "test_period": "3 weeks", "kpi": "Add-to-cart rate from collections", "id": "T003"}, {"num": 4, "name": "Real-Time Stock Counter", "category": "UX + Functionality", "tags": "Scarcity, PDP", "difficulty": "Easy", "time": "1h", "bias": "Scarcity / Urgency", "what": "Show remaining stock count when below a threshold (e.g. 'Only 4 left')", "how": "1. In Shopify theme editor, find Product page > enable 'Show inventory count' OR use app 'Urgency Bear'. 2. Set threshold: only show when stock < 10. 3. Display as: 'Only [X] left in stock'. 4. Use amber/red color. 5. Hide when stock is high — scarcity only works when real.", "ga4": "GA4: Compare add_to_cart event rate on PDPs with low stock label vs without. Create custom dimension 'low_stock' via GTM dataLayer push. Analyze in Explorations.", "shopify": "Shopify: Analytics > Reports > Sales by product. Compare conversion rate (sessions to orders) for products that had low-stock badge vs those that didn't over same period.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on low-stock products", "id": "T004"}, {"num": 5, "name": "Back-in-Stock Notification", "category": "UX + Functionality", "tags": "Retention, Email", "difficulty": "Easy", "time": "2h", "bias": "FOMO", "what": "Capture emails for out-of-stock products and auto-notify when restocked", "how": "1. Install 'Back In Stock — Restock Alerts' (free, Shopify App Store). 2. Place 'Notify Me' button on OOS product pages. 3. Set auto-send email when stock > 0. 4. Customize email with product image and direct ATC link. 5. Track sign-up rate by product to prioritize restocking decisions.", "ga4": "GA4: Track custom event 'notify_me_signup' via GTM. Monitor how many signed up vs how many converted when email sent. Create Exploration: notify_me_signup → purchase path.", "shopify": "Shopify: App dashboard shows sign-ups and conversions. Also check Analytics > Email campaigns if using Shopify Email to track open/click/purchase from restock notification.", "test_period": "Ongoing", "kpi": "Restock email conversion rate", "id": "T005"}, {"num": 6, "name": "Persistent Mini-Cart", "category": "UX + Functionality", "tags": "Cart, Conversion", "difficulty": "Medium", "time": "2h", "bias": "Commitment & Consistency", "what": "Show a slide-out cart drawer that stays accessible without leaving the page", "how": "1. In theme editor check if your theme has 'Cart type: Drawer' option — enable it. 2. If not, install 'Slide Cart Upsell by AMP'. 3. Ensure mini-cart shows: product images, quantities, subtotal, free shipping progress bar, CTA. 4. Add upsell suggestion inside the drawer. 5. Make cart icon in header show item count badge.", "ga4": "GA4: Compare sessions with view_cart event vs those without, and their purchase rate. Also measure: begin_checkout rate from users who interacted with mini-cart vs full cart page.", "shopify": "Shopify: Analytics > Reports > Online store conversion rate. Compare 'Reached checkout' rate before vs after enabling drawer cart. Also check if AOV changes.", "test_period": "3 weeks", "kpi": "Reached checkout rate", "id": "T006"}, {"num": 7, "name": "One-Click Reorder Button", "category": "UX + Functionality", "tags": "Retention, UX", "difficulty": "Medium", "time": "3h", "bias": "Cognitive Ease", "what": "Let returning customers reorder their last purchase in one click from account page or email", "how": "1. In Shopify Admin > Online Store > Themes, edit account/order page template. 2. Add 'Reorder' button that adds previous order items to cart. 3. Alternatively use app 'Reorder Master'. 4. Also add reorder CTA to post-purchase emails (after 30/60 days based on repurchase cycle). 5. Deep-link button to pre-filled cart.", "ga4": "GA4: Track custom event 'reorder_click'. Compare purchase completion rate of reorder sessions vs standard sessions. Analyze in Explorations > Funnel.", "shopify": "Shopify: Analytics > Reports > Returning customer rate. Track orders where cart was pre-filled via reorder link. Tag these orders with UTM parameter reorder=true and filter in reports.", "test_period": "6 weeks", "kpi": "Returning customer purchase rate", "id": "T007"}, {"num": 8, "name": "Guest Checkout Option", "category": "UX + Functionality", "tags": "Checkout, Conversion", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Remove forced account creation — always offer guest checkout as primary path", "how": "1. Shopify Admin > Settings > Checkout. 2. Under 'Customer accounts' select 'Accounts are optional'. 3. Make Guest Checkout the first/primary button. 4. Offer account creation AFTER purchase on confirmation page. 5. Confirm with mobile test that guest path is smooth.", "ga4": "GA4: Funnel: begin_checkout → purchase. Compare completion rates before vs after. Also check if 'accounts' event drops — GA4 may track account creation separately via your setup.", "shopify": "Shopify: Analytics > Reports > Online store conversion rate. Compare Reached checkout → Completed order rate. Also check if new customer rate increases.", "test_period": "3 weeks", "kpi": "Checkout completion rate", "id": "T008"}, {"num": 9, "name": "Product Image Zoom on Hover", "category": "UX + Functionality", "tags": "PDP, Visual", "difficulty": "Easy", "time": "30 min", "bias": "Endowment Effect", "what": "Enable hover-to-zoom or click-to-zoom on product images on desktop", "how": "1. In theme editor > Product page, enable 'Image zoom' or 'Zoom on hover' if available. 2. If not in theme, install 'Magic Zoom Plus' or use free 'Swiper Slider' with zoom. 3. Ensure high-res images (min 2000px) are uploaded. 4. On mobile, enable pinch-to-zoom. 5. Test that zoom doesn't break on touch screens.", "ga4": "GA4: Track custom event 'image_zoom' via GTM (on mouseenter or click of zoom element). Compare add_to_cart rate of sessions with zoom interaction vs without. Explorations > Segment Overlap.", "shopify": "Shopify: Indirectly measure via add-to-cart rate on PDPs. Analytics > Reports > Product page views vs Add-to-cart events (requires GA4 integration or pixel tracking).", "test_period": "4 weeks", "kpi": "Add-to-cart rate (desktop)", "id": "T009"}, {"num": 10, "name": "Recently Viewed Products Widget", "category": "UX + Functionality", "tags": "Navigation, Retention", "difficulty": "Easy", "time": "1h", "bias": "Mere Exposure Effect", "what": "Show a 'Recently viewed' product strip on PDP, cart, and homepage for returning visitors", "how": "1. Many Shopify themes have this built-in — check theme editor > Product page > 'Recently viewed products'. 2. If not, install free 'Recently Viewed Products' app. 3. Place widget: bottom of PDP, bottom of cart page, homepage for logged-in users. 4. Show min 4, max 8 products. 5. Exclude currently viewed product from the strip.", "ga4": "GA4: Track custom event 'recently_viewed_click'. Measure if sessions that interact with widget have higher purchase rate. Explorations > Funnel from recently_viewed_click → purchase.", "shopify": "Shopify: Compare returning visitor conversion rate before/after. Analytics > Reports > Returning customers. Also look at sessions-to-purchase for returning visitors specifically.", "test_period": "4 weeks", "kpi": "Returning visitor conversion rate", "id": "T010"}, {"num": 11, "name": "Compare Products Feature", "category": "UX + Functionality", "tags": "Navigation, Decision", "difficulty": "Medium", "time": "1 day", "bias": "Choice Architecture", "what": "Let users select 2-3 products and compare specs, price, and features side-by-side", "how": "1. Install 'Product Compare' app (e.g. 'Smarty' or 'EasyCompare'). 2. Add compare checkbox to collection page product cards. 3. Show comparison table with key attributes: price, materials, dimensions, ratings, key features. 4. Add ATC button for each in the comparison view. 5. Best for: fashion (fit/materials), electronics, skincare (ingredients).", "ga4": "GA4: Track 'compare_open' and 'compare_add_to_cart' custom events via GTM. Compare conversion rate of sessions using compare vs not. Explorations > Segment Overlap.", "shopify": "Shopify: Measure add-to-cart rate on collection pages before vs after. Analytics > Online store sessions by page. Compare CVR on collection pages where compare is enabled.", "test_period": "4 weeks", "kpi": "Collection page add-to-cart rate", "id": "T011"}, {"num": 12, "name": "Saved Addresses at Checkout", "category": "UX + Functionality", "tags": "Checkout, Friction", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Auto-populate returning customer shipping details at checkout", "how": "1. Ensure customer accounts are enabled (Settings > Checkout > Accounts optional or required). 2. For logged-in users Shopify auto-fills saved addresses — verify this works in your theme. 3. Add prompt at checkout: 'Log in to use your saved address'. 4. For guest returners, use Shopify's browser autofill compatibility — ensure form fields have correct autocomplete attributes (name, address-line1, etc.).", "ga4": "GA4: Funnel Exploration: begin_checkout → add_shipping_info. Compare drop-off rate for logged-in vs guest sessions. Use user property 'logged_in' as segment.", "shopify": "Shopify: Compare checkout completion rate for customers with accounts vs guest. Analytics > Reports > Customers > filter by account status.", "test_period": "4 weeks", "kpi": "Checkout completion rate (returning)", "id": "T012"}, {"num": 13, "name": "Search Autocomplete with Images", "category": "UX + Functionality", "tags": "Navigation, Search", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Show product image thumbnails and categories in the search dropdown as user types", "how": "1. Install 'Searchie' or 'Smart Search & Filter' app (both have free tiers). 2. Enable visual autocomplete: show product image, name, price in dropdown. 3. Add 'Popular searches' and 'Recent searches' sections. 4. Configure synonym mapping (e.g. 'sneakers' = 'trainers'). 5. Add 'No results' fallback with suggestions.", "ga4": "GA4: Track search events: view_search_results. Compare sessions with search vs without: purchase rate, pages per session, bounce rate. Also track if 'no results' rate decreases. Reports > Engagement > Events.", "shopify": "Shopify: Online Store > Search Analytics (if enabled). Compare search-to-purchase conversion rate before vs after. Check top search terms and 'no results' queries.", "test_period": "3 weeks", "kpi": "Search-to-purchase conversion rate", "id": "T013"}, {"num": 14, "name": "Exit Intent Detection", "category": "UX + Functionality", "tags": "Conversion, Retention", "difficulty": "Medium", "time": "2h", "bias": "Loss Aversion", "what": "Show a targeted message or offer when user moves cursor toward closing the tab (desktop)", "how": "1. Install 'OptiMonk' or 'Privy' (free tiers available). 2. Set trigger: mouse leaves top of viewport (exit intent). 3. Desktop only — use scroll-up trigger for mobile. 4. Message options: a) Email capture for discount, b) 'Don't forget your cart' reminder, c) 'Here's what others bought instead'. 5. Set cookie to show max once per 7 days per user.", "ga4": "GA4: Track custom event 'exit_intent_shown' and 'exit_intent_converted' via GTM. Compare bounce rate and session duration before vs after. Also measure email capture rate from exit intent specifically.", "shopify": "Shopify: Track via app dashboard (OptiMonk/Privy show conversion rates). Also compare abandoned cart rate in Analytics > Reports > Abandoned checkouts before vs after.", "test_period": "4 weeks", "kpi": "Bounce rate / Email capture rate", "id": "T014"}, {"num": 15, "name": "Back-to-Top Button", "category": "UX + Functionality", "tags": "Navigation, Mobile", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Show a floating 'back to top' button on long pages (PDP, blog, category)", "how": "1. In theme editor check if 'Back to top button' exists — enable it. 2. If not, add via theme code: a small fixed-position button that appears after 300px scroll. 3. Place bottom-right (desktop) or bottom-center (mobile). 4. Use an upward arrow icon, not text. 5. Ensure it doesn't overlap the sticky ATC button on mobile.", "ga4": "GA4: Track scroll_depth event (GA4 tracks 90% scroll automatically). Compare pages per session and time on page before vs after on long pages. Reports > Engagement > Pages and screens.", "shopify": "Shopify: Indirect — compare pages/session and session duration in Analytics. Also look at drop-off in heatmap tools (Hotjar free tier) on long category pages.", "test_period": "3 weeks", "kpi": "Pages per session / Scroll depth", "id": "T015"}, {"num": 16, "name": "Wishlist / Save for Later", "category": "UX + Functionality", "tags": "Retention, Email", "difficulty": "Easy", "time": "2h", "bias": "Commitment & Consistency", "what": "Let shoppers save products to a wishlist and optionally get a reminder email", "how": "1. Install 'Wishlist Plus' (free tier — up to 500 wishlists/month). 2. Add heart icon to product cards on collections and PDP. 3. Allow wishlist without account (saves to local storage). 4. Set up wishlist reminder email after 7 days of inactivity. 5. Add 'Price drop' alert trigger: email when wishlisted item goes on sale.", "ga4": "GA4: Track custom event 'wishlist_add' and 'wishlist_purchase'. Create Exploration: wishlist_add → purchase funnel. Compare conversion rate of wishlist users vs non-wishlist users over 30 days.", "shopify": "Shopify: Wishlist Plus dashboard shows saves and conversions. Also compare returning customer rate before vs after. Analytics > Reports > Returning customers.", "test_period": "6 weeks", "kpi": "Wishlist-to-purchase conversion rate", "id": "T016"}, {"num": 17, "name": "Infinite Scroll vs Pagination Test", "category": "UX + Functionality", "tags": "Navigation, Discovery", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Test whether removing pagination and loading products automatically increases engagement and sales", "how": "1. In theme editor check collection page settings — some themes offer 'Load more' or 'Infinite scroll'. 2. Enable infinite scroll (or 'Load more' button as middle ground). 3. Run for 3 weeks, then switch back to pagination for 3 weeks. 4. Compare metrics. 5. 'Load more' button often outperforms both extremes.", "ga4": "GA4: Compare: products_viewed per session, add_to_cart rate, session duration, pages_per_session on collection pages. Use date comparison in Reports > Engagement > Pages.", "shopify": "Shopify: Compare add-to-cart rate from collection pages, and overall session-to-purchase conversion. Analytics > Online Store Conversion Rate, filter by traffic source.", "test_period": "6 weeks (3+3)", "kpi": "Products viewed per session", "id": "T017"}, {"num": 18, "name": "Filter Persistence", "category": "UX + Functionality", "tags": "Navigation, UX", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Remember user's filter selections when they navigate away and return to a category page", "how": "1. Most Shopify filter apps (SearchPie, Boost Commerce) support URL-based filters that persist via browser history. 2. Enable URL parameter-based filtering in your filter app. 3. Filters should appear in URL as ?filter.p.tag=blue. 4. Breadcrumb should show active filters. 5. Add 'Clear all filters' button prominently.", "ga4": "GA4: Track 'filter_applied' custom event. Compare session depth (pages per session) and add_to_cart rate for sessions that use filters vs sessions that don't. Explorations > Segment Overlap.", "shopify": "Shopify: Compare collection page bounce rate and add-to-cart rate. If using SearchPie/Boost, their dashboards show filter usage analytics and conversion rates per filter combination.", "test_period": "4 weeks", "kpi": "Collection page engagement / add-to-cart", "id": "T018"}, {"num": 19, "name": "Lazy Image Loading", "category": "UX + Functionality", "tags": "Performance, Mobile", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Defer loading of off-screen images to speed up initial page load", "how": "1. In your theme's image tags, add loading='lazy' attribute. Most modern Shopify themes already do this — verify in browser DevTools (Inspect > Network > Img). 2. If not, edit theme Liquid files: add loading='lazy' to all <img> tags except above-the-fold hero. 3. Also compress images: use Shopify's built-in image optimizer or install 'TinyIMG'. 4. Target: LCP < 2.5s on mobile.", "ga4": "GA4: Reports > Tech > Web vitals. Monitor LCP (Largest Contentful Paint) before vs after. Also compare mobile bounce rate and session duration. Reports > Tech > Devices.", "shopify": "Shopify: Online Store > Themes > Speed score (Shopify's built-in). Compare speed score before/after. Also use Google PageSpeed Insights on key pages and record scores.", "test_period": "3 weeks", "kpi": "Page speed score / Mobile bounce rate", "id": "T019"}, {"num": 20, "name": "Sticky Navigation Bar", "category": "UX + Functionality", "tags": "Navigation, UX", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Keep the header/navigation visible as users scroll down on all pages", "how": "1. In theme editor, look for 'Sticky header' option — enable it. 2. Ensure sticky header shows: logo, search, cart icon with count, nav links. 3. Consider a 'compact' sticky header (smaller than full header). 4. Test that sticky header doesn't cover content or CTAs on mobile. 5. Ensure it doesn't obscure popups or cookie banners.", "ga4": "GA4: Compare pages per session, time on site, and add_to_cart rate before vs after. Also check if search usage increases (track view_search_results event). Reports > Engagement.", "shopify": "Shopify: Compare overall online store conversion rate before vs after in Analytics > Reports. Check if average session duration increases. No direct metric — use overall CVR as proxy.", "test_period": "3 weeks", "kpi": "Pages per session / Conversion rate", "id": "T020"}, {"num": 21, "name": "Breadcrumb Navigation", "category": "UX + Functionality", "tags": "Navigation, SEO", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Show the navigation path (Home > Category > Product) on all PDP and category pages", "how": "1. Check if your theme includes breadcrumbs — if yes, enable in theme editor. 2. If not, add breadcrumb Liquid snippet to product and collection templates. 3. Ensure breadcrumbs are clickable links back to parent categories. 4. Add structured data (JSON-LD BreadcrumbList schema) for SEO benefit. 5. Test on mobile — breadcrumbs should wrap neatly.", "ga4": "GA4: Track clicks on breadcrumb links as custom event 'breadcrumb_click' via GTM (click trigger on breadcrumb elements). Compare bounce rate on PDPs before vs after. Reports > Engagement > Pages.", "shopify": "Shopify: Compare bounce rate and pages/session on product pages. Analytics > Online Store > Sessions by landing page — look at product page bounce rates before vs after.", "test_period": "4 weeks", "kpi": "PDP bounce rate / Pages per session", "id": "T021"}, {"num": 22, "name": "Product Video in Gallery", "category": "UX + Functionality", "tags": "PDP, Visual", "difficulty": "Medium", "time": "2h per product", "bias": "Endowment Effect", "what": "Add a short 15-30 second product video as the first or second item in the image carousel", "how": "1. Record or source a simple product demo video: show it from multiple angles, in use, in context. Smartphone footage is fine. 2. In Shopify Admin > Products, add video URL (YouTube/Vimeo) or upload MP4 directly (Shopify supports up to 1GB). 3. Place video as 2nd item in gallery. 4. Enable autoplay (muted). 5. Start with your 3 best-selling products.", "ga4": "GA4: Track 'video_play' event (GA4 auto-tracks YouTube embeds). For native video, set up custom event via GTM. Compare add_to_cart rate on PDPs with video vs without. Explorations > Segment Overlap.", "shopify": "Shopify: Compare add-to-cart rate on product pages with video vs those without. Use Analytics > Product performance report. Filter by specific products and compare CVR.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on video PDPs", "id": "T022"}, {"num": 23, "name": "Back-in-Stock Filter on Collections", "category": "UX + Functionality", "tags": "Navigation, FOMO", "difficulty": "Easy", "time": "1h", "bias": "FOMO", "what": "Add a 'Back in Stock' filter or badge to help shoppers find recently restocked items", "how": "1. In Shopify Admin, create a product tag 'back-in-stock' and apply it to restocked products. 2. Remove tag after 14 days (use automation app or manual process). 3. In filter app (SearchPie, Boost), add tag-based filter 'Back in Stock'. 4. Also add a 'Back in Stock' collection page (auto-collects tagged products). 5. Add to navigation as 'New & Restocked'.", "ga4": "GA4: Track sessions landing on back-in-stock collection vs other collection pages. Compare add_to_cart rate and session duration. Explorations > Path Exploration from collection page.", "shopify": "Shopify: Analytics > Reports > Sales by product. Compare sales velocity for products immediately after receiving 'back-in-stock' tag vs baseline. Check if sell-through rate improves.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on restocked items", "id": "T023"}, {"num": 24, "name": "Form Autofill Compatibility", "category": "UX + Functionality", "tags": "Checkout, Mobile", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Ensure all checkout form fields have correct HTML autocomplete attributes so browsers can fill them", "how": "1. Inspect checkout form HTML (browser DevTools). 2. Ensure these autocomplete values are set: name, given-name, family-name, email, tel, street-address, address-line1, city, postal-code, country. 3. In Shopify, checkout HTML is limited — use Shopify Checkout Extensibility or contact theme dev. 4. Test with Chrome and Safari autofill on mobile. 5. Test Apple Pay and Google Pay as alternatives.", "ga4": "GA4: Funnel: begin_checkout → add_shipping_info. Compare drop-off rate before vs after, specifically on mobile. Filter funnel by device category = mobile in Explorations.", "shopify": "Shopify: Analytics > Reports > Checkout abandonment. Compare step-by-step drop-off in checkout funnel on mobile before vs after. Settings > Checkout > Checkout analytics.", "test_period": "3 weeks", "kpi": "Mobile checkout completion rate", "id": "T024"}, {"num": 25, "name": "404 Page with Product Recommendations", "category": "UX + Functionality", "tags": "Navigation, Recovery", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Replace default 404 error page with one that shows bestsellers and a search bar", "how": "1. Shopify Admin > Online Store > Themes > Edit code > 404.liquid. 2. Add: a friendly message, a search bar, and a product grid showing your bestsellers collection. 3. Add navigation links to top categories. 4. Keep it on-brand and light in tone. 5. Include a link to homepage and contact support.", "ga4": "GA4: Track sessions landing on /404 page. Compare bounce rate from 404 pages before vs after. Also check if search usage from 404 increases. Reports > Engagement > Pages and screens, filter by page path = /404.", "shopify": "Shopify: Analytics > Reports > Online store sessions by landing page. Filter to /404. Compare bounce rate and next-page navigation. Check if sessions from 404 result in purchases after the change.", "test_period": "4 weeks", "kpi": "Bounce rate from 404 page", "id": "T025"}, {"num": 26, "name": "Persistent Search Bar", "category": "UX + Functionality", "tags": "Navigation, Discovery", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Make the search bar always visible in the header (not hidden behind an icon)", "how": "1. In theme editor > Header section, change search from 'icon only' to 'input field always visible'. 2. Add placeholder text that guides: 'Search for products, brands...' 3. Style with subtle border and search icon on right. 4. On mobile, keep as icon but make tap target large (min 44x44px). 5. Ensure search is indexed and fast.", "ga4": "GA4: Compare view_search_results event count before vs after. Also compare: bounce rate (more search = more engaged), pages per session, purchase rate from sessions that use search. Reports > Events.", "shopify": "Shopify: Online Store > Search Analytics. Compare number of searches/day and search-to-purchase conversion rate before vs after making search always visible.", "test_period": "3 weeks", "kpi": "Search usage rate / Search CVR", "id": "T026"}, {"num": 27, "name": "Smart Size Guide Modal", "category": "UX + Functionality", "tags": "PDP, Trust", "difficulty": "Medium", "time": "2h", "bias": "Cognitive Ease", "what": "Show a size guide in a popup/modal that doesn't navigate away from the product page", "how": "1. Install 'Size Chart & Size Guide' app (free tier available). 2. Create size guide tables per product category (clothing, shoes, etc.). 3. Trigger via 'Size Guide' link next to size selector — opens modal. 4. Include: measurements table, how-to-measure instructions, fit notes. 5. If possible, add a 'Find my size' quiz within the modal.", "ga4": "GA4: Track 'size_guide_open' custom event via GTM. Compare: return rate (Shopify) for customers who viewed size guide vs those who didn't. Also compare add_to_cart rate on pages with size guide.", "shopify": "Shopify: Analytics > Returns. Compare return rate for clothing/size-sensitive products before vs after adding modal size guide. Also check add-to-cart rate on relevant PDPs.", "test_period": "6 weeks", "kpi": "Return rate / Add-to-cart on size-sensitive products", "id": "T027"}, {"num": 28, "name": "Click-to-Expand Product Details", "category": "UX + Functionality", "tags": "PDP, Content", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Use accordion sections to organize PDP content (Description, Details, Shipping, Reviews) cleanly", "how": "1. In theme editor > Product page, enable accordion/collapsible sections if available. 2. Structure: Section 1: Description (open by default), Section 2: Product Details/Specs (closed), Section 3: Shipping & Returns (closed), Section 4: Reviews (closed). 3. Ensure first section is always open. 4. Make section headers clearly labeled and tappable on mobile.", "ga4": "GA4: Track 'accordion_open' custom event per section via GTM. Compare time on page and add_to_cart rate on PDPs before vs after restructuring. Reports > Engagement > Pages and screens.", "shopify": "Shopify: Compare add-to-cart rate and bounce rate on product pages before vs after. Analytics > Product performance report. Check if specific high-content products show improvement.", "test_period": "3 weeks", "kpi": "PDP engagement / add-to-cart rate", "id": "T028"}, {"num": 29, "name": "Auto-Scroll to Form Error", "category": "UX + Functionality", "tags": "Checkout, UX", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "When a user submits a form with errors, auto-scroll to and highlight the first error field", "how": "1. In Shopify checkout this is partially handled natively. 2. For theme contact forms and custom forms: add JS that on form submit scrolls to first .error or [aria-invalid=true] field. 3. Add red border AND error message below field (not just color — accessibility). 4. Test on mobile where errors often appear off-screen. 5. Ensure error message is specific: 'Please enter a valid email' not just 'Error'.", "ga4": "GA4: Funnel: begin_checkout → purchase. Compare completion rate. Also track custom event 'form_error_shown' and see if users who see errors still convert. Explorations > Funnel.", "shopify": "Shopify: Analytics > Reports > Checkout abandonment. Compare abandonment rate at 'Customer information' step before vs after. This step has most form errors.", "test_period": "3 weeks", "kpi": "Checkout step completion rate", "id": "T029"}, {"num": 30, "name": "Swipe Gestures for Image Gallery", "category": "UX + Functionality", "tags": "Mobile, PDP", "difficulty": "Easy", "time": "1h", "bias": "Cognitive Ease", "what": "Enable native swipe-left/right to browse product images on mobile", "how": "1. Check if your theme supports mobile swipe on product gallery — test on a real device. 2. If not, most themes can enable this via theme settings or a small JS library (Swiper.js). 3. Add dot indicators below images showing position in gallery. 4. Ensure first image loads fast (< 1s). 5. Add 'pinch to zoom' on mobile.", "ga4": "GA4: Track 'image_swipe' custom event on mobile via GTM (touch event on gallery). Compare add_to_cart rate on mobile PDPs before vs after. Filter by device = mobile in Explorations.", "shopify": "Shopify: Analytics > Reports > Online store conversion rate, device = Mobile. Compare mobile add-to-cart rate before vs after enabling swipe gallery.", "test_period": "3 weeks", "kpi": "Mobile add-to-cart rate", "id": "T030"}, {"num": 31, "name": "Benefit-Led H1 Headline", "category": "Content + Copy", "tags": "PDP, SEO", "difficulty": "Easy", "time": "1h", "bias": "Framing Effect", "what": "Rewrite the main product heading from a product name to a customer benefit statement", "how": "1. Identify your top 10 PDPs by traffic. 2. Rewrite H1 from 'Model X Running Shoe' to 'Run Further, Feel Less — Lightweight Trail Shoe for Distance Runners'. 3. Keep the product name in H2 or subtitle for SEO. 4. Make benefit specific and tangible — avoid vague words like 'best' or 'premium'. 5. Test on 5 products, leave 5 as control.", "ga4": "GA4: Compare add_to_cart rate on pages with new H1 vs control pages. Use Explorations > Funnel: page_view (filter by page_path) → add_to_cart. Run for 4 weeks before concluding.", "shopify": "Shopify: Analytics > Product performance. Compare add-to-cart rate and sessions-to-purchase on rewritten PDPs vs control group over same period.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on PDPs", "id": "T031"}, {"num": 32, "name": "Who It's For Section", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Choice Architecture", "what": "Add a short 'This is for you if...' bullet list to help shoppers self-qualify quickly", "how": "1. Below the main description, add a section headed 'Perfect for you if:'. 2. Write 3-5 specific bullets: 'You run 3+ times a week', 'You prefer minimal cushioning', 'You have wide feet'. 3. Be specific — generic benefits don't help. 4. Aim for shoppers to nod along to at least 2 bullets. 5. Start with your 5 highest-returning or most-reviewed products.", "ga4": "GA4: Track time on page and scroll depth on PDPs with this section vs without. Also compare add_to_cart rate and return rate. Explorations > Segment Overlap: pages with section vs without.", "shopify": "Shopify: Compare return rate for products with 'Who it's for' section vs without. Analytics > Returns report. Also check add-to-cart rate in Product performance report.", "test_period": "4 weeks", "kpi": "Return rate / Add-to-cart rate", "id": "T032"}, {"num": 33, "name": "Who It's NOT For Section", "category": "Content + Copy", "tags": "PDP, Trust", "difficulty": "Medium", "time": "2h", "bias": "Trust / Safety", "what": "Add a brief 'This might not be for you if...' section to build authenticity and reduce returns", "how": "1. Below 'Who it's for', add 'This might not suit you if:'. 2. Write 2-3 honest qualifiers: 'You prefer maximum cushioning', 'You need waterproofing'. 3. Link to alternative products where relevant. 4. This builds radical trust — shoppers who stay after reading are pre-qualified. 5. Test on products with high return rates first.", "ga4": "GA4: Track time on page on PDPs with this section. Compare return rate and review sentiment (qualitative). Also compare add_to_cart rate — expect slight drop but higher purchase intent quality.", "shopify": "Shopify: Analytics > Returns. Compare return rate for products with honest 'not for' section vs control. Also check repeat purchase rate — higher quality buyers should reorder more.", "test_period": "6 weeks", "kpi": "Return rate / Customer satisfaction", "id": "T033"}, {"num": 34, "name": "Feature-to-Benefit Bullets", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Framing Effect", "what": "Rewrite product bullet points from features to customer benefits using 'so you can' framing", "how": "1. List all current feature bullets (e.g. '500ml capacity', 'BPA-free plastic'). 2. Rewrite each as: Feature → Benefit → Proof. Example: '500ml capacity → Lasts a full workday without refills → So you stay hydrated through 8 hours of meetings'. 3. Aim for 4-6 bullets max. 4. Put most important benefit first. 5. Use 'you' language throughout.", "ga4": "GA4: Compare add_to_cart rate on rewritten PDPs vs original. Use date comparison or run on subset of products. Reports > Events > add_to_cart filtered by page_path.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and conversion rate (sessions → orders) on rewritten products vs control group. Track over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on PDPs", "id": "T034"}, {"num": 35, "name": "Specific CTA Text", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "30 min", "bias": "Cognitive Ease", "what": "Change generic 'Add to Cart' to specific action-oriented text that matches product context", "how": "1. Identify product categories where specificity helps: food ('Add to My Order'), subscription ('Start My Subscription'), customisable product ('Build Mine'). 2. Update CTA button text in theme editor or product metafields. 3. Keep 'Add to Cart' for standard products — only change where it adds clarity. 4. Test: 'Add to Cart' vs 'Get Yours Today' vs 'Add [Product Name]'.", "ga4": "GA4: Compare add_to_cart event rate on pages with changed CTA vs original. Run as manual before/after on specific pages. Reports > Events > add_to_cart by page_path.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate on changed products vs control products over same 3-week period.", "test_period": "3 weeks", "kpi": "Add-to-cart rate", "id": "T035"}, {"num": 36, "name": "Urgency Copy Near CTA", "category": "Content + Copy", "tags": "PDP, Urgency", "difficulty": "Easy", "time": "30 min", "bias": "Scarcity / Urgency", "what": "Add time-sensitive or stock-sensitive copy directly below the ATC button", "how": "1. Below ATC button add one line of urgency copy. Options: 'Order in next 2h 15m for delivery tomorrow', 'Only 4 left — selling fast', 'X people viewing this now'. 2. Make it true — fake urgency destroys trust. 3. Use dynamic copy where possible (real stock count, real cut-off time). 4. Style in small gray text, not red — avoid 'scammy' feel. 5. Test with and without.", "ga4": "GA4: Compare add_to_cart rate on PDPs with urgency copy vs without. A/B test: enable on 50% of traffic using your Shopify theme or an app. Explorations > Funnel by variant.", "shopify": "Shopify: Compare add-to-cart rate in Product performance report, before/after adding urgency copy. Also check if time-on-page decreases (faster decisions).", "test_period": "3 weeks", "kpi": "Add-to-cart rate / Time to purchase", "id": "T036"}, {"num": 37, "name": "Social Proof Line in Description", "category": "Content + Copy", "tags": "PDP, Trust", "difficulty": "Easy", "time": "1h", "bias": "Social Proof", "what": "Add a specific social proof statement within the product description text", "how": "1. Pull a real stat from your data: '4,200 customers have reviewed this product — 94% would recommend'. Or use review themes: 'Our most-gifted product 3 years running.' 2. Place in first 3 lines of description. 3. Update monthly if using specific numbers. 4. Make it specific — '4,200 customers' beats 'thousands of customers'. 5. Link to review section if possible.", "ga4": "GA4: Compare add_to_cart rate on PDPs with social proof line vs without. Also compare time_on_page — engaged readers may spend longer but convert faster. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart and conversion rates on products with updated descriptions vs control products over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate", "id": "T037"}, {"num": 38, "name": "FAQ Section on PDP", "category": "Content + Copy", "tags": "PDP, Trust", "difficulty": "Medium", "time": "3h", "bias": "Trust / Safety", "what": "Add 5-8 frequently asked questions with answers directly on the product page", "how": "1. Pull questions from: customer support emails, review questions, on-site search queries. 2. Write 5-8 Q&As covering: sizing/fit, materials, shipping time, returns, how to use. 3. Use accordion format (see Tactic #28). 4. Add FAQ schema markup (JSON-LD) for SEO rich results. 5. Update quarterly based on new customer questions.", "ga4": "GA4: Track 'faq_open' event per question via GTM accordion click trigger. Compare: time on page, add_to_cart rate, and support contact rate (if you track that). Explorations > Funnel.", "shopify": "Shopify: Compare add-to-cart rate on PDPs with FAQ vs without. Also check if support ticket volume decreases (use Shopify Inbox or helpdesk data). Product performance report.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Support contact rate", "id": "T038"}, {"num": 39, "name": "Brand Story on PDP", "category": "Content + Copy", "tags": "PDP, Brand", "difficulty": "Easy", "time": "2h", "bias": "Liking / Affinity", "what": "Add a short 'Why we made this' founder/brand story section on select product pages", "how": "1. Write 3-5 sentences: the problem you noticed, the gap in the market, why you built this specific product. First person, honest, specific. 2. Add a small founder photo or product origin image. 3. Place below main description. 4. Best for: brand-defining hero products, new launches, products with unique origin stories. 5. Keep it under 100 words.", "ga4": "GA4: Track scroll depth to brand story section via GTM (intersection observer on the element). Compare add_to_cart rate and return rate on products with brand story vs without.", "shopify": "Shopify: Compare add-to-cart rate and return rate on featured products. Also check review sentiment — brand story often generates more 'love the ethos' style reviews.", "test_period": "6 weeks", "kpi": "Add-to-cart rate / Brand engagement", "id": "T039"}, {"num": 40, "name": "Number-Led Headlines", "category": "Content + Copy", "tags": "PDP, Category", "difficulty": "Easy", "time": "1h", "bias": "Authority", "what": "Use specific numbers in product and category page headlines to increase credibility", "how": "1. Replace vague headlines with number-led alternatives: 'Complete Skincare Range' → '7-Step Skincare Routine, One Brand'. 'Running Shoes' category → '14 Running Shoes Tested for 2025'. 2. Use real numbers from your data: '500+ 5-star reviews', '3-year guarantee'. 3. Apply to: hero banners, category page headings, email subject lines. 4. Odd numbers feel more authentic than round ones.", "ga4": "GA4: Compare click-through rate from homepage to category pages (track outbound_click or navigation_click events via GTM). Also compare time on category pages and add_to_cart rate.", "shopify": "Shopify: Compare sessions and add-to-cart rate on updated category pages vs before. Online Store > Sessions by landing page. Track category page CVR before/after.", "test_period": "3 weeks", "kpi": "Category page CVR / CTR", "id": "T040"}, {"num": 41, "name": "Before/After Copy Block", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Medium", "time": "2h", "bias": "Framing Effect", "what": "Add a before/after comparison block showing life without vs with the product", "how": "1. Create two columns: 'Before' (pain state) and 'After' (desired state). Keep language specific and relatable. Example: 'Before: Waking up tired despite 8 hours sleep. After: Deep restorative sleep, wake up energised.' 2. Use checkmarks and X marks visually. 3. Place mid-page on PDP, below description. 4. Best for: health, wellness, productivity, home products.", "ga4": "GA4: Track scroll to before/after section via GTM intersection observer. Compare add_to_cart rate on PDPs with before/after vs control. Explorations > Segment Overlap.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR on products with before/after block vs similar products without, over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on relevant PDPs", "id": "T041"}, {"num": 42, "name": "Customer Language in Copy", "category": "Content + Copy", "tags": "PDP, Reviews", "difficulty": "Medium", "time": "3h", "bias": "Social Proof", "what": "Rewrite product descriptions using the exact words and phrases customers use in reviews", "how": "1. Export your reviews (Shopify Reviews, Loox, Judge.me). 2. Find the most repeated words and phrases — note specific adjectives, use cases, problems solved. 3. Rewrite 3-5 key product descriptions using these exact phrases. 4. Pay attention to: how they describe the problem before buying, the specific outcome they loved. 5. Your copy should feel like a review, not a brochure.", "ga4": "GA4: Compare time on page (customers 'recognize' their words) and add_to_cart rate before vs after rewrite. Explorations: pages with new copy vs old, compare conversion events.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and return rate (better-matched copy → better expectations → fewer returns) for rewritten products.", "test_period": "4 weeks", "kpi": "Add-to-cart rate / Return rate", "id": "T042"}, {"num": 43, "name": "Press & Media Mentions", "category": "Content + Copy", "tags": "Homepage, Trust", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Display 'As seen in / As featured in' logos from press, podcasts, or publications on homepage and PDPs", "how": "1. Collect any legitimate press coverage: blog features, podcast mentions, review sites, local press. 2. Request logo permission from publication or use publication's name in text format if logo not available. 3. Place as a horizontal strip on homepage (above fold on mobile) and on key PDPs. 4. Link each logo to the actual article. 5. Keep current — remove outdated coverage.", "ga4": "GA4: Track if sessions that scroll past media strip have higher add_to_cart rate. Use GTM intersection observer. Compare conversion rates of sessions that engage with media section vs those that don't.", "shopify": "Shopify: Compare overall online store conversion rate on homepage-entry sessions before vs after adding media strip. Analytics > Sessions by landing page > Homepage CVR.", "test_period": "4 weeks", "kpi": "Homepage CVR / Trust signals", "id": "T043"}, {"num": 44, "name": "Checkout Form Microcopy", "category": "Content + Copy", "tags": "Checkout, Trust", "difficulty": "Easy", "time": "1h", "bias": "Trust / Safety", "what": "Add small helper text below checkout form fields to reduce anxiety and errors", "how": "1. Add gray helper text below key fields: Email field: 'We'll send your order confirmation here.' Phone field: 'For delivery updates only — no marketing.' Card field: 'Secured by 256-bit SSL encryption.' Address field: 'Enter address as it appears on your bank card.' 2. In Shopify, add via Checkout Extensibility (Shopify Plus) or checkout.liquid edits. 3. Keep under 60 characters per field.", "ga4": "GA4: Funnel: begin_checkout → add_payment_info → purchase. Compare drop-off at payment step before vs after adding reassurance copy. Explorations > Funnel by date range.", "shopify": "Shopify: Analytics > Checkout abandonment. Compare abandonment rate at 'Payment' step before vs after. Settings > Checkout analytics. Also compare overall checkout completion rate.", "test_period": "3 weeks", "kpi": "Checkout completion rate at payment step", "id": "T044"}, {"num": 45, "name": "Ingredient/Material Transparency", "category": "Content + Copy", "tags": "PDP, Trust", "difficulty": "Medium", "time": "3h", "bias": "Trust / Safety", "what": "Add a full ingredient list, material sourcing info, or manufacturing origin to PDPs", "how": "1. Create a dedicated 'What's inside' or 'Materials & Sourcing' section. 2. For food/beauty: full INCI ingredient list with plain-language explanations. For fashion: material %, country of manufacture, factory info. For home: materials list with sustainability notes. 3. Use a clean table or icon-based layout. 4. Link to certifications (organic, B-Corp, etc.) where applicable.", "ga4": "GA4: Track scroll to transparency section via GTM. Compare return rate and add_to_cart rate on products with full transparency vs without. Also track if review quality improves (longer, more specific reviews = better-informed buyers).", "shopify": "Shopify: Analytics > Returns. Compare return rate for products with transparency sections vs similar products without. Also check review count and average rating before vs after.", "test_period": "6 weeks", "kpi": "Return rate / Review quality", "id": "T045"}, {"num": 46, "name": "Pairs Well With Block", "category": "Content + Copy", "tags": "PDP, Cross-sell", "difficulty": "Easy", "time": "2h", "bias": "Choice Architecture", "what": "Add editorial 'Pairs well with' product recommendations on PDPs with brief copy explaining why", "how": "1. For your top 20 products, manually select 2-3 complementary products. 2. Add a 'Pairs well with' or 'Complete the look' section with brief copy: '[Product A] + [Product B]: The combination our customers order most.' 3. Show product image, name, price. 4. Include 'Add both for €X' if bundle pricing is possible. 5. This is editorial — not algorithmic. Curate carefully.", "ga4": "GA4: Track 'cross_sell_click' custom event on 'Pairs well with' product clicks. Compare AOV of sessions that interact with cross-sell vs those that don't. Explorations > Segment Overlap.", "shopify": "Shopify: Analytics > Reports > Product performance. Compare AOV before vs after adding cross-sell blocks. Also check if 'frequently bought together' data in orders shows increased multi-item purchases.", "test_period": "4 weeks", "kpi": "Average Order Value (AOV)", "id": "T046"}, {"num": 47, "name": "Short vs Long Description Test", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Easy", "time": "2h", "bias": "Cognitive Ease", "what": "Test whether a concise 3-sentence description converts better than a detailed 10-sentence one", "how": "1. Take 5 high-traffic PDPs. 2. Write a short version (3 sentences, benefit-focused, no jargon) and a long version (detailed, includes specs, use cases, FAQ). 3. Use a theme section that can toggle between versions, or manually swap for 2 weeks each. 4. Track add_to_cart rate for each period. 5. Note: short often wins for impulse/low-cost, long wins for considered/high-cost purchases.", "ga4": "GA4: Compare add_to_cart rate and time on page for short vs long description periods. Use date range comparison. Reports > Events > add_to_cart by page_path.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate in weeks 1-2 (long) vs weeks 3-4 (short) — or vice versa. Control for seasonality in comparison.", "test_period": "4 weeks (2+2)", "kpi": "Add-to-cart rate on test PDPs", "id": "T047"}, {"num": 48, "name": "Localization for Key Markets", "category": "Content + Copy", "tags": "International, UX", "difficulty": "Medium", "time": "1 day", "bias": "Cognitive Ease", "what": "Show prices, language, and currency in the visitor's local format based on their location", "how": "1. Install 'Translate & Adapt' (Shopify's free app) for language switching. 2. Install 'Geolocation' app (free) to auto-detect country and suggest currency. 3. Shopify Markets (built-in) handles multi-currency if on Shopify plan. 4. Translate at minimum: checkout, navigation, product descriptions for top 2-3 markets. 5. Use local date formats, measurement units, and shipping timeframes.", "ga4": "GA4: Compare conversion rate by country before vs after adding localization. Reports > Demographics > Country. Compare CVR for target markets specifically.", "shopify": "Shopify: Analytics > Reports > Sessions by location. Compare conversion rate (orders/sessions) for localized countries before vs after. Also check if cart abandonment decreases in those markets.", "test_period": "6 weeks", "kpi": "Conversion rate in target markets", "id": "T048"}, {"num": 49, "name": "Founder/Expert Quote on PDP", "category": "Content + Copy", "tags": "PDP, Authority", "difficulty": "Easy", "time": "1h", "bias": "Authority", "what": "Add a short quote from the founder, product developer, or expert about the product", "how": "1. Write or source a 1-2 sentence authentic quote about why this product exists or what makes it special. 2. Attribute it with name, title, and small photo. 3. Place near top of product description or as a pull-quote mid-page. 4. Avoid marketing language — it should sound like a real person speaking. 5. Rotate for seasonal or campaign-specific products.", "ga4": "GA4: Track scroll to quote section. Compare add_to_cart rate on PDPs with founder quote vs without. Explorations > Segment Overlap: sessions that scrolled to quote vs those that didn't.", "shopify": "Shopify: Product performance report. Compare add-to-cart and CVR on products with founder quotes vs control products over 4 weeks.", "test_period": "4 weeks", "kpi": "Add-to-cart rate", "id": "T049"}, {"num": 50, "name": "Staff Pick Copy Badge", "category": "Content + Copy", "tags": "PDP, Authority", "difficulty": "Easy", "time": "1h", "bias": "Authority", "what": "Add 'Staff Pick' or 'Team Favourite' editorial tag with a short personal recommendation note", "how": "1. Select 5-10 products that genuinely resonate with your team. 2. Add a small badge/label to collection page card and PDP header. 3. On PDP, include a 1-2 sentence personal note: 'I've used this for 2 years — the handle alone is worth the price. — Jamie, Customer Success.' 4. Real names and real opinions only. 5. Rotate seasonally.", "ga4": "GA4: Track clicks on 'Staff Pick' badge in collection pages (custom event via GTM). Compare add_to_cart rate on staff-picked products vs similar non-picked products. Explorations.", "shopify": "Shopify: Product performance report. Compare add-to-cart rate and CVR on staff-picked products vs their 4-week baseline. Also check if review volume increases on featured products.", "test_period": "4 weeks", "kpi": "Add-to-cart rate on featured products", "id": "T050"}, {"num": 51, "name": "Category Page Intro Copy", "category": "Content + Copy", "tags": "Category, SEO", "difficulty": "Easy", "time": "2h", "bias": "Authority", "what": "Add a 2-3 sentence editorial intro at the top of category pages to guide and reassure shoppers", "how": "1. For top 5 category pages, write a brief intro: what the category contains, what makes yours different, a buying guide signal. Example: 'Our running shoes are tested by our in-house team over 200km before launch. Whether you're a beginner or ultramarathon runner, use the filters to find your match.' 2. Keep to 2-3 sentences. 3. Include naturally a primary keyword for SEO. 4. Place above the product grid.", "ga4": "GA4: Compare time on page and bounce rate for category pages with intro vs without. Also compare add_to_cart rate from these pages. Reports > Engagement > Pages and screens.", "shopify": "Shopify: Analytics > Sessions by landing page. Compare bounce rate and add-to-cart rate on updated category pages before vs after adding intro copy.", "test_period": "3 weeks", "kpi": "Category page bounce rate / CVR", "id": "T051"}, {"num": 52, "name": "Comparison Table vs Alternatives", "category": "Content + Copy", "tags": "PDP, Conversion", "difficulty": "Medium", "time": "3h", "bias": "Anchoring", "what": "Add a comparison table showing your product against generic alternatives (not named competitors)", "how": "1. Create a table: rows = key decision criteria, columns = Your product vs Generic alternative vs 'The expensive option'. 2
