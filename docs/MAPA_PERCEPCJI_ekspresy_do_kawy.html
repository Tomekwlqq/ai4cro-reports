<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Percepcji — Ekspresy do kawy</title>
<style>
:root {
  --bg: #fdfcfb;
  --bg-card: #ffffff;
  --bg-hover: #f7f4f0;
  --ink: #1a1a1a;
  --ink2: #555;
  --muted: #8c8c8c;
  --line: #e8e4dc;
  --line2: #f0ede6;
  --accent: #8B4513;
  --accent2: #C8753B;
  --info: #2E7D32;
  --komerc: #E65100;
  --transakc: #1565C0;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
  --radius: 10px;
  --radius-sm: 6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  line-height: 1.5; font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* ── TOPBAR ── */
.topbar{
  position: sticky; top: 0; z-index: 200;
  background: rgba(253,252,251,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.topbar-row1{
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.topbar h1{font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.topbar h1 span{color:var(--accent2)}

.search-wrap{flex:1;min-width:140px;max-width:100%;position:relative}
.search-wrap input{
  width:100%;padding:8px 10px 8px 34px;
  border:1.5px solid var(--line);border-radius:8px;font-size:14px;
  background:var(--bg-card);color:var(--ink);
  outline:none;transition:border .15s;
  -webkit-appearance:none;
}
.search-wrap input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(200,117,59,.12);
}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;color:var(--muted)}

.filter-toggle{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--bg-card);color:var(--ink2);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:all .15s;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.filter-toggle:hover{background:var(--bg-hover)}
.filter-toggle.open{background:var(--accent);color:#fff;border-color:var(--accent)}

.filter-panel{display:none;flex-direction:column;gap:8px;padding-top:4px}
.filter-panel.visible{display:flex}

.filter-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.filter-label{
  font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;
  margin-right:4px;white-space:nowrap;
}

/* ── CHIPS ── */
.chip{
  padding:5px 10px;border-radius:20px;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--line);
  background:var(--bg-card);color:var(--ink2);
  transition:all .15s;user-select:none;white-space:nowrap;
  min-height:32px;display:inline-flex;align-items:center;
  -webkit-tap-highlight-color:transparent;
}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-all.active{background:var(--ink2);border-color:var(--ink2)}

/* ── STATS BAR ── */
.statsbar{
  display:flex;gap:10px;flex-wrap:wrap;
  padding:6px 14px;font-size:12px;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--line2);
  align-items:center;
}
.statsbar .stat{font-weight:600;color:var(--ink2)}
.statsbar .dot{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px}
.statsbar .sep{color:var(--line);margin:0 4px}

/* ── MAIN ── */
.main{padding:12px;max-width:900px;margin:0 auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* ── CARDS ── */
.cards-grid{display:flex;flex-direction:column;gap:12px}

.card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-lg)}

.card-header{
  padding:12px 14px;cursor:pointer;user-select:none;
  display:flex;align-items:flex-start;gap:10px;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.card-header:hover{background:var(--bg-hover)}

.card-icon{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;flex-shrink:0;
}
.card-body-hdr{flex:1;min-width:0}
.card-path{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.card-title{font-size:15px;font-weight:700;line-height:1.35}
.card-tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;margin-top:3px}
.card-chevron{font-size:18px;color:var(--muted);transition:transform .25s;flex-shrink:0;margin-top:4px}
.card.open .card-chevron{transform:rotate(180deg)}
.card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-body{display:none}
.card.open .card-body{display:block}

/* ── STATES ── */
.states-list{padding:0 14px 12px}
.state-block{border:1px solid var(--line2);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.state-header{
  padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;
  background:#faf9f7;transition:background .15s;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.state-header:hover{background:#f3f0ec}
.state-num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.state-name{font-size:13px;font-weight:600;flex:1}
.state-count{font-size:11px;color:var(--muted);margin-right:4px}
.state-chevron{font-size:14px;color:var(--muted);transition:transform .2s}
.state-block.open .state-chevron{transform:rotate(180deg)}
.state-questions{display:none;padding:6px 12px 10px}
.state-block.open .state-questions{display:block}

/* ── QUESTIONS ── */
.q-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.45}
.q-item:last-child{border-bottom:none}
.q-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.q-dot.info{background:var(--info)}
.q-dot.komerc{background:var(--komerc)}
.q-dot.transakc{background:var(--transakc)}
.q-text{flex:1}
.q-type{font-size:10px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}

/* ── LEGEND ── */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;font-size:12px;align-items:center;border-top:1px solid var(--line2);margin:0 14px 10px}
.legend-item{display:flex;align-items:center;gap:5px;color:var(--ink2)}

/* ── RESPONSIVE ── */
@media(min-width:640px){
  .topbar{padding:12px 20px}
  .topbar-row1{flex-wrap:nowrap}
  .topbar h1{font-size:18px}
  .filter-toggle{display:none}
  .filter-panel{display:flex!important;flex-direction:row;flex-wrap:wrap;gap:12px;padding-top:0;align-items:center}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
  .main{padding:16px 20px}
}
@media(min-width:900px){
  .cards-grid{grid-template-columns:1fr 1fr}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}
.card{animation:fadeIn .3s ease-out}
</style>
</head>
<body>

<div class="topbar" id="topbar">

// STATE & FILTERS

let selPaths = new Set(PATHS.map(p => p.letter));
let selTypes = new Set(['info', 'komerc', 'transakc']);
let searchQuery = '';

const TYPE_LABELS = {info:'Informacyjne', komerc:'Komercyjne', transakc:'Transakcyjne'};
const TYPE_ICONS = {info:'🟢', komerc:'🟠', transakc:'🔵'};

function togglePath(letter) {
  if (selPaths.has(letter)) {
    if (selPaths.size > 1) selPaths.delete(letter);
  } else {
    selPaths.add(letter);
  }
  updateChips(); render();
}
function selectAllPaths() {
  selPaths = new Set(PATHS.map(p => p.letter));
  updateChips(); render();
}
function toggleType(type) {
  if (selTypes.has(type)) {
    if (selTypes.size > 1) selTypes.delete(type);
  } else {
    selTypes.add(type);
  }
  updateChips(); render();
}
function toggleFilters() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggle');
  panel.classList.toggle('visible');
  btn.classList.toggle('open');
  btn.innerHTML = panel.classList.contains('visible') ? '✕ Zamknij' : '⚙ Filtry';
}

function updateChips() {
  const allActive = selPaths.size === PATHS.length;
  let html = '<span class="chip chip-all '+(allActive?'active':'')+'" onclick="selectAllPaths()">Wszystkie</span>';
  PATHS.forEach(p => {
    html += '<span class="chip '+(selPaths.has(p.letter)?'active':'')+'" style="'+(selPaths.has(p.letter)?'background:'+p.color+';border-color:'+p.color:'')+'" onclick="togglePath(\''+p.letter+'\')">'+p.letter+'</span>';
  });
  document.getElementById('pathChips').innerHTML = html;

  let thtml = '';
  ['info','komerc','transakc'].forEach(t => {
    thtml += '<span class="chip '+(selTypes.has(t)?'active':'')+'" onclick="toggleType(\''+t+'\')">'+TYPE_ICONS[t]+' '+TYPE_LABELS[t]+'</span>';
  });
  document.getElementById('typeChips').innerHTML = thtml;
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  searchQuery = q;

  const filtered = PATHS.filter(p => selPaths.has(p.letter));

  const pathsWithMatch = filtered.map(p => {
    const matchStates = p.states.map((questions, si) => {
      const matchQs = questions.filter(function(_a) {
        var text = _a[0], type = _a[1];
        if (!selTypes.has(type)) return false;
        if (q && !text.toLowerCase().includes(q)) return false;
        return true;
      });
      return {questions: matchQs, stateIdx: si};
    }).filter(function(s) { return s.questions.length > 0; });
    return Object.assign({}, p, {matchStates: matchStates});
  }).filter(function(p) { return p.matchStates.length > 0; });

  var totalQs = 0, totalAll = 0;
  PATHS.forEach(function(p) { p.states.forEach(function(s) { totalAll += s.length; }); });
  pathsWithMatch.forEach(function(p) { p.matchStates.forEach(function(s) { totalQs += s.questions.length; }); });

  document.getElementById('statsbar').innerHTML =
    '<span><span class="dot" style="background:var(--info)"></span> <span class="stat">'+countByType('info')+'</span> inform.</span>' +
    '<span class="sep">|</span>' +
    '<span><span class="dot" style="background:var(--komerc)"></span> <span class="stat">'+countByType('komerc')+'</span> komerc.</span>' +
    '<span class="sep">|</span>' +
    '<span><span class="dot" style="background:var(--transakc)"></span> <span class="stat">'+countByType('transakc')+'</span> transakc.</span>' +
    '<span class="sep">|</span>' +
    '<span><span class="stat">'+pathsWithMatch.length+'</span> z '+PATHS.length+' ścieżek</span>' +
    '<span class="sep">|</span>' +
    '<span><span class="stat">'+totalQs+'</span> z '+totalAll+' pytań</span>';

  var main = document.getElementById('main');
  if (!pathsWithMatch.length) {
    main.innerHTML = '<div class="empty"><div style="font-size:48px">🔍</div><p>Brak wyników. Zmień filtry lub wyszukiwanie.</p></div>';
    return;
  }
  main.innerHTML = '<div class="cards-grid">'+pathsWithMatch.map(buildCard).join('')+'</div>';
}

function countByType(type) {
  var c = 0;
  PATHS.forEach(function(p) { p.states.forEach(function(s) { s.forEach(function(_a) { if (_a[1] === type) c++; }); }); });
  return c;
}

function buildCard(p) {
  var totalMatch = p.matchStates.reduce(function(sum, s) { return sum + s.questions.length; }, 0);
  var totalInPath = p.states.reduce(function(sum, s) { return sum + s.length; }, 0);
  return '<div class="card" id="card-'+p.letter+'">' +
    '<div class="card-header" onclick="toggleCard(\''+p.letter+'\')">' +
      '<div class="card-icon" style="background:'+p.color+'">'+p.letter+'</div>' +
      '<div class="card-body-hdr">' +
        '<div class="card-path">Ścieżka '+p.letter+' · <span style="color:'+p.color+'">['+p.tag+']</span></div>' +
        '<div class="card-title">'+p.title+'</div>' +
        '<div class="card-meta">' +
          '<span class="card-tag" style="background:'+p.color+'">'+p.tag.toUpperCase()+'</span>' +
          '<span style="font-size:11px;color:var(--muted)">'+totalMatch+'/'+totalInPath+' pytań</span>' +
          (totalMatch===totalInPath?'':' <span style="font-size:10px;color:var(--muted)">(filtrowane)</span>') +
        '</div>' +
      '</div>' +
      '<div class="card-chevron">▾</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="legend">' +
        '<div class="legend-item"><span class="q-dot info"></span> informacyjne</div>' +
        '<div class="legend-item"><span class="q-dot komerc"></span> komercyjne</div>' +
        '<div class="legend-item"><span class="q-dot transakc"></span> transakcyjne</div>' +
      '</div>' +
      '<div class="states-list">'+p.matchStates.map(function(s) { return buildStateBlock(p, s); }).join('')+'</div>' +
    '</div>' +
  '</div>';
}

function buildStateBlock(p, s) {
  var allQsInState = p.states[s.stateIdx].length;
  return '<div class="state-block" id="state-'+p.letter+'-'+s.stateIdx+'">' +
    '<div class="state-header" onclick="event.stopPropagation();toggleState(\''+p.letter+'\','+s.stateIdx+')">' +
      '<div class="state-num">'+(s.stateIdx+1)+'</div>' +
      '<div class="state-name">'+STATE_NAMES[s.stateIdx]+'</div>' +
      '<div class="state-count">'+s.questions.length+'/'+allQsInState+'</div>' +
      '<div class="state-chevron">▾</div>' +
    '</div>' +
    '<div class="state-questions">'+s.questions.map(function(_a) {
      var text = _a[0], type = _a[1];
      return '<div class="q-item">' +
        '<div class="q-dot '+type+'"></div>' +
        '<div class="q-text">'+highlightMatch(text)+'<span class="q-type">'+TYPE_LABELS[type]+'</span></div>' +
      '</div>';
    }).join('')+'</div>' +
  '</div>';
}

function highlightMatch(text) {
  if (!searchQuery) return text;
  var escaped = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp('('+escaped+')', 'gi'), '<mark style="background:#FFF3CD;padding:1px 3px;border-radius:2px">$1</mark>');
}

function toggleCard(letter) {
  document.getElementById('card-'+letter).classList.toggle('open');
}
function toggleState(letter, idx) {
  document.getElementById('state-'+letter+'-'+idx).classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
updateChips();
render();
if (window.innerWidth >= 640) {
  setTimeout(function() { toggleCard('A'); }, 100);
}
</script>
