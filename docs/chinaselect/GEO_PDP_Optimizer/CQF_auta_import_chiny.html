<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CQF v6 — auta import chiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F1;--surface:#FFFFFF;--surface-2:#F7F0EA;--line:#EFE3DA;--line-soft:#F4EBE4;
  --ink:#2B2326;--muted:#6B5D5A;--faint:#9C8D88;
  --v:#C9A84C;--v-d:#8A6D1F;--v-soft:rgba(201,168,76,.12);--v-line:rgba(201,168,76,.38);
  --dark:#3F4A44;--dark-sub:#4B564F;--dark-txt:#E4DCD4;
  --g:#2E8B57;--g-d:#236B43;--g-soft:rgba(46,139,87,.10);--g-line:rgba(46,139,87,.30);
  --o:#E07A3C;--o-d:#C4652B;--o-soft:rgba(224,122,60,.10);--o-line:rgba(224,122,60,.30);
  --sage:#5E8C7E;--sage-d:#3F6B62;--sage-soft:rgba(94,140,126,.10);--sage-line:rgba(94,140,126,.34);
  --blue:#4A7FB5;--blue-d:#3A6691;--blue-soft:rgba(74,127,181,.10);--blue-line:rgba(74,127,181,.30);
  --plum:#8C6A87;--plum-d:#6A4D65;--plum-soft:rgba(140,106,135,.10);--plum-line:rgba(140,106,135,.32);
  --terra:#C08468;--terra-d:#7A4E35;--terra-soft:rgba(192,132,104,.10);--terra-line:rgba(192,132,104,.34);
  --amber:#B07C22;--amber-d:#8F641A;--amber-soft:rgba(176,124,34,.12);--amber-line:rgba(176,124,34,.32);
  --rose:#B0707F;--rose-d:#8A4F5D;--rose-soft:rgba(176,112,127,.10);--rose-line:rgba(176,112,127,.30);
  --grotesk:'Space Grotesk',-apple-system,sans-serif;--mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
  --sh:0 4px 20px rgba(120,88,72,.07);--r:12px;--r-sm:8px;
  --gutter:16px;--bottom-nav:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--grotesk);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue-d)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ── APP BAR ── */
.appbar{position:sticky;top:0;z-index:40;background:rgba(251,246,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px var(--gutter)}
.appbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.title small{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;margin-left:6px}
.counter{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.counter b{color:var(--ink)}
/* mode switch */
.mode{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;width:100%;margin-top:8px}
.mode button{flex:1;padding:8px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;white-space:nowrap}
.mode button.on{background:var(--ink);color:#fff}
.mode button .m{font-family:var(--mono);font-size:10px;opacity:.7;margin-right:6px}

/* ── VIEW TABS (bottom on mobile) ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);height:var(--bottom-nav);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button .ic{font-family:var(--mono);font-size:14px;font-weight:600}
.tabs button.on{color:var(--v-d)}
.tabs button.on .ic{color:var(--v-d)}

/* ── FILTER BAR ── */
.fbar{padding:10px var(--gutter) 6px;display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;min-width:0}
.search input::placeholder{color:var(--faint)}
.fbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.fbtn .n{font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.fbtn .n:empty{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px var(--gutter) 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);flex-shrink:0}
.chip .dim{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.chip .x{font-family:var(--mono);color:var(--faint);padding-left:2px}
.chip.clear{background:transparent;color:var(--muted);border-style:dashed}

/* ── LAYOUT ── */
.shell{display:block;padding-bottom:calc(var(--bottom-nav) + 24px)}
.main{padding:0 var(--gutter);min-width:0}
.pane{display:none}
.pane.on{display:block}

/* ── FACET SHEET ── */
.sheet-bg{position:fixed;inset:0;background:rgba(43,35,38,.35);z-index:50;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s ease}
.sheet.on{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px var(--gutter);border-bottom:1px solid var(--line)}
.sheet-h b{font-size:15px}
.sheet-h .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sheet-body{overflow-y:auto;padding:6px var(--gutter) 16px}
.sheet-f{display:flex;gap:8px;padding:10px var(--gutter);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.btn{flex:1;border-radius:999px;padding:11px 14px;font-weight:600;font-size:14px;text-align:center}
.btn.pri{background:var(--ink);color:#fff}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.facet{border-bottom:1px solid var(--line-soft)}
.facet-h{display:flex;align-items:center;width:100%;padding:11px 0;gap:8px;text-align:left}
.facet-h .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.facet-h b{font-size:13.5px;line-height:1.2}
.facet-h .fsel{font-family:var(--mono);font-size:10px;color:var(--v-d);margin-left:auto;white-space:nowrap}
.facet-h .ar{font-family:var(--mono);color:var(--faint);transition:.15s}
.facet.open .facet-h .ar{transform:rotate(90deg)}
.facet-b{display:none;padding:0 0 10px}
.facet.open .facet-b{display:block}
.fopt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 4px;border-radius:8px;text-align:left;font-size:13px}
.fopt:hover{background:var(--surface-2)}
.fopt .bx{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;flex-shrink:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.fopt.on .bx{background:var(--ink);border-color:var(--ink);color:#fff}
.fopt .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fopt .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.fopt.zero{opacity:.38}
.fopt .mk{font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ── PLAN SUMMARY (tryb B) ── */
.plan{min-width:0;background:var(--surface);border:1px solid var(--v-line);border-radius:var(--r);padding:12px 14px;margin:8px 0 12px;box-shadow:var(--sh)}
.plan h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.plan h3 .kicker{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.mx{margin-top:10px;overflow-x:auto;min-width:0;max-width:100%}
.mx table{border-collapse:collapse;font-size:11px;min-width:100%}
.mx th{font-family:var(--mono);font-weight:500;color:var(--faint);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:10px}
.mx td{padding:4px 6px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.mx td.n{font-family:var(--mono);text-align:right}
.mx td.n.z{color:var(--line)}
.mx td.n.hi{color:var(--v-d);font-weight:600}
.mx .tpn{display:inline-flex;align-items:center;gap:5px}

/* ── STATE SECTION ── */
.state{margin:10px 0 14px}
.state-h{position:sticky;top:120px;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 0;background:var(--bg)}
.state-h .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.state-h .nm{font-weight:700;font-size:14px}
.state-h .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.state-h .tg{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.state-h .wbar{height:3px;border-radius:2px;background:var(--line);width:60px;overflow:hidden}
.state-h .wbar i{display:block;height:100%;background:var(--v)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.more{margin:8px 0 0;width:100%;padding:10px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:13px;font-weight:600}

/* ── Q CARD ── */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 14px;position:relative;box-shadow:var(--sh)}
.q.open{border-left:4px solid var(--v);padding-left:11px}
.q .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.q .txt{font-size:14.5px;line-height:1.4;font-weight:500}
.q .txt mark{background:var(--v-soft);color:inherit;padding:0 2px;border-radius:3px}
.q .bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.q .cep{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.q .cep .cn{font-weight:600;color:var(--ink)}
.q .cep.also{margin-top:4px}
.q .exp{display:none;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.q.x .exp{display:block}
.q .tgl{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:12px;color:var(--faint);width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.q .tgl:hover{background:var(--surface-2)}
.q .quote{background:var(--sage-soft);border-left:3px solid var(--sage);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink);margin:6px 0}
.q .quote .src{font-family:var(--mono);font-size:10.5px;color:var(--sage-d);display:block;margin-top:4px;word-break:break-all}
.dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:12.5px;margin-top:4px}
.dl dt{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.dl dd{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

/* ── BADGE SYSTEM (kolor = wymiar) ── */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11px;line-height:1.35;font-weight:600;border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;min-width:0}
.b i{font-style:normal;font-family:var(--mono);font-weight:500;font-size:10px;opacity:.75}
.b-st{font-family:var(--mono);font-weight:600;background:var(--surface);border-color:var(--line);color:var(--ink)}
.b-op{background:var(--v);color:#fff;border-color:var(--v)}
.b-op .ar{font-family:var(--mono)}
.b-src{background:var(--sage-soft);color:var(--sage-d);border-color:var(--sage-line)}
.b-src.eng{background:transparent;color:var(--faint);border-color:var(--line);font-weight:500}
.b-ty{background:var(--blue-soft);color:var(--blue-d);border-color:var(--blue-line)}
.b-fm{background:transparent;color:var(--plum-d);border-color:var(--plum-line)}
.b-tp{background:var(--terra-soft);color:var(--terra-d);border-color:var(--terra-line)}
.b-tp .kl{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--terra-d);display:inline-block}
.b-tp .kl.owned{background:var(--terra-d)}
.b-tp .kl.partner{background:linear-gradient(90deg,var(--terra-d) 50%,transparent 50%)}
.b-tp .kl.dark{background:transparent;border-style:dashed}
.b-in{background:transparent;color:var(--amber-d);border-color:transparent;padding-left:0;font-weight:600}
.b-pr{font-family:var(--mono);font-weight:500;color:var(--muted);background:transparent;border-color:transparent;padding-left:0;padding-right:0;gap:6px}
.b-pr .bar{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:inline-block}
.b-pr .bar i{display:block;height:100%;background:var(--ink);opacity:.7}
.b-core{font-family:var(--mono);background:var(--v-soft);color:var(--v-d);border-color:var(--v-line);font-weight:600}
.b-kd{font-family:var(--mono);font-weight:500;border-color:transparent;background:transparent;padding-left:0}
.b-kd.UDOWODNIONE{color:var(--g-d)}.b-kd.PRAWDOPODOBNE{color:var(--amber-d)}.b-kd.HIPOTEZA{color:var(--faint)}
.b-bl{background:var(--rose-soft);color:var(--rose-d);border-color:var(--rose-line)}
.b-seg{background:var(--dark);color:var(--dark-txt);border-color:var(--dark);font-family:var(--mono);font-weight:500}
.b-kw{background:var(--v-soft);color:var(--v-d);border-color:var(--v-line)}
.b-kw .stt{font-family:var(--mono);font-size:9.5px;opacity:.8}
.b-kto{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.b-kto.marka{color:var(--terra-d);border-color:var(--terra-line)}
.b-kto.monit{color:var(--faint);border-style:dashed}
.b-orph{background:var(--rose-soft);color:var(--rose-d);border-color:var(--rose-line);font-family:var(--mono);font-weight:500}
.b-draft{background:transparent;color:var(--faint);border-color:var(--line);border-style:dashed;font-family:var(--mono);font-weight:500}
.b-nat{font-family:var(--mono);font-weight:500;font-size:10px}
.b-nat.zyje{background:var(--g);color:#fff;border-color:var(--g)}
.b-nat.slad{background:var(--amber);color:#fff;border-color:var(--amber)}
.b-nat.brak{background:transparent;color:var(--faint);border-color:var(--line);border-style:dashed}
.nat-row{display:flex;align-items:center;gap:6px;margin:2px 0 0}
.nat-ref{font-size:12px;color:var(--muted);font-style:italic;max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nat-qw{font-size:11px;font-family:var(--mono);color:var(--v-d);background:var(--v-soft);border:1px solid var(--v-line);border-radius:3px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}

/* ── RECO BLOCK (tryb B) ── */
.reco{margin-top:10px;border:1px solid var(--v-line);background:linear-gradient(0deg,var(--v-soft),transparent 60%);border-radius:var(--r-sm);padding:9px 10px}
.reco h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--v-d);display:flex;align-items:center;gap:8px}
.reco h4 .kto{margin-left:auto;letter-spacing:0;text-transform:none;font-family:var(--grotesk);font-size:11px}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.rrow:last-of-type{border-bottom:0}
.rrow .ar{color:var(--faint);font-family:var(--mono);font-size:10px;text-align:center}
.rrow .who{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap}
.rrow .who.marka{color:var(--terra-d)}
.rrow .who.monit{color:var(--faint)}
.redir{margin-top:8px;padding-top:8px;border-top:1px solid var(--v-line);font-size:12.5px}
.redir .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--v-d);display:block;margin-bottom:3px}
.redir .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

/* ── PATH VIEW (metro) ── */
.pick{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.pick label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.sel select{flex:1;border:0;background:transparent;outline:0;min-width:0;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr;gap:14px}
.cmp.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cmp.two .lane{font-size:13px}
.cmp.two .st-q{display:none}
.cmp.two .st-q.first{display:block}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px;box-shadow:var(--sh);min-width:0}
.lane-h{margin-bottom:10px}
.lane-h .nm{font-weight:700;font-size:15px;line-height:1.25}
.lane-h .tr{font-size:12.5px;color:var(--muted);margin-top:3px;font-style:italic}
.lane-h .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center;min-width:0}
.metro{position:relative;padding-left:34px}
.metro::before{content:"";position:absolute;left:13px;top:10px;bottom:16px;width:4px;border-radius:2px;background:var(--line)}
.stn{position:relative;padding:4px 0 14px}
.stn .dot{position:absolute;left:-34px;top:2px;width:30px;height:30px;display:grid;place-items:center}
.stn .dot i{display:block;border-radius:50%;background:var(--v);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--v)}
.stn.off .dot i{background:var(--surface);box-shadow:0 0 0 2px var(--line);border-color:var(--surface)}
.stn.luka .dot i{background:var(--surface);box-shadow:0 0 0 2px var(--rose);border-color:var(--surface)}
.stn .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stn .sh .no{font-family:var(--mono);font-size:11px;font-weight:600}
.stn .sh .nm{font-weight:700;font-size:13.5px}
.stn .sh .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.stn.off .sh .nm,.stn.off .sh .no{color:var(--faint);font-weight:500}
.stn .note{font-size:11.5px;color:var(--faint);margin-top:2px}
.stn .note.luka{color:var(--rose-d)}
.st-q{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.sq{font-size:12.5px;line-height:1.35;padding:6px 8px;background:var(--surface-2);border-radius:8px;display:flex;flex-direction:column;gap:4px}
.sq.op{background:var(--v-soft);border-left:3px solid var(--v)}
.sq .r{display:flex;gap:4px;flex-wrap:wrap}
.sq .r .b{font-size:10px;padding:1px 5px}
.stn .conv{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.stn .bl{margin-top:6px}
.lane-f{border-top:1px dashed var(--line);margin-top:4px;padding:8px 0 4px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmp-sum{background:var(--surface-2);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;margin-top:10px;display:flex;flex-wrap:wrap;gap:10px}
.cmp-sum b{font-family:var(--mono)}

/* ── SEGMENT VIEW ── */
.segs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:8px}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.seg .hd{display:flex;align-items:center;gap:8px}
.seg .hd .id{font-family:var(--mono);background:var(--dark);color:var(--dark-txt);border-radius:6px;padding:2px 7px;font-size:11px}
.seg .hd b{font-size:15px}
.seg .hd .pp{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.seg .kto{font-size:13px;color:var(--muted);margin-top:6px}
.seg .ob{font-size:13px;margin-top:6px;padding:7px 10px;background:var(--v-soft);border-radius:8px;border-left:3px solid var(--v)}
.seg .cl{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.cepl{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;background:var(--surface-2);text-align:left;font-size:13px}
.cepl:hover{background:var(--line-soft)}
.cepl .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cepl .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.cepl .go{font-family:var(--mono);color:var(--v-d)}

/* ── LEGEND ── */
.leg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px;box-shadow:var(--sh)}
.leg h3{font-size:14px;margin-bottom:8px}
.leg h3 small{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:400;margin-left:6px}
.lrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.lrow:last-child{border-bottom:0}
.lrow .ex{display:flex;flex-wrap:wrap;gap:4px}
.lrow .d{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.lrow .d b{color:var(--ink)}
.ok{color:var(--g-d);font-family:var(--mono);font-size:11px}
.miss{color:var(--rose-d);font-family:var(--mono);font-size:11px}

/* ── EMPTY ── */
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);margin:12px 0}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.empty .hint{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* ── DESKTOP ── */
@media (min-width:1024px){
  :root{--gutter:24px}
  .shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;padding-bottom:40px}
  .tabs{position:sticky;top:0;bottom:auto;height:auto;border-top:0;border-right:1px solid var(--line);flex-direction:column;align-items:stretch;background:var(--surface);padding:14px 10px;gap:2px;height:100vh;overflow-y:auto}
  .tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 12px;border-radius:10px;font-size:13.5px}
  .tabs button.on{background:var(--v-soft)}
  .tabs .sheetslot{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
  .sheet{position:static;transform:none;max-height:none;border-radius:0;background:transparent}
  .sheet-bg{display:none!important}
  .sheet-h,.sheet-f{display:none}
  .sheet-body{padding:0;overflow:visible}
  .fbtn{display:none}
  .appbar{grid-column:2}
  .appbar-row{flex-wrap:nowrap}
  .mode{width:auto;margin-top:0;margin-left:16px}
  .fbar{grid-column:2}
  .chips{grid-column:2}
  .main{grid-column:2;max-width:1180px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .state-h{top:64px}
  .cmp.two .st-q{display:flex}
  .segs{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .kpis{grid-template-columns:repeat(6,1fr)}
}
@media (min-width:1024px){ .tabs{position:sticky;grid-row:1 / span 4} }
</style>

,"w":1.75,"pr":22.2,"k":"P4","in":"transakcyjna","ty":"odpowiedz","f":["faq_item","akapit_cytowalny","mail"],"tp":["ai_overview","paa","pdp_sklep"],"kto":"owned","n":1,"b":false,"pw":"wysoka","nat":"ZYJE","ref":null,"qw":"wymagana homologacja samochodu"},{"i":689,"t":"Czy można zarejestrować pojazd bez homologacji?","c":"cep_formalnosci_import","s":8,"l":2,"oc":null,"z":"glos","zd":"głos kupujących (T3)","cy":"Czy można zarejestrować pojazd bez homologacji?","u":"","w":1.75,"pr":20.7,"k":"P4","in":"transakcyjna","ty":"odpowiedz","f":["faq_item","akapit_cytowalny","mail"],"tp":["ai_overview","paa","pdp_sklep"],"kto":"owned","n":1,"b":false,"pw":"wysoka","nat":"ZYJE","ref":null,"qw":"rejestracja bez homologacji"},{"i":690,"t":"Jakie są procedury homologacji samochodów z Chin w Europie?","c":"cep_formalnosci_import","s":8,"l":2,"oc":null,"z":"glos","zd":"głos kupujących (T3)","cy":"Jakie są procedury homologacji samochodów z Chin w Europie?","u":"","w":1.75,"pr":27.5,"k":"P4","in":"transakcyjna","ty":"opis","f":["akapit_cytowalny","tabela_parametrow"],"tp":["brand_pdp","pdp_sklep","serp_organic"],"kto":"owned","n":1,"b":false,"pw":"wysoka","nat":"ZYJE","ref":null,"qw":"procedury homologacji z chin"},{"i":691,"t":"Ile kosztuje zrobienie homologacji?","c":"cep_formalnosci_import","s":5,"l":2,"oc":null,"z":"glos","zd":"głos kupujących (T3)","cy":"Ile kosztuje zrobienie homologacji?","u":"","w":1.85,"pr":27.2,"k":"P4","in":"komercyjna","ty":"odpowiedz","f":["faq_item","akapit_cytowalny"],"tp":["ai_overview","paa","pdp_sklep"],"kto":"owned","n":1,"b":false,"pw":"wysoka","nat":"ZYJE","ref":null,"qw":"koszt homologacji samochodu"},{"i":692,"t":"Jak założyć homologację?","c":"cep_formalnosci_import","s":8,"l":2,"oc":null,"z":"glos","zd":"głos kupujących (T3)","cy":"Jak założyć homologację?","u":"","w":1.75,"pr":20.7,"k":"P4","in":"transakcyjna","ty":"instrukcja","f":["lista_bullet"],"tp":["brand_yt","serp_video","brand_support"],"kto":"owned","n":1,"b":false,"pw":"wysoka","nat":"ZYJE","ref":null,"qw":"założenie homologacji auta"}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const Q = D.q, CEP = {}, SEG = {}, TP = D.tp, TPK = D.tpk, ST = D.st;
D.ceps.forEach(c => CEP[c.id] = c);
D.seg.forEach(s => SEG[s.id] = s);
const STATES = [2,3,4,5,6,7,8];
const TYP_PL = {odpowiedz:'odpowiedź',opis:'opis',porownanie:'porównanie',dowod:'dowód',instrukcja:'instrukcja',rekomendacja:'rekomendacja',reklama:'reklama',opinia:'opinia'};
const INT_PL = {informacyjna:'informacyjna',komercyjna:'komercyjna',transakcyjna:'transakcyjna'};
const KL_PL = {owned:'my',partner:'marka',dark:'monitoring'};
const KL_CLS = {owned:'',partner:'marka',dark:'monit'};
const ORPHAN = '__orphan__';
const PAGE = 40;

// ── wymiary (facety) — jedna definicja = jedno źródło prawdy dla filtrów, chipów i legendy ──
const DIMS = [
  {k:'cep',  n:'CEP (sytuacja wejścia)', sw:'var(--ink)',   get:q=>[q.c||ORPHAN], lbl:v=>v===ORPHAN?'— bez CEP (sieroty)':(CEP[v]?CEP[v].nm:v), mark:v=>CEP[v]?kdMark(CEP[v].kd):'', order:(a,b)=>(a===ORPHAN)-(b===ORPHAN)||(CEP[a]?CEP[a].ix:99)-(CEP[b]?CEP[b].ix:99)},
  {k:'seg',  n:'Segment (kto przeżywa)', sw:'var(--dark)',  get:q=>q.c&&CEP[q.c]?CEP[q.c].seg:[], lbl:v=>v+' · '+(SEG[v]?SEG[v].nm:v), order:(a,b)=>a.localeCompare(b)},
  {k:'st',   n:'Stan (2–8)',             sw:'var(--muted)', get:q=>[String(q.s)], lbl:v=>'S'+v+' · '+ST[v].s, order:(a,b)=>a-b},
  {k:'lay',  n:'Warstwa',                sw:'var(--v)',     get:q=>[q.l===1?'open':'deep'], lbl:v=>v==='open'?'① otwierające (wejście ścieżki)':'② pogłębione'},
  {k:'src',  n:'Źródło pytania',         sw:'var(--sage)',  get:q=>[q.z], lbl:v=>({glos:'rynek · głos kupujących',rynek:'rynek · PAA / DFS',silnik:'silnik V5'})[v]||v, order:(a,b)=>['glos','rynek','silnik'].indexOf(a)-['glos','rynek','silnik'].indexOf(b)},
  {k:'ty',   n:'Typ treści',             sw:'var(--blue)',  get:q=>q.ty?[q.ty]:['—'], lbl:v=>TYP_PL[v]||v},
  {k:'fm',   n:'Format',                 sw:'var(--plum)',  get:q=>q.f.length?q.f:['—'], lbl:v=>v},
  {k:'tp',   n:'Touchpoint',             sw:'var(--terra)', get:q=>q.tp.length?q.tp:['—'], lbl:v=>TP[v]?TP[v].nm:v, mark:v=>TP[v]?KL_PL[TP[v].kl]:'' , order:(a,b)=>(TP[a]?TP[a].g:'z').localeCompare(TP[b]?TP[b].g:'z')||a.localeCompare(b)},
  {k:'in',   n:'Intencja',               sw:'var(--amber)', get:q=>[q.in||'—'], lbl:v=>INT_PL[v]||v},
  {k:'kd',   n:'Klasa dowodu CEP',       sw:'var(--g)',     get:q=>[q.c&&CEP[q.c]?CEP[q.c].kd:'—'], lbl:v=>v, order:(a,b)=>['UDOWODNIONE','PRAWDOPODOBNE','HIPOTEZA'].indexOf(a)-['UDOWODNIONE','PRAWDOPODOBNE','HIPOTEZA'].indexOf(b)},
  {k:'kl',   n:'Priorytet (klasa)',      sw:'var(--ink)',   get:q=>[q.k||'—'], lbl:v=>v, order:(a,b)=>a.localeCompare(b)},
  {k:'kto',  n:'Kto odpowiada',          sw:'var(--terra-d)', get:q=>[q.kto||'—'], lbl:v=>({owned:'my (owned)',obcy:'obcy / rynek'})[v]||v},
  {k:'core', n:'Rdzeń kategorii',        sw:'var(--v-d)',   get:q=>[q.n>=3?'core':'one'], lbl:v=>v==='core'?'rdzeń — pytanie na ≥3 ścieżkach':'na 1–2 ścieżkach'},
  {k:'bl',   n:'Bloker (pytanie)',       sw:'var(--rose)',  get:q=>[q.b?'tak':'brak'], lbl:v=>v==='tak'?'pytanie-bloker':'brak w danych (D3)'},
  {k:'nat',  n:'Natura pytania (J6b)',   sw:'var(--g)',     get:q=>[q.nat||'—'], lbl:v=>({ZYJE:'ŻYJE w naturze',SLAD:'ŚLAD w naturze',BEZ_SLADU:'bez śladu w tanich źródłach'})[v]||v, order:(a,b)=>['ZYJE','SLAD','BEZ_SLADU','—'].indexOf(a)-['ZYJE','SLAD','BEZ_SLADU','—'].indexOf(b)},
];
const DIM = {}; DIMS.forEach(d => DIM[d.k] = d);

// ── stan aplikacji (w URL) ──
const S = {m:'A', v:'pole', f:{}, q:'', cep:'', cep2:'', open:{}};
function readHash(){
  const h = location.hash.replace(/^#/, '');
  if (!h) return;
  const p = new URLSearchParams(h);
  S.m = p.get('m')==='B'?'B':'A';
  S.v = ['pole','path','seg','leg'].includes(p.get('v'))?p.get('v'):'pole';
  S.q = p.get('q')||'';
  S.cep = p.get('cep')||''; S.cep2 = p.get('cep2')||'';
  S.f = {};
  (p.get('f')||'').split(';').filter(Boolean).forEach(seg => {
    const [k, vals] = seg.split(':'); if (DIM[k] && vals) S.f[k] = new Set(vals.split(','));
  });
}
function writeHash(){
  const p = new URLSearchParams();
  p.set('m', S.m); p.set('v', S.v);
  if (S.q) p.set('q', S.q);
  if (S.cep) p.set('cep', S.cep); if (S.cep2) p.set('cep2', S.cep2);
  const f = Object.keys(S.f).filter(k=>S.f[k].size).map(k=>k+':'+[...S.f[k]].join(',')).join(';');
  if (f) p.set('f', f);
  history.replaceState(null, '', '#'+p.toString());
}

// ── filtrowanie ──
function matchDim(q, k){ const sel = S.f[k]; if (!sel || !sel.size) return true; return DIM[k].get(q).some(v => sel.has(v)); }
function matchText(q){
  if (!S.q) return true; const t = S.q.toLowerCase();
  return q.t.toLowerCase().includes(t) || (q.cy && q.cy.toLowerCase().includes(t)) || (q.c && CEP[q.c] && CEP[q.c].nm.toLowerCase().includes(t));
}
function visible(q, skip){ if (!matchText(q)) return false; for (const d of DIMS) { if (d.k===skip) continue; if (!matchDim(q, d.k)) return false; } return true; }
function filtered(){ return Q.filter(q => visible(q, null)); }
function nActive(){ return Object.values(S.f).reduce((a,s)=>a+s.size, 0); }

// ── facety z licznikami (liczone bez własnego wymiaru = standard faceted search) ──
function facetCounts(k){
  const c = new Map();
  for (const q of Q) { if (!visible(q, k)) continue; for (const v of DIM[k].get(q)) c.set(v, (c.get(v)||0)+1); }
  return c;
}
function allValues(k){ const s = new Set(); for (const q of Q) for (const v of DIM[k].get(q)) s.add(v); return [...s]; }
function kdMark(kd){ return {UDOWODNIONE:'●',PRAWDOPODOBNE:'◐',HIPOTEZA:'○'}[kd]||''; }
const openFacets = new Set(['cep','st','lay']);
function renderFacets(){
  const el = document.getElementById('facets'); let h = '';
  for (const d of DIMS) {
    const cnt = facetCounts(d.k); const sel = S.f[d.k]||new Set();
    let vals = allValues(d.k); if (d.order) vals.sort(d.order); else vals.sort((a,b)=>(cnt.get(b)||0)-(cnt.get(a)||0));
    h += `<div class="facet ${openFacets.has(d.k)?'open':''}" data-k="${d.k}"><button class="facet-h" onclick="togFacet('${d.k}')"><span class="sw" style="background:${d.sw}"></span><b>${d.n}</b><span class="fsel">${sel.size?sel.size+' wybr.':''}</span><span class="ar">›</span></button><div class="facet-b">`;
    for (const v of vals) {
      const n = cnt.get(v)||0; const on = sel.has(v);
      h += `<button class="fopt ${on?'on':''} ${!n&&!on?'zero':''}" onclick="togF('${d.k}','${esc(v)}')"><span class="bx">${on?'✓':''}</span><span class="lb">${d.lbl(v)}</span>${d.mark?`<span class="mk">${d.mark(v)}</span>`:''}<span class="c">${n}</span></button>`;
    }
    h += '</div></div>';
  }
  el.innerHTML = h;
  const n = filtered().length;
  document.getElementById('sheet-cnt').textContent = n+' z '+Q.length;
  document.getElementById('sheet-n').textContent = n;
}
function togFacet(k){ openFacets.has(k)?openFacets.delete(k):openFacets.add(k); renderFacets(); }
function togF(k, v){ if (!S.f[k]) S.f[k] = new Set(); S.f[k].has(v)?S.f[k].delete(v):S.f[k].add(v); if (!S.f[k].size) delete S.f[k]; update(); }
function clearFilters(){ S.f = {}; S.q=''; document.getElementById('q').value=''; update(); }
function esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function hx(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderChips(){
  const el = document.getElementById('chips'); let h = '';
  for (const k of Object.keys(S.f)) for (const v of S.f[k]) h += `<button class="chip" onclick="togF('${k}','${esc(v)}')"><span class="dim">${DIM[k].n.split(' ')[0]}</span>${DIM[k].lbl(v)}<span class="x">✕</span></button>`;
  if (S.q) h += `<button class="chip" onclick="document.getElementById('q').value='';S.q='';update()"><span class="dim">szukaj</span>„${hx(S.q)}”<span class="x">✕</span></button>`;
  if (h) h += `<button class="chip clear" onclick="clearFilters()">Wyczyść wszystko</button>`;
  el.innerHTML = h; el.classList.toggle('hidden', !h);
  const n = nActive(); document.getElementById('fcnt').textContent = n?n:'';
}

// ── odznaki (standard oznaczania) ──
function bSt(q){ return `<span class="b b-st" title="${hx(ST[q.s].n)}">S${q.s} <i>${ST[q.s].s}</i></span>`; }
function bOpen(q){ if (q.l!==1) return ''; const c = q.oc&&CEP[q.oc]; return `<span class="b b-op" title="pytanie otwierające — wejście ścieżki">① otwiera <span class="ar">→</span> ${c?hx(c.nm):'?'}</span>`; }
function bSrc(q){ if (q.z==='silnik') return `<span class="b b-src eng" title="${hx(q.zd)}">silnik</span>`; return `<span class="b b-src" title="${hx(q.zd)}">„ ” ${q.z==='glos'?'głos rynku':'PAA / DFS'}</span>`; }
function bTy(q){ return q.ty?`<span class="b b-ty">${TYP_PL[q.ty]||q.ty}</span>`:''; }
function bIn(q){ return q.in?`<span class="b b-in">${q.in}</span>`:''; }
function bPr(q){ if (q.pr==null) return ''; const w = Math.max(4, Math.min(100, q.pr)); return `<span class="b b-pr" title="priorytet ${q.pr} · klasa ${q.k} · waga stanu ${q.w}">${q.k} · ${Math.round(q.pr)}<span class="bar"><i style="width:${w}%"></i></span></span>`; }
function bCore(q){ return q.n>=3?`<span class="b b-core" title="to samo pytanie na ${q.n} ścieżkach = rdzeń kategorii">rdzeń ×${q.n}</span>`:''; }
function bFm(f){ return `<span class="b b-fm">${f}</span>`; }
function bTp(id){ const t = TP[id]; if (!t) return `<span class="b b-tp">${id}</span>`; return `<span class="b b-tp" title="${hx(t.nm)} · ${t.kl} · grupa ${t.g}"><span class="kl ${t.kl}"></span>${hx(t.nm)}</span>`; }
function bKd(kd){ return `<span class="b b-kd ${kd}">${kdMark(kd)} ${kd}</span>`; }
function bSeg(s){ return `<span class="b b-seg" title="${hx(SEG[s]?SEG[s].nm:s)}">${s}</span>`; }
function bBl(t){ return `<span class="b b-bl" title="bloker decyzji (poziom CEP)">🛡 ${hx(t)}</span>`; }
function bNat(q){
  if (!q.nat) return '';
  const cls = {ZYJE:'zyje',SLAD:'slad',BEZ_SLADU:'brak'}[q.nat]||'brak';
  const lbl = {ZYJE:'✓ żyje',SLAD:'~ ślad',BEZ_SLADU:'○ bez śladu'}[q.nat]||q.nat;
  return `<span class="b b-nat ${cls}" title="natura pytania (J6b): ${q.nat}">${lbl}</span>`;
}
function bKonw(id){ const t = TP[id]; const k = TPK[id]; return `<span class="b b-kw" title="${hx(k?k.uw:'')}">${hx(t?t.nm:id)}${k?` <span class="stt">· ${k.status}</span>`:''}</span>`; }
function bKto(kl){ return `<span class="b b-kto ${KL_CLS[kl]||''}">${KL_PL[kl]||kl}</span>`; }

// ── rekomendacja treści (tryb B) — wyprowadzona z K5v2 (scored) + CEP.pdp_anchor + touchpointy konwersji klienta ──
function recoRows(q){
  return q.tp.map(id => { const t = TP[id]||{}; const fmt = (t.f && q.f.includes(t.f)) ? t.f : (q.f[0]||t.f||'—'); return {tp:id, ty:q.ty, fm:fmt, kl:t.kl||'owned'}; });
}
function konwFor(sid){ return Object.keys(TPK).filter(id => TP[id] && TP[id].st.includes(Number(sid))); }
function recoBlock(q){
  const rows = recoRows(q); const c = q.c&&CEP[q.c]; const kw = konwFor(q.s);
  let h = `<div class="reco"><h4>Plan produkcji <span class="kto">odpowiada: ${q.kto==='owned'?'my':'obcy / rynek'}</span></h4>`;
  if (!rows.length) h += `<div class="note">brak touchpointów w scored — luka K6</div>`;
  for (const r of rows) h += `<div class="rrow">${bTp(r.tp)}<span>${bTy({ty:r.ty})}</span><span>${bFm(r.fm)}</span><span class="who ${KL_CLS[r.kl]}">${r.kl==='owned'?'produkujemy':r.kl==='partner'?'oddajemy marce':'monitorujemy'}</span></div>`;
  h += `<div class="redir"><span class="k">Przekierowanie kategoria → produkt</span>`;
  h += c && c.pa ? `<div>${hx(c.pa)}</div>` : `<div class="note">brak pdp_anchor dla tego CEP</div>`;
  h += `<div class="kw">${kw.length?kw.map(bKonw).join(''):'<span class="b b-draft">brak touchpointu konwersji w stanie S'+q.s+'</span>'}<span class="b b-draft" title="dopasowanie produktu (PRIMARY/SECONDARY/WEAK) liczy Product #3">[szkic — do wyprowadzenia z ORM]</span></div></div></div>`;

  ];
  h += kd.map(r=>`<div class="lrow"><span class="${r[1]==='ok'?'ok':'miss'}">${r[1]==='ok'?'JEST':'BRAK'}</span><div class="d"><b>${r[0]}</b> — ${r[2]}</div></div>`).join('');
  h += `<div class="lrow"><span class="kicker" style="padding-top:4px">źródła</span><div class="d mono" style="font-size:11px">${Object.values(m.src).join(' · ')}<br>wygenerowano ${m.gen} · tools/prototyp_cqf_v6.py · ${m.n} pytań · ${m.n_cep} CEP · ${m.n_orphan} sierot · scored niedopasowane: ${m.unmatched_scored}</div></div></div>`;
  el.innerHTML = h;
}

// ── sterowanie ──
function setView(v){ S.v = v; update(); }
function setMode(m){ S.m = m; update(); }
function openSheet(){ document.getElementById('sheet').classList.add('on'); document.getElementById('sheet-bg').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('sheet-bg').classList.remove('on'); }
function update(){
  writeHash();
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===S.m));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.v));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+S.v));
  const showF = S.v==='pole' || S.v==='path';
  document.getElementById('fbar').classList.toggle('hidden', !showF);
  renderChips(); renderFacets();
  if (S.v==='pole') renderPole(); else if (S.v==='path') renderPath(); else if (S.v==='seg') renderSeg(); else renderLeg();
  if (S.v!=='pole') document.getElementById('cnt').innerHTML = `<b>${filtered().length}</b> / ${Q.length} pytań`;
}
function placeSheet(){ const sheet = document.getElementById('sheet'); const slot = document.getElementById('sheetslot'); if (window.innerWidth>=1024) { if (sheet.parentNode!==slot) slot.appendChild(sheet); } else if (sheet.parentNode===slot) document.body.appendChild(sheet); }
let deb; document.getElementById('q').addEventListener('input', e => { clearTimeout(deb); deb = setTimeout(()=>{ S.q = e.target.value.trim(); update(); }, 160); });
window.addEventListener('resize', placeSheet);
window.addEventListener('hashchange', ()=>{ readHash(); document.getElementById('q').value = S.q; update(); });
document.getElementById('ttl').innerHTML = `${hx(D.meta.cat)} <small>${D.meta.n} pytań · ${D.meta.n_cep} CEP · ${D.meta.n_seg} segmentów</small>`;
readHash(); document.getElementById('q').value = S.q; placeSheet(); update();
</script>
