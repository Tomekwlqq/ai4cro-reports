<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan sklepu i treści</title>
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#1c2420;--mut:#59645e;--line:#dbe0d9;--acc:#1d6b47;--acc2:#e6f2ec;--p1:#b42318;--p1b:#fdecea;--p2:#a15c07;--p2b:#fdf1de;--p3:#44505a;--p3b:#eceff1;--ok:#1d6b47;--warn:#a15c07;--bad:#b42318;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-wrap:anywhere}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;line-height:1.2;margin:0 0 4px}
h2{font-size:1.15rem;margin:22px 0 8px}
h3{font-size:1rem;margin:0 0 4px}
p{margin:0 0 8px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.kpi span{color:var(--mut);font-size:.8rem}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tab,.chip,.node,.prow,.more{font:inherit;color:inherit;cursor:pointer}
.tab{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-weight:600;min-height:44px}
.tab[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.filters .lab{font-size:.8rem;color:var(--mut);margin-right:2px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:36px}
.chip[aria-pressed=true]{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.count{font-size:.85rem;color:var(--mut);margin:4px 0 8px}
.branch{margin:0 0 14px}
.branch>h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.nodewrap{border-left:2px solid var(--line);margin-left:6px;padding-left:10px}
.item{margin-bottom:6px}
.node,.prow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
.node:hover,.prow:hover{border-color:var(--acc)}
.node[aria-expanded=true],.prow[aria-expanded=true]{border-color:var(--acc);background:#fbfdfb}
.top{display:flex;gap:8px;align-items:flex-start}
.top .nm{flex:1;min-width:0;font-weight:600}
.url{font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);display:block;margin-top:2px}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b1{background:var(--p1b);color:var(--p1)}.b2{background:var(--p2b);color:var(--p2)}.b3{background:var(--p3b);color:var(--p3)}
.bk{background:var(--acc2);color:var(--acc)}.bp{background:#e8eefb;color:#2b4a9a}.bw{background:#efeafb;color:#5b3aa0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.78rem;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.detail{background:#fbfdfb;border:1px solid var(--acc);border-top:0;border-radius:0 0 10px 10px;padding:10px 12px;margin-top:-4px}
.detail dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.detail dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.detail dd{margin:0}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.mods span{background:var(--p3b);border-radius:6px;padding:2px 8px;font-size:.8rem}
.links{display:flex;flex-wrap:wrap;gap:5px}
.lk{font:inherit;background:var(--acc2);border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:.8rem;cursor:pointer}
.week{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.week>h3{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.week>h3 span{color:var(--mut);font-weight:400;font-size:.85rem}
.qs{margin:6px 0 0;padding:0;list-style:none}
.qs li{padding:5px 0;border-top:1px solid var(--line);font-size:.88rem}
.qs code{font:11px ui-monospace,Menlo,monospace;color:var(--mut);margin-right:6px}
.more{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--p3b);margin:6px 0}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--mut)}
.legend b{color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.rowst{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:8px 0}
.rowst .bar{height:16px;margin:2px 0}
.rowst small{color:var(--mut)}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
.hole{border-left:4px solid var(--bad)}
.hole .num{font-size:1.6rem;font-weight:700;color:var(--bad)}
.small{font-size:.85rem;color:var(--mut)}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.tc li{margin-bottom:4px}
@media (min-width:720px){
 .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
 .tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
 .detail dl{grid-template-columns:repeat(2,minmax(0,1fr))}
 .detail dl .full{grid-column:1/-1}
 .twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .wrap{padding:24px}
 h1{font-size:1.8rem}
}
</style>
</head>
