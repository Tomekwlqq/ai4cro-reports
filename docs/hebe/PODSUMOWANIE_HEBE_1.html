<script>
const LOGIN='hebe26';
async function otworz(login,haslo){if(login.trim().toLowerCase()!==LOGIN.toLowerCase())throw 0;
 const raw=Uint8Array.from(atob(document.getElementById('c').textContent.trim()),c=>c.charCodeAt(0));
 if(String.fromCharCode(...raw.slice(0,8))!=='Salted__')throw 0;const salt=raw.slice(8,16),data=raw.slice(16);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(haslo),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,384));
 const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
 const dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,data);
 const txt=new TextDecoder().decode(dec);try{sessionStorage.setItem('gate_ok','1')}catch(e){}
 document.open();document.write(txt);document.close();}
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();document.getElementById('e').style.display='none';document.getElementById('ld').style.display='block';
 try{await otworz(document.getElementById('l').value,document.getElementById('h').value)}catch(err){document.getElementById('ld').style.display='none';document.getElementById('e').style.display='block'}};
</script>
<style>
#pub-lightbox-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;align-items:center;justify-content:center;cursor:zoom-out}
#pub-lightbox-overlay.open{display:flex}
#pub-lightbox-overlay img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#pub-lightbox-close{position:fixed;top:16px;right:20px;font-size:36px;color:#fff;cursor:pointer;line-height:1;user-select:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style>
<div id="pub-lightbox-overlay"><span id="pub-lightbox-close">&times;</span><img id="pub-lightbox-img" src="" alt=""></div>
<script>
(function(){
  var ov=document.getElementById('pub-lightbox-overlay');
  var im=document.getElementById('pub-lightbox-img');
  document.querySelectorAll('a.pub-lightbox-trigger').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var img=a.querySelector('img');
      if(img){im.src=img.src;ov.classList.add('open');}
    });
  });
  document.getElementById('pub-lightbox-close').addEventListener('click',function(){ov.classList.remove('open');im.src='';});
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){ov.classList.remove('open');im.src='';}});
})();
</script>
