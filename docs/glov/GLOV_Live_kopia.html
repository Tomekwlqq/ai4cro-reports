<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOV Live 🇵🇱 — Dashboard GA4 PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="light"]{
  --bg:#fafbfd;--card:#ffffff;--card2:#f1f3f7;--line:#e6e6e9;
  --txt:#0a0a0a;--muted:#5b6472;--faint:#8b93a2;
  --accent:#7c5cff;--accent-d:#5a3ff0;--accent-soft:#efeaff;--accent-line:#d4c9ff;
  --good:#16a34a;--good-d:#15803d;--good-soft:#e7f6ec;--good-line:#b7e3c4;
  --warn:#f5751a;--warn-d:#dd5e0a;--warn-soft:#fff2e8;--warn-line:#f8c39a;
  --bad:#c0392b;--bad-d:#c0392b;--bad-soft:#fdeaea;--bad-line:#f6b6b6;
  --blue:#0f7ae5;--blue-d:#0a63bd;--blue-soft:#e9f3fd;--blue-line:#a9d2f6;
  --dark:#1a1f2b;
  --shadow:0 1px 3px rgba(0,0,0,0.07);
  --grotesk:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
:root,:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b22;--card2:#1e2229;--line:#2a2f3a;--txt:#e8eaed;
  --muted:#9aa3b2;--faint:#6b7280;
  --accent:#7c5cff;--accent-d:#a08aff;--accent-soft:rgba(124,92,255,.16);--accent-line:rgba(124,92,255,.45);
  --good:#3ecf8e;--good-d:#3ecf8e;--good-soft:rgba(62,207,142,.12);--good-line:rgba(62,207,142,.35);
  --warn:#f5a623;--warn-d:#f5a623;--warn-soft:rgba(245,166,35,.12);--warn-line:rgba(245,166,35,.35);
  --bad:#ff5c7c;--bad-d:#ff5c7c;--bad-soft:rgba(255,92,124,.12);--bad-line:rgba(255,92,124,.35);
  --blue:#5b8def;--blue-d:#5b8def;--blue-soft:rgba(91,141,239,.14);--blue-line:rgba(91,141,239,.4);
  --dark:#14181f;
  --shadow:0 2px 6px rgba(0,0,0,.3);
  --grotesk:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media(prefers-color-scheme:light){:root{
  --bg:#fafbfd;--card:#ffffff;--card2:#f1f3f7;--line:#e6e6e9;
  --txt:#0a0a0a;--muted:#5b6472;--faint:#8b93a2;
  --accent:#7c5cff;--accent-d:#5a3ff0;--accent-soft:#efeaff;--accent-line:#d4c9ff;
  --good:#16a34a;--good-d:#15803d;--good-soft:#e7f6ec;--good-line:#b7e3c4;
  --warn:#f5751a;--warn-d:#dd5e0a;--warn-soft:#fff2e8;--warn-line:#f8c39a;
  --bad:#c0392b;--bad-d:#c0392b;--bad-soft:#fdeaea;--bad-line:#f6b6b6;
  --blue:#0f7ae5;--blue-d:#0a63bd;--blue-soft:#e9f3fd;--blue-line:#a9d2f6;
  --dark:#1a1f2b;
  --shadow:0 1px 3px rgba(0,0,0,0.07);
}}
body{background:var(--bg);color:var(--txt);font-family:var(--grotesk);
  line-height:1.55;padding:0 0 80px;transition:background .25s,color .25s;font-size:14px}
/* ── Header (ścieżkowy: dark + kicker + src badges) ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 16px;
  background:var(--dark);color:var(--card);position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.header-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent-line);margin-bottom:5px;display:block}
.logo{font-size:20px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.logo b{color:var(--accent)}
.flag{font-size:10px;font-weight:700;color:var(--good-d);background:var(--good-soft);
  padding:2px 9px;border-radius:20px;display:inline-block;margin-left:6px;vertical-align:middle}
.topright{display:flex;align-items:center;gap:10px}
.sources{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.src-badge{background:rgba(255,255,255,0.08);border-radius:4px;padding:3px 9px;
  font-family:var(--mono);font-size:10px;color:var(--faint)}
.src-badge.s1{color:var(--blue)}.src-badge.s2{color:var(--good)}.src-badge.s3{color:var(--warn)}
.theme-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;
  width:34px;height:34px;cursor:pointer;font-size:14px;color:var(--card)}
.theme-btn:hover{background:rgba(255,255,255,.16)}
.chat-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:var(--grotesk)}
.chat-btn:hover{background:var(--accent-d)}
.wrap{max-width:1160px;margin:0 auto;padding:24px 20px 48px}
/* ── Panele / karty ── */
.dpanel,.live-sec{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}
.dpanel-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.dp-group{display:flex;flex-direction:column;gap:4px}
.dp-group label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono)}
.dp-group input[type=date]{background:var(--card2);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;color:var(--txt);font-size:13px;font-family:var(--grotesk)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:0}
.preset-btn{background:var(--card2);border:1px solid var(--line);border-radius:7px;
  padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;font-family:var(--grotesk)}
.preset-btn:hover,.preset-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmp-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none;margin-left:4px}
.cmp-toggle input{accent-color:var(--accent);width:15px;height:15px}
.cmp-row{display:none;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.apply-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:8px 18px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--grotesk)}
#refreshBtn{background:var(--accent)!important;color:#fff!important;border:none!important;border-radius:7px!important;
  padding:5px 12px;cursor:pointer;font-size:11.5px;font-weight:600;font-family:var(--grotesk)}
/* ── Sekcje raportu (ścieżkowy: kicker + akcent) ── */
.rpt-sec{margin-bottom:36px;padding-left:14px;border-left:3px solid var(--accent-line)}
.rpt-sec .col-body{display:block}
h2{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  margin:34px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--accent-d);background:var(--accent-soft);
  padding:3px 8px;border-radius:10px;letter-spacing:.08em}
.what{color:var(--txt);font-size:13px;margin:6px 0 2px;font-weight:600}
.dl{color:var(--muted);font-size:10.5px;margin:2px 0 10px;font-family:var(--mono);
  background:var(--card2);display:inline-block;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.alert{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:10px;
  padding:12px 14px;margin:0 0 18px;font-size:13px;display:none}
.alert b{color:var(--bad)}
/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-family:var(--mono)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .s{font-size:10px;color:var(--faint);margin-top:2px}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.d-up{color:var(--good-d)}.d-dn{color:var(--bad)}.d-neu{color:var(--muted)}
/* ── Tabele ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);background:var(--card2)}
td:first-child{font-weight:600}
tr:hover td{background:var(--card2)}
tr.hot td{background:var(--good-soft)}tr.danger td{background:var(--bad-soft)}
.crpill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.b-good{background:var(--good-soft);color:var(--good-d)}
.b-warn{background:var(--warn-soft);color:var(--warn-d)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-blue{background:var(--blue-soft);color:var(--blue-d)}
/* ── Bary / wnioski / rekomendacje ── */
.fbar{height:28px;border-radius:5px;background:var(--card2);overflow:hidden;margin:4px 0}
.fbar span{display:flex;height:100%;border-radius:5px;align-items:center;padding-left:9px;
  font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.concl{border-radius:0 9px 9px 0;padding:12px 14px;margin:12px 0 3px;font-size:12.5px;line-height:1.6}
.concl b{font-weight:700}
.c-red{background:var(--bad-soft);border-left:3px solid var(--bad)}
.c-amber{background:var(--warn-soft);border-left:3px solid var(--warn)}
.c-green{background:var(--good-soft);border-left:3px solid var(--good)}
.concl .lab{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  display:block;margin-bottom:3px;opacity:.8;font-family:var(--mono)}
.reco{background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;margin:7px 0 3px;font-size:12px}
.reco b{color:var(--accent)}.reco .meta{font-size:10.5px;color:var(--faint);margin-top:3px;font-family:var(--mono)}
/* ── Karty ── */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:640px){.cards2,.cards3{grid-template-columns:1fr}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.dcard.flag-bad{border-color:var(--bad-line)}
.dcard h4{font-size:13px;margin-bottom:7px}
.dcard .big{font-size:25px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.dcard .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.psb{padding:6px 14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:20px;
  cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s;margin-bottom:4px;font-family:var(--grotesk)}
.psb:hover,.psb.psa{background:var(--accent);color:#fff;border-color:var(--accent)}
.hbar{display:flex;align-items:flex-end;gap:2px;height:80px;margin-top:8px}
.col-btn{float:right;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:12px;padding:3px 11px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;margin-left:8px;font-family:var(--mono)}
.col-btn:hover{background:var(--card2);color:var(--txt)}
.rpt-sec.col-collapsed .col-body{display:none}
.rpt-sec.col-collapsed .concl,.rpt-sec.col-collapsed .reco{display:none}
.col-toolbar{display:flex;gap:8px;margin:8px 0 6px}
.col-all-btn{padding:4px 14px;border:1px solid var(--accent);background:transparent;color:var(--accent);
  border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:var(--grotesk)}
.col-all-btn:hover{background:var(--accent);color:#fff}
.hbar .hb{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.75;transition:opacity .15s;cursor:pointer}
.hbar .hb:hover{opacity:1}
/* ── Plan działania ── */
.plan .pi{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.plan .pi .pr{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:2px;background:var(--accent-soft);color:var(--accent-d)}
.plan .pi .pv{font-size:13px;font-weight:700;color:var(--good-d);white-space:nowrap;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
/* ── Ask Assistant ── */
.ask-widget{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:0}
.ask-panel{width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1);margin-bottom:8px}
.ask-panel.open{max-height:520px}
.ask-head{padding:12px 16px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ask-head h3{font-size:13.5px;font-weight:700;color:var(--card);margin:0;font-family:var(--grotesk)}
.ask-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;line-height:1;padding:0}
.ask-msgs{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:160px;max-height:280px;background:var(--card);flex-shrink:0}
.msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-radius:10px 10px 2px 10px}
.msg.ai{background:var(--card2);color:var(--txt);align-self:flex-start;border-radius:10px 10px 10px 2px}
.msg.typing{background:var(--card2);align-self:flex-start;border-radius:10px 10px 10px 2px;padding:10px 14px;display:flex;gap:4px;align-items:center}
.msg.typing span{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block;animation:tdot 1.2s infinite ease-in-out}
.msg.typing span:nth-child(2){animation-delay:.2s}
.msg.typing span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.ask-inp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.ask-inp input[type=text]{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--txt);font-size:12.5px;font-family:var(--grotesk)}
.ask-send{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:12px;align-self:flex-end;transition:transform .15s,background .15s;font-family:var(--grotesk)}
.ask-send:active{transform:scale(.92)}
.ask-send.sending{animation:sendbounce .4s ease}
@keyframes sendbounce{0%{transform:scale(1)}30%{transform:scale(.85)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.ask-key-row{padding:7px 12px 10px;display:flex;gap:7px;align-items:center;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.ask-key-row input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--txt);font-size:12px;font-family:var(--mono)}
.ask-key-row label{font-size:11px;color:var(--muted);white-space:nowrap}
.src{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:32px;padding-top:12px;border-top:1px solid var(--line)}
/* ── Live section ── */
.live-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.live-tab{padding:6px 16px;border-radius:20px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--grotesk)}
.live-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.live-pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;animation:lpulse 1.4s infinite;margin-right:5px;vertical-align:middle}
@keyframes lpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sbadge{font-family:var(--mono);font-size:9px;font-weight:600;padding:1px 6px;border-radius:4px;vertical-align:middle;line-height:1}
.sbadge-shp{background:#96bf48;color:#fff}.sbadge-ga4{background:var(--accent);color:#fff}
.sbadge-clr{background:var(--blue);color:#fff}.sbadge-bl{background:#f97316;color:#fff}
.lkgrid{display:grid;gap:8px;margin-bottom:10px}
.blformula{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:rgba(124,92,255,.07);border:1px solid rgba(124,92,255,.2);border-radius:6px;padding:7px 11px;margin-bottom:10px;white-space:nowrap;overflow-x:auto}
.blformula b{color:var(--good-d)}
.lkgrid-3{grid-template-columns:repeat(3,1fr)}.lkgrid-4{grid-template-columns:repeat(4,1fr)}.lkgrid-2{grid-template-columns:1fr 1fr}
@media(max-width:640px){.lkgrid-3,.lkgrid-4,.lkgrid-2{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.lkgrid-3,.lkgrid-4,.lkgrid-2{grid-template-columns:1fr}}
.lkcard{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.lkcard .ll{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;font-family:var(--mono)}
.lkcard .lv{font-size:18px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.lkcard .aovline{font-size:10px;color:var(--faint);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono)}
.lkcard .aovline b{font-size:15px;color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;margin-left:2px}
.lkcard .cr-hero{font-size:32px!important;font-weight:800;letter-spacing:-.8px;line-height:1.12;font-variant-numeric:tabular-nums}
.lkcard .ls{font-size:11px;color:var(--faint);margin-top:2px}
.lsep{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.lsep::after{content:'';flex:1;height:1px;background:var(--line)}
.lcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:640px){.lcols{grid-template-columns:1fr}}
.lcol-head{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.topprod{display:flex;flex-direction:column;margin-top:4px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.trow:last-child{border-bottom:none}
.tname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tqty{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.trev{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbar{grid-column:1/-1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:-4px}
.tbar div{height:100%;background:var(--accent);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:4px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tn{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv{font-size:21px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile .ts{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.live-nodata{color:var(--faint);font-size:12px;padding:12px 0;text-align:center}
.g4funnel{margin:4px 0 8px}
.gfrow{display:grid;grid-template-columns:120px 58px 1fr 115px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.gfrow:last-child{border-bottom:none}
.gfname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfcnt{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.gfbar-wrap{height:22px;background:var(--card2);border-radius:5px;overflow:hidden}
.gfbar{height:100%;border-radius:5px;background:var(--accent);transition:width .3s ease}
.gfpct{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.gfpct-lbl{font-size:9px;font-weight:500;color:var(--faint);margin-left:3px}
.gfpct-sub{font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;margin-top:1px;font-variant-numeric:tabular-nums}
@media(max-width:640px){.gfrow{grid-template-columns:90px 42px 1fr 90px;gap:6px}}
@media (max-width: 680px){
  .topbar{padding:16px 16px 14px}
  .wrap{padding:16px 1rem 32px}
  .rpt-sec{padding-left:10px}
}

</style>
</head>
<body>
<div class="topbar">
  <div>
    <span class="header-kicker">GLOV · Mission Control — PL</span>
    <div class="logo">glov<b>.</b>live <span class="flag">🇵🇱 PL only</span></div>
    <div class="sources">
      <span class="src-badge s1">Shopify</span>
      <span class="src-badge s2">GA4 342844459</span>
      <span class="src-badge s3">Clarity</span>
    </div>
  </div>
  <div class="topright">
    <button class="chat-btn" id="chatBtn">💬 Ask Assistant</button>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</div>
<div class="wrap">
  <div class="live-sec">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div style="font-size:14px;font-weight:800"><span class="live-pulse"></span>Live Shopify Raport — Dziś i Wczoraj</div>
      <button id="refreshBtn" onclick="refreshData()" style="background:#2C3E50;color:#fff;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600">🔄 Odśwież</button>
    </div>
    <div class="live-tabs">
      <button class="live-tab active" onclick="switchLiveTab('today',this)">🔴 Dziś <span id="lt-today-date" style="font-weight:400;font-size:11px"></span></button>
      <button class="live-tab" onclick="switchLiveTab('yesterday',this)">Wczoraj <span id="lt-yesterday-date" style="font-weight:400;font-size:11px"></span></button>
    </div>
    <div id="live-content"></div>
  </div>
  <div id="report"></div>
  <div class="src" id="srcInfo">Ładowanie danych...</div>
</div>

<div class="ask-widget">
  <div class="ask-panel" id="askPanel">
    <div class="ask-head">
      <h3>💬 Ask Assistant</h3>
      <button class="ask-close" id="askClose">×</button>
    </div>
    <div class="ask-msgs" id="chatMsgs">
      <div class="msg ai">Cześć! Jestem analitykiem GLOV PL. Pytaj o dane GA4 z bieżącego zakresu — kanały, produkty, lejek, trendy, rekomendacje.</div>
    </div>
    <div class="ask-inp">
      <input type="text" id="chatInput" placeholder="Pytaj o dane... (Enter = wyślij)">
      <button class="ask-send" id="chatSend">Wyślij</button>

<div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#2C3E50;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;font-weight:600">Ładowanie danych...</div>
</div>
<script>
const DOW_PL=['Niedz','Pon','Wt','Śr','Czw','Pt','Sob'];
let DAILY={},META={},LIVE=null,FIRST='',LAST='',LAST30='',LEJEK={},R02_DAY=null;

function n(x){return Math.round(x||0).toLocaleString('pl-PL');}
function money(x){return Math.round(x||0).toLocaleString('pl-PL')+' zł';}
function pct(x){return ((x||0)*100).toFixed(1)+'%';}
function crp(v){const c=v>=3?'b-good':v>=1.5?'b-warn':'b-bad';return `<span class="crpill ${c}">${v.toFixed(2)}%</span>`;}
function delta(cur,prev){
  if(!prev||prev===0)return '';
  const d=(cur-prev)/prev*100;const sign=d>=0?'+':'';const cls=d>=0?'d-up':'d-dn';
  return `<div class="d ${cls}">${sign}${d.toFixed(1)}%</div>`;
}

// ── Live section ──────────────────────────────────────────────────────────────

function switchLiveTab(key,btn){
  document.querySelectorAll('.live-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLive(key);
}

function renderLive(key){
  const data=LIVE?LIVE[key]:null;
  const el=document.getElementById('live-content');
  if(!data){el.innerHTML='<div class="live-nodata">Brak danych — uruchom: <code>python3 glov_etl_live2.py</code></div>';return;}

  const sh=data.shopify||{},g4=data.ga4||{};
  const shk=sh.kpi||{},g4k=g4.kpi||{};
  const ch=data.channels_merged||[];
  const shp=sh.products||[];
  const g4land=g4.landing||[];

  let h='';

  // Shopify KPI — podział Online Store vs TikTok Shop (27.08.2026, ShopifyQL sales_channel) + sesje human/bot
  const sfun=shk.funnel||{};
  const completedCO=sfun.purchase||0;
  const chans=shk.channels||{};
  const chOnline=chans['Online Store']||{orders:0,gross_sales:0};
  const chTT=chans['TikTok']||{orders:0,gross_sales:0};
  const onlineOrd=chOnline.orders||0, tiktokOrd=chTT.orders||0;
  const onlineGross=chOnline.gross_sales||0, tiktokGross=chTT.gross_sales||0;
  const hasSplit=onlineOrd||tiktokOrd;
  // Razem = SUMA kanałów (ShopifyQL Q3) — spójne ze splitem; REST (financial_status=paid) gubi TikTok pending
  const chAll=Object.values(chans);
  const chTotOrd=chAll.reduce((a,c)=>a+(c.orders||0),0);
  const chTotGross=chAll.reduce((a,c)=>a+(c.gross_sales||0),0);
  const razemOrd=hasSplit?chTotOrd:(shk.orders||0);
  const razemGross=hasSplit?chTotGross:(shk.gross_sales||0);
  const onlineAOV=onlineOrd>0?onlineGross/onlineOrd:0;
  const ttAOV=tiktokOrd>0?tiktokGross/tiktokOrd:0;
  const ttShare=razemGross>0?tiktokGross/razemGross:0;
  // sesje Shopify: total / boty / human
  const shSess=shk.sessions||0, shBot=shk.bot_sessions||0, shHuman=shk.human_sessions||(shSess-shBot);
  const botPct=shSess>0?(shBot/shSess*100).toFixed(0):'—';
  const crReal=shHuman>0?(onlineOrd/shHuman*100):0;
  const crCol=crReal>=3?'var(--good-d)':crReal>=1.5?'var(--warn-d)':'var(--bad)';
  const splitBar=`<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:7px">
    <div style="width:${(100-ttShare*100).toFixed(1)}%;background:var(--good)"></div>
    <div style="width:${(ttShare*100).toFixed(1)}%;background:var(--warn)"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:3px">
      <span>● Online ${(100-ttShare*100).toFixed(0)}%</span><span>● TikTok ${(ttShare*100).toFixed(0)}%</span></div>`;
  // BaseLinker — marketplace'y NA GÓRZE (28.08.2026): Allegro/Hebe z raportu BaseLinker (HP)
  const blk=data.baselinker||{};
  const blA=blk.allegro||{orders:0,revenue:0}, blH=blk.hebe||{orders:0,revenue:0};
  const blOrd=blA.orders+blH.orders, blRev=blA.revenue+blH.revenue;
  const blTotalOrd=razemOrd+blOrd, blTotalGross=razemGross+blRev;
  const blHA=blRev>0?blH.revenue/blRev*100:0;
  const blAA=blRev>0?blA.revenue/blRev*100:0;
  h+=`<div class="lsep"><span class="sbadge sbadge-bl">BASELINKER</span>Marketplace'y — raport HP</div>
  <div class="lkgrid lkgrid-3">
    <div class="lkcard"><div class="ll">Allegro</div><div class="lv" style="color:var(--accent)">${n(blA.orders)} · ${money(blA.revenue)}</div><div class="ls">${blAA.toFixed(0)}% sprzedaży BL</div></div>
    <div class="lkcard"><div class="ll">Hebe</div><div class="lv" style="color:var(--accent)">${n(blH.orders)} · ${money(blH.revenue)}</div><div class="ls">${blHA.toFixed(0)}% sprzedaży BL</div></div>
    <div class="lkcard"><div class="ll">RAZEM (wszystkie kanały)</div><div class="lv" style="color:var(--good-d)">${n(blTotalOrd)} · ${money(blTotalGross)}</div><div class="ls">liczone u nas · nie z BaseLinker</div></div>
  </div>
  <div class="blformula">RAZEM = Shopify ${n(razemOrd)} · ${money(razemGross)} + Hebe ${n(blH.orders)} · ${money(blH.revenue)} + Allegro ${n(blA.orders)} · ${money(blA.revenue)} → ${n(blTotalOrd)} · ${money(blTotalGross)}</div>`;

  h+=`<div class="lsep"><span class="sbadge sbadge-shp">SHOPIFY</span>Zamówienia &amp; Przychód — source of truth</div>
  <div class="lkgrid lkgrid-3">
    <div class="lkcard"><div class="ll">Online Store</div><div class="lv" style="color:var(--good-d)">${n(onlineOrd)} · ${money(onlineGross)}</div><div class="aovline">AOV <b>${n(onlineAOV)} zł</b></div></div>
    <div class="lkcard"><div class="ll">TikTok Shop</div><div class="lv" style="color:var(--warn-d)">${n(tiktokOrd)} · ${money(tiktokGross)}</div><div class="aovline">AOV <b>${n(ttAOV)} zł</b></div></div>
    <div class="lkcard"><div class="ll">RAZEM SHOPIFY</div><div class="lv">${n(razemOrd)} · ${money(razemGross)}</div>${hasSplit?splitBar+'<div class="ls">wg kanałów (ShopifyQL)</div>':'<div class="ls">brak podziału kanałów</div>'}</div>
  </div>`;

  // Lejek konwersji (bazowy) — dzień — POD Shopify (28.08: lejki zastępują sekcję Ruch & Konwersja)
  // FIX 31.08: lejek podlega tej samej regule co reszta Live — dzień aktywnej zakładki (Dziś/Wczoraj)
  // FIX 05.09: dla bieżącego dnia LEJEK (daily) nie ma dziś — wstrzykujemy dane z glov_live2.json
  const _prevR02=R02_DAY; R02_DAY=data.date||null;
  const _liveInject = data.date && !LEJEK[data.date] && data.ga4 && data.ga4.funnel;
  if(_liveInject){
    const f=data.ga4.funnel;
    const shk=(data.shopify&&data.shopify.kpi)||{};
    const shCh=shk.channels||{};
    const shHuman=shk.human_sessions||0;
    const shBot=(shk.bot_sessions)||(shk.sessions||0)-shHuman;
    const onlineOrd=(shCh['Online Store']&&shCh['Online Store'].orders)||0;
    LEJEK[data.date]={
      ga4:{all:{pl:{session_start:f.session_start||0,view_item:f.view_item||0,add_to_cart:f.add_to_cart||0,begin_checkout:f.begin_checkout||0,purchase:f.purchase||0},unknown:{},xx:{}}},
      shopify:{
        human:{pl:{sessions:shHuman,atc:f.add_to_cart||0,checkout:f.begin_checkout||0,completed:onlineOrd},unknown:{},xx:{}},
        bot:{pl:{sessions:shBot},unknown:{},xx:{}},
        channels_sales:shCh
      }
    };
  }
  h+=renderFunnel(null,data.date,data.date);
  if(_liveInject) delete LEJEK[data.date];
  R02_DAY=_prevR02;

  // Δ vs mediana dnia tygodnia — 8 tyg wstecz, ten sam dzień tygodnia (28.08.2026)
  const wdnGen=['niedzieli','poniedziałku','wtorku','środy','czwartku','piątku','soboty'];
  const wdMed=(metric,excl)=>{
    const wd=new Date(excl+'T12:00:00').getDay();
    const vals=[];
    Object.keys(DAILY).filter(x=>x<excl).sort().slice(-56).forEach(x=>{
      const k=DAILY[x]&&DAILY[x].kpi; if(!k)return;
      if(new Date(x+'T12:00:00').getDay()!==wd)return;
      const v=metric(k); if(v!=null)vals.push(v);
    });
    if(vals.length<3)return null;
    vals.sort((a,b)=>a-b);
    return vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2;
  };
  const d0=data.date;
  const medOrd=wdMed(k=>k.shopify_orders!=null?k.shopify_orders:k.transactions,d0);
  const medRev=wdMed(k=>k.shopify_revenue!=null?k.shopify_revenue:k.totalRevenue,d0);
  const medSess=wdMed(k=>k.sessions,d0);
  const medBounce=wdMed(k=>k.bounceRate!=null?k.bounceRate*100:null,d0);
  const dp=(cur,med)=>med>0?((cur-med)/med*100):null;
  const dTile=(nm,cur,med,isToday)=>{
    const dd=dp(cur,med);
    if(dd==null)return `<div class="tile"><div class="tn">${nm}</div><div class="tv" style="color:var(--faint)">—</div><div class="ts">brak normy</div></div>`;
    const col=dd>=10?'var(--good-d)':dd<=-10?'var(--bad)':'var(--muted)';
    const sign=dd>0?'+':'';
    return `<div class="tile"><div class="tn">${nm}</div><div class="tv" style="color:${col}">${sign}${dd.toFixed(0)}%</div><div class="ts">dziś ${n(cur)} vs norma ${n(Math.round(med))}${isToday?' (dzień w toku)':''}</div></div>`;
  };
  // Bounce rate: spadek = dobrze → odwrócone kolory
  const dBounce=(nm,cur,med,isToday)=>{
    const dd=dp(cur,med);
    if(dd==null)return `<div class="tile"><div class="tn">${nm}</div><div class="tv" style="color:var(--faint)">—</div><div class="ts">brak normy</div></div>`;
    const col=dd<=-10?'var(--good-d)':dd>=10?'var(--bad)':'var(--muted)';
    const sign=dd>0?'+':'';
    return `<div class="tile"><div class="tn">${nm}</div><div class="tv" style="color:${col}">${sign}${dd.toFixed(0)}%</div><div class="ts">dziś ${(cur||0).toFixed(0)}% vs norma ${Math.round(med||0)}%${isToday?' (dzień w toku)':''}</div></div>`;
  };
  h+=`<div class="lsep">Δ vs mediana ${wdnGen[new Date(d0+'T12:00:00').getDay()]} (8 tyg wstecz)</div><div class="tiles">`
    +dTile('Zamówienia',razemOrd,medOrd,key==='today')
    +dTile('Przychód',razemGross,medRev,key==='today')
    +dTile('Sesje (GA4 PL)',g4k.sessions,medSess,key==='today')
    +dBounce('Bounce rate (GA4 PL)',(g4k.bounce_rate||0)*100,medBounce,key==='today')
    +'</div>';

  // Sprzedaż dzienna — itemy Shopify (po medianie)
  h+=`<div class="lsep"><span class="sbadge sbadge-shp">SHOPIFY</span>Top produkty dziś (sprzedaż w sztukach)</div>`;
  if(shp.length){
    h+='<div class="tiles">';
    shp.slice(0,6).forEach((p,i)=>{
      const nm=p.name.length>24?p.name.slice(0,24)+'…':p.name;
      const top=i===0;
      h+=`<div class="tile"><div class="tn" title="${p.name}">${nm}</div><div class="tv" style="${top?'color:var(--good-d)':''}">${n(p.qty)} szt</div><div class="ts">${money(p.revenue)}</div></div>`;
    });
    h+='</div>';
  }else{h+='<div class="live-nodata">brak danych</div>';}

  // Porzucone koszyki + Lista mailingowa — GA4 PL (28.08.2026)
  const abandoned=Math.max(0,(g4k.checkouts||0)-(g4k.purchases||0));
  const aovGA4=(g4k.purchases||0)>0?(g4k.revenue||0)/g4k.purchases:0;
  const nl=(data.ga4.newsletter!=null)?data.ga4.newsletter:null;
  h+=`<div class="lsep"><span class="sbadge sbadge-ga4">GA4</span>Koszyk &amp; Lista mailingowa</div><div class="tiles">
    <div class="tile"><div class="tn">Porzucone koszyki</div><div class="tv" style="color:var(--warn-d)">${n(abandoned)}</div><div class="ts">≈ ${money(Math.round(abandoned*aovGA4))} · checkout→zakup PL</div></div>
    <div class="tile"><div class="tn">Lista mailingowa dziś</div><div class="tv">${nl==null?'—':n(nl)}</div><div class="ts">zapisów · GA4 event newsletter</div></div>
  </div>`;

  // GA4 — kanały dziś (klocki w poziomie: nazwa · % · ilość)
  const chg=(data.ga4.channels_group||[]).slice(0,6);
  if(chg.length){
    const totCh=chg.reduce((a,c)=>a+(c.sessions||0),0);
    h+=`<div class="lsep"><span class="sbadge sbadge-ga4">GA4</span>Kanały dziś</div><div class="tiles">`;
    chg.forEach((c,i)=>{
      const pc=totCh>0?((c.sessions||0)/totCh*100).toFixed(1):0;
      const top=i===0;
      h+=`<div class="tile"><div class="tn" title="${c.channel}">${c.channel}</div><div class="tv" style="${top?'color:var(--accent)':''}">${pc}%</div><div class="ts">${n(c.sessions)} sesji</div></div>`;
    });
    h+='</div>';
  }

  // Clarity — browsery (ostatnie 24h; in-app na pomarańczowo) — NA KOŃCU
  const clr=(LIVE&&LIVE.clarity)||null;
  if(clr&&clr.today){
    const brs=Object.entries(clr.today.browsers||{}).sort((a,b)=>b[1].sessions-a[1].sessions).slice(0,6);
    const ttl=clr.today.totals||{};
    const totBr=ttl.sessions||brs.reduce((a,[,v])=>a+(v.sessions||0),0);
    h+=`<div class="lsep"><span class="sbadge sbadge-clr">CLARITY</span>Browsery (ostatnie 24h)</div><div class="tiles">`;
    brs.forEach(([b,v])=>{
      const inApp=/app/i.test(b);
      const nm=b.replace(/App$/,' App').replace(/Mobile/i,' (mob)');
      const pc=totBr>0?((v.sessions||0)/totBr*100).toFixed(1):0;
      h+=`<div class="tile" style="${inApp?'border-color:var(--warn-line)':''}"><div class="tn" style="${inApp?'color:var(--warn-d)':''}">${nm}</div><div class="tv" style="${inApp?'color:var(--warn-d)':''}">${n(v.sessions)}</div><div class="ts">${pc}% ruchu</div></div>`;
    });
    h+='</div>';
    // Clarity — pasek 2×3: Insights (miary problemów) + Intent (3 poziomy) (28.08.2026)
    const totS=ttl.sessions||0;
    const pctClr=v=>totS>0?(v/totS*100).toFixed(1):'0.0';
    h+=`<div class="lsep" style="margin-top:16px"><span class="sbadge sbadge-clr">CLARITY</span>Insights &amp; Intent <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)">(24h · sesje ludzkie, bez botów)</span></div>
    <div class="lkgrid lkgrid-3">
      <div class="lkcard"><div class="ll">😤 Rage clicks</div><div class="lv" style="color:var(--bad)">${n(ttl.rage||0)}</div><div class="ls">${pctClr(ttl.rage||0)}% sesji z frustracją</div></div>
      <div class="lkcard"><div class="ll">💀 Dead clicks</div><div class="lv" style="color:var(--bad)">${n(ttl.dead||0)}</div><div class="ls">${pctClr(ttl.dead||0)}% sesji z martwym klikiem</div></div>
      <div class="lkcard"><div class="ll">↩ Quick back</div><div class="lv" style="color:var(--warn-d)">${n(ttl.quickback||0)}</div><div class="ls">${pctClr(ttl.quickback||0)}% sesji z powrotem do wyników</div></div>
    </div>
    <div class="lkgrid lkgrid-3" style="margin-top:8px">
      <div class="lkcard"><div class="ll">🟢 Intent L1 — przeglądają</div><div class="lv" style="color:var(--good-d)">${totS>0?((totS-(g4k.atc||0))/totS*100).toFixed(1):'—'}%</div><div class="ls">sesje bez dodania do koszyka</div></div>
      <div class="lkcard"><div class="ll">🟡 Intent L2 — rozważają</div><div class="lv" style="color:var(--warn-d)">${totS>0?((g4k.atc||0)/totS*100).toFixed(1):'—'}%</div><div class="ls">doszli do koszyka (ATC)</div></div>
      <div class="lkcard"><div class="ll">🔴 Intent L3 — gotowi</div><div class="lv" style="color:var(--accent)">${totS>0?((g4k.checkouts||0)/totS*100).toFixed(1):'—'}%</div><div class="ls">dotarli do checkoutu</div></div>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:6px">😤 rage ${n(ttl.rage)} · 💀 dead ${n(ttl.dead)} · ↩ quickback ${n(ttl.quickback)} · 📜 excessive scroll ${n(ttl.scroll)} <span style="float:right">Clarity nie łapie botów — to sesje ludzkie</span></div>`;
  }
  el.innerHTML=h;
}

function initLive(){

function aggregateRange(s,e){
  const out={
    kpi:{sessions:0,transactions:0,totalRevenue:0,bounceSum:0,bounceSess:0,
         addToCarts:0,checkouts:0,durSum:0,durSess:0,paid_sessions:0,paid_revenue:0,newsletter:0},
    channelsMap:{},channelsDetailMap:{},devicesMap:{},funnel:{},productsMap:{},shpProductsMap:{},
    landingMap:{},landingShopifyMap:{},newretMap:{},searchMap:{},hourMap:{},dowMap:{},
    repeat_buyers:META.repeat_buyers||[]
  };
  const dkeys=Object.keys(DAILY).filter(dk=>dk>=s&&dk<=e).sort();
  dkeys.forEach(dk=>{
    const d=DAILY[dk];if(!d)return;
    const k=d.kpi||{};
    out.kpi.sessions    +=k.sessions||0;
    out.kpi.transactions+=(k.shopify_orders!=null?k.shopify_orders:k.transactions)||0;
    out.kpi.totalRevenue+=(k.shopify_revenue!=null?k.shopify_revenue:k.totalRevenue)||0;
    out.kpi.addToCarts  +=k.addToCarts||0;
    out.kpi.checkouts   +=k.checkouts||0;
    out.kpi.paid_sessions+=(k.paid_sessions||0);
    out.kpi.paid_revenue+=(k.paid_revenue||0);
    out.kpi.newsletter+=(k.newsletter||0);
    if((k.sessions||0)>0){
      out.kpi.bounceSum +=k.bounceRate*(k.sessions);
      out.kpi.bounceSess+=k.sessions;
      out.kpi.durSum    +=(k.avgSessionDuration_s||0)*(k.sessions);
      out.kpi.durSess   +=k.sessions;
    }
    (d.channels||[]).forEach(c=>{
      const m=out.channelsMap[c.channel]||(out.channelsMap[c.channel]={channel:c.channel,sessions:0,transactions:0,revenue:0,durSum:0,durSess:0,ppsSum:0,ppsSess:0});
      m.sessions+=c.sessions||0;m.transactions+=c.transactions||0;m.revenue+=c.revenue||0;
      if((c.sessions||0)>0){m.durSum+=(c.dur||0)*c.sessions;m.durSess+=c.sessions;m.ppsSum+=(c.pps||0)*c.sessions;m.ppsSess+=c.sessions;}
    });
    (d.channels_detail||[]).forEach(c=>{
      const key=(c.source||'')+'|'+(c.medium||'')+'|'+(c.campaign||'');
      const m=out.channelsDetailMap[key]||(out.channelsDetailMap[key]={source:c.source,medium:c.medium,campaign:c.campaign,sessions_ga4:0,sessions_shp:0,sessions:0,transactions:0,revenue:0});
      m.sessions_ga4+=c.sessions||0;m.transactions+=c.transactions||0;m.revenue+=c.revenue||0;
    });
    // Shopify UTM sessions (source of truth dla Meta; Google/cpc = 0 w Shopify)
    (d.channels_shopify||[]).forEach(c=>{
      const key=(c.source||'')+'|'+(c.medium||'')+'|'+(c.campaign||'');
      if(out.channelsDetailMap[key]){
        out.channelsDetailMap[key].sessions_shp+=c.sessions||0;
      } else {
        out.channelsDetailMap[key]={source:c.source,medium:c.medium,campaign:c.campaign,sessions_ga4:0,sessions_shp:c.sessions||0,sessions:0,transactions:0,revenue:0};
      }
    });
    (d.devices||[]).forEach(c=>{
      const m=out.devicesMap[c.device]||(out.devicesMap[c.device]={device:c.device,sessions:0,transactions:0,revenue:0});
      m.sessions+=c.sessions||0;m.transactions+=c.transactions||0;m.revenue+=c.revenue||0;
    });
    const f=d.funnel||{};
    ['session_start','view_item','add_to_cart','begin_checkout','purchase'].forEach(ev=>{
      out.funnel[ev]=(out.funnel[ev]||0)+(f[ev]||0);
    });
    (d.products||[]).forEach(p=>{
      const m=out.productsMap[p.name]||(out.productsMap[p.name]={name:p.name,viewed:0,atc:0,purchased:0,revenue:0});
      m.viewed+=p.viewed||0;m.atc+=p.atc||0;m.purchased+=p.purchased||0;m.revenue+=p.revenue||0;
    });
    (d.products_shopify||[]).forEach(p=>{
      const key=(p.name||'').toLowerCase().trim();
      const m=out.shpProductsMap[key]||(out.shpProductsMap[key]={name:p.name,qty:0,revenue:0});
      m.qty+=p.qty||0;m.revenue+=p.revenue||0;
    });
    (d.landing_shopify||[]).forEach(p=>{
      const m=out.landingShopifyMap[p.page]||(out.landingShopifyMap[p.page]={page:p.page,sessions:0,visitors:0,atc:0,checkout:0});
      m.sessions+=p.sessions||0;m.visitors+=p.visitors||0;m.atc+=p.atc||0;m.checkout+=p.checkout||0;
    });
    (d.landing_atc||[]).forEach(p=>{
      if(/-kopia/i.test(p.page))return; // testowe produkty → skip
      // normalizuj /collections/X/products/Y → /products/Y (dedup duplikatów URL)
      const pg=p.page.replace(/\/collections\/[^/]+\/products\//,'/products/');
      const m=out.landingMap[pg]||(out.landingMap[pg]={page:pg,sessions:0,atc:0,transactions:0,revenue:0});
      m.sessions+=p.sessions||0;m.atc+=p.atc||0;m.transactions+=p.transactions||0;m.revenue+=p.revenue||0;
    });
    (d.newret||[]).forEach(nr=>{
      const m=out.newretMap[nr.segment]||(out.newretMap[nr.segment]={segment:nr.segment,sessions:0,transactions:0,revenue:0});
      m.sessions+=nr.sessions||0;m.transactions+=nr.transactions||0;m.revenue+=nr.revenue||0;
    });
    (d.search||[]).forEach(st=>{
      const m=out.searchMap[st.term]||(out.searchMap[st.term]={term:st.term,count:0,transactions:0});
      m.count+=st.count||0;m.transactions+=st.transactions||0;
    });
    (d.hour||[]).forEach(hr=>{
      const m=out.hourMap[hr.h]||(out.hourMap[hr.h]={h:hr.h,sessions:0,transactions:0});
      m.sessions+=hr.sessions||0;m.transactions+=hr.transactions||0;
    });
    const di=new Date(dk+'T12:00:00').getDay();
    const dm=out.dowMap[di]||(out.dowMap[di]={day:di,sessions:0,transactions:0,revenue:0});
    dm.sessions+=k.sessions||0;
    dm.transactions+=(k.shopify_orders!=null?k.shopify_orders:k.transactions)||0;
    dm.revenue+=(k.shopify_revenue!=null?k.shopify_revenue:k.totalRevenue)||0;
  });
  const kpi=out.kpi;
  kpi.bounceRate=kpi.bounceSess>0?kpi.bounceSum/kpi.bounceSess:0;
  kpi.avgSessionDuration_s=kpi.durSess>0?kpi.durSum/kpi.durSess:0;
  // Wybierz właściwe sessions per kanał: meta→Shopify, google organic→GA4, google/cpc→GA4, reszta→max
  out.channels_detail=Object.values(out.channelsDetailMap).map(c=>{
    const src=(c.source||'').toLowerCase(),med=(c.medium||'').toLowerCase();
    const isMetaPaid=(src==='meta'||src==='facebook')&&med==='cpc';
    const isGooglePaid=src==='google'&&med==='cpc';
    const isGoogleOrganic=src==='google'&&med==='organic';
    const isShopifyTracked=(src==='google'&&med==='product_sync');
    let sessions, sess_src;
    if(isMetaPaid){
      // Meta: Shopify jest source of truth (iOS blokuje GA4)
      sessions=c.sessions_shp||c.sessions_ga4||0; sess_src='shp';
    } else if(isGooglePaid||isGoogleOrganic){
      // Google: GA4 (gclid niewidoczny dla Shopify)
      sessions=c.sessions_ga4||0; sess_src='ga4';
    } else if(isShopifyTracked){
      sessions=c.sessions_shp||0; sess_src='shp';
    } else {
      sessions=Math.max(c.sessions_ga4||0,c.sessions_shp||0);
      sess_src=(c.sessions_shp||0)>=(c.sessions_ga4||0)?'shp':'ga4';
    }
    return {...c, sessions, sess_src};
  }).sort((a,b)=>b.sessions-a.sessions).slice(0,30);
  out.channels=Object.values(out.channelsMap).map(c=>({...c,
    dur:c.durSess>0?c.durSum/c.durSess:0,
    pps:c.ppsSess>0?c.ppsSum/c.ppsSess:0
  })).sort((a,b)=>b.revenue-a.revenue).slice(0,12);
  out.devices=Object.values(out.devicesMap).sort((a,b)=>b.sessions-a.sessions);
  out.products=Object.values(out.productsMap).map(p=>{
    const shp=out.shpProductsMap[(p.name||'').toLowerCase().trim()];
    return {...p,
      purchased:shp!=null?shp.qty:p.purchased,
      revenue:shp!=null?shp.revenue:p.revenue,
      shp_match:shp!=null};
  }).sort((a,b)=>b.purchased-a.purchased).slice(0,15);
  out.landing_atc=Object.values(out.landingMap).sort((a,b)=>b.sessions-a.sessions).slice(0,15);
  out.landing_shopify=Object.values(out.landingShopifyMap).sort((a,b)=>b.sessions-a.sessions).slice(0,15);
  out.newret=Object.values(out.newretMap);
  out.search_terms=Object.values(out.searchMap).sort((a,b)=>b.count-a.count).slice(0,10);
  out.hour=Object.values(out.hourMap).sort((a,b)=>a.h-b.h);
  out.dayofweek=Object.values(out.dowMap).sort((a,b)=>a.day-b.day);
  out.daysCount=dkeys.length;
  return out;
}

function renderFunnel(d,s,e){
  // Lejek konwersji (bazowy) — 6 zestawów × 5 poziomów × własna konwersja; live = widok dzienny (R02_DAY)
  const dksAll=Object.keys(LEJEK).filter(x=>x>=s&&x<=e);
  const dks=R02_DAY?dksAll.filter(x=>x===R02_DAY):dksAll;
  const L=()=>({wej:0,pdp:0,kosz:0,chk:0,zak:0});
  const ga4All=L(),ga4PL=L(),shAll=L(),shHum=L(),shAllPL=L(),shHumPL=L();
  let shOnline=0;
  dks.forEach(dk=>{
    const day=LEJEK[dk]; if(!day)return;
    const g=day.ga4||{}; const all=g.all||{};
    ['pl','xx','unknown'].forEach(k=>{
      const b=all[k]||{};
      ga4All.wej+=b.session_start||0;ga4All.pdp+=b.view_item||0;ga4All.kosz+=b.add_to_cart||0;
      ga4All.chk+=b.begin_checkout||0;ga4All.zak+=b.purchase||0;
    });
    const pl=all.pl||{};
    ga4PL.wej+=pl.session_start||0;ga4PL.pdp+=pl.view_item||0;ga4PL.kosz+=pl.add_to_cart||0;
    ga4PL.chk+=pl.begin_checkout||0;ga4PL.zak+=pl.purchase||0;
    const sh=day.shopify||{};
    ['pl','xx','unknown'].forEach(k=>{
      const hu=(sh.human||{})[k]||{}, bo=(sh.bot||{})[k]||{};
      shAll.wej+= (hu.sessions||0)+(bo.sessions||0);
      shAll.kosz+=hu.atc||0; shAll.chk+=hu.checkout||0;
      shHum.wej+=hu.sessions||0; shHum.kosz+=hu.atc||0; shHum.chk+=hu.checkout||0;
      if(k==='pl'){ // karty PL: tylko Polska (Q1 ma podział na kraje; Q3 nie)
        shAllPL.wej+=(hu.sessions||0)+(bo.sessions||0);
        shAllPL.kosz+=hu.atc||0; shAllPL.chk+=hu.checkout||0; shAllPL.zak+=hu.completed||0;
        shHumPL.wej+=hu.sessions||0; shHumPL.kosz+=hu.atc||0; shHumPL.chk+=hu.checkout||0; shHumPL.zak+=hu.completed||0;
      }
    });
    // Zakup (All) = zamówienia ONLINE STORE (Q3) — TikTok NIE płynie przez lejek sklepu
    const cs=sh.channels_sales||{};
    if(cs['Online Store'])shOnline+=(cs['Online Store'].orders||0);
  });
  shAll.zak=shOnline; shHum.zak=shOnline; // karty globalne: te same zakupy, różnica tylko w Wejściu (z/bez botów)
  const stepsDef=[['wej','Wejście','#5b8def','sesji'],['pdp','PDP','#7c5cff','Wejście'],['kosz','Koszyk','#d97706','PDP'],['chk','Checkout','#ec4899','Koszyk'],['zak','Zakup','#16a34a','Checkout']];
  function funRows(steps){
    const max=Math.max(...stepsDef.map(([k])=>steps[k]||0),1);
    let h='';
    stepsDef.forEach(([k,nm,col,prevLbl],i)=>{
      const v=steps[k]||0;
      const prev=i>0?(steps[stepsDef[i-1][0]]||0):0;
      const has=v>0;
      const isAtc=k==='kosz';
      const barW=has?Math.max(v/max*100,1).toFixed(0):0;
      const pctSess=has&&i>0?(v/max*100).toFixed(1)+'%':'—';
      const pctPrev=has&&i>=2&&prev>0?((v/prev*100).toFixed(1)+'%'):'';
      h+=`<div class="gfrow">
        <div class="gfname">${nm}</div>
        <div class="gfcnt">${has?n(v):'<span style="color:var(--faint)">—</span>'}</div>
        <div class="gfbar-wrap"${isAtc&&has?' style="outline:2px solid var(--bad);outline-offset:-2px"':''}><div class="gfbar" style="width:${barW}%;background:${col}"></div></div>
        <div><div class="gfpct" style="color:${has?col:'var(--faint)'}">${pctSess}${has&&i>0?`<span class="gfpct-lbl">ze&nbsp;sesji</span>`:''}</div>
        ${pctPrev?`<div class="gfpct-sub">${pctPrev}<span class="gfpct-lbl">ze&nbsp;${prevLbl}</span></div>`:''}
        </div>
      </div>`;
    });
    return h;
  }
  function funCard(title,badge,steps,cr,crNote){
    const col=cr>=3?'var(--good-d)':cr>=1.5?'var(--warn-d)':'var(--bad)';
    return `<div class="lkcard" style="margin:0">
      <div class="ll">${title} ${badge}</div>
      <div class="g4funnel" style="margin-top:6px">${funRows(steps)}</div>
      <div style="margin-top:8px;padding-top:7px;border-top:1px solid var(--line)"><div style="font-size:9px;color:var(--faint);letter-spacing:.08em">KONWERSJA</div><b style="color:${col};font-size:24px">${cr.toFixed(2)}%</b><div class="ls">${crNote}</div></div>
    </div>`;
  }
  const crAll=ga4All.wej>0?(ga4All.zak/ga4All.wej*100):0;
  const crPL=ga4PL.wej>0?(ga4PL.zak/ga4PL.wej*100):0;
  const crShAll=shAll.wej>0?(shAll.zak/shAll.wej*100):0;
  const crShHum=shHum.wej>0?(shHum.zak/shHum.wej*100):0;
  const crShAllPL=shAllPL.wej>0?(shAllPL.zak/shAllPL.wej*100):0;
  const crShHumPL=shHumPL.wej>0?(shHumPL.zak/shHumPL.wej*100):0;
  return `<h2><span class="r">R02</span> Lejek konwersji (bazowy) — dzień</h2>
  <div class="what">Dzień: <b>${R02_DAY||'—'}</b> (pełne dane dzienne). Każdy zestaw × 5 kroków × własna konwersja. Shopify nie raportuje kroku PDP — stąd „—”. Karty PL: zakupy z Q1 (sesje-match), globalne z Q3 Online Store.</div>
  <div class="lkgrid lkgrid-3" style="margin-top:10px">
    ${funCard('GA4 All','<span class="sbadge sbadge-ga4">GA4</span>',ga4All,crAll,'zakupy ÷ wejście · wszystkie kraje')}
    ${funCard('GA4 PL','<span class="sbadge sbadge-ga4">GA4</span>',ga4PL,crPL,'zakupy ÷ wejście · country=Poland')}
    ${funCard('Shopify All','<span class="sbadge sbadge-shp">SHP</span>',shAll,crShAll,'zamówienia online ÷ sesje (z botami) · bez TikTok')}
    ${funCard('Shopify tylko ludzie','<span class="sbadge sbadge-shp">SHP</span>',shHum,crShHum,'zamówienia online ÷ sesje bez botów · CR real · bez TikTok')}
    ${funCard('Shopify All PL','<span class="sbadge sbadge-shp">SHP</span> 🇵🇱',shAllPL,crShAllPL,'zamówienia ÷ sesje PL (z botami) · sesje-match · bez TikTok')}
    ${funCard('Shopify tylko ludzie PL','<span class="sbadge sbadge-shp">SHP</span> 🇵🇱',shHumPL,crShHumPL,'zamówienia ÷ sesje PL bez botów · CR real PL · sesje-match · bez TikTok')}
  </div>`;
}

function renderChannelFunnel(d,s,e){
  if(!Object.keys(LEJEK).length)return '';
  // Lejek konwersji vs kanały — dane: LEJEK (lejek_daily) ga4.channels[ch].pl
  const dks=Object.keys(LEJEK).filter(x=>x>=s&&x<=e);
  const raw={};
  dks.forEach(dk=>{
    const g4=LEJEK[dk]&&LEJEK[dk].ga4&&LEJEK[dk].ga4.channels;
    if(!g4)return;
    Object.keys(g4).forEach(cn=>{
      const pl=g4[cn]&&g4[cn].pl;
      if(!pl)return;
      const r=raw[cn]||(raw[cn]={wej:0,kosz:0,kasa:0,zak:0});
      r.wej+=pl.session_start||0;r.kosz+=pl.add_to_cart||0;r.kasa+=pl.begin_checkout||0;r.zak+=pl.purchase||0;
    });
  });
  if(!Object.keys(raw).length)return '';
  // Widok Zgrupowane — kanon raportu ścieżek (Meta CPC · Google CPC · Google Organic · Direct · Affiliate/Inne)
  const kanon=[
    ['Meta CPC',['Paid Social']],
    ['Google CPC',['Paid Search','Paid Shopping','Cross-network']],
    ['Google Organic',['Organic Search']],
    ['Direct',['Direct']],
    ['Affiliate/Inne',['Referral','Organic Social','Organic Shopping','Email','SMS','Unassigned','Display','Paid Other','Organic Video','Audio','Affiliate','Mobile Push Notifications','AI Assistant']]
  ];
  const chIdx={};
  kanon.forEach(k=>k[1].forEach(cn=>chIdx[cn]=k[0]));
  const rows={};
  Object.entries(raw).forEach(([cn,r])=>{
    const nm=chIdx[cn]||'Affiliate/Inne';
    const g=rows[nm]||(rows[nm]={wej:0,kosz:0,kasa:0,zak:0});
    g.wej+=r.wej;g.kosz+=r.kosz;g.kasa+=r.kasa;g.zak+=r.zak;
  });
  function matrixHtml(items,showRaw){
    const tot={wej:0,kosz:0,kasa:0,zak:0};
    items.forEach(r=>{tot.wej+=r.wej;tot.kosz+=r.kosz;tot.kasa+=r.kasa;tot.zak+=r.zak;});
    const list=items.concat([{name:'RAZEM',...tot}]);
    let h='<table><tr><th>Kanał</th><th>Wejście</th><th>Do koszyka</th><th>Kasa</th><th>Zakup</th><th>KONWERSJA</th></tr>';
    list.forEach(r=>{
      const crv=r.wej>0?(r.zak/r.wej*100):0;
      const bold=r.name==='RAZEM';
      const col=crv>=2?'var(--good)':crv>=0.7?'var(--warn)':'var(--bad)';

    });
    return h+'</table>';
  }
  const grouped=kanon.map(([nm])=>({name:nm,...(rows[nm]||{wej:0,kosz:0,kasa:0,zak:0})}));
  const rawList=Object.entries(raw).sort((a,b)=>b[1].wej-a[1].wej).slice(0,10).map(([nm,r])=>({name:nm,...r}));
  return `<h2><span class="r">R01c</span> Lejek konwersji vs kanały</h2>
  <div class="what">Lejek per kanał (PL) — dwa widoki: <b>Zgrupowane</b> (kanon raportu ścieżek: Meta CPC · Google CPC · Google Organic · Direct · Affiliate/Inne) i <b>Z GA4</b> (kanały dokładnie jak raportuje GA4 — bez naszego grupowania).</div>

    <button onclick="r01cview('grup',this)" class="psb psa" id="r01c-gbtn">🗂 Zgrupowane (kanon ścieżek)</button>
    <button onclick="r01cview('ga4',this)" class="psb" id="r01c-ga4btn">📡 Z GA4 (raw)</button>
  </div>
  <div id="r01c-grup">${matrixHtml(grouped)}</div>
  <div id="r01c-ga4" style="display:none">${matrixHtml(rawList)}</div>`;
}

function renderProducts(d){
  const ps=(d.products||[]).filter(p=>!/free gift/i.test(p.name)).slice(0,30);
  if(!ps.length)return '';
  window._prodData=ps;
  function crBadge(val,hi,lo){
    if(val==null||isNaN(val))return'<span style="color:var(--muted)">—</span>';
    const v=parseFloat(val);
    const cl=v>=hi?'b-good':v>=lo?'b-warn':'b-bad';
    return`<span class="crpill ${cl}">${val.toFixed(1)}%</span>`;
  }
  function renderProdRows(arr){
    return arr.map((p,i)=>{
      const v=p.viewed||0,a=p.atc||0,pu=p.purchased||0;
      const c1=v?a/v*100:null,c2=a?pu/a*100:null;
      const src=p.shp_match?'<span class="sbadge sbadge-shp" title="Shopify">SHP</span>':'<span class="sbadge sbadge-ga4" title="GA4">GA4</span>';
      return`<tr><td style="color:var(--muted);text-align:center">${i+1}</td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.name}">${p.name}</td><td>${n(v)}</td><td>${n(a)}</td><td>${n(pu)} ${src}</td><td>${money(p.revenue)} ${src}</td><td>${crBadge(c1,30,15)}</td><td>${crBadge(c2,30,20)}</td></tr>`;
    }).join('');
  }
  window.sortProd=function(key){
    document.querySelectorAll('.psb').forEach(b=>b.classList.remove('psa'));
    const btnId='psb-'+key.replace('_','-');
    const btn=document.getElementById(btnId);if(btn)btn.classList.add('psa');
    const sorted=[...(window._prodData||[])].sort((a,b)=>{
      if(key==='purchases')return(b.purchased||0)-(a.purchased||0);
      if(key==='views')return(b.viewed||0)-(a.viewed||0);
      if(key==='revenue')return(b.revenue||0)-(a.revenue||0);
      if(key==='cr_va'){const ra=a.atc&&a.viewed?a.atc/a.viewed:-1,rb=b.atc&&b.viewed?b.atc/b.viewed:-1;return rb-ra;}
      if(key==='cr_ap'){const ra=a.purchased&&a.atc?a.purchased/a.atc:-1,rb=b.purchased&&b.atc?b.purchased/b.atc:-1;return rb-ra;}
      return 0;
    });
    const tb=document.getElementById('prod-tbody');
    if(tb)tb.innerHTML=renderProdRows(sorted);
  };
  const h=`<h2><span class="r">R02</span> Produkty — lejek per SKU</h2>
  <div class="what">Pełna ścieżka per produkt: widoki→ATC→zakup. Widoki &amp; ATC z GA4, Zakupy &amp; Przychód z Shopify (source of truth) gdy dostępne — badge wskazuje źródło per wiersz.</div>
  <span class="dl">itemsViewed/ATC <span class="sbadge sbadge-ga4">GA4</span> · Zakupy/Przychód <span class="sbadge sbadge-shp">SHOPIFY</span> gdy dostępne · country=Poland</span>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px">
    <button onclick="sortProd('purchases')" class="psb psa" id="psb-purchases">🏆 Top sprzedaż</button>
    <button onclick="sortProd('views')" class="psb" id="psb-views">👁 Top ruch</button>
    <button onclick="sortProd('revenue')" class="psb" id="psb-revenue">💵 Top przychód</button>
    <button onclick="sortProd('cr_va')" class="psb" id="psb-cr-va">🛒 Top CR wizyta→ATC</button>
    <button onclick="sortProd('cr_ap')" class="psb" id="psb-cr-ap">💰 Top CR ATC→zakup</button>
  </div>
  <table><thead><tr><th style="width:32px;text-align:center">#</th><th>Produkt</th><th>Widoki</th><th>ATC</th><th>Zakupy</th><th>Przychód</th><th>CR widz→ATC</th><th>CR ATC→zak</th></tr></thead>
  <tbody id="prod-tbody">${renderProdRows(ps)}</tbody></table>
  <div class="concl c-amber"><span class="lab">Główny wniosek</span>Sprawdź CR widz→ATC per produkt — produkty z niskim CR to problem ekspozycji CTA/Quick Add na PDP. Buttony sortowania powyżej izolują różne wymiary lejka.</div>
  <div class="reco"><b>⚙️ Rekomendacja:</b> Clarity heatmap na PDP top SKU z niskim CR widz→ATC. Kopiuj układ PDP najlepszego produktu.<div class="meta">Właściciel: PM+UX · miernik: CR widz→ATC Luna Eye &gt;30%</div></div>`;
  return h;
}

function renderChannels(d){
  const cd=d.channels_detail||[];
  const cs=d.channels||[];
  if(!cd.length&&!cs.length)return '';

  // Granular label: source/medium · campaign (jeśli niebanalny)
  function chLabel(c){
    const base=(c.source||'?')+'/'+(c.medium||'?');
    const camp=c.campaign&&c.campaign!=='(direct)'&&c.campaign!=='(organic)'&&c.campaign!=='(not set)'?c.campaign:'';
    return camp?base+' · '+camp:base;
  }
  function chVerdict(c){
    const crv=c.sessions>0?c.transactions/c.sessions*100:0;
    const src=(c.source||'').toLowerCase(),med=(c.medium||'').toLowerCase();
    if(src==='google'&&med==='cpc')return ['🌟 Paid Search','b-good'];
    if(src==='meta'&&med==='cpc')return ['📱 Meta Ads','b-warn'];
    if(src==='google'&&med==='organic')return ['🔍 Organic','b-blue'];
    if(src==='(direct)')return ['❓ Direct','b-warn'];
    if(crv>=3)return ['✅ Solid CR','b-good'];
    if(crv>=1.5)return ['• OK','b-blue'];
    return ['▼ Niski CR','b-bad'];
  }

  // View toggle: granular (default) vs coarse
  const hasShpData=cd.some(c=>c.sessions_shp>0);
  let hDetail=`<table><tr><th>Źródło / Medium · Kampania</th><th>Sesje <span style="font-weight:400;font-size:9px" id="r03-sess-src"></span></th>${hasShpData?'<th style="font-size:10px"><span class="sbadge sbadge-ga4">GA4</span></th><th style="font-size:10px"><span class="sbadge sbadge-shp">SHP</span></th>':''}<th>Zakupy</th><th>CR</th><th>Przychód</th><th>Ocena</th></tr>`;
  cd.slice(0,20).forEach(c=>{
    const crv=c.sessions>0?c.transactions/c.sessions*100:0;
    const[v,cl]=chVerdict(c);
    const label=chLabel(c);
    const hot=(c.source||'').toLowerCase()==='google'&&(c.medium||'').toLowerCase()==='cpc'?'hot':'';
    const srcBadge=c.sess_src==='shp'?`<span class="sbadge sbadge-shp">SHP</span>`:`<span class="sbadge sbadge-ga4">GA4</span>`;
    const ga4col=hasShpData?`<td style="color:var(--muted)">${n(c.sessions_ga4)}</td>`:'';
    const shpCol=hasShpData?`<td>${c.sessions_shp?n(c.sessions_shp):'<span style="color:var(--muted)">—</span>'}</td>`:'';
    hDetail+=`<tr class="${hot}"><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${label}">${label}</td><td><b>${n(c.sessions)}</b> ${srcBadge}</td>${ga4col}${shpCol}<td>${n(c.transactions)}</td><td>${crp(crv)}</td><td>${money(c.revenue)}</td><td><span class="badge ${cl}">${v}</span></td></tr>`;
  });
  hDetail+='</table>';

  let hCoarse='<table><tr><th>Kanał (GA4 grouping)</th><th>Sesje</th><th>Zakupy</th><th>CR</th><th>Przychód</th><th>Czas</th><th>PV/ses</th></tr>';
  cs.slice(0,10).forEach(c=>{
    const crv=c.sessions>0?c.transactions/c.sessions*100:0;
    const dur=c.dur?Math.floor(c.dur/60)+':'+String(Math.round(c.dur%60)).padStart(2,'0'):'—';
    hCoarse+=`<tr><td>${c.channel}</td><td>${n(c.sessions)}</td><td>${n(c.transactions)}</td><td>${crp(crv)}</td><td>${money(c.revenue)}</td><td>${dur}</td><td>${(c.pps||0).toFixed(1)}</td></tr>`;
  });
  hCoarse+='</table>';

  let h=`<h2><span class="r">R03</span> Kanały &amp; jakość ruchu</h2>
  <div class="what">Granularny widok: source/medium/kampania per wiersz. Widoczne każde konto Meta Ads i Google Ads osobno. Toggle → coarse grouping z czasem sesji.</div>
  <span class="dl">sessionSource · sessionMedium · sessionCampaignName · sessions · ecommercePurchases · purchaseRevenue <span class="sbadge sbadge-ga4">GA4</span> · country=Poland</span>
  <div style="display:flex;gap:8px;margin:10px 0 12px">
    <button onclick="r03view('detail',this)" class="psb" id="r03-detail">📊 Granularny (source/medium)</button>
    <button onclick="r03view('coarse',this)" class="psb psa" id="r03-coarse">🗂 Coarse (channel grouping)</button>
  </div>
  <div id="r03-detail-body" style="display:none">${hDetail}</div>
  <div id="r03-coarse-body">${hCoarse}</div>`;

  h+=`<div class="concl c-green"><span class="lab">Jak czytać</span>Każdy wiersz = konkretna kampania/kanał. Paid Search (google/cpc) = najwyższy CR — intencja zakupowa. Meta Ads = wolumen. Direct bez UTM = potencjalny Paid bez tagu.</div>`;
  h+=`<div class="reco"><b>⚙️ Rekomendacja:</b> Kampanie Meta bez transakcji → wyłącz lub retargetuj. Otaguj UTM ruch Direct. Paid Search — skaluj kanał z najwyższym CR.<div class="meta">Właściciel: Performance · miernik: Paid Search CR &gt;3%</div></div>`;
  return h;
}
window.r03view=function(v,btn){

  document.getElementById('r03-'+v+'-body').style.display='';
  document.querySelectorAll('#r03-detail,#r03-coarse').forEach(b=>b.classList.remove('psa'));

}

function renderWindow(d){
  const k=d.kpi||{},f=d.funnel||{};
  const eng=Math.round((k.sessions||0)*(1-(k.bounceRate||0)));
  const atcSes=f.add_to_cart||0;
  const win=Math.max(eng-atcSes,0);
  const aov=k.transactions?k.totalRevenue/k.transactions:130;
  const pot=Math.round(win*0.05*(f.purchase/(atcSes||1))*aov);
  const perDay=d.daysCount>0?Math.round(win/d.daysCount):0;
  return `<h2><span class="r">R08</span> Okno wystawowe (EEL) — window shoppers</h2>
  <div class="what">Ile zaangażowanych sesji PL NIE dodaje nic do koszyka? Engaged − ATC = największy segment do odblokowania.</div>
  <span class="dl">kalkulacja EEL: sesje_engaged (nie-bounce) − sesje_ATC · country=Poland</span>
  <div class="cards3">
    <div class="dcard"><h4>Sesje łącznie</h4><div class="big">${n(k.sessions)}</div></div>
    <div class="dcard"><h4>Engaged (nie-bounce)</h4><div class="big">${n(eng)}</div><div class="row"><span>udział</span><b>${pct(1-(k.bounceRate||0))}</b></div></div>
    <div class="dcard flag-bad"><h4>🪟 Okno wystawowe</h4><div class="big" style="color:var(--bad)">${n(win)}</div><div class="row"><span>~${n(perDay)}/dzień</span><b></b></div></div>
  </div>
  <div class="concl c-red"><span class="lab">Główny wniosek</span><b>${n(win)} sesji</b> (~${n(perDay)}/dzień) angażuje się, ale nie dodaje nic do koszyka. Jeśli 5% tego segmentu kupi → ~${money(pot)} dodatkowego przychodu.</div>
  <div class="reco"><b>⚙️ Rekomendacja:</b> Clarity heatmap + scroll na PDP top SKU → sticky ATC pod foldem mobile.<div class="meta">Właściciel: UX · miernik: sesje z ATC &gt;12%</div></div>`;
}

function renderDOW(d){
  const dw=d.dayofweek||[];if(!dw.length)return '';
  const sorted=[...dw].sort((a,b)=>a.day-b.day);
  const top=sorted.reduce((a,b)=>b.revenue>a.revenue?b:a,sorted[0]);
  const worst=sorted.reduce((a,b)=>b.revenue<a.revenue?b:a,sorted[0]);
  const bestCR=sorted.reduce((a,b)=>(b.sessions>0&&b.transactions/b.sessions>a.transactions/a.sessions?b:a),sorted[0]);
  let h=`<h2><span class="r">R09</span> Wzorce — dni tygodnia</h2>
  <div class="what">Kiedy Polacy kupują? Peak day do planowania budżetu kampanii i pushów.</div>
  <span class="dl">dimension dayOfWeek · sessions · transactions · revenue · country=Poland</span>
  <table><tr><th>Dzień</th><th>Sesje</th><th>Zakupy</th><th>CR</th><th>Przychód</th></tr>`;
  sorted.forEach(x=>{
    const cls=x.day===top.day?'hot':(x.day===worst.day?'danger':'');
    const crv=x.sessions>0?x.transactions/x.sessions*100:0;
    h+=`<tr class="${cls}"><td>${DOW_PL[x.day]}</td><td>${n(x.sessions)}</td><td>${n(x.transactions)}</td><td>${crp(crv)}</td><td>${money(x.revenue)}</td></tr>`;
  });
  h+='</table>';
  h+=`<div class="concl c-amber"><span class="lab">Główny wniosek</span><b>${DOW_PL[top.day]} #1 przychodu</b> (${money(top.revenue)}). Najwyższy CR: <b>${DOW_PL[bestCR.day]}</b>. Skaluj kampanie przed peakiem, tnij budżet w ${DOW_PL[worst.day]}.</div>`;
  return h;
}

function renderHour(d){
  const hr=d.hour||[];if(!hr.length)return '';
  const maxS=Math.max(...hr.map(x=>x.sessions||0));
  const peak=hr.reduce((a,b)=>b.sessions>a.sessions?b:a,hr[0]);
  let h=`<h2><span class="r">R10</span> Wzorce — godziny</h2>
  <div class="what">Rozkład ruchu w dobie (PL). Pik = ${peak.h}:00.</div>
  <span class="dl">dimension hour · sessions · country=Poland</span>
  <div class="hbar">`;
  hr.forEach(x=>{const ht=maxS>0?Math.max((x.sessions/maxS*100),2):2;h+=`<div class="hb" style="height:${ht}%" title="${x.h}:00 — ${n(x.sessions)} sesji, ${n(x.transactions)} zak."></div>`;});
  h+='</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>';
  return h;
}

const GLOV_SYSTEM=`Jesteś asystentem analitycznym sklepu GLOV (glov.co). Rozmawiasz po polsku, po ludzku — jak kolega z firmy, nie jak raport Excel.

Zasady odpowiedzi:

- Krótko. Jedno pytanie = jedna odpowiedź, nie elaborat

Dobry styl: "Paid Search konwertuje 2-3× lepiej niż Meta — warto przesunąć budżet."
Zły styl: "Sesje: 34745, transakcje: 631, CR: 1.82%, bounce: 67.3%..."

Dane: GA4 + Shopify, tylko Polska (filtr country=Poland). Masz dostęp do danych wybranego okresu.`;

async function sendChat(){
  const inp=document.getElementById('chatInput');
  const msg=inp.value.trim();if(!msg)return;
  const msgs=document.getElementById('chatMsgs');
  const sendBtn=document.getElementById('chatSend');
  msgs.innerHTML+=`<div class="msg user">${msg.replace(/</g,'&lt;')}</div>`;
  inp.value='';msgs.scrollTop=msgs.scrollHeight;
  // animacja fuzika
  sendBtn.classList.add('sending');
  setTimeout(()=>sendBtn.classList.remove('sending'),400);
  // typing indicator
  const tid='ti_'+Date.now();
  msgs.innerHTML+=`<div class="msg typing" id="${tid}"><span></span><span></span><span></span></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  const ctx=window._lastData?JSON.stringify({
    kpi:window._lastData.kpi,
    top_products:(window._lastData.products||[]).slice(0,5),
    top_channels:(window._lastData.channels||[]).slice(0,5),
    funnel:window._lastData.funnel,
    top_landing:(window._lastData.landing_atc||[]).slice(0,5)
  }):'(brak danych)';
  try{
    const r=await fetch('https://glov-chat.waleqq.workers.dev',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'deepseek-chat',messages:[
        {role:'system',content:GLOV_SYSTEM},
        {role:'user',content:`Dane bieżącego zakresu:\n${ctx}\n\nPytanie: ${msg}`}
      ]})
    });
    const data=await r.json();
    const reply=data.choices?.[0]?.message?.content||'Brak odpowiedzi';
    document.getElementById(tid)?.remove();
    msgs.innerHTML+=`<div class="msg ai">${reply.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`;
  }catch(err){
    document.getElementById(tid)?.remove();
    msgs.innerHTML+=`<div class="msg ai" style="color:#dc2626">Błąd: ${err.message}</div>`;
  }
  msgs.scrollTop=msgs.scrollHeight;
}
document.getElementById('chatSend').onclick=sendChat;
document.getElementById('chatInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();sendChat();}
});

// Data loading
const BASE_URL='https://tomekwlqq.github.io/ai4cro-reports/';
function loadData(showSpinner){
  if(showSpinner){
    const ov=document.getElementById('loadingOverlay');
    if(ov)ov.style.display='flex';
  }
  const t=Date.now();
  return Promise.all([
    fetch(BASE_URL+'glov_pl_daily.json?t='+t).then(r=>r.json()),
    fetch(BASE_URL+'glov_live2.json?t='+t).then(r=>r.json()).catch(()=>null),
    fetch(BASE_URL+'lejek_daily.json?t='+t).then(r=>r.json()).catch(()=>null)
  ]).then(([daily,live,lejek])=>{
    DAILY=daily.days||{};
    META=daily._meta||{};
    LEJEK=(lejek&&lejek.days)||{};
    R02_DAY=Object.keys(LEJEK).sort().pop()||null; // R02 domyślnie: widok dzienny (ostatni pełny dzień)
    LIVE=live;
    const dk=Object.keys(DAILY).sort();
    FIRST=dk[0]||'';LAST=dk[dk.length-1]||'';
    const si=document.getElementById('srcInfo');
    if(si)si.innerHTML=`Źródło: GA4 342844459, filtr <b>country=Poland</b>. Dane: ${FIRST} → ${LAST} (${dk.length} dni). Aktualizacja: ${META.updated||'N/A'}. Boty/zagranica wykluczone. INTERNAL.`;
    renderReport(LAST,LAST); // live: raport = tylko R02 lejek bazowy, tryb dzienny (R02_DAY)
    initLive();
  }).catch(e=>{
    const si=document.getElementById('srcInfo');
    if(si)si.innerHTML='Błąd ładowania danych: '+e.message;
    initLive();
  }).finally(()=>{
    const ov=document.getElementById('loadingOverlay');
    if(ov)ov.style.display='none';
    const rb=document.getElementById('refreshBtn');
    if(rb){rb.disabled=false;rb.textContent='🔄 Odśwież';}
  });
}
function refreshData(){
  const rb=document.getElementById('refreshBtn');
  if(rb){rb.disabled=true;rb.textContent='⏳...';}
  loadData(false);
}
document.addEventListener('DOMContentLoaded',()=>loadData(true));
