<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>GLOV — Rekomendacje nagłówków H1/H2</title>
<style>
:root[data-theme="light"]{
  --bg:#f8f9fa;--card:#fff;--border:#dee2e6;--text:#212529;--muted:#6c757d;
  --accent:#d4005c;--accent-bg:#fff0f5;--ok:#198754;--warn:#dc3545;--warn-bg:#fff5f5;
  --input-bg:#f8f9fa;--badge-bg:#e9ecef;--shadow:rgba(0,0,0,.07);
}
:root[data-theme="dark"]{
  --bg:#1a1a2e;--card:#16213e;--border:#2d3748;--text:#e2e8f0;--muted:#a0aec0;
  --accent:#ff6b9d;--accent-bg:#2d1b2e;--ok:#48bb78;--warn:#fc8181;--warn-bg:#2d1b1b;
  --input-bg:#0f3460;--badge-bg:#2d3748;--shadow:rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;flex-wrap:wrap;box-shadow:0 2px 8px var(--shadow)}
.topbar h1{font-size:16px;font-weight:700;color:var(--accent);flex:1}
.topbar .stats{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text]{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px}
.btn{border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:5px}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--badge-bg);color:var(--muted)}
.btn-export{background:#0d6efd;color:#fff}
.toggle-theme{background:var(--badge-bg);color:var(--text);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.container{max-width:1400px;margin:0 auto;padding:16px}
.progress-bar{background:var(--badge-bg);border-radius:8px;height:8px;margin:0 0 16px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--ok);transition:.3s;border-radius:8px}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;display:none}
.item.visible{display:block}
.item.accepted{border-color:var(--ok);background:var(--accent-bg)}
.item-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--badge-bg);color:var(--muted);font-weight:600}
.badge.product{background:#dbeafe;color:#1d4ed8}
.badge.collection{background:#d1fae5;color:#065f46}
.badge.warn{background:#fee2e2;color:#991b1b}
.badge.cat{background:#fef3c7;color:#92400e}
.item-url{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-url a{color:var(--accent);text-decoration:none}
.item-url a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.field-group{}
.field-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field-current{font-size:12px;color:var(--muted);padding:6px 10px;background:var(--badge-bg);border-radius:5px;margin-bottom:6px;line-height:1.4}
.field-current .len{float:right;font-weight:700}
.len.ok{color:var(--ok)}
.len.bad{color:var(--warn)}
.reko-wrap{display:flex;gap:6px;align-items:flex-start}
.reko-input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text);resize:vertical;min-height:36px;line-height:1.4;font-family:inherit}
.reko-input.accepted{border-color:var(--ok);background:var(--accent-bg)}
.h2-list{display:flex;flex-direction:column;gap:6px}
.h2-item{display:flex;gap:6px;align-items:flex-start}
.h2-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text);font-family:inherit}
.h2-input.accepted{border-color:var(--ok);background:var(--accent-bg)}
.h2-num{font-size:11px;color:var(--muted);padding-top:8px;min-width:20px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.comment-field{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text);font-family:inherit}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--badge-bg);flex-shrink:0}
.status-dot.accepted{background:var(--ok)}
</style>
</head>
<body>
<div class="topbar">
  <h1>GLOV — Rekomendacje nagłówków H1 + H2</h1>
  <div class="stats" id="stats">Ładowanie…</div>
  <div class="filters">
    <select id="filterType" onchange="applyFilters()">
      <option value="all">Wszystkie typy</option>
      <option value="product">Produkty</option>
      <option value="collection">Kolekcje</option>
    </select>
    <select id="filterStatus" onchange="applyFilters()">
      <option value="all">Wszystkie</option>
      <option value="pending">Do zatwierdzenia</option>
      <option value="accepted">Zatwierdzone</option>
    </select>
    <select id="filterH1" onchange="applyFilters()">
      <option value="all">Każdy H1</option>
      <option value="toolong">H1 za długi (&gt;65)</option>
    </select>
    <input type="text" id="filterSearch" placeholder="🔍 Szukaj…" oninput="applyFilters()">
    <button class="btn btn-export" onclick="exportJSON()">⬇ Eksportuj JSON</button>
    <button class="btn btn-accent" onclick="acceptAll()">✓ Zaakceptuj widoczne</button>
    <button class="toggle-theme" onclick="toggleTheme()">🌙/☀️</button>
  </div>
</div>

<div class="container">
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="list"></div>
</div>

const STATE_KEY = 'glov-headings-v1';

let state = {};
try { state = JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch(e) {}

function save() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); updateStats(); }

function getState(id) { return state[id] || {accepted:false,h1:'',seo:'',h2s:[],comment:''}; }

function renderAll() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  DATA.forEach((row, idx) => {
    const id = `item-${idx}`;
    const s = getState(id);
    const h1_len = row.current_h1.length;
    const seo_len = (row.current_seo||'').length;
    const h1_ok = h1_len <= 65;
    const seo_ok = seo_len > 0 && seo_len <= 60;
    const div = document.createElement('div');
    div.className = 'item' + (s.accepted ? ' accepted' : '');
    div.dataset.id = id;
    div.dataset.type = row.type;
    div.dataset.accepted = s.accepted ? '1' : '0';
    div.dataset.h1ok = h1_ok ? '1' : '0';
    div.dataset.title = row.current_h1.toLowerCase();

    const h2sHtml = (row.h2s||[]).map((h2,i) => {
      const val = (s.h2s||[])[i] !== undefined ? s.h2s[i] : h2;
      return `<div class="h2-item">
        <span class="h2-num">H2.${i+1}</span>
        <input class="h2-input${s.accepted?' accepted':''}" data-h2idx="${i}" value="${esc(val)}"
          oninput="updateH2('${id}',${i},this.value)" placeholder="Propozycja H2…">
        <button class="btn btn-sm btn-warn" title="Przywróć" onclick="resetH2('${id}',${i},'${esc(h2)}',this)">↩</button>
      </div>`;
    }).join('');

    div.innerHTML = `
      <div class="item-header">
        <span class="status-dot${s.accepted?' accepted':''}"></span>
        <span class="badge ${row.type}">${row.type === 'product' ? '📦 Produkt' : '📁 Kolekcja'}</span>
        ${!h1_ok ? '<span class="badge warn">⚠ H1 za długi</span>' : ''}
        ${!seo_ok ? '<span class="badge warn">⚠ Brak SEO title</span>' : ''}
        ${row.cat !== '—' ? `<span class="badge cat">${row.cat.replace(/_/g,' ')}</span>` : ''}
        <span class="item-url"><a href="${row.url}" target="_blank">${esc(row.url)}</a></span>
      </div>
      <div class="grid">
        <div class="field-group">
          <div class="field-label">Tytuł produktu (H1) · aktualny</div>
          <div class="field-current">${esc(row.current_h1)} <span class="len ${h1_ok?'ok':'bad'}">${h1_len} zn.</span></div>
          <div class="field-label">➜ Rekomendacja H1</div>
          <div class="reko-wrap">
            <textarea class="reko-input${s.accepted?' accepted':''}" id="h1-${id}" rows="2"
              oninput="updateField('${id}','h1',this.value)">${esc(s.h1||row.reko_h1)}</textarea>
            <button class="btn btn-sm btn-warn" onclick="resetField('${id}','h1','${esc(row.reko_h1)}','h1-${id}')">↩</button>
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">SEO Page Title · aktualny</div>
          <div class="field-current">${row.current_seo ? esc(row.current_seo) + ` <span class="len ${seo_ok?'ok':'bad'}">${seo_len} zn.</span>` : '<em style="color:var(--warn)">brak</em>'}</div>
          <div class="field-label">➜ Rekomendacja SEO title (max 60 zn.)</div>
          <div class="reko-wrap">
            <textarea class="reko-input${s.accepted?' accepted':''}" id="seo-${id}" rows="2"
              oninput="updateField('${id}','seo',this.value)">${esc(s.seo||row.reko_seo)}</textarea>
            <button class="btn btn-sm btn-warn" onclick="resetField('${id}','seo','${esc(row.reko_seo)}','seo-${id}')">↩</button>
          </div>
        </div>
      </div>
      ${row.h2s && row.h2s.length ? `
      <div class="field-label" style="margin-bottom:8px">➜ Propozycje H2 (z blueprintu GSC)</div>
      <div class="h2-list">${h2sHtml}</div>` : ''}
      <div class="actions">
        <button class="btn ${s.accepted?'btn-warn':'btn-ok'} btn-sm" onclick="toggleAccept('${id}',this)">
          ${s.accepted ? '↩ Cofnij' : '✓ Akceptuję'}
        </button>
        <input class="comment-field" placeholder="💬 Notatka / uwaga…" value="${esc(s.comment||'')}"
          oninput="updateField('${id}','comment',this.value)">
      </div>`;
    list.appendChild(div);
  });
  applyFilters();
  updateStats();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleAccept(id, btn) {
  const s = getState(id);
  s.accepted = !s.accepted;
  state[id] = s;
  const div = document.querySelector(`[data-id="${id}"]`);
  div.classList.toggle('accepted', s.accepted);
  div.dataset.accepted = s.accepted ? '1' : '0';
  div.querySelector('.status-dot').classList.toggle('accepted', s.accepted);
  btn.textContent = s.accepted ? '↩ Cofnij' : '✓ Akceptuję';
  btn.className = `btn ${s.accepted?'btn-warn':'btn-ok'} btn-sm`;
  div.querySelectorAll('.reko-input,.h2-input').forEach(el => el.classList.toggle('accepted', s.accepted));
  save();
}

function updateField(id, field, val) {
  if(!state[id]) state[id] = {};
  state[id][field] = val;
  save();
}

function updateH2(id, idx, val) {
  if(!state[id]) state[id] = {};
  if(!state[id].h2s) state[id].h2s = [];
  state[id].h2s[idx] = val;
  save();
}

function resetField(id, field, orig, inputId) {
  if(!state[id]) state[id] = {};
  state[id][field] = orig;
  document.getElementById(inputId).value = orig;
  save();
}

function resetH2(id, idx, orig, btn) {
  if(!state[id]) state[id] = {};
  if(!state[id].h2s) state[id].h2s = [];
  state[id].h2s[idx] = orig;
  btn.previousElementSibling.value = orig;
  save();
}

function acceptAll() {
  document.querySelectorAll('.item.visible:not(.accepted)').forEach(div => {
    const id = div.dataset.id;
    if(!state[id]) state[id] = {};
    state[id].accepted = true;
    div.classList.add('accepted');
    div.dataset.accepted = '1';
    div.querySelector('.status-dot').classList.add('accepted');
    const btn = div.querySelector('.actions .btn');
    btn.textContent = '↩ Cofnij'; btn.className = 'btn btn-warn btn-sm';
    div.querySelectorAll('.reko-input,.h2-input').forEach(el => el.classList.add('accepted'));
  });
  save();
}

function applyFilters() {
  const fType = document.getElementById('filterType').value;
  const fStatus = document.getElementById('filterStatus').value;
  const fH1 = document.getElementById('filterH1').value;
  const fSearch = document.getElementById('filterSearch').value.toLowerCase();
  document.querySelectorAll('.item').forEach(div => {
    let show = true;
    if(fType !== 'all' && div.dataset.type !== fType) show = false;
    if(fStatus === 'pending' && div.dataset.accepted === '1') show = false;
    if(fStatus === 'accepted' && div.dataset.accepted !== '1') show = false;
    if(fH1 === 'toolong' && div.dataset.h1ok === '1') show = false;
    if(fSearch && !div.dataset.title.includes(fSearch)) show = false;
    div.classList.toggle('visible', show);
  });
  updateStats();
}

function updateStats() {
  const all = DATA.length;
  const accepted = Object.values(state).filter(s=>s.accepted).length;
  const visible = document.querySelectorAll('.item.visible').length;
  const pct = all ? Math.round(accepted/all*100) : 0;
  document.getElementById('stats').textContent = `${accepted}/${all} zaakceptowanych (${pct}%) · widoczne: ${visible}`;
  document.getElementById('progressFill').style.width = pct + '%';
}

function exportJSON() {
  const out = DATA.map((row,idx) => {
    const id = `item-${idx}`;
    const s = getState(id);
    return {
      url: row.url,
      shopify_id: row.shopify_id,
      type: row.type,
      accepted: s.accepted,
      h1_final: s.h1 || row.reko_h1,
      seo_title_final: s.seo || row.reko_seo,
      h2s_final: row.h2s.map((h2,i) => (s.h2s||[])[i] !== undefined ? s.h2s[i] : h2),
      comment: s.comment || ''
    };
  }).filter(r=>r.accepted);
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'glov_headings_accepted.json';
  a.click();
}

function toggleTheme() {
  const r = document.documentElement;
  const t = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', t);
  localStorage.setItem('glov-theme', t);
}

// Restore theme
const savedTheme = localStorage.getItem('glov-theme');
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

renderAll();
</script>
