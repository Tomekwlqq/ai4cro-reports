*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#1e293b;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.shot-img{display:block;margin:20px auto}
.shot-img.mobile{width:390px;max-width:390px}

.el-top{color:#94a3b8;font-size:11px;flex-shrink:0}
.chevron{margin-left:auto;color:#94a3b8;flex-shrink:0;transition:transform .15s}
.el-row.expanded .chevron{transform:rotate(180deg)}

.el-accordion{background:#fafafa;padding:4px 20px 12px 40px;display:none}
.el-row.expanded+.el-accordion{display:block}
.acc-section{padding:8px 0}
.acc-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;margin-bottom:5px}
.acc-content{font-size:13px;color:#334155;line-height:1.6}
.acc-zaw{color:#334155;font-size:13px;line-height:1.6}
.acc-zaw ul{margin:3px 0;padding-left:16px}.acc-zaw li{margin:2px 0}

let curTab = 0;
let curVp = 'desktop';

function switchTab(i, btn) {
  curTab = i;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTab();
}

function setVp(vp, btn) {
  curVp = vp;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderShot();
}

function renderShot() {
  const d = DATA[curTab];
  const img = document.getElementById('shotImg');
  img.src = d.url + '_' + curVp + '.png';
  img.className = 'shot-img ' + curVp;
  document.getElementById('shotPane').scrollTop = 0;
}

function renderTab() {
  const d = DATA[curTab];
  const list = document.getElementById('listPane');

  // wnioski banner
  let html = `<div class="wnioski-banner">
    <div class="wnioski-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
      🔴 Główne problemy — ${d.name} <span>▼</span>
    </div>
    <div class="wnioski-body">`;
  d.wnioski.forEach(w => {
    html += `<div class="alarm-card"><div class="alarm-problem">${w.problem}</div><div class="alarm-insight">${w.insight}</div></div>`;
  });
  html += `<div class="dz-block"><strong>DZ dla GLOV:</strong> ${d.dz}</div></div></div>`;

  // elements
  d.elements.forEach((el, i) => {
    const zoneClr = el.zone === 'above' ? '#dbeafe' : '#fef9c3';
    const zoneTxt = el.zone === 'above' ? '#1e40af' : '#854d0e';
    html += `<div class="el-item">
      <div class="el-row" onclick="toggleEl(this,${i})">
        <span class="dot" style="background:${el.dot}"></span>
        <span class="el-name">${el.el}</span>
        <span class="el-etyk">${el.etyk}</span>
        <span class="zone-badge" style="background:${zoneClr};color:${zoneTxt}">${el.zone}</span>
        <span class="el-top">${el.top}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="el-accordion">
        <div class="acc-section">
          <div class="acc-title">Zawartość / akcje shopera</div>
          <div class="acc-zaw">${el.zaw}</div>
        </div>
        <div class="acc-section">
          <div class="acc-title">Obserwacja</div>
          <div class="obs-insight">${el.obs}</div>
        </div>
        <div class="acc-section">
          <div class="acc-title">Ocena</div>
          <div class="acc-content"><strong>${el.ocena.w}:</strong> ${el.ocena.o}</div>
        </div>
        <div class="acc-section">
          <div class="acc-title">Developer / Tech</div>
          <div class="acc-footer">${el.dev}</div>
        </div>
      </div>
    </div>`;
  });

  list.innerHTML = html;
  renderShot();
}

function toggleEl(row, i) {
  const wasExp = row.classList.contains('expanded');
  document.querySelectorAll('.el-row').forEach(r => r.classList.remove('expanded','active'));
  if (!wasExp) {
    row.classList.add('expanded', 'active');
  }
}

renderTab();
</script>
