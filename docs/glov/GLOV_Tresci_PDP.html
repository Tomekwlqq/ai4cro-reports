ą 30 razy cieńsze niż bawełniane włókna i aż 100 razy cieńsze od ludzkiego włosa. Kiedy są mokre, wciągają cząsteczki makijażu w głąb siebie, dosłownie działają na nie jak magnes, nie rozmazując niczego na skórze.\n3. Jak czyścić i suszyć rękawiczkę?\nRękawiczek nie pierzemy w pralce. Najlepiej czyścić je ręcznie zwykłym, szarym mydełkiem w kostce lub z naszym specjalnym mydełkiem Magnet Cleanser. Po użyciu odwiesić do wyschnięcia. Nie suszyć na kaloryferach czy w suszarkach bębnowych.\n4. Co zrobić z rękawiczką gdy się zużyje?\nZachęcamy do tego, aby dać jej drugie życie i nie wyrzucać. Rękawiczki gdy się zużyją doskonale sprawdzają się np. do sprzątania. Możemy nią ścierać kurze, czyścić buty czy myć okna! Znaleźliśmy również rozwiązanie, aby w pełni wykorzystać zużyte produkty i dać im całkiem nowe przeznaczenie, trzecie życie. Odeślij zużyty produkt do nas lub wrzuć do specjalnego kontenera w dowolnej perfumerii Sephora, a trafi on do recyklingu materiałowego. Spowoduje to, że staną się one zupełnie nowym produktem - ławką ogrodową i parkową, donicą, lampą uliczną, stołem ogrodowym, itp.\n5. Czy rękawiczka może służyć do samego oczyszczania twarzy?\nRękawiczka oczywiście może służyć do samego oczyszczania twarzy, nawet gdy nie mamy na niej makijażu. Zachęcamy do tego, aby rano przemyć twarz rękawiczką po przebudzeniu. Świetnie zbiera ona nadmiar sebum nagromadzony podczas snu i pobudza krążenie twarzy.\n6. Jakie są wymiary rękawiczki?\n7 cm na 4 cm\n7. Czy rękawiczki można używać z innymi kosmetykami?\nRękawiczki można używać zarówno z samą wodą jak i z ulubionymi kosmetykami typu żel czy płyn micelarny.", "znakow": 2442}, {"sekcja": "main", "rodzaj": "zakładka", "naglowek": "Skład i konserwacja", "naglowki": [], "tekst": "80% poliester, 20% poliamid. Prać ręcznie z dodatkiem mydła GLOV Magnet Cleanser lub szarego mydła w kostce.", "znakow": 108}, {"sekcja": "175465084590711709", "rodzaj": "opinie", "naglowek": "Customer Reviews", "naglowki": [{"poziom": "h2", " <script>
const D = JSON.parse(document.getElementById('dane').textContent);
const P = D.produkty;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COPY = b => b.rodzaj === 'zakładka' || b.rodzaj === 'sekcja';
const PL = {a:'aą',c:'cć',e:'eę',l:'lł',n:'nń',o:'oó',s:'sś',z:'zźż'};
const norm = s => String(s).toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const img = (u, w) => u ? u + (u.includes('?') ? '&' : '?') + 'width=' + w : '';
P.forEach(p => {
  p._copy = p.bloki.filter(COPY).reduce((a, b) => a + b.znakow, 0);
  p._nb = p.bloki.filter(COPY).length;
  p._szuk = norm(p.tytul + ' ' + p.h1 + ' ' + p.bloki.map(b => b.naglowek + ' ' + b.tekst).join(' '));
});
[...new Set(P.map(p => p.typ || '— bez typu'))].sort().forEach(t => $('#typ').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
let akt = null;

function podswietl(tekst, q) {
  const e = esc(tekst);
  if (!q) return e;
  // wzorzec odporny na polskie znaki: „wizaz” podświetla też „Wizaż”
  const wz = [...norm(q)].map(ch => PL[ch] ? '[' + PL[ch] + ']' : esc(ch).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('');
  const re = new RegExp(wz, 'gi');
  return e.replace(re, m => `<mark>${m}</mark>`);
}
function widoczne() {
  const q = norm($('#q').value.trim()), t = $('#typ').value, s = $('#sort').value;
  let w = P.filter(p => (!q || p._szuk.includes(q)) && (!t || (p.typ || '— bez typu') === t));
  const cmp = {az: (a, b) => a.tytul.localeCompare(b.tytul, 'pl'), dluzej: (a, b) => b._copy - a._copy,
               krocej: (a, b) => a._copy - b._copy, bloki: (a, b) => a._nb - b._nb}[s];
  return w.sort(cmp);
}
function rysujListe() {
  const w = widoczne(), q = norm($('#q').value.trim());
  $('#stat').textContent = `${w.length} / ${P.length}`;
  $('#lista').innerHTML = w.length ? w.map(p => {
    const traf = q ? (p._szuk.split(q).length - 1) : 0;
    return `<div class="poz${p.handle === akt ? ' akt' : ''}" data-h="${esc(p.handle)}">
      <img src="${esc(img(p.packshot, 120))}" alt="" loading="lazy">
      <div><div class="t">${esc(p.tytul)}</div>
      <div class="m">${p._nb} bloków · ${p._copy.toLocaleString('pl')} zn.${traf ? ' · trafień: ' + traf : ''}</div></div></div>`;
  }).join('') : '<div class="pusto">Nic nie pasuje.</div>';
}
function rysujProdukt(h) {
  const p = P.find(x => x.handle === h);
  if (!p) { akt = null; $('#szczegol').innerHTML = '<div class="pusto">Nie ma takiego produktu — wybierz z listy.</div>'; document.body.classList.remove('otwarty'); rysujListe(); return; }
  akt = h;
  const q = $('#q').value.trim(), obce = $('#obce').checked;
  const bloki = p.bloki.filter(b => obce || COPY(b));
  const ukryte = p.bloki.length - bloki.length;
  const h1diff = p.h1 && p.h1 !== p.tytul ? `<div class="h1diff">H1 na stronie różni się od nazwy produktu: „${esc(p.h1)}”</div>` : '';
  $('#szczegol').innerHTML = `
    <button class="wstecz" onclick="location.hash=''">← wszystkie produkty</button>
    <div class="naglowek-prod">
      <img src="${esc(img(p.packshot, 640))}" alt="${esc(p.tytul)}">
      <div>
        <div class="kicker">${esc(p.typ || 'bez typu')}</div>
        <h1 class="tyt">${podswietl(p.tytul, q)}</h1>
        ${h1diff}
        <div class="meta">
          <span class="tag">${p.cena != null ? p.cena.toFixed(2).replace('.', ',') + ' zł' : '—'}</span>
          <span class="tag">${p._nb} bloków copy</span>
          <span class="tag">${p._copy.toLocaleString('pl')} znaków</span>
          <span class="tag">${p.zdjec} zdjęć</span>
          <span class="tag">zmiana w Shopify ${esc(p.aktualizacja)}</span>
        </div>
        <a class="live" href="${esc(p.url)}" target="_blank" rel="noopener">otwórz na glov.co ↗</a>
      </div>
    </div>
    ${ukryte ? `<div class="nota">Ukryto ${ukryte} blok(i) z opiniami klientek i karuzelami produktów — to nie copy marki. Włącz „pokaż opinie i polecane”, żeby je zobaczyć.</div>` : ''}
    ${bloki.map((b, i) => `
      <div class="blok ${b.rodzaj === 'zakładka' ? 'zakladka' : esc(b.rodzaj)}">
        <div class="gora"><span class="kicker">${String(i + 1).padStart(2, '0')} · ${esc(b.rodzaj)}${b.rodzaj === 'zakładka' ? ' (akordeon)' : ''}</span>
          <span class="stat">${b.znakow.toLocaleString('pl')} zn.</span></div>
        <h3>${podswietl(b.naglowek || '(bez nagłówka)', q)}</h3>
        ${b.naglowki.length ? `<div class="hs">${b.naglowki.map(n => `<span><b>${esc(n.poziom.toUpperCase())}</b> ${podswietl(n.tekst, q)}</span>`).join('')}</div>` : ''}
        <div class="tx">${podswietl(b.tekst, q)}</div>
      </div>`).join('') || '<div class="pusto">Brak bloków treści na tej karcie.</div>'}`;
  document.body.classList.add('otwarty');
  rysujListe();
  window.scrollTo(0, 0);
}
function zHasha() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) rysujProdukt(h);
  else { akt = null; document.body.classList.remove('otwarty'); rysujListe();
         if (matchMedia('(min-width:900px)').matches && widoczne()[0]) rysujProdukt(widoczne()[0].handle); }
}
$('#lista').addEventListener('click', e => { const d = e.target.closest('.poz'); if (d) location.hash = encodeURIComponent(d.dataset.h); });
['#q', '#typ', '#sort'].forEach(s => $(s).addEventListener('input', () => { rysujListe(); if (akt) rysujProdukt(akt); }));
$('#obce').addEventListener('change', () => akt && rysujProdukt(akt));
window.addEventListener('hashchange', zHasha);
zHasha();
</script>

<style>
#pub-lightbox-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;align-items:center;justify-content:center;cursor:zoom-out}
#pub-lightbox-overlay.open{display:flex}
#pub-lightbox-overlay img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#pub-lightbox-close{position:fixed;top:16px;right:20px;font-size:36px;color:#fff;cursor:pointer;line-height:1;user-select:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style>
<div id="pub-lightbox-overlay"><span id="pub-lightbox-close">&times;</span><img id="pub-lightbox-img" src="" alt=""></div>
<script>
(function(){
  var ov=document.getElementById('pub-lightbox-overlay');
  var im=document.getElementById('pub-lightbox-img');
  document.querySelectorAll('a.pub-lightbox-trigger').forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var img=a.querySelector('img');
      if(img){im.src=img.src;ov.classList.add('open');}
    });
  });
  document.getElementById('pub-lightbox-close').addEventListener('click',function(){ov.classList.remove('open');im.src='';});
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){ov.classList.remove('open');im.src='';}});
})();
</script>
</body>
